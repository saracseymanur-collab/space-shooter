// --- Draw: Ship ---
const SHIP_W = 90, SHIP_H = 90; // görsel boyutu (1024×1024 kare)

function drawShip(x, y) {
  ctx.save();
  ctx.translate(x, y);

  // Hasar yanıp sönme
  ctx.globalAlpha = player.flash > 0 ? (Math.sin(player.flash * 1.5) > 0 ? 0.25 : 1) : 1;

  // Spaceship görseli (altta)
  if (spaceshipImg.complete && spaceshipImg.naturalWidth > 0) {
    ctx.drawImage(spaceshipImg, -SHIP_W / 2, -SHIP_H / 2, SHIP_W, SHIP_H);
  }

  // Kalkan efekti (geminin üstünde, stroke yok)
  if (player.shieldTimer > 0) {
    const pulse = 0.6 + 0.4 * Math.sin(frameCount * 0.15);
    const shieldAlpha = Math.min(1, player.shieldTimer / 40) * pulse;
    // Halka: içi boş, kenarda yoğunlaşan gradient — net koruyucu balon hissi
    const sg = ctx.createRadialGradient(0, 0, 42, 0, 0, 62);
    sg.addColorStop(0,    `rgba(0, 180, 255, 0)`);
    sg.addColorStop(0.72, `rgba(0, 200, 255, ${shieldAlpha * 0.25})`);
    sg.addColorStop(0.88, `rgba(80, 220, 255, ${shieldAlpha * 0.75})`);
    sg.addColorStop(1,    `rgba(180, 240, 255, ${shieldAlpha * 0.55})`);
    ctx.globalAlpha = 1;
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.arc(0, 0, 62, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.globalAlpha = 1;
  ctx.restore();
}

// --- Draw: Enemy ---
// Tier özellikleri: 1HP=küçük+mavi, 2HP=orta+turuncu, 3HP=büyük+kırmızı
const ENEMY_TIER = {
  1: { sc: 0.95, body: '#1e7acc', core: '#7dd4ff', glow: '#1e7acc' },
  2: { sc: 1.30, body: '#c86010', core: '#ffcc77', glow: '#ff8820' },
  3: { sc: 1.75, body: '#c01818', core: '#ff8888', glow: '#ff2020' },
};

function drawEnemy(e) {
  const sz   = ENEMY_SIZES[e.maxHp] ?? { w: 80, h: 60 };
  const dw   = sz.w, dh = sz.h;
  const img  = enemyImgs[e.maxHp];

  ctx.save();
  ctx.translate(e.x, e.y);
  const baseAlpha = e.phantom ? e.alpha : 1;
  ctx.globalAlpha = baseAlpha * (e.flash > 0 ? (e.flash % 6 < 3 ? 0.3 : 1) : 1);

  // Hayalet düşman: mor parıltı halesi
  if (e.phantom) {
    ctx.fillStyle = 'rgba(190,90,255,0.22)';
    ctx.beginPath(); ctx.ellipse(0, 0, dw * 0.62, dh * 0.7, 0, 0, Math.PI * 2); ctx.fill();
  }
  // Çekimle savrulan düşman: girdap izi
  if (e.shifting > 0) {
    ctx.strokeStyle = `rgba(255,140,60,${e.shifting / 40 * 0.8})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, dw * 0.6, frameCount * 0.3, frameCount * 0.3 + Math.PI * 1.3); ctx.stroke();
  }

  // Görsel — merkeze hizalı, gerçek en/boy oranıyla
  if (img && img.complete && img.naturalWidth > 0) {
    ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);
  }
  if (e.phantom && baseAlpha < 0.45) { ctx.restore(); return; } // görünmezken can barı yok

  // HP bar — geminin gerçek alt kenarına dayalı
  const barY = dh / 2 + 4;
  const barW = dw * 0.30 * e.maxHp, barH = 5; // 1x / 2x / 3x
  // Bar rengi: düşman tipine göre ton, can azaldıkça açılır
  const ENEMY_HUE = { 1: 125, 2: 48, 3: 350 }; // yeşil / sarı / kırmızı
  const ratio = e.hp / e.maxHp;
  const hue = ENEMY_HUE[e.maxHp] ?? 0;
  const sat  = Math.round(15 + ratio * 45);  // tam can=orta doygun(%60) → sıfır=soluk(%15)
  const lum  = Math.round(22 + ratio * 18);  // tam can=orta(%40) → sıfır=koyu(%22)
  const barColor = `hsl(${hue}, ${sat}%, ${lum}%)`;
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = `hsla(${hue}, 40%, 10%, 0.7)`;
  ctx.fillRect(-barW / 2, barY, barW, barH);
  ctx.fillStyle = barColor;
  ctx.fillRect(-barW / 2, barY, barW * ratio, barH);
  ctx.globalAlpha = 1;
  ctx.restore();
}

// --- Boss görseli: bölgeye göre renklendirilmiş kopyalar (bir kez üretilir) ---
const BOSS_TINTS = { 3: 'rgba(40,220,200,0.42)', 4: 'rgba(20,0,30,0.55)' };
const bossSprites = {};
function getBossSprite(zone) {
  const tint = BOSS_TINTS[zone];
  if (!tint) return bossImg;
  if (!bossSprites[zone]) {
    const c = document.createElement('canvas');
    c.width = bossImg.naturalWidth; c.height = bossImg.naturalHeight;
    const g = c.getContext('2d');
    g.drawImage(bossImg, 0, 0);
    g.globalCompositeOperation = 'source-atop';
    g.fillStyle = tint;
    g.fillRect(0, 0, c.width, c.height);
    if (zone === 4) { // Void Leader: kızıl damarlar
      const rg = g.createRadialGradient(c.width/2, c.height/2, 0, c.width/2, c.height/2, c.width/2);
      rg.addColorStop(0, 'rgba(255,60,40,0.35)'); rg.addColorStop(1, 'rgba(255,60,40,0)');
      g.fillStyle = rg; g.fillRect(0, 0, c.width, c.height);
    }
    bossSprites[zone] = c;
  }
  return bossSprites[zone];
}

// --- Draw: Boss ---
function drawBoss(b) {
  const sc    = b.special ? 1.45 : 1.0;
  const phase = b.phase || 1;
  const pulse = 0.6 + 0.4 * Math.sin(frameCount * (phase === 3 ? 0.22 : 0.07));
  const flashAlpha = b.flash > 0 ? (b.flash % 6 < 3 ? 0.25 : 1) : 1;

  // Faz renk paleti
  const palettes = {
    1: { aura1: '180,0,255', aura2: '100,0,200', wing: '#550099', wingGlow: '#9900cc', body: '#7700bb', bodyGlow: '#cc44ff', core1: '255,220,255', core2: '210,80,255', core3: '140,0,255', gun: '#ff99ff' },
    2: { aura1: '220,0,180', aura2: '140,0,120', wing: '#880055', wingGlow: '#dd0088', body: '#aa0066', bodyGlow: '#ff22aa', core1: '255,200,240', core2: '255,60,180', core3: '180,0,120', gun: '#ff88cc' },
    3: { aura1: '255,40,0',  aura2: '180,0,0',   wing: '#991100', wingGlow: '#ff3300', body: '#cc2200', bodyGlow: '#ff6600', core1: '255,220,180', core2: '255,100,20', core3: '200,40,0',  gun: '#ffaa44' },
  };
  const p = palettes[phase];

  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.scale(sc, sc);
  ctx.globalAlpha = flashAlpha * (b.cloak ? 0.16 + 0.06 * Math.sin(frameCount * 0.3) : 1);

  // Dış aura — gradient yerine 2 transparan circle
  ctx.fillStyle = `rgba(${p.aura1},${0.18 * pulse})`;
  ctx.beginPath(); ctx.arc(0, 0, 75, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = `rgba(${p.aura1},${0.22 * pulse})`;
  ctx.beginPath(); ctx.arc(0, 0, 48, 0, Math.PI * 2); ctx.fill();

  // Boss görseli
  if (bossImg.complete && bossImg.naturalWidth > 0) {
    const bw = BOSS_W, bh = BOSS_H;
    ctx.shadowColor = p.bodyGlow; ctx.shadowBlur = 18;
    ctx.drawImage(getBossSprite(b.zone), -bw / 2, -bh / 2, bw, bh);
    ctx.shadowBlur = 0;
  }

  // Çekirdek parıltısı — faz renginde nabız
  ctx.fillStyle = `rgba(${p.core2},${0.35 * pulse})`; ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = `rgba(${p.core1},${0.55 * pulse})`; ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2); ctx.fill();

  // Faz 3: alev efekti — gradient yerine transparan circle'lar
  if (phase === 3) {
    ctx.globalAlpha = flashAlpha * 0.45 * pulse;
    [-28, 0, 28].forEach(fx => {
      ctx.fillStyle = 'rgba(255,80,0,0.5)';  ctx.beginPath(); ctx.arc(fx,62,18,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,180,0,0.7)'; ctx.beginPath(); ctx.arc(fx,58,10,0,Math.PI*2); ctx.fill();
    });
  }

  ctx.globalAlpha = 1;
  ctx.restore();
}

// --- Draw: Enemy Bullet ---
// Gradient ve shadowBlur yerine katmanlı circle — çok daha hızlı
function drawEBullet(b) {
  ctx.save();
  ctx.translate(b.x, b.y);

  if (b.big) {
    const r = 16 + 3 * Math.sin(frameCount * 0.18);
    ctx.fillStyle = 'rgba(150,24,45,0.22)';  ctx.beginPath(); ctx.arc(0,0,r+10,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(200,40,60,0.55)';  ctx.beginPath(); ctx.arc(0,0,r+4,0,Math.PI*2);  ctx.fill();
    ctx.fillStyle = 'rgba(240,80,90,0.9)';   ctx.beginPath(); ctx.arc(0,0,r-2,0,Math.PI*2);  ctx.fill();
    ctx.fillStyle = '#ffaaaa';               ctx.beginPath(); ctx.arc(0,0,r*0.4,0,Math.PI*2); ctx.fill();
    ctx.restore();
    return;
  }

  // Kırmızı ton paleti — koyu: #96182d (150,24,45)
  const isBoss = b.fromBoss;
  const [c3, c2, c1] = isBoss
    ? ['rgba(150,24,45,0.20)', 'rgba(200,40,60,0.65)', 'rgba(255,120,130,1)']
    : b.hp === 3
    ? ['rgba(150,24,45,0.20)', 'rgba(190,30,50,0.65)', 'rgba(240,70,85,1)']
    : b.hp === 2
    ? ['rgba(150,24,45,0.18)', 'rgba(200,40,60,0.60)', 'rgba(255,90,100,1)']
    : ['rgba(150,24,45,0.15)', 'rgba(210,50,65,0.55)', 'rgba(255,110,120,1)'];

  const r = isBoss ? 11 : 9;
  ctx.fillStyle = c3; ctx.beginPath(); ctx.arc(0,0,r+6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = c2; ctx.beginPath(); ctx.arc(0,0,r+1,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = c1; ctx.beginPath(); ctx.arc(0,0,r-2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0,0,3,0,Math.PI*2); ctx.fill();

  ctx.restore();
}

// --- Draw: Player Bullet ---
function drawTutorial() {
  const step = tutorial.step;
  const dir  = step === 0 ? 1 : -1; // 1=sağ, -1=sol
  const label = step === 0 ? 'SWIPE RIGHT' : 'SWIPE LEFT';

  // Ok animasyonu: ileri-geri kayma + nabız
  const slide   = Math.sin(frameCount * 0.07) * 14;
  const opacity = 0.55 + 0.45 * Math.sin(frameCount * 0.07);

  const cx = W / 2;
  const cy = H - 110;

  ctx.save();
  ctx.globalAlpha = opacity;
  ctx.translate(cx + dir * slide, cy);

  // Ok gövdesi
  const aw = 52, ah = 18, tipW = 30, tipH = 38;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  if (dir === 1) {
    // → sağ ok
    ctx.moveTo(-aw, -ah / 2);
    ctx.lineTo(aw - tipW, -ah / 2);
    ctx.lineTo(aw - tipW, -tipH / 2);
    ctx.lineTo(aw, 0);
    ctx.lineTo(aw - tipW, tipH / 2);
    ctx.lineTo(aw - tipW, ah / 2);
    ctx.lineTo(-aw, ah / 2);
  } else {
    // ← sol ok
    ctx.moveTo(aw, -ah / 2);
    ctx.lineTo(-aw + tipW, -ah / 2);
    ctx.lineTo(-aw + tipW, -tipH / 2);
    ctx.lineTo(-aw, 0);
    ctx.lineTo(-aw + tipW, tipH / 2);
    ctx.lineTo(-aw + tipW, ah / 2);
    ctx.lineTo(aw, ah / 2);
  }
  ctx.closePath();
  ctx.fill();

  // Yazı
  ctx.globalAlpha = opacity;
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 15px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText(label, 0, 28);

  ctx.restore();
}

function drawBullet(b) {
  ctx.save();
  ctx.translate(b.x, b.y);
  const BULLET_COLORS = {
    triple: ['rgba(180,255,200,1)', 'rgba(0,220,100,0.8)'],  // yeşil
    double: ['rgba(255,255,80,1)',  'rgba(255,180,0,0.8)'],   // sarı
    normal: ['rgba(255,255,180,1)', 'rgba(0,220,255,0.8)'],   // mavi/beyaz
  };
  const color = BULLET_COLORS[b.color] ?? BULLET_COLORS.normal;
  const grd = ctx.createRadialGradient(0, 0, 0, 0, 0, 7);
  grd.addColorStop(0, color[0]);
  grd.addColorStop(0.4, color[1]);
  grd.addColorStop(1, 'rgba(0,100,255,0)');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(0, 0, 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(0, 0, 2.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// --- Draw: Power-up ---
const POWERUP_COLORS = { triple: '#00ffaa', double: '#ffee00', bomb: '#ff4444', shield: '#2299ff', fuel: '#44ff66' };
const POWERUP_GLOW = {
  triple: ['rgba(0,255,170,0.65)',  'rgba(0,255,170,0)'],
  double: ['rgba(255,238,0,0.65)',  'rgba(255,238,0,0)'],
  bomb:   ['rgba(255,68,68,0.65)',  'rgba(255,68,68,0)'],
  shield: ['rgba(34,153,255,0.65)', 'rgba(34,153,255,0)'],
  fuel:   ['rgba(68,255,102,0.65)', 'rgba(68,255,102,0)'],
};

function drawPowerupIcon(type, size) {
  ctx.save();
  if (type === 'triple') {
    // Üç mermi
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#00ffaa';
    ctx.shadowBlur = 6;
    for (const sx of [-size * 0.52, 0, size * 0.52]) {
      ctx.beginPath();
      ctx.moveTo(sx, -size * 0.7);
      ctx.lineTo(sx + size * 0.2, size * 0.4);
      ctx.lineTo(sx, size * 0.2);
      ctx.lineTo(sx - size * 0.2, size * 0.4);
      ctx.closePath();
      ctx.fill();
    }
  } else if (type === 'double') {
    // İki mermi
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#ffee00';
    ctx.shadowBlur = 6;
    for (let sx of [-size * 0.38, size * 0.38]) {
      ctx.beginPath();
      ctx.moveTo(sx, -size * 0.7);
      ctx.lineTo(sx + size * 0.25, size * 0.4);
      ctx.lineTo(sx, size * 0.2);
      ctx.lineTo(sx - size * 0.25, size * 0.4);
      ctx.closePath();
      ctx.fill();
    }
  } else if (type === 'shield') {
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#2299ff';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.moveTo(0, -size * 0.75);
    ctx.lineTo(size * 0.65, -size * 0.35);
    ctx.lineTo(size * 0.65, size * 0.1);
    ctx.quadraticCurveTo(0, size * 0.85, 0, size * 0.85);
    ctx.quadraticCurveTo(-size * 0.65, size * 0.1, -size * 0.65, size * 0.1);
    ctx.lineTo(-size * 0.65, -size * 0.35);
    ctx.closePath();
    ctx.fill();
  } else if (type === 'fuel') {
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#44ff66';
    ctx.shadowBlur = 6;
    // Barrel body
    ctx.fillRect(-size * 0.38, -size * 0.55, size * 0.76, size * 0.9);
    // Cap
    ctx.fillRect(-size * 0.22, -size * 0.72, size * 0.44, size * 0.2);
    // Green tint stripe
    ctx.fillStyle = '#88ffaa';
    ctx.fillRect(-size * 0.28, -size * 0.2, size * 0.56, size * 0.22);
  } else {
    // Bomba: daire + patlama çizgileri
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#ff4444';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(0, size * 0.1, size * 0.45, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    const rays = 6;
    for (let i = 0; i < rays; i++) {
      const a = (i / rays) * Math.PI * 2 - Math.PI / 2;
      const r1 = size * 0.55, r2 = size * 0.82;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * r1, size * 0.1 + Math.sin(a) * r1);
      ctx.lineTo(Math.cos(a) * r2, size * 0.1 + Math.sin(a) * r2);
      ctx.stroke();
    }
    // Fitil
    ctx.strokeStyle = '#ff8';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(size * 0.22, -size * 0.32);
    ctx.quadraticCurveTo(size * 0.5, -size * 0.7, size * 0.15, -size * 0.82);
    ctx.stroke();
  }
  ctx.restore();
}

function drawPowerup(p) {
  const color = POWERUP_COLORS[p.type];
  const bob = Math.sin(p.bobTimer * 0.07) * 3;
  ctx.save();
  ctx.translate(p.x, p.y + bob);

  // Glow
  const glow = POWERUP_GLOW[p.type];
  const grd = ctx.createRadialGradient(0, 0, 4, 0, 0, 22);
  grd.addColorStop(0, glow[0]);
  grd.addColorStop(1, glow[1]);
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(0, 0, 22, 0, Math.PI * 2);
  ctx.fill();

  // Ring
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.shadowColor = color;
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.arc(0, 0, 15, 0, Math.PI * 2);
  ctx.stroke();

  // Icon (scaled to fit circle)
  drawPowerupIcon(p.type, 10);

  ctx.restore();
}

// --- Draw: Explosions ---
function drawExplosions() {
  // shadowBlur per-particle yerine toplu: önce büyük glow circle'lar, sonra core circle'lar
  ctx.save();
  explosions.forEach(p => {
    ctx.globalAlpha = p.life * 0.35;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 2.2, 0, Math.PI * 2); ctx.fill();
  });
  explosions.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalAlpha = 1;
  ctx.restore();
}

// --- Draw: HUD ---
function drawHUD() {
  ctx.save();

  // Üst çubuk arka planı
  ctx.fillStyle = 'rgba(0,0,20,0.55)';
  ctx.fillRect(0, 0, W, 36);

  ctx.font = 'bold 19px Courier New';
  ctx.textBaseline = 'middle';
  ctx.shadowBlur = 8;

  ctx.fillStyle = '#0ff';
  ctx.shadowColor = '#0ff';
  ctx.textAlign = 'left';
  ctx.fillText('SCORE: ' + score, 12, 24);

  ctx.textAlign = 'center';
  const lvWave = Math.max(1, Math.min(5, getWave() - (currentLevel - 1) * 5));
  ctx.fillText(boss ? `LV ${currentLevel}` : `WAVE ${lvWave}/5`, W / 2, 24);

  ctx.textAlign = 'right';
  const livesStr = '❤'.repeat(Math.max(0, lives)) + '🖤'.repeat(Math.max(0, 3 - lives));
  ctx.fillText('LIVES: ' + livesStr, W - 12, 24);

  // Boss HP barı
  if (boss) {
    const bx = 64, by = 48, bw = W - 76, bh = 22;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(bx, by, bw, bh);
    const bRatio = boss.hp / boss.maxHp;
    const bPhase = boss.phase || 1;
    const barColors = [['#aa00ff','#ff44ff','#cc44ff'], ['#cc0066','#ff44aa','#ff22aa'], ['#cc2200','#ff6600','#ff4400']];
    const [bc0, bc1, bshadow] = barColors[bPhase - 1];
    const bGrd = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    bGrd.addColorStop(0, bc0);
    bGrd.addColorStop(1, bc1);
    ctx.fillStyle = bGrd;
    ctx.shadowColor = bshadow;
    ctx.shadowBlur = 10;
    ctx.fillRect(bx, by, bw * bRatio, bh);
    ctx.shadowBlur = 0;
    // Faz sınır çizgileri
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1;
    [0.6, 0.3].forEach(pct => {
      const lx = bx + bw * pct;
      ctx.beginPath(); ctx.moveTo(lx, by); ctx.lineTo(lx, by + bh); ctx.stroke();
    });
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px Courier New';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const phaseLabels = ['', ' ◆ PHASE 2', ' ◆◆ PHASE 3'];
    const bName = boss.special ? BOSS_NAMES[boss.zone] : 'BOSS';
    ctx.fillText(`★ ${bName}  ${boss.hp}/${boss.maxHp}${phaseLabels[bPhase-1]} ★`, W / 2, by + bh / 2);
  }

  // Aktif power-up göstergesi
  const active = [];
  if (player.shieldTimer > 0) active.push({ type: 'shield', timer: player.shieldTimer, color: '#29f', label: 'SHIELD' });
  if (player.tripleTimer > 0) active.push({ type: 'triple', timer: player.tripleTimer, color: '#0fa', label: 'TRIPLE SHOT' });
  if (player.doubleTimer > 0) active.push({ type: 'double', timer: player.doubleTimer, color: '#ff0', label: 'DOUBLE SHOT' });

  if (active.length > 0) {
    const barW = 90, barH = 10, pad = 8;
    const totalW = active.length * (barW + pad * 2 + 26) - pad;
    let sx = W / 2 - totalW / 2;

    active.forEach(a => {
      // Icon
      ctx.save();
      ctx.translate(sx + 13, H - 22);
      drawPowerupIcon(a.type, 8);
      ctx.restore();

      // Bar bg
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(sx + 26, H - 28, barW, barH);

      // Bar fill
      const ratio = a.timer / POWERUP_DURATION;
      ctx.fillStyle = a.color;
      ctx.shadowColor = a.color;
      ctx.shadowBlur = 6;
      ctx.fillRect(sx + 26, H - 28, barW * ratio, barH);

      // Label
      ctx.fillStyle = a.color;
      ctx.font = '9px Courier New';
      ctx.textAlign = 'left';
      ctx.shadowBlur = 4;
      ctx.fillText(a.label, sx + 26, H - 32);

      sx += barW + pad * 2 + 26;
    });
  }

  // Geri butonu (sol üst, HUD'ın hemen altı)
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillRect(6, 44, 52, 26);
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 1;
  ctx.strokeRect(6, 44, 52, 26);
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.font = 'bold 12px Courier New';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('◀ BACK', 32, 57);

  // Zone 2 extras: fuel bar
  if (currentZone === 2) {
    const fby = boss ? 76 : 48, fbx = 64, fbw = W - 76, fbh = 14;
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(fbx, fby, fbw, fbh);
    const fr = fuel / FUEL_MAX;
    const fc = fr > 0.5 ? '#44ff66' : fr > 0.25 ? '#ffcc00' : '#ff4444';
    ctx.fillStyle = fc; ctx.shadowColor = fc; ctx.shadowBlur = fr < 0.25 ? 10 : 4;
    ctx.fillRect(fbx, fby, fbw * fr, fbh);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff'; ctx.font = 'bold 8px Courier New';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(`⛽ FUEL  ${Math.ceil(fuel)}%`, W / 2, fby + fbh / 2);

  }

  ctx.restore();
}

// --- Draw: Overlay ---
function drawOverlay(title, sub) {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,20,0.78)';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#0ff';
  ctx.font = 'bold 36px Courier New';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = '#0ff';
  ctx.shadowBlur = 20;
  ctx.fillText(title, W / 2, H / 2 - 50);

  ctx.fillStyle = '#fff';
  ctx.font = '15px Courier New';
  ctx.shadowBlur = 6;
  ctx.fillText(sub, W / 2, H / 2 + 0);

  if (state === 'start') {
    ctx.fillStyle = '#adf';
    ctx.font = '12px Courier New';
    ctx.shadowBlur = 4;
    const tips = [
      '🛡 Blue shield = 5s invincibility',
      '⚡ Yellow icon = 5s double shot',
      '💣 Red bomb = destroys all enemies',
    ];
    tips.forEach((t, i) => ctx.fillText(t, W / 2, H / 2 + 32 + i * 20));
  }

  if (state === 'gameover') {
    ctx.fillStyle = '#0ff';
    ctx.font = '14px Courier New';
    ctx.fillText('SCORE: ' + score, W / 2, H / 2 + 36);
  }

  // Haritaya dön butonu
  const btnY = H / 2 + 58;
  ctx.fillStyle = 'rgba(0,40,30,0.85)';
  ctx.fillRect(W / 2 - 100, btnY - 20, 200, 40);
  ctx.strokeStyle = 'rgba(0,255,200,0.7)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = 'rgba(0,255,200,0.95)';
  ctx.font = 'bold 15px Courier New';
  ctx.shadowBlur = 6;
  ctx.fillText('BACK TO MAP', W / 2, btnY + 1);
  ctx.restore();
}

// --- Bomb: patlat hepsini ---
function activateBomb() {
  enemies.forEach(e => {
    spawnExplosion(e.x, e.y, true);
    score += e.maxHp * 10;
  });
  // Büyük ekran flaşı
  explosions.push({ x: W / 2, y: H / 2, vx: 0, vy: 0, life: 1, decay: 0.04, r: 260, color: 'rgba(255,80,80,0.18)', isBombFlash: true });
  enemies = [];
}

// --- Update ---
function update() {
  frameCount++;

  stars.forEach(s => {
    s.y += s.spd;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
  });

  // Zone transition update
  if (state === 'zonetransition') {
    if (zoneTransPhase === 'fadein') {
      zoneTransAlpha = Math.min(1, zoneTransAlpha + 0.022);
      if (zoneTransAlpha >= 1) zoneTransPhase = 'show';
    }
    return;
  }

  // Intro cinematic update
  if (state === 'intro') {
    if (introPhase === 'fadein') {
      introAlpha = Math.min(1, introAlpha + 0.033);
      if (introAlpha >= 1) introPhase = 'show';
    } else if (introPhase === 'fadeout') {
      introAlpha = Math.max(0, introAlpha - 0.05);
      if (introAlpha <= 0) {
        introPanelIdx++;
        if (introPanelIdx >= cinePanels.length) {
          endCinematic();
        } else {
          introPhase = 'fadein';
        }
      }
    }
    return;
  }

  // Menu kart animasyonu
  menuAnimX += (menuIdx * (W - 60) - menuAnimX) * 0.14;

  if (state === 'levelcomplete') {
    if (levelCompleteType === 'clear') {
      if (bossKillTimer > 0) { bossKillTimer--; if (bossKillTimer === 0) { state = 'map'; } }
    } else {
      // Boss zaferi: zamanı say, parçacıkları oluştur ve güncelle
      victoryTime++;
      const spawnCount = victoryTime < 90 ? 5 : victoryTime < 200 ? 2 : (victoryTime % 20 < 3 ? 2 : 0);
      const VCOLORS = ['#ffe040','#00ffff','#ff44ff','#44ff88','#ff8800','#ffffff','#88aaff','#ffaaff'];
      for (let i = 0; i < spawnCount; i++) {
        const a = Math.random() * Math.PI * 2;
        const spd = 2.5 + Math.random() * 7;
        victoryParticles.push({
          x: W * 0.2 + Math.random() * W * 0.6,
          y: H * 0.25 + Math.random() * H * 0.45,
          vx: Math.cos(a) * spd,
          vy: Math.sin(a) * spd - 3.5,
          life: 1,
          decay: 0.006 + Math.random() * 0.014,
          r: 2.5 + Math.random() * 6,
          color: VCOLORS[Math.floor(Math.random() * VCOLORS.length)],
          star: Math.random() < 0.35,
        });
      }
      victoryParticles = victoryParticles.filter(p => {
        p.x += p.vx; p.y += p.vy;
        p.vy += 0.14;
        p.vx *= 0.985;
        p.life -= p.decay;
        return p.life > 0;
      });
    }
    return;
  }
  if (state !== 'play') return;

  // Tutorial progress on lane change
  if (player.targetLane !== prevTargetLane) {
    if (player.targetLane > prevTargetLane && tutorial && tutorial.step === 0) tutorial.step = 1;
    else if (player.targetLane < prevTargetLane && tutorial && tutorial.step === 1) { localStorage.setItem('ss_tutorial', '1'); tutorial = null; }
    prevTargetLane = player.targetLane;
  }

  const targetX = LANE_CENTERS[player.targetLane];
  const slideFactor = 0.35;
  player.x += (targetX - player.x) * slideFactor;
  if (Math.abs(targetX - player.x) < 1) player.x = targetX;

  if (player.flash > 0) player.flash--;
  if (player.shieldTimer > 0) player.shieldTimer--;
  if (player.doubleTimer > 0) player.doubleTimer--;
  if (player.tripleTimer > 0) player.tripleTimer--;

  // Death animation
  if (player.dead) {
    player.deathTimer++;
    if (player.deathTimer > 80) state = 'gameover';
    return;
  }

  // Auto fire
  player.fireTimer++;
  if (player.fireTimer >= player.fireRate) {
    player.fireTimer = 0;
    const bColor = player.tripleTimer > 0 ? 'triple' : player.doubleTimer > 0 ? 'double' : 'normal';
    if (player.tripleTimer > 0) {
      bullets.push({ x: player.x - 13, y: player.y - 20, speed: 10, color: bColor });
      bullets.push({ x: player.x,      y: player.y - 28, speed: 10, color: bColor });
      bullets.push({ x: player.x + 13, y: player.y - 20, speed: 10, color: bColor });
    } else if (player.doubleTimer > 0) {
      bullets.push({ x: player.x - 10, y: player.y - 24, speed: 10, color: bColor });
      bullets.push({ x: player.x + 10, y: player.y - 24, speed: 10, color: bColor });
    } else {
      bullets.push({ x: player.x, y: player.y - 28, speed: 10, color: bColor });
    }
  }

  // Bullets move
  bullets = bullets.filter(b => { b.y -= b.speed; return b.y > -10; });

  // Boss spawn tespiti: sadece 5. bölümde
  const currentWave = getWave();
  if (currentWave !== lastWaveForBoss) {
    lastWaveForBoss = currentWave;
    if (currentLevel === currentZone * 5 && currentWave % 5 === 0 && !boss) spawnBoss(currentWave);
  }

  // Level tamamlama: 5 dalgayı geçince bölüm biter (boss seviyesi hariç)
  const _zoneLastLevel = currentZone * 5;
  if (currentLevel !== _zoneLastLevel && !boss && currentWave > currentLevel * 5 && enemies.length === 0) {
    levelStates[currentLevel - 1] = 'completed';
    levelStates[currentLevel] = 'unlocked';
    saveLevelStates();
    bossKillTimer = 180;
    levelCompleteType = 'clear';
    state = 'levelcomplete';
  }

  // Boss güncelleme
  if (boss) {
    const ratio = boss.hp / boss.maxHp;
    const prevPhase = boss.phase || 1;
    boss.phase = ratio > 0.6 ? 1 : ratio > 0.3 ? 2 : 3;
    if (boss.phase !== prevPhase) { boss.flash = 20; boss.fireTimer = 0; } // faz geçişinde flash

    // Yatay hareket hızı faza göre
    const baseSpeed = (boss.special ? 1.9 : 1.2 + boss.bossNum * 0.2)
                    * (boss.phase === 1 ? 1.0 : boss.phase === 2 ? 1.7 : 2.8);
    const sign = boss.vx >= 0 ? 1 : -1;
    boss.vx = sign * baseSpeed;
    boss.x += boss.vx;
    if (boss.x < 55) { boss.x = 55; boss.vx = baseSpeed; }
    if (boss.x > W - 55) { boss.x = W - 55; boss.vx = -baseSpeed; }

    // Dikey: her fazda üstte sabit
    const homeY = boss.special ? H * 0.14 : H * 0.13;
    boss.y += (homeY - boss.y) * 0.025;

    if (boss.flash > 0) boss.flash--;

    // Komuta Merkezi: faz 2'den itibaren periyodik olarak görünmez olur (mermi işlemez, ateş etmez)
    if (boss.zone === 3 && boss.phase >= 2) {
      boss.cloakCycle = (boss.cloakCycle || 0) + 1;
      boss.cloak = boss.cloakCycle % 300 > 215 ? 1 : 0;
    } else {
      boss.cloak = 0;
    }

    // Drone gönderme: Komuta Merkezi her fazda, Void Leader son fazda
    if (boss.zone === 3 || (boss.zone === 4 && boss.phase === 3)) {
      boss.droneTimer++;
      const droneEvery = boss.zone === 4 ? 210 : [0, 230, 190, 160][boss.phase];
      if (boss.droneTimer >= droneEvery) {
        boss.droneTimer = 0;
        spawnDrone(boss.x, boss.zone === 3 && boss.phase >= 2 && Math.random() < 0.5);
      }
    }

    // Void Leader: şerit lazerleri (önce uyarı, sonra ışın)
    if (boss.zone === 4 && boss.phase >= 2) {
      boss.laserTimer++;
      const laserEvery = boss.phase === 2 ? 170 : 135;
      if (boss.laserTimer >= laserEvery && lasers.length === 0) {
        boss.laserTimer = 0;
        const count = boss.phase === 2 ? 1 : 2;
        const lanes = [0, 1, 2].sort(() => Math.random() - 0.5).slice(0, count);
        lanes.forEach(l => lasers.push({ lane: l, t: 0, warn: 62, fire: 28, hit: false }));
      }
    }

    // Boss ateş ediyor
    boss.fireTimer++;
    if (boss.fireTimer >= boss.nextFireIn) {
      boss.fireTimer = 0;
      const bY  = boss.y + 44;
      const mk  = (x, vy, big) => ({ x, y: bY, vx: 0, vy, hp: 3, lane: -1, fromBoss: true, big: !!big });
      // Bossun ağzından hedef şeride nişanlı mermi (Void Leader)
      const aimed = (lane, vy) => {
        const b = mk(boss.x, vy);
        b.vx = (LANE_CENTERS[lane] - boss.x) / ((player.y - bY) / vy);
        b.lane = lane; b.aimLane = lane;
        return b;
      };

      if (boss.zone === 3) {
        // Komuta Merkezi: daima 1 şerit güvenli; görünmezken ateş etmez
        if (boss.cloak) {
          boss.nextFireIn = 20;
        } else {
          const phase = boss.phase || 1;
          boss.nextFireIn = phase === 1 ? 64 + Math.random() * 16 : phase === 2 ? 48 + Math.random() * 14 : 34 + Math.random() * 10;
          const safe = Math.floor(Math.random() * 3);
          const vy = phase === 1 ? 4.5 : phase === 2 ? 5.2 : 6.0;
          [0, 1, 2].filter(l => l !== safe).forEach(l => eBullets.push(mk(LANE_CENTERS[l], vy)));
          if (phase === 3 && Math.random() < 0.2) eBullets.push(mk(LANE_CENTERS[safe === 1 ? 0 : 1], 2.8, true));
        }
      } else if (boss.zone === 4) {
        // Void Leader: nişanlı yelpaze; lazer varken mermiler lazer şeritlerine gider (güvenli şerit korunur)
        const phase = boss.phase || 1;
        boss.nextFireIn = phase === 1 ? 52 + Math.random() * 16 : phase === 2 ? 70 + Math.random() * 18 : 58 + Math.random() * 16;
        const vy = phase === 1 ? 4.6 : 5.4;
        let targets;
        if (lasers.length > 0) targets = lasers.map(L => L.lane);
        else {
          const safe = Math.floor(Math.random() * 3);
          targets = [0, 1, 2].filter(l => l !== safe);
          if (phase === 2) targets = [targets[Math.floor(Math.random() * 2)]];
        }
        targets.forEach(l => eBullets.push(aimed(l, vy)));
      } else if (boss.zone === 2) {
        // Zone 2 boss: fires asteroids + bullets by phase
        const phase = boss.phase || 1;
        if (phase === 1) {
          boss.nextFireIn = 55 + Math.random() * 20;
          spawnAsteroid('normal', boss.x + (Math.random()-0.5)*80, boss.y + 50, 18 + Math.random()*10);
          asteroids[asteroids.length-1].speed = 3.5; asteroids[asteroids.length-1].vx = 0;
        } else if (phase === 2) {
          boss.nextFireIn = 40 + Math.random() * 15;
          const atype = Math.random() < 0.45 ? 'iron' : 'normal';
          spawnAsteroid(atype, boss.x + (Math.random()-0.5)*100, boss.y + 50, 20 + Math.random()*12);
          asteroids[asteroids.length-1].speed = 4.0; asteroids[asteroids.length-1].vx = 0;
          eBullets.push(mk(LANE_CENTERS[Math.floor(Math.random()*3)], 5.0));
        } else {
          boss.nextFireIn = 22 + Math.random() * 10;
          spawnAsteroid('normal', boss.x + (Math.random()-0.5)*60, boss.y + 50, 16 + Math.random()*8);
          asteroids[asteroids.length-1].speed = 4.5; asteroids[asteroids.length-1].vx = 0;
          eBullets.push(mk(LANE_CENTERS[Math.floor(Math.random()*3)], 6.0));
          if (Math.random() < 0.4) eBullets.push(mk(LANE_CENTERS[Math.floor(Math.random()*3)], 5.5));
        }
      } else if (boss.phase === 1) {
        // ── FAZ 1: tek mermi, yavaş ──
        // Rastgele 1 şerite ateş → 2 şerit daima boş
        boss.nextFireIn = 62 + Math.random() * 18;
        eBullets.push(mk(LANE_CENTERS[Math.floor(Math.random() * 3)], 4.5));

      } else if (boss.phase === 2) {
        // ── FAZ 2: 2 şerite ateş, 1 şerit daima boş ──
        // Safe lane her atışta değişir → oyuncu takip etmek zorunda
        boss.nextFireIn = 36 + Math.random() * 14;
        const safe = Math.floor(Math.random() * 3);
        [0, 1, 2].filter(l => l !== safe).forEach(l =>
          eBullets.push(mk(LANE_CENTERS[l], 5.5))
        );

      } else {
        // ── FAZ 3: dalga sistemi ──
        // Ekran 4 eşit zona bölünür. Her dalgada 1 zon güvenli, 3 zona ateş.
        // Dalga biter → nefes molası → oyuncu güvenli zona geçer → yeni dalga
        const ZONE_CENTERS = [W/8, 3*W/8, 5*W/8, 7*W/8]; // 4 eşit zon, W orantılı

        if (!boss.wave) boss.wave = { onBreak: true, fired: 0, size: 3, targets: [], safeZone: 0 };
        const w = boss.wave;

        if (w.onBreak) {
          // Nefes molası bitti → yeni dalgayı hazırla
          w.onBreak  = false;
          w.fired    = 0;
          w.size     = 3 + (Math.random() < 0.38 ? 1 : 0); // 3 veya 4 mermi
          w.safeZone = Math.floor(Math.random() * 4);       // rastgele güvenli zon
          w.targets  = ZONE_CENTERS.filter((_, i) => i !== w.safeZone);
          boss.nextFireIn = 10; // ilk mermi kısa gecikmeli
        } else {
          // Dalga içi bir mermi at (hedef zonlar sırayla)
          const x = w.targets[w.fired % w.targets.length];
          if (w.fired === 0 && Math.random() < 0.22) {
            // Dalga başı: küçük şansla büyük yavaş mermi — tek şerit hedef
            eBullets.push(mk(LANE_CENTERS[Math.floor(Math.random() * 3)], 3.0, true));
          } else {
            eBullets.push(mk(x, 6.5));
          }
          w.fired++;

          if (w.fired >= w.size) {
            // Dalga bitti → nefes molası (~1 sn)
            w.onBreak       = true;
            boss.nextFireIn = 58 + Math.random() * 22;
          } else {
            // Dalga devam → hızlı ardışık ateş
            boss.nextFireIn = 11 + Math.random() * 7;
          }
        }
      }
    }

    // Oyuncu mermileri bossa çarpıyor
    bullets = bullets.filter(b => {
      if (!boss) return true; // boss aynı frame'de öldüyse kalan mermilere dokunma
      if (boss.cloak) return true; // görünmez boss'tan mermi geçer
      const bsc = boss.special ? 1.45 : 1.0;
      const hit = Math.abs(b.x - boss.x) < 62 * bsc && Math.abs(b.y - boss.y) < 48 * bsc;
      if (hit) {
        boss.hp--;
        boss.flash = 8;
        spawnExplosion(b.x, b.y, false);
        if (boss.hp <= 0) {
          for (let i = 0; i < 8; i++)
            spawnExplosion(boss.x + (Math.random() - 0.5) * 130, boss.y + (Math.random() - 0.5) * 80, true);
          score += 300 + boss.bossNum * 200;
          levelStates[currentLevel - 1] = 'completed';
          const _zll = currentZone * 5;
          if (currentLevel < _zll) {
            levelStates[currentLevel] = 'unlocked';
          } else if (currentLevel < levelStates.length) {
            levelStates[currentLevel] = 'unlocked'; // first level of next zone
            if (currentZone < MENU_CARDS.length) {
              MENU_CARDS[currentZone].locked = false;
              saveZoneStates();
            }
          }
          if (currentLevel === LEVEL_COUNT) {
            try { localStorage.setItem('ss_complete', '1'); } catch(e) {}
          }
          lasers = []; eBullets = [];
          saveLevelStates();
          boss = null;
          bossKillTimer = 180;
          levelCompleteType = 'boss';
          returnToMap = true;
          victoryTime = 0;
          victoryParticles = [];
          state = 'levelcomplete';
        }
      }
      return !hit;
    });
  }

  // Lazerler: uyarı süresi bitince ışın, oyuncu o şeritteyse tek sefer hasar
  lasers = lasers.filter(L => {
    L.t++;
    if (L.t > L.warn && !L.hit && !player.dead && playerLaneNow() === L.lane) {
      L.hit = true;
      damagePlayer('Vaporized by the void beam!');
    }
    return L.t <= L.warn + L.fire;
  });

  // Nebula sis bulutları
  if (currentZone === 3) {
    fogClouds.forEach((c, i) => {
      c.y += c.speed; c.x += c.drift;
      if (c.y - c.r > H) fogClouds[i] = makeFogCloud(-140);
    });
  }

  // --- Zone 2 mechanics ---
  if (currentZone === 2 && state === 'play' && !player.dead) {
    // Fuel drain
    fuel = Math.max(0, fuel - FUEL_DRAIN);
    if (fuel <= 0) {
      lives = 0;
      deathCause = 'Out of fuel!';
      player.dead = true;
      spawnExplosion(player.x, player.y, true);
      spawnExplosion(player.x + 15, player.y - 10, true);
    }
  }

  // Black Hole: kara deliğe çekilen enkaz
  const _zcfg = getLevelConfig();
  if (currentZone === 4 && _zcfg && _zcfg.debris && !boss && state === 'play' && !player.dead) {
    asteroidSpawnTimer++;
    if (asteroidSpawnTimer >= _zcfg.debris) {
      asteroidSpawnTimer = 0;
      spawnAsteroid('normal');
      const a = asteroids[asteroids.length - 1];
      a.speed = 2.4 + Math.random() * 0.6;
      a.rotSpeed = (Math.random() - 0.5) * 0.06;
    }
  }

  if ((currentZone === 2 || currentZone === 4) && state === 'play' && !player.dead) {
    // Asteroid spawning (zone 2)
    if (currentZone === 2 && !boss) {
      asteroidSpawnTimer++;
      const astLvl = currentLevel - 5; // 1-4 for zone 2 levels 6-9
      const astInterval = [55, 44, 35, 28][astLvl - 1] ?? 44;
      if (asteroidSpawnTimer >= astInterval) {
        asteroidSpawnTimer = 0;
        const ironCount = asteroids.filter(a => a.type === 'iron').length;
        const canIron = ironCount < 2;
        const spd = [2.2, 2.6, 3.0, 3.4][astLvl - 1] ?? 2.2;

        // Ana asteroid — demir oranı artırıldı
        let atype;
        if (astLvl === 1) atype = (canIron && Math.random() < 0.30) ? 'iron' : 'normal';
        else if (astLvl === 2) atype = (canIron && Math.random() < 0.45) ? 'iron' : 'normal';
        else if (astLvl === 3) atype = (canIron && Math.random() < 0.55) ? 'iron' : 'normal';
        else                   atype = (canIron && Math.random() < 0.60) ? 'iron' : 'normal';
        if (atype === 'iron') {
          // Mevcut demir lane'lerini bul — yeni demir ekleyince en az 1 lane boş kalsın
          const ironLanes = new Set();
          asteroids.forEach(a => {
            if (a.type === 'iron') {
              let ci = 0;
              LANE_CENTERS.forEach((lc, li) => { if (Math.abs(a.x - lc) < Math.abs(a.x - LANE_CENTERS[ci])) ci = li; });
              ironLanes.add(ci);
            }
          });
          const available = [0, 1, 2].filter(l => new Set([...ironLanes, l]).size < 3);
          if (available.length > 0) {
            spawnAsteroid('iron', LANE_CENTERS[available[Math.floor(Math.random() * available.length)]]);
          } else {
            atype = 'normal'; spawnAsteroid('normal');
          }
        } else {
          spawnAsteroid(atype);
        }
        { const a = asteroids[asteroids.length-1]; a.speed = spd; a.rotSpeed = 0; }

        // Ekstra normal asteroidler
        const extraChances = [0.20, 0.35, 0.50, 0.65][astLvl - 1] ?? 0.35;
        const tripleChance = [0,    0,    0.15, 0.30][astLvl - 1] ?? 0;
        if (Math.random() < extraChances) {
          spawnAsteroid('normal');
          const a2 = asteroids[asteroids.length-1]; a2.speed = spd; a2.rotSpeed = 0;
        }
        if (Math.random() < tripleChance) {
          spawnAsteroid('normal');
          const a3 = asteroids[asteroids.length-1]; a3.speed = spd; a3.rotSpeed = 0;
        }
      }
    }

    // Asteroid update + collisions
    const newFragments = [];
    asteroids = asteroids.filter(a => {
      a.y += a.speed;
      a.rotation += a.rotSpeed;
      if (a.flash > 0) a.flash--;
      if (a.y > H + 60 || a.x < -60 || a.x > W + 60) return false;

      // Bullet collision
      if (a.type !== 'iron') {
        let hit = false;
        bullets = bullets.filter(b => {
          if (hit) return true;
          if (Math.hypot(b.x - a.x, b.y - a.y) < a.size * 0.9) {
            a.hp--;
            a.flash = 10;
            spawnExplosion(b.x, b.y, false);
            if (a.hp <= 0) {
              hit = true;
              spawnExplosion(a.x, a.y, a.size > 22);
              score += a.size > 25 ? 20 : 10;
              if (a.type === 'normal' && a.size > 24 && !a.isFragment) {
                for (let f = 0; f < 2; f++) {
                  const ns = a.size * 0.52;
                  const n2 = 8;
                  newFragments.push({
                    type: 'normal', x: a.x, y: a.y,
                    size: ns, speed: a.speed * 1.3, hp: 1, maxHp: 1,
                    vx: 0, rotation: Math.random()*Math.PI*2,
                    rotSpeed: (Math.random()-0.5)*0.055,
                    shape: Array.from({length: n2}, () => 0.55 + Math.random()*0.5),
                    flash: 0, isFragment: true,
                  });
                }
                if (currentZone === 2 && Math.random() < 0.10) powerups.push({ type: 'fuel', x: a.x, y: a.y, speed: 1.6, bobTimer: 0 });
              }
            }
            return false;
          }
          return true;
        });
        if (hit) return false;
      }
      // Iron asteroids: bullets pass through (invincible, but doesn't block shots)

      // Player collision
      if (!player.dead && Math.abs(a.x - player.x) < a.size + 16 && Math.abs(a.y - player.y) < a.size + 16) {
        spawnExplosion(a.x, a.y, true);
        damagePlayer('Hit by an asteroid!');
        return false;
      }
      return true;
    });
    asteroids.push(...newFragments);
  }

  // Normal spawn — boss savaşında, level bitiş bekleme aşamasında ve zone 2'de durur
  const levelEnding = currentLevel !== currentZone * 5 && getWave() > currentLevel * 5;
  if (!boss && !levelEnding && currentZone !== 2) {
    spawnTimer++;
    const cfg      = getLevelConfig();
    const interval = cfg ? cfg.interval      : getSpawnInterval();
    const dChance  = cfg ? cfg.doubleChance  : getDoubleSpawnChance();
    if (spawnTimer >= interval) {
      spawnTimer = 0;
      spawnEnemy();
      // Suppress double enemy spawn when an iron asteroid is blocking a lane
      const ironActive = currentZone === 2 && asteroids.some(a => a.type === 'iron');
      if (Math.random() < dChance && !ironActive) spawnEnemy(Math.floor(Math.random() * 80 + 60));
    }
  }

  // Power-ups move + collect
  powerups = powerups.filter(p => {
    p.y += p.speed;
    p.bobTimer++;
    if (p.y > H + 20) return false;

    // Oyuncu topladı mı?
    if (Math.abs(p.x - player.x) < 28 && Math.abs(p.y - player.y) < 34) {
      if (p.type === 'shield') {
        player.shieldTimer = POWERUP_DURATION;
      } else if (p.type === 'triple') {
        player.tripleTimer = POWERUP_DURATION;
      } else if (p.type === 'double') {
        player.doubleTimer = POWERUP_DURATION;
      } else if (p.type === 'bomb') {
        activateBomb();
      } else if (p.type === 'fuel') {
        fuel = Math.min(FUEL_MAX, fuel + 28);
      }
      // Toplama efekti
      spawnCollectEffect(p.x, p.y, POWERUP_COLORS[p.type]);
      return false;
    }
    return true;
  });

  if (eBullets.length > 30) eBullets.splice(0, eBullets.length - 30); // unbounded growth engeli

  // Düşman mermileri: hareket + oyuncuya çarpma
  eBullets = eBullets.filter(b => {
    // Black Hole: kara delik mermiyi ortaya doğru büker
    if (b.curve) b.vx = Math.max(-1.6, Math.min(1.6, b.vx + (W / 2 - b.x) * 0.00012));
    b.x += b.vx;
    b.y += b.vy;
    if (b.y > H + 10) return false;

    if (!player.dead && Math.abs(b.x - player.x) < 24 && Math.abs(b.y - player.y) < 40) {
      damagePlayer('Your ship was destroyed!');
      return false;
    }
    return true;
  });

  // Enemies
  enemies = enemies.filter(e => {
    e.y += e.speed;
    // Black Hole: çekim düşmanı komşu şeride savurur
    if (e.shiftAt !== null && e.y > e.shiftAt) { e.lane = e.shiftTo; e.shiftAt = null; e.shifting = 40; }
    if (e.shifting > 0) e.shifting--;
    // Zikzak hareketi (bölüm 4)
    if (e.zigzag) {
      e.zigzagPhase += 0.055;
      const zx = LANE_CENTERS[e.lane] + Math.sin(e.zigzagPhase) * 40;
      e.x += (zx - e.x) * (e.shifting > 0 ? 0.08 : 1);
    } else {
      e.x += (LANE_CENTERS[e.lane] - e.x) * 0.08;
    }
    if (e.flash > 0) e.flash--;

    // Nebula hayaletleri: görünür → kaybolur → görünmez → belirir döngüsü
    if (e.phantom) {
      e.cloakT = (e.cloakT + 1) % 170;
      const t = e.cloakT;
      e.alpha = t < 90 ? 1 : t < 110 ? 1 - (t - 90) / 20 * 0.88 : t < 150 ? 0.12 : 0.12 + (t - 150) / 20 * 0.88;
    }
    const cloaked = e.phantom && e.alpha < 0.45;

    // Ateş etme — canShoot false ise hiç ateş etme
    e.fireTimer++;
    if (e.canShoot && !cloaked && e.fireTimer >= e.fireRate && e.y > 0) {
      e.fireTimer = 0;
      const activeLanes = new Set(eBullets.map(b => b.lane));
      if (activeLanes.size < 2 || activeLanes.has(e.lane)) {
        eBullets.push({
          x: e.x, y: e.y + 20,
          vx: 0, vy: 5,
          hp: e.maxHp,
          lane: e.lane,
          curve: e.curveShots,
        });
      }
    }

    // Bullet hits (görünmez hayaletten mermi geçer)
    if (!cloaked) bullets = bullets.filter(b => {
      const sc  = ENEMY_TIER[e.maxHp].sc;
      const hit = Math.abs(b.x - e.x) < 22 * sc && Math.abs(b.y - e.y) < 26 * sc;
      if (hit) {
        e.hp--;
        e.flash = 14;
        if (e.hp <= 0) {
          spawnExplosion(e.x, e.y, true);
          score += e.maxHp * 10;
          spawnPowerup(e.x, e.y);
        } else {
          spawnExplosion(e.x, e.y, false);
        }
      }
      return !hit;
    });

    if (e.hp <= 0) return false;

    // Reached player — kalkan varsa engelle (kalkan hasarı emer, ama bitmez)
    if (e.y > H - 55) {
      spawnExplosion(e.x, e.y, true);
      damagePlayer('The enemy reached the ship!');
      return false;
    }

    return true;
  });

  // Explosions
  explosions = explosions.filter(p => {
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.96; p.vy *= 0.96;
    p.life -= p.decay;
    return p.life > 0;
  });
}

// --- Draw: yuvarlak köşe yardımcısı ---
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// --- Menü kartı illüstrasyonları (bölgeye göre) ---
function drawCardArt(i, cx, CY, CW) {
  const px = cx + CW * 0.62, py = CY + 140;
  if (i === 0) {
    // Dekoratif gezegen + halka
    const pg = ctx.createRadialGradient(px, py, 20, px, py, 80);
    pg.addColorStop(0, '#1a4aaa'); pg.addColorStop(0.5, '#0a2060'); pg.addColorStop(1, '#040820');
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.arc(px, py, 72, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(100,160,255,0.35)'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.ellipse(px, py + 8, 105, 22, -0.3, 0, Math.PI * 2); ctx.stroke();
  } else if (i === 1) {
    // Asteroid kümesi
    [[px, py, 46], [px - 110, py - 50, 22], [px - 70, py + 70, 30], [px + 40, py - 85, 16], [px - 140, py + 30, 14]].forEach(([ax, ay, r], k) => {
      ctx.save(); ctx.translate(ax, ay); ctx.rotate(k);
      ctx.fillStyle = k === 0 ? '#6a4a2e' : '#7a5535'; ctx.strokeStyle = '#9a7050'; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let j = 0; j < 8; j++) {
        const a = j / 8 * Math.PI * 2, rr = r * (0.75 + 0.25 * Math.sin(j * 2.3 + k));
        j === 0 ? ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    });
  } else if (i === 2) {
    // Nebula bulutları + gizli komuta merkezi
    [[px, py, 110, 'rgba(160,50,200,0.45)'], [px - 120, py + 40, 90, 'rgba(200,50,150,0.35)'], [px - 60, py - 60, 80, 'rgba(50,150,190,0.3)']].forEach(([gx, gy, gr, gc]) => {
      const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
      g.addColorStop(0, gc); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(gx, gy, gr, 0, Math.PI * 2); ctx.fill();
    });
    ctx.strokeStyle = 'rgba(80,240,220,0.6)'; ctx.lineWidth = 2;
    ctx.strokeRect(px - 30, py - 12, 60, 24);
    ctx.beginPath(); ctx.moveTo(px, py - 12); ctx.lineTo(px, py - 34); ctx.stroke();
  } else {
    // Kara delik
    const halo = ctx.createRadialGradient(px - 30, py, 30, px - 30, py, 130);
    halo.addColorStop(0, 'rgba(255,120,40,0.4)'); halo.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(px - 30, py, 130, 0, Math.PI * 2); ctx.fill();
    for (let k = 0; k < 3; k++) {
      ctx.strokeStyle = `rgba(255,${160 - k * 30},${70 + k * 20},${0.7 - k * 0.15})`; ctx.lineWidth = 5 - k;
      ctx.beginPath(); ctx.ellipse(px - 30, py, 90 + k * 14, 18 + k * 4, -0.2, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(px - 30, py, 40, 0, Math.PI * 2); ctx.fill();
  }
  // Küçük düşman silüetleri
  [[cx + 55, CY + 80, 0.55], [cx + 90, CY + 210, 0.45], [cx + 195, CY + 195, 0.5]].forEach(([ex, ey, sc]) => {
    ctx.save(); ctx.translate(ex, ey); ctx.scale(sc, sc);
    ctx.fillStyle = 'rgba(255,80,80,0.55)';
    ctx.beginPath();
    ctx.moveTo(0,16); ctx.lineTo(-14,-14); ctx.lineTo(-6,-8); ctx.lineTo(0,-16); ctx.lineTo(6,-8); ctx.lineTo(14,-14);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  });
}

// --- Draw: Ana Menü ---
function drawMenu() {
  ctx.fillStyle = '#00001a';
  ctx.fillRect(0, 0, W, H);
  drawStars();

  // Başlık
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 26px Courier New';
  ctx.fillStyle = '#0ff'; ctx.shadowColor = '#0ff'; ctx.shadowBlur = 16;
  ctx.fillText('SPACE SHOOTER', W / 2, 46);
  ctx.font = '11px Courier New';
  ctx.fillStyle = devMode ? '#ff0' : '#48a'; ctx.shadowBlur = 0;
  let gameDone = false;
  try { gameDone = localStorage.getItem('ss_complete') === '1'; } catch(e) {}
  ctx.fillText(devMode ? '⚡ TEST MODE' : gameDone ? '★ GAME COMPLETE ★' : 'Choose a zone', W / 2, 70);
  ctx.restore();

  const CW = 280, CH = 420, CR = 16;
  const GAP = W - 60;   // kart başlangıçları arası mesafe (menuAnimX ile aynı birim)
  const CY = 108;       // kartın üst y'si

  MENU_CARDS.forEach((card, i) => {
    const cx = W / 2 - CW / 2 + i * GAP - menuAnimX; // sol kenar x
    if (cx > W + CW || cx < -CW) return;          // ekran dışı, çizme

    const locked = isZoneLocked(i);
    ctx.save();

    // Kart arka planı
    const bg = ctx.createLinearGradient(cx, CY, cx, CY + CH);
    bg.addColorStop(0, card.col1);
    bg.addColorStop(1, card.col2);
    ctx.fillStyle = bg;
    rrect(cx, CY, CW, CH, CR); ctx.fill();

    // Kart kenarlığı
    ctx.strokeStyle = locked ? '#1e2040' : (i === menuIdx ? '#0cf' : '#1a3060');
    ctx.lineWidth   = i === menuIdx && !locked ? 2.5 : 1.5;
    if (!locked && i === menuIdx) { ctx.shadowColor = '#0cf'; ctx.shadowBlur = 14; }
    rrect(cx, CY, CW, CH, CR); ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

    if (!locked) {
      // — İllüstrasyon alanı (gezegen + yıldızlar) —
      ctx.save();
      ctx.beginPath(); ctx.rect(cx, CY, CW, CH); ctx.clip();

      drawCardArt(i, cx, CY, CW);
      ctx.restore();

      // Başlık
      ctx.font = 'bold 22px Courier New';
      ctx.fillStyle = '#fff'; ctx.shadowColor = '#0cf'; ctx.shadowBlur = 10;
      ctx.fillText(card.name, cx + CW / 2, CY + CH - 145);
      ctx.shadowBlur = 0;

      ctx.font = '12px Courier New';
      ctx.fillStyle = '#7df';
      ctx.fillText(card.sub, cx + CW / 2, CY + CH - 118);

      ctx.font = '10px Courier New';
      ctx.fillStyle = '#46a';
      ctx.fillText('5 Level  •  1 Boss', cx + CW / 2, CY + CH - 97);

      // OYNA butonu
      const bx = cx + CW / 2 - 65, by = CY + CH - 78;
      const bGrd = ctx.createLinearGradient(bx, by, bx, by + 44);
      bGrd.addColorStop(0, '#0088cc');
      bGrd.addColorStop(1, '#0044aa');
      ctx.fillStyle = bGrd;
      ctx.shadowColor = '#0cf'; ctx.shadowBlur = 12;
      rrect(bx, by, 130, 44, 10); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 15px Courier New';
      ctx.fillText('PLAY', cx + CW / 2, by + 22);

    } else {
      // Kilitli kart
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      rrect(cx, CY, CW, CH, CR); ctx.fill();

      // Kilit ikonu (çizimle)
      const lx = cx + CW / 2, ly = CY + CH / 2 - 20;
      ctx.fillStyle = '#2a2a50';
      rrect(lx - 28, ly - 14, 56, 46, 8); ctx.fill();
      ctx.strokeStyle = '#2a2a50'; ctx.lineWidth = 10;
      ctx.beginPath(); ctx.arc(lx, ly - 18, 20, Math.PI, 0); ctx.stroke();
      ctx.strokeStyle = '#1a1a38'; ctx.lineWidth = 8;
      ctx.beginPath(); ctx.arc(lx, ly - 18, 20, Math.PI, 0); ctx.stroke();
      ctx.fillStyle = '#3a3a6a';
      ctx.beginPath(); ctx.arc(lx, ly + 8, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(lx - 2, ly + 8, 4, 10);

      ctx.font = 'bold 16px Courier New';
      ctx.fillStyle = '#3a3a60';
      ctx.fillText(card.name, cx + CW / 2, CY + CH / 2 + 50);

      ctx.font = 'bold 10px Courier New';
      ctx.fillStyle = '#2a2a48';
      ctx.fillText('COMING SOON', cx + CW / 2, CY + CH / 2 + 74);
    }

    ctx.restore();
  });

  // Sol ok
  if (menuIdx > 0) {
    ctx.save(); ctx.globalAlpha = 0.7;
    ctx.fillStyle = 'rgba(0,180,255,0.18)';
    ctx.beginPath(); ctx.arc(28, H / 2 + 30, 22, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#0cf'; ctx.font = 'bold 18px Courier New';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('‹', 28, H / 2 + 30);
    ctx.restore();
  }
  // Sağ ok
  if (menuIdx < MENU_CARDS.length - 1) {
    ctx.save(); ctx.globalAlpha = 0.7;
    ctx.fillStyle = 'rgba(0,180,255,0.18)';
    ctx.beginPath(); ctx.arc(W - 28, H / 2 + 30, 22, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#0cf'; ctx.font = 'bold 18px Courier New';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('›', W - 28, H / 2 + 30);
    ctx.restore();
  }

  // Nokta göstergesi
  ctx.save();
  MENU_CARDS.forEach((_, i) => {
    ctx.fillStyle = i === menuIdx ? '#0cf' : '#224';
    ctx.beginPath(); ctx.arc(W / 2 + (i - 1.5) * 18, 626, i === menuIdx ? 5 : 3.5, 0, Math.PI * 2); ctx.fill();
  });

  // DEV butonu (sağ alt köşe)
  ctx.fillStyle = devMode ? 'rgba(255,200,0,0.25)' : 'rgba(255,255,255,0.08)';
  ctx.fillRect(W - 52, H - 36, 44, 26);
  ctx.strokeStyle = devMode ? 'rgba(255,200,0,0.6)' : 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 1;
  ctx.strokeRect(W - 52, H - 36, 44, 26);
  ctx.fillStyle = devMode ? '#fc0' : 'rgba(255,255,255,0.4)';
  ctx.font = 'bold 11px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('DEV', W - 30, H - 19);

  ctx.restore();
}

// --- Draw: Level Map ---
function drawMap() {
  // Arka plan
  ctx.fillStyle = '#00001a';
  ctx.fillRect(0, 0, W, H);
  drawStars();

  // Başlık
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 22px Courier New';
  ctx.fillStyle = '#0ff'; ctx.shadowColor = '#0ff'; ctx.shadowBlur = 14;
  const zoneNames = ['', 'SPACE', 'ASTEROID BELT', 'NEBULA', 'BLACK HOLE'];
  ctx.fillText(`✦ ${zoneNames[currentZone] || 'LEVEL MAP'} ✦`, W / 2, 58);
  ctx.shadowBlur = 0;
  ctx.font = '11px Courier New';
  ctx.fillStyle = '#4af';
  ctx.fillText('Tap an unlocked level', W / 2, 82);
  ctx.restore();

  // Bağlantı çizgileri
  for (let i = 0; i < 4; i++) {
    const a = MAP_NODES[i], b = MAP_NODES[i + 1];
    const sa = levelStates[(currentZone-1)*5 + i], sb = levelStates[(currentZone-1)*5 + i + 1];
    ctx.save();
    ctx.lineWidth = 3;
    ctx.setLineDash([7, 6]);
    if (sa === 'completed' && sb === 'completed') {
      ctx.strokeStyle = '#f90'; ctx.shadowColor = '#f90'; ctx.shadowBlur = 6;
    } else if (sa === 'completed' || sa === 'unlocked') {
      ctx.strokeStyle = '#26a'; ctx.shadowBlur = 0;
    } else {
      ctx.strokeStyle = '#223'; ctx.shadowBlur = 0;
    }
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.restore();
  }

  // Nodelar
  MAP_NODES.forEach((node, i) => {
    const li    = (currentZone - 1) * 5 + i;
    const st    = levelStates[li];
    const lvl   = li + 1;
    const isBoss = lvl % 5 === 0;
    const r     = isBoss ? 30 : 24;
    const pulse = 0.65 + 0.35 * Math.sin(frameCount * 0.06 + i * 0.8);

    ctx.save();
    ctx.translate(node.x, node.y);

    if (st === 'completed') {
      // Altın
      ctx.shadowColor = '#f90'; ctx.shadowBlur = 12;
      ctx.fillStyle = '#7a3800';
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f90';
      ctx.beginPath(); ctx.arc(0, 0, r - 4, 0, Math.PI * 2); ctx.fill();
      // Tik işareti
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.shadowBlur = 0;
      ctx.beginPath(); ctx.moveTo(-7, 0); ctx.lineTo(-2, 6); ctx.lineTo(8, -6); ctx.stroke();
    } else if (st === 'unlocked') {
      // Siyan / parlak
      ctx.shadowColor = '#0cf'; ctx.shadowBlur = 16 * pulse;
      ctx.fillStyle = '#003344';
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `rgba(0,200,255,${0.75 * pulse})`;
      ctx.beginPath(); ctx.arc(0, 0, r - 4, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `bold ${isBoss ? 11 : 12}px Courier New`;
      ctx.fillText(lvl, 0, isBoss ? -5 : 0);
      if (isBoss) { ctx.font = 'bold 9px Courier New'; ctx.fillStyle = '#ff8'; ctx.fillText('BOSS', 0, 7); }
    } else {
      // Kilitli
      ctx.fillStyle = '#111122';
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#2a2a44'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
      // Kilit gövdesi
      ctx.fillStyle = '#2a2a44';
      ctx.fillRect(-6, -2, 12, 9);
      ctx.beginPath(); ctx.arc(0, -4, 6, Math.PI, 0); ctx.strokeStyle = '#2a2a44';
      ctx.lineWidth = 3; ctx.stroke();
    }
    ctx.restore();
  });

  // Geri butonu
  ctx.save();
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 13px Courier New';
  ctx.fillStyle = '#0cf'; ctx.shadowColor = '#0cf'; ctx.shadowBlur = 8;
  ctx.fillText('◀ BACK', 14, 28);
  ctx.shadowBlur = 0;
  ctx.restore();

  // Alt bilgi
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '10px Courier New';
  ctx.fillStyle = '#446';
  ctx.fillText(`Level ${currentZone * 5} is a boss fight`, W / 2, 650);
  ctx.restore();
}

// --- Collect effect ---
function spawnCollectEffect(x, y, color) {
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * Math.PI * 2;
    const spd = Math.random() * 2.5 + 1;
    explosions.push({
      x, y,
      vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
      life: 1, decay: 0.04,
      r: Math.random() * 3 + 1.5,
      color,
    });
  }
}

// --- Render ---
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  if (state === 'intro') { drawIntro(); return; }
  if (state === 'zonetransition') { drawZoneTransition(); return; }
  if (state === 'menu') { drawMenu(); return; }
  if (state === 'map') { drawMap(); return; }

  if (currentZone === 2) {
    drawZone2Background();
  } else if (currentZone === 3) {
    drawZone3Background();
  } else if (currentZone === 4) {
    drawZone4Background();
  } else {
    ctx.fillStyle = '#000010';
    ctx.fillRect(0, 0, W, H);
    drawStars();
  }
  drawLanes();
  drawExplosions();

  asteroids.forEach(drawAsteroid);
  powerups.forEach(drawPowerup);
  bullets.forEach(drawBullet);
  enemies.forEach(drawEnemy);
  if (boss) drawBoss(boss);
  if (currentZone === 3) drawFog(); // sis düşmanları örter, düşman mermilerini değil
  drawLasers();
  eBullets.forEach(drawEBullet);

  if ((state === 'play' || state === 'gameover') && !player.dead) {
    drawShip(player.x, player.y);
  }

  if (state === 'play' && tutorial) drawTutorial();


  if (state === 'gameover') drawOverlay('GAME OVER', deathCause || 'The enemy reached the ship!');

  if (state === 'levelcomplete') {
    if (levelCompleteType === 'clear') {
      // Sade bölüm tamamlama ekranı
      const t = 1 - bossKillTimer / 180;
      const fadeIn = Math.min(1, t * 5);
      ctx.save();
      ctx.fillStyle = `rgba(0,0,15,${Math.min(0.82, t * 2)})`;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = fadeIn;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = 'bold 13px Courier New';
      ctx.fillStyle = '#ffee88'; ctx.shadowColor = '#ff8'; ctx.shadowBlur = 10;
      ctx.fillText(`LEVEL ${currentLevel}`, W / 2, H / 2 - 50);
      ctx.font = 'bold 26px Courier New';
      ctx.fillStyle = '#fff'; ctx.shadowColor = '#0ff'; ctx.shadowBlur = 22;
      ctx.fillText('AREA CLEARED!', W / 2, H / 2);
      ctx.font = '14px Courier New'; ctx.fillStyle = '#0ff'; ctx.shadowBlur = 8;
      ctx.fillText('SCORE: ' + score, W / 2, H / 2 + 44);
      ctx.font = '11px Courier New'; ctx.fillStyle = '#446'; ctx.shadowBlur = 0;
      ctx.fillText('Returning to map...', W / 2, H / 2 + 80);
      ctx.restore();

    } else {
      // ── BOSS ZAFERİ: GÖRKEMLI EKRAN ──
      const vt = victoryTime;

      // Koyu arka plan
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,10,0.88)';
      ctx.fillRect(0, 0, W, H);

      // Zafer parçacıkları — shadowBlur yok, glow katmanlı circle ile
      ctx.save();
      victoryParticles.forEach(p => {
        ctx.globalAlpha = Math.max(0, p.life) * 0.28;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 2.5, 0, Math.PI * 2); ctx.fill();
      });
      victoryParticles.forEach(p => {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        if (p.star) {
          ctx.save(); ctx.translate(p.x, p.y);
          ctx.beginPath();
          for (let i = 0; i < 5; i++) {
            const a = (i / 5) * Math.PI * 2 - Math.PI / 2;
            const b = a + Math.PI / 5;
            i === 0 ? ctx.moveTo(Math.cos(a)*p.r, Math.sin(a)*p.r) : ctx.lineTo(Math.cos(a)*p.r, Math.sin(a)*p.r);
            ctx.lineTo(Math.cos(b)*p.r*0.4, Math.sin(b)*p.r*0.4);
          }
          ctx.closePath(); ctx.fill();
          ctx.restore();
        } else {
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2); ctx.fill();
        }
      });
      ctx.globalAlpha = 1;
      ctx.restore();

      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

      // "BÖLÜM X" küçük etiket — fade in
      const labelAlpha = Math.min(1, vt / 30);
      ctx.save();
      ctx.globalAlpha = labelAlpha;
      ctx.font = 'bold 13px Courier New';
      ctx.fillStyle = '#ffee44'; ctx.shadowColor = '#ff8'; ctx.shadowBlur = 12;
      ctx.fillText(currentLevel === LEVEL_COUNT ? 'THE VOID LEADER HAS FALLEN' : `LEVEL ${currentLevel}  ·  BOSS DEFEATED`, W / 2, H / 2 - 130);
      ctx.restore();

      // "BÖLGE TEMİZLENDİ!" — bounce animasyonu
      const titleProgress = Math.min(1, vt / 45);
      const bounce = titleProgress < 0.6
        ? 1 + 0.55 * Math.sin(titleProgress * Math.PI / 0.6)
        : 1 + 0.08 * Math.sin((vt - 27) * 0.18);
      const titleAlpha = Math.min(1, vt / 20);
      ctx.save();
      ctx.globalAlpha = titleAlpha;
      ctx.translate(W / 2, H / 2 - 62);
      ctx.scale(bounce, bounce);
      ctx.font = 'bold 32px Courier New';
      const tGrd = ctx.createLinearGradient(-160, -20, 160, 20);
      tGrd.addColorStop(0,   '#ffe040');
      tGrd.addColorStop(0.5, '#ffffff');
      tGrd.addColorStop(1,   '#00ffff');
      ctx.fillStyle = tGrd;
      ctx.shadowColor = '#ffe040'; ctx.shadowBlur = 30;
      ctx.fillText('AREA CLEARED!', 0, 0);
      ctx.restore();

      // Yıldız süslemeler
      if (vt > 40) {
        const starAlpha = Math.min(1, (vt - 40) / 30);
        ctx.save(); ctx.globalAlpha = starAlpha;
        [W/2 - 130, W/2 + 130].forEach(sx => {
          ctx.font = '28px Courier New';
          ctx.fillStyle = '#ffe040'; ctx.shadowColor = '#ff8'; ctx.shadowBlur = 16;
          ctx.fillText('★', sx, H / 2 - 62);
        });
        ctx.restore();
      }

      // Skor
      if (vt > 55) {
        const scoreAlpha = Math.min(1, (vt - 55) / 25);
        ctx.save(); ctx.globalAlpha = scoreAlpha;
        ctx.font = 'bold 15px Courier New';
        ctx.fillStyle = '#aaddff'; ctx.shadowColor = '#0cf'; ctx.shadowBlur = 10;
        ctx.fillText('TOTAL SCORE', W / 2, H / 2 + 5);
        ctx.font = 'bold 38px Courier New';
        ctx.fillStyle = '#ffffff'; ctx.shadowColor = '#0ff'; ctx.shadowBlur = 24;
        ctx.fillText(score, W / 2, H / 2 + 50);
        ctx.restore();
      }

      // Haritaya dön butonu
      if (vt > 90) {
        const btnAlpha = Math.min(1, (vt - 90) / 30);
        const btnPulse = 0.8 + 0.2 * Math.sin(vt * 0.08);
        const bx = W / 2 - 100, by = H - 145;
        ctx.save(); ctx.globalAlpha = btnAlpha * btnPulse;
        const bGrd = ctx.createLinearGradient(bx, by, bx, by + 50);
        bGrd.addColorStop(0, '#005599');
        bGrd.addColorStop(1, '#002244');
        ctx.fillStyle = bGrd;
        ctx.shadowColor = '#0cf'; ctx.shadowBlur = 18;
        rrect(bx, by, 200, 50, 12); ctx.fill();
        ctx.strokeStyle = '#0cf'; ctx.lineWidth = 1.5;
        rrect(bx, by, 200, 50, 12); ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff'; ctx.font = 'bold 15px Courier New';
        ctx.globalAlpha = btnAlpha;
        ctx.fillText(currentLevel === LEVEL_COUNT ? 'CONTINUE  ▶' : 'RETURN TO MENU  ▶', W / 2, by + 25);
        ctx.restore();
      }

      ctx.restore();
    }
  }

  drawHUD();
}

// --- Loop ---
let _lastTime = 0;
let _accum = 0;
const _STEP = 1000 / 60;

function loop(timestamp) {
  requestAnimationFrame(loop);
  if (_lastTime === 0) { _lastTime = timestamp; }
  const delta = Math.min(timestamp - _lastTime, 100);
  _lastTime = timestamp;
  _accum += delta;
  while (_accum >= _STEP) {
    update();
    _accum -= _STEP;
  }
  render();
}

if (BOSS_MODE) {
  levelStates = levelStates.map(() => 'unlocked');
  startLevel(5);
  spawnBoss(25);
}

requestAnimationFrame(loop);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
