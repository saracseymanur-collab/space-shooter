<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Space Shooter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block;
    position: fixed;
    top: 50%; left: 50%;
    width: 390px; height: 844px;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(var(--game-scale, 1));
    touch-action: none;
    image-rendering: pixelated;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const spaceshipImg = new Image();
spaceshipImg.src = 'ASSETS/spaceship.png';

const enemyImgs = [null, new Image(), new Image(), new Image()];
enemyImgs[1].src = 'ASSETS/enemy1.png';
enemyImgs[2].src = 'ASSETS/enemy2.png';
enemyImgs[3].src = 'ASSETS/enemy3.png';

const bossImg = new Image();
bossImg.src = 'ASSETS/boss.png';
const BOSS_W = 190, BOSS_H = 127; // 1536×1024 oranında

// Düşman görsel boyutları — gerçek en/boy oranına göre (sıkı kırpılmış assetler)
const ENEMY_SIZES = { 1: { w: 58, h: 38 }, 2: { w: 82, h: 55 }, 3: { w: 108, h: 89 } };

// Sabit oyun alanı boyutu (390×844 — iPhone standart)
const W = 390;
const H = 844;

// Retina/HiDPI: fiziksel piksel sayısını artır, mantıksal koordinatlar değişmez
const DPR = Math.min(window.devicePixelRatio || 1, 2);
canvas.width  = W * DPR;
canvas.height = H * DPR;

// --- CSS ölçeği: mobilde tam ekran doldur, masaüstünde telefon boyutu ---
function updateScale() {
  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
  let scale;
  if (isMobile) {
    scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  } else {
    scale = Math.min(1, window.innerWidth / W, window.innerHeight / H);
  }
  document.documentElement.style.setProperty('--game-scale', scale);
}
updateScale();
window.addEventListener('resize', updateScale);

// --- Lanes ---
const LANE_COUNT = 3;
const LANE_W = W / LANE_COUNT;
const LANE_CENTERS = [LANE_W * 0.5, LANE_W * 1.5, LANE_W * 2.5];

// --- Harita node pozisyonları (5 level, dikey path) ---
const MAP_NODES = [
  { x: W / 2, y: H * 0.80 },
  { x: W / 2, y: H * 0.66 },
  { x: W / 2, y: H * 0.51 },
  { x: W / 2, y: H * 0.37 },
  { x: W / 2, y: H * 0.23 },
];

// --- Menu ---
const MENU_CARDS = [
  { name: 'SPACE',         sub: 'Clear the Enemies',       locked: false, col1: '#001030', col2: '#002860' },
  { name: 'Asteroid Belt', sub: 'Chase the Main Fleet',    locked: true,  col1: '#150e04', col2: '#241808' },
  { name: 'Nebula',        sub: 'Find the Command Center', locked: true,  col1: '#160020', col2: '#240030' },
  { name: 'Black Hole',    sub: 'Face Their Leader',       locked: true,  col1: '#040404', col2: '#0c0c0c' },
];
// DEV / test modunda tüm bölgeler açık görünür
function isZoneLocked(i) { return MENU_CARDS[i].locked && !devMode && !TEST_MODE; }
const BOSS_NAMES = ['', 'VOID VANGUARD', 'ROCK TITAN', 'COMMAND CENTER', 'VOID LEADER'];
let menuIdx  = 0;   // hedef kart indexi
let menuAnimX = 0;  // smooth scroll x
let titleTapCount = 0, titleTapTimer = 0; // gizli test modu: başlığa 5x hızlı dokun
let devMode = false;

// --- Intro Cinematic ---
const INTRO_PANELS = [
  "Humanity discovered a new planet — Astra. Thousands of settlers set out with hope.",
  "Then the Dark Wave came. No one was ready. Two planets. One night.",
  "Those stranded on Astra transformed. Mutated. They could never return home — they were not welcomed.",
  "From the ruins, rage was born. They built the Void Colony. First to survive. Then for revenge.",
  "Now they are coming. The planet is weak. The army is gone.",
  "Only you remain. And that has to be enough.",
];
const ENDING_PANELS = [
  "The Void Leader is gone — swallowed by the black hole it called home.",
  "Without their leader, the Void Colony's fleet stops. Then, one by one, they lower their weapons.",
  "They were never monsters. Only survivors — abandoned, changed, and afraid.",
  "A new message is sent toward Astra. Not a warning this time. Two words: \"Come home.\"",
  "You came to save one planet. Maybe you saved two.",
  "THE END",
];
let cinePanels = INTRO_PANELS; // intro ve final sinematiği aynı ekranı kullanır
let introPanelIdx = 0;
let introAlpha = 0;
let introPhase = 'fadein'; // 'fadein' | 'show' | 'fadeout'

function startCinematic(panels) {
  cinePanels = panels;
  introPanelIdx = 0; introAlpha = 0; introPhase = 'fadein';
  state = 'intro';
}
function endCinematic() {
  if (cinePanels === ENDING_PANELS) menuIdx = MENU_CARDS.length - 1;
  cinePanels = INTRO_PANELS;
  introPanelIdx = 0; introAlpha = 0; introPhase = 'fadein';
  state = 'menu';
}

// --- Zone Transition ---
const ZONE_TRANSITION_MESSAGES = [
  "The advance fleet has been destroyed. But the main fleet retreated into the asteroid belt. You have no choice but to follow.",
  "The asteroid belt is clear. But the Void Colony's command center is hidden deep in the nebula. This ends there.",
  "The command center is down. Only their leader remains. They're waiting for you near the black hole.",
];
let zoneTransIdx = 0;
let zoneTransAlpha = 0;
let zoneTransPhase = 'fadein'; // 'fadein' | 'show'
function exitZoneTransition() {
  menuIdx = Math.min(MENU_CARDS.length - 1, zoneTransIdx + 1); // yeni açılan bölge kartı
  state = 'menu';
}

// --- State ---
let state = 'intro';

// --- Tutorial ---
let tutorial = localStorage.getItem('ss_tutorial') ? null : { step: 0 }; // 0=swipe right, 1=swipe left
let score = 0;
let lives = 3;
let spawnTimer = 0;
let frameCount = 0;
let boss = null;
let lastWaveForBoss = -1;
let bossKillTimer = 0;
let returnToMap = false;
let levelCompleteType = 'boss'; // 'boss' | 'clear'
let victoryTime = 0;
let victoryParticles = [];
let deathCause = '';
let lasers = [];     // Void Leader şerit lazerleri
let fogClouds = [];  // Nebula sis bulutları

// --- Level sistemi ---
let currentLevel = 1;
const TEST_MODE = new URLSearchParams(window.location.search).get('test') === 'true';
const BOSS_MODE = new URLSearchParams(window.location.search).get('boss') === 'true';
const LEVEL_COUNT = 20; // 4 bölge × 5 bölüm
function loadLevelStates() {
  if (TEST_MODE) return Array.from({length: LEVEL_COUNT}, () => 'unlocked');
  try {
    const saved = JSON.parse(localStorage.getItem('ss_levels'));
    if (Array.isArray(saved) && saved.length > 0 && saved.length <= LEVEL_COUNT) {
      // Eski kayıtlar (5 / 10 bölüm) 20'ye tamamlanır
      const s = [...saved, ...Array.from({length: LEVEL_COUNT - saved.length}, () => 'locked')];
      // Bir bölgenin boss'u bitmişse sonraki bölgenin ilk bölümü açık olmalı
      for (let z = 1; z < 4; z++) {
        if (s[z * 5 - 1] === 'completed' && s[z * 5] === 'locked') s[z * 5] = 'unlocked';
      }
      return s;
    }
  } catch(e) {}
  const s = Array.from({length: LEVEL_COUNT}, () => 'locked');
  s[0] = 'unlocked';
  return s;
}
function saveLevelStates() {
  try { localStorage.setItem('ss_levels', JSON.stringify(levelStates)); } catch(e) {}
}
function loadZoneUnlocked() {
  try {
    const saved = JSON.parse(localStorage.getItem('ss_zones'));
    if (Array.isArray(saved) && saved.length === 4) return saved;
  } catch(e) {}
  return [false, true, true, true]; // true = locked
}
function saveZoneStates() {
  try { localStorage.setItem('ss_zones', JSON.stringify(MENU_CARDS.map(c => c.locked))); } catch(e) {}
}
let levelStates = loadLevelStates();
// Apply saved zone locks
(function() {
  const zl = loadZoneUnlocked();
  MENU_CARDS.forEach((c, i) => { c.locked = zl[i]; });
  // Bölge kilidini bölüm ilerlemesiyle senkronla (eski kayıtlarda Nebula hiç açılmıyordu)
  MENU_CARDS.forEach((c, i) => { if (i > 0 && levelStates[i * 5] !== 'locked') c.locked = false; });
})();

let currentZone = 1;

// --- Zone 2 mechanics ---
let asteroids = [];
let asteroidSpawnTimer = 0;
let fuel = 100;
const FUEL_MAX = 100;
const FUEL_DRAIN = 0.016; // per frame

// Zorluk: tüm parametreler frameCount'tan türetilir (smooth, ayrık wave yok)
function gameSec()  { return frameCount / 60; }
function getWave()  { return Math.floor(gameSec() / 14) + 1; } // her 14s bir dalga

// Spawn aralığı: 80 frame → 36 frame, 160 saniyede lineer düşer
function getSpawnInterval() {
  return Math.max(36, Math.round(80 - gameSec() * 0.46));
}

// Düşman hızı: 1.3 → 3.0, 4 dakikada lineer artar
function getEnemySpeed() {
  return Math.min(3.0, 1.8 + gameSec() / 240 * 1.7) + Math.random() * 0.35;
}

// Düşman HP olasılığı: 2HP 30s'de yavaşça girer, 3HP 2dk'da girer
function getEnemyHp() {
  const t = gameSec();
  const p3 = Math.max(0, Math.min(0.38, (t - 120) / 200));
  const p2 = Math.max(0, Math.min(0.52, (t - 30)  / 160));
  const r = Math.random();
  return r < p3 ? 3 : r < p3 + p2 ? 2 : 1;
}

// Çift spawn şansı: 1 dakikadan itibaren %0 → %48 lineer
function getDoubleSpawnChance() {
  return Math.max(0, Math.min(0.48, (gameSec() - 60) / 200));
}

// Bölüm 1-4 için sabit level konfigürasyonu (5 = özel boss, 6+ smooth sistem)
function getLevelConfig() {
  switch (currentLevel) {
    case 1: {
      const lw = getWave() - (currentLevel - 1) * 5; // level içi dalga (1-4)
      return {
        interval: Math.max(34, 72 - (lw - 1) * 14),  // 72→58→44→34
        doubleChance: 0.12 + (lw - 1) * 0.2,         // 12%→32%→52%→72%
        speed: () => 1.4 + Math.random() * 0.35,
        hp: () => { const r = Math.random(); return r < 0.45 ? 1 : r < 0.78 ? 2 : 3; },
        canShoot: false, zigzag: false,
      };
    }
    case 2: return {
      interval: 58, doubleChance: 0.30,
      speed: () => 1.6 + Math.random() * 0.4,
      hp: () => Math.random() < 0.45 ? 2 : 1,
      canShoot: true, zigzag: false,
    };
    case 3: return {
      interval: 62, doubleChance: 0.3,
      // %40 ihtimalle hızlı küçük düşman
      speed: () => Math.random() < 0.4 ? 3.2 + Math.random() * 0.5 : 1.9 + Math.random() * 0.4,
      hp: () => Math.random() < 0.35 ? 2 : 1,
      canShoot: true, zigzag: false,
    };
    case 4: return {
      interval: 72, doubleChance: 0.25,
      speed: () => 1.9 + Math.random() * 0.5,
      hp: () => Math.random() < 0.4 ? 2 : 1,
      canShoot: false, zigzag: true,
    };
    case 6: return { // Zone 2 L1: light enemies
      interval: 75, doubleChance: 0.15,
      speed: () => 1.5 + Math.random() * 0.4,
      hp: () => Math.random() < 0.35 ? 2 : 1,
      canShoot: false, zigzag: false,
    };
    case 7: return { // Zone 2 L2: iron asteroids + enemies
      interval: 68, doubleChance: 0.25,
      speed: () => 1.7 + Math.random() * 0.4,
      hp: () => Math.random() < 0.4 ? 2 : 1,
      canShoot: true, zigzag: false,
    };
    case 8: return { // Zone 2 L3 (zone 2'de düşman spawn'ı kapalı, sadece asteroid)
      interval: 65, doubleChance: 0.28,
      speed: () => 1.8 + Math.random() * 0.5,
      hp: () => Math.random() < 0.45 ? 2 : 1,
      canShoot: true, zigzag: false,
    };
    case 9: return { // Zone 2 L4
      interval: 70, doubleChance: 0.22,
      speed: () => 1.6 + Math.random() * 0.4,
      hp: () => Math.random() < 0.4 ? 2 : 1,
      canShoot: true, zigzag: true,
    };
    // ── Zone 3: Nebula — sis bulutları + görünmez olabilen hayalet düşmanlar ──
    case 11: return {
      interval: 70, doubleChance: 0.18,
      speed: () => 1.6 + Math.random() * 0.4,
      hp: () => Math.random() < 0.4 ? 2 : 1,
      canShoot: false, zigzag: false, phantom: 0.3, fog: 3,
    };
    case 12: return {
      interval: 64, doubleChance: 0.25,
      speed: () => 1.7 + Math.random() * 0.4,
      hp: () => Math.random() < 0.45 ? 2 : 1,
      canShoot: true, zigzag: false, phantom: 0.4, fog: 4,
    };
    case 13: return {
      interval: 62, doubleChance: 0.28,
      speed: () => 1.8 + Math.random() * 0.5,
      hp: () => { const r = Math.random(); return r < 0.15 ? 3 : r < 0.55 ? 2 : 1; },
      canShoot: true, zigzag: false, phantom: 0.5, fog: 5,
    };
    case 14: case 15: return {
      interval: 66, doubleChance: 0.25,
      speed: () => 1.8 + Math.random() * 0.5,
      hp: () => { const r = Math.random(); return r < 0.15 ? 3 : r < 0.55 ? 2 : 1; },
      canShoot: true, zigzag: true, phantom: 0.55, fog: 5,
    };
    // ── Zone 4: Black Hole — çekim şerit değiştirtir, mermiler kıvrılır, enkaz ──
    case 16: return {
      interval: 68, doubleChance: 0.2,
      speed: () => 1.7 + Math.random() * 0.4,
      hp: () => Math.random() < 0.45 ? 2 : 1,
      canShoot: false, zigzag: false, gravity: 0.45,
    };
    case 17: return {
      interval: 64, doubleChance: 0.25,
      speed: () => 1.8 + Math.random() * 0.4,
      hp: () => Math.random() < 0.45 ? 2 : 1,
      canShoot: true, zigzag: false, gravity: 0.5, curveShots: true,
    };
    case 18: return {
      interval: 72, doubleChance: 0.2,
      speed: () => 1.8 + Math.random() * 0.5,
      hp: () => Math.random() < 0.5 ? 2 : 1,
      canShoot: true, zigzag: false, gravity: 0.5, curveShots: true, debris: 80,
    };
    case 19: case 20: return {
      interval: 66, doubleChance: 0.25,
      speed: () => 1.9 + Math.random() * 0.5,
      hp: () => { const r = Math.random(); return r < 0.2 ? 3 : r < 0.6 ? 2 : 1; },
      canShoot: true, zigzag: false, gravity: 0.6, curveShots: true, debris: 64,
    };
    default: return null;
  }
}

// --- Stars ---
const STAR_COUNT = 80;
let stars = Array.from({ length: STAR_COUNT }, () => ({
  x: Math.random() * W, y: Math.random() * H,
  s: Math.random() * 1.5 + 0.3, spd: Math.random() * 1.5 + 0.5,
}));

// --- Player ---
let player = {
  lane: 1, targetLane: 1,
  x: LANE_CENTERS[1], y: H - 160,
  w: 40, h: 50,
  fireTimer: 0, fireRate: 10,
  dead: false, deathTimer: 0, flash: 0,
  shieldTimer: 0,
  doubleTimer: 0,
  tripleTimer: 0,
};

let prevTargetLane = 1;

const POWERUP_DURATION = 300; // 5 sn @ 60fps

// --- Arrays ---
let bullets  = [];  // oyuncu mermileri
let eBullets = [];  // düşman mermileri
let enemies  = [];
let explosions = [];
let powerups = [];

// --- Input ---
let keys = {};
let keyHandled = {};

document.addEventListener('keydown', e => {
  if (!keys[e.code]) keyHandled[e.code] = false;
  keys[e.code] = true;
  if (state === 'intro') {
    if (e.code === 'Escape') { endCinematic(); return; }
    if ((e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowRight') && introPhase === 'show') {
      introPhase = 'fadeout'; return;
    }
    return;
  }
  if (state === 'zonetransition') {
    if ((e.code === 'Space' || e.code === 'Enter') && zoneTransPhase === 'show') {
      exitZoneTransition(); return;
    }
    return;
  }
  if (state === 'menu') {
    if (e.code === 'ArrowLeft')  menuIdx = Math.max(0, menuIdx - 1);
    if (e.code === 'ArrowRight') menuIdx = Math.min(MENU_CARDS.length - 1, menuIdx + 1);
    if ((e.code === 'Enter' || e.code === 'Space') && !isZoneLocked(menuIdx)) { currentZone = menuIdx + 1; state = 'map'; }
    return;
  }
  if (state === 'map') {
    if (e.code === 'Escape') state = 'menu';
  }
  if (state === 'gameover') {
    if (e.code === 'Space' || e.code === 'Enter') state = 'map';
    return;
  }
  if (state === 'play') {
    if (e.code === 'ArrowLeft' && !keyHandled[e.code]) {
      keyHandled[e.code] = true;
      if (player.targetLane > 0) player.targetLane--;
    }
    if (e.code === 'ArrowRight' && !keyHandled[e.code]) {
      keyHandled[e.code] = true;
      if (player.targetLane < 2) player.targetLane++;
    }
  }
});
document.addEventListener('keyup', e => { keys[e.code] = false; keyHandled[e.code] = false; });

// --- Touch / Swipe Kontrolleri ---
// Document seviyesinde tüm default touch davranışlarını engelle
['touchstart','touchmove','touchend','touchcancel'].forEach(evt => {
  document.addEventListener(evt, e => { e.preventDefault(); }, { passive: false });
});

let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
let swipeFired = false; // her dokunuşta tek swipe

let mouseStartX = 0, mouseStartY = 0, mouseStartTime = 0;
let mouseSwipeFired = false;

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  touchStartX = t.clientX;
  touchStartY = t.clientY;
  touchStartTime = Date.now();
  swipeFired = false;
}, { passive: false });

// Oyun içi swipe: parmak kalkmadan, 10px hareket eder etmez anında tetikle
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (state !== 'play' || swipeFired) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) {
    if (dx < 0 && player.targetLane > 0) player.targetLane--;
    if (dx > 0 && player.targetLane < 2) player.targetLane++;
    swipeFired = true;
    if (tutorial) {
      if (dx > 0 && tutorial.step === 0) tutorial.step = 1;
      else if (dx < 0 && tutorial.step === 1) { localStorage.setItem('ss_tutorial', '1'); tutorial = null; }
    }
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  const dt = Date.now() - touchStartTime;
  const absDx = Math.abs(dx), absDy = Math.abs(dy);

  // Tap → click olarak ilet (swipe olmadıysa)
  if (!swipeFired && absDx < 12 && absDy < 12 && dt < 300) {
    canvas.dispatchEvent(new MouseEvent('click', {
      clientX: t.clientX, clientY: t.clientY, bubbles: true
    }));
    return;
  }

  // Menüde yatay swipe → kart değiştir
  if (state === 'menu' && absDx > absDy && absDx > 20) {
    if (dx < 0) menuIdx = Math.min(MENU_CARDS.length - 1, menuIdx + 1);
    if (dx > 0) menuIdx = Math.max(0, menuIdx - 1);
  }
}, { passive: false });

canvas.addEventListener('touchcancel', e => { e.preventDefault(); swipeFired = false; }, { passive: false });

canvas.addEventListener('mousedown', e => {
  mouseStartX = e.clientX;
  mouseStartY = e.clientY;
  mouseStartTime = Date.now();
  mouseSwipeFired = false;
});

canvas.addEventListener('mousemove', e => {
  if (state !== 'play' || mouseSwipeFired) return;
  const dx = e.clientX - mouseStartX;
  const dy = e.clientY - mouseStartY;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) {
    if (dx < 0 && player.targetLane > 0) player.targetLane--;
    if (dx > 0 && player.targetLane < 2) player.targetLane++;
    mouseSwipeFired = true;
    if (tutorial) {
      if (dx > 0 && tutorial.step === 0) tutorial.step = 1;
      else if (dx < 0 && tutorial.step === 1) { localStorage.setItem('ss_tutorial', '1'); tutorial = null; }
    }
  }
});

canvas.addEventListener('mouseup', e => {
  mouseSwipeFired = false;
});

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  const my = (e.clientY - rect.top)  * (H / rect.height);

  if (state === 'intro') {
    // Skip button: top right
    if (mx > W - 90 && my < 44) { endCinematic(); return; }
    // Anywhere else advances panel
    if (introPhase === 'show') { introPhase = 'fadeout'; return; }
    return;
  }

  if (state === 'gameover') {
    const btnY = H / 2 + 58;
    if (mx > W / 2 - 100 && mx < W / 2 + 100 && my > btnY - 20 && my < btnY + 20) {
      state = 'map'; return;
    }
  }

  if (state === 'menu') {
    // Sol ok
    if (mx < 52 && my > 100 && my < H - 80) { menuIdx = Math.max(0, menuIdx - 1); return; }
    // Sağ ok
    if (mx > W - 52 && my > 100 && my < H - 80) { menuIdx = Math.min(MENU_CARDS.length - 1, menuIdx + 1); return; }
    // DEV butonu (sağ alt)
    if (mx > W - 52 && my > H - 36) {
      devMode = !devMode;
      levelStates = devMode ? levelStates.map(() => 'unlocked') : loadLevelStates();
      return;
    }
    // OYNA butonu (merkez kart, kilitli değilse)
    if (!isZoneLocked(menuIdx)) {
      if (mx > W/2 - 65 && mx < W/2 + 65 && my > 450 && my < 494) { currentZone = menuIdx + 1; state = 'map'; return; }
    }
    return;
  }

  if (state === 'levelcomplete' && levelCompleteType === 'boss' && victoryTime > 90) {
    if (mx > W/2 - 100 && mx < W/2 + 100 && my > H - 145 && my < H - 95) {
      returnToMap = false;
      const zone = Math.ceil(currentLevel / 5);
      if (zone >= 1 && zone <= 3) {
        zoneTransIdx = zone - 1;
        zoneTransAlpha = 0;
        zoneTransPhase = 'fadein';
        state = 'zonetransition';
      } else {
        startCinematic(ENDING_PANELS); // final boss → kapanış hikâyesi
      }
      return;
    }
  }

  if (state === 'zonetransition' && zoneTransPhase === 'show') {
    exitZoneTransition(); return;
  }

  if (state === 'play') {
    // Geri butonu (sol üst, HUD altı)
    if (mx > 6 && mx < 58 && my > 44 && my < 70) { state = 'map'; return; }
  }

  if (state === 'map') {
    // Geri butonu (sol üst)
    if (mx < 60 && my < 52) { state = 'menu'; return; }
    MAP_NODES.forEach((node, i) => {
      const li = (currentZone - 1) * 5 + i;
      if (levelStates[li] === 'locked') return;
      if (Math.hypot(mx - node.x, my - node.y) < 32) startLevel(li + 1);
    });
  }
});

// --- Level Başlatma ---
function startLevel(level) {
  currentLevel = level;
  currentZone = Math.ceil(level / 5);
  score = 0; lives = 3;
  spawnTimer = 0;
  frameCount     = (level - 1) * 4200;
  lastWaveForBoss = (level - 1) * 5;
  bullets = []; eBullets = []; enemies = []; explosions = []; powerups = [];
  asteroids = []; asteroidSpawnTimer = 0;
  boss = null; bossKillTimer = 0; returnToMap = false;
  lasers = []; deathCause = '';
  // Zone 3: sis bulutları ekranı baştan kaplasın
  const _cfg = getLevelConfig();
  fogClouds = Array.from({ length: _cfg && _cfg.fog ? _cfg.fog : 0 }, () => makeFogCloud(Math.random() * H));
  // Zone 2 mechanics reset
  fuel = FUEL_MAX;
  player.lane = 1; player.targetLane = 1;
  player.x = LANE_CENTERS[1];
  player.dead = false; player.deathTimer = 0; player.flash = 0;
  player.shieldTimer = 0; player.doubleTimer = 0; player.tripleTimer = 0;
  state = 'play';
}

// --- Spawn helpers ---
function spawnEnemy(yOffset = 0) {
  // Block lanes occupied by enemies or asteroids near the top
  const occupied = new Set(enemies.map(e => e.lane));
  asteroids.forEach(a => {
    if (a.y < H * 0.42) {
      LANE_CENTERS.forEach((lc, li) => { if (Math.abs(a.x - lc) < LANE_W * 0.65) occupied.add(li); });
    }
  });
  const free = [0, 1, 2].filter(l => !occupied.has(l));
  if (free.length === 0) return;

  const lane = free[Math.floor(Math.random() * free.length)];
  const cfg  = getLevelConfig();
  const hp    = cfg ? cfg.hp()    : getEnemyHp();
  const speed = cfg ? cfg.speed() : getEnemySpeed();
  const canShoot = cfg ? cfg.canShoot : true;
  const zigzag   = cfg ? cfg.zigzag   : false;
  const fireRate = hp === 3 ? 180 : hp === 2 ? 110 : 140;
  // Black Hole: çekim düşmanı yolun ortasında komşu şeride savurur
  let shiftAt = null, shiftTo = lane;
  if (cfg && cfg.gravity && Math.random() < cfg.gravity) {
    shiftTo = lane === 0 ? 1 : lane === 2 ? 1 : (Math.random() < 0.5 ? 0 : 2);
    shiftAt = H * (0.18 + Math.random() * 0.22);
  }
  enemies.push({
    lane, x: LANE_CENTERS[lane], y: -40 - yOffset, w: 38, h: 44,
    hp, maxHp: hp, speed, flash: 0,
    fireTimer: Math.floor(Math.random() * fireRate), fireRate,
    canShoot,
    zigzag, zigzagPhase: Math.random() * Math.PI * 2,
    phantom: !!(cfg && cfg.phantom && Math.random() < cfg.phantom),
    cloakT: Math.floor(Math.random() * 60), alpha: 1,
    shiftAt, shiftTo, curveShots: !!(cfg && cfg.curveShots),
  });
}

// Komuta Merkezi / Void Leader'ın gönderdiği küçük drone
function spawnDrone(x, phantom) {
  const lane = Math.floor(Math.random() * 3);
  enemies.push({
    lane, x, y: boss ? boss.y + 40 : 0, w: 38, h: 44,
    hp: 1, maxHp: 1, speed: 2.3 + Math.random() * 0.5, flash: 0,
    fireTimer: 0, fireRate: 999, canShoot: false,
    zigzag: false, zigzagPhase: 0,
    phantom, cloakT: 0, alpha: 1,
    shiftAt: null, shiftTo: lane, curveShots: false,
  });
}

// Oyuncuya hasar — kalkan varsa emer
function damagePlayer(cause) {
  if (player.dead) return;
  if (player.shieldTimer > 0) { player.flash = 20; return; }
  lives--;
  player.flash = 50;
  if (lives <= 0) {
    deathCause = cause;
    player.dead = true;
    spawnExplosion(player.x, player.y, true);
    spawnExplosion(player.x + 15, player.y - 10, true);
    spawnExplosion(player.x - 15, player.y + 5, true);
  }
}

// Oyuncunun şu an bulunduğu şerit (kayma sırasında en yakın şerit)
function playerLaneNow() {
  let best = 0;
  LANE_CENTERS.forEach((lc, i) => { if (Math.abs(player.x - lc) < Math.abs(player.x - LANE_CENTERS[best])) best = i; });
  return best;
}

function makeFogCloud(y) {
  return {
    x: Math.random() * W, y,
    r: 90 + Math.random() * 70,
    speed: 0.5 + Math.random() * 0.5,
    drift: (Math.random() - 0.5) * 0.3,
    hue: Math.random() < 0.5 ? 285 : 315,
  };
}

function spawnBoss(wave) {
  const bossNum = Math.floor(wave / 5);
  const special = currentLevel % 5 === 0; // her bölgenin 5. bölümü
  const BOSS_HP = { 5: 90, 10: 130, 15: 160, 20: 220 };
  const hp = BOSS_HP[currentLevel] ?? 25 + bossNum * 10;
  boss = {
    x: W / 2, y: special ? H * 0.14 : H * 0.13,
    vx: currentLevel === 10 ? 2.2 : special ? 1.9 : 1.2 + bossNum * 0.2,
    cloak: 0, droneTimer: 0, laserTimer: 0,
    hp, maxHp: hp, flash: 0,
    fireTimer: 0,
    nextFireIn: special ? 28 : 55,
    bossNum, special, zone: currentZone,
  };
  enemies = [];
  asteroids = []; // clear asteroids during boss fight
  lasers = [];
}

function spawnExplosion(x, y, big) {
  const count = big ? 22 : 12;
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = Math.random() * (big ? 4 : 2.5) + 0.5;
    explosions.push({
      x, y,
      vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd,
      life: 1, decay: Math.random() * 0.03 + 0.02,
      r: Math.random() * (big ? 5 : 3) + 1,
      color: `hsl(${Math.floor(Math.random() * 60 + 10)}, 100%, 60%)`,
    });
  }
}

function spawnPowerup(x, y) {
  if (currentZone === 2) {
    if (Math.random() > 0.10) return;
    const types = ['fuel', 'fuel', 'fuel', 'shield', 'triple', 'double', 'bomb'];
    const type = types[Math.floor(Math.random() * types.length)];
    powerups.push({ type, x, y, speed: 1.8, bobTimer: 0 });
    return;
  }
  if (Math.random() > 0.04) return;
  const cfg = getLevelConfig();
  const enemyShoots = cfg ? cfg.canShoot : true;
  const types = enemyShoots ? ['shield', 'triple', 'double', 'bomb'] : ['triple', 'double', 'bomb'];
  const type = types[Math.floor(Math.random() * types.length)];
  powerups.push({ type, x, y, speed: 1.8, bobTimer: 0 });
}

function spawnAsteroid(type, ox, oy, osize) {
  const sz = osize ?? (type === 'iron' ? 26 + Math.random() * 14
                                       : 14 + Math.random() * 20);
  const n = 8;
  const shape = Array.from({length: n}, () => 0.55 + Math.random() * 0.5);

  // Pick a free lane (not blocked by an enemy or another asteroid near the top)
  // Iron asteroids are restricted to side lanes (0 or 2) so the middle stays passable
  let ax;
  if (ox !== undefined) {
    ax = ox;
  } else {
    const blocked = new Set();
    enemies.forEach(e => { if (e.y < H * 0.45) blocked.add(e.lane); });
    asteroids.forEach(a => {
      if (a.y < H * 0.42) {
        LANE_CENTERS.forEach((lc, li) => { if (Math.abs(a.x - lc) < LANE_W * 0.65) blocked.add(li); });
      }
    });
    const candidates = [0, 1, 2];
    const free = candidates.filter(l => !blocked.has(l));
    const pool = free.length > 0 ? free : candidates;
    const lane = pool[Math.floor(Math.random() * pool.length)];
    ax = LANE_CENTERS[lane];
  }

  asteroids.push({
    type,
    x: ax,
    y: oy ?? -sz - 10,
    size: sz,
    speed: (osize ? 1.6 : 1.0) + Math.random() * 1.2,
    hp: type === 'normal' ? Math.max(1, Math.floor(sz / 14)) : Infinity,
    maxHp: type === 'normal' ? Math.max(1, Math.floor(sz / 14)) : 1,
    vx: 0,
    rotation: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.032,
    shape,
    flash: 0,
    isFragment: !!osize,
  });
}

// --- Draw: Zone 2 Background ---
function drawZone2Background() {
  // Warm dark rocky space
  ctx.fillStyle = '#0c0804';
  ctx.fillRect(0, 0, W, H);
  // Amber nebula glow patches
  [[W*0.75, H*0.25, 260, 'rgba(90,45,8,0.18)'], [W*0.2, H*0.65, 200, 'rgba(70,30,5,0.14)'], [W*0.5, H*0.5, 320, 'rgba(50,20,2,0.09)']].forEach(([gx,gy,gr,gc]) => {
    const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
    g.addColorStop(0, gc); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  });
  // Stars with warm tint
  ctx.save();
  stars.forEach(s => {
    const warm = s.spd > 1.2;
    ctx.fillStyle = warm ? `rgba(255,220,160,${0.3 + s.spd * 0.15})` : `rgba(255,255,255,${0.3 + s.spd * 0.15})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2); ctx.fill();
  });
  ctx.restore();
}

// --- Draw: Zone 3 Background (Nebula) ---
function drawZone3Background() {
  ctx.fillStyle = '#0a0414';
  ctx.fillRect(0, 0, W, H);
  // Yavaşça dalgalanan mor / pembe / camgöbeği gaz bulutları
  const t = frameCount * 0.004;
  [[W*0.25 + Math.sin(t)*30, H*0.3, 280, 'rgba(120,30,160,0.22)'],
   [W*0.8, H*0.6 + Math.cos(t*0.8)*40, 260, 'rgba(170,30,120,0.16)'],
   [W*0.45 + Math.cos(t*1.3)*25, H*0.85, 230, 'rgba(30,110,150,0.14)']].forEach(([gx,gy,gr,gc]) => {
    const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
    g.addColorStop(0, gc); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  });
  ctx.save();
  stars.forEach(s => {
    ctx.fillStyle = s.spd > 1.2 ? `rgba(230,190,255,${0.3 + s.spd * 0.15})` : `rgba(255,255,255,${0.25 + s.spd * 0.15})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2); ctx.fill();
  });
  ctx.restore();
}

// --- Draw: Nebula sis katmanı (düşmanların üstünde, mermilerin altında) ---
function drawFog() {
  ctx.save();
  fogClouds.forEach(c => {
    const g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r);
    g.addColorStop(0,   `hsla(${c.hue}, 55%, 32%, 0.62)`);
    g.addColorStop(0.6, `hsla(${c.hue}, 55%, 24%, 0.38)`);
    g.addColorStop(1,   `hsla(${c.hue}, 55%, 18%, 0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2); ctx.fill();
  });
  ctx.restore();
}

// --- Draw: Zone 4 Background (Black Hole) ---
function drawZone4Background() {
  ctx.fillStyle = '#030208';
  ctx.fillRect(0, 0, W, H);
  const bx = W / 2, by = 150;
  // Yıldızlar kara deliğe doğru hafifçe kıvrılır
  ctx.save();
  stars.forEach(s => {
    const dx = s.x - bx, dy = s.y - by;
    const d = Math.hypot(dx, dy);
    const pull = Math.min(0.35, 2200 / (d * d + 1));
    const sx = s.x - dx * pull, sy = s.y - dy * pull;
    ctx.fillStyle = `rgba(255,${200 + s.spd * 20},${170 + s.spd * 40},${0.3 + s.spd * 0.18})`;
    ctx.beginPath(); ctx.arc(sx, sy, s.s, 0, Math.PI * 2); ctx.fill();
  });
  ctx.restore();
  // Dış parıltı
  const halo = ctx.createRadialGradient(bx, by, 40, bx, by, 230);
  halo.addColorStop(0, 'rgba(255,120,40,0.28)');
  halo.addColorStop(0.4, 'rgba(160,40,120,0.12)');
  halo.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = halo; ctx.fillRect(0, 0, W, H);
  // Dönen yığılma diski
  ctx.save();
  ctx.translate(bx, by);
  for (let i = 0; i < 4; i++) {
    const rot = frameCount * (0.004 + i * 0.002) + i;
    ctx.strokeStyle = `rgba(255,${150 - i * 25},${60 + i * 20},${0.5 - i * 0.09})`;
    ctx.lineWidth = 7 - i * 1.3;
    ctx.beginPath(); ctx.ellipse(0, 0, 92 + i * 16, 20 + i * 5, -0.18, rot, rot + Math.PI * 1.6); ctx.stroke();
  }
  // Olay ufku
  ctx.fillStyle = '#000';
  ctx.shadowColor = 'rgba(255,140,60,0.9)'; ctx.shadowBlur = 24;
  ctx.beginPath(); ctx.arc(0, 0, 44, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,200,140,0.75)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, 0, 46, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

// --- Draw: Void Leader lazerleri ---
function drawLasers() {
  lasers.forEach(L => {
    const x = LANE_CENTERS[L.lane];
    const top = boss ? boss.y + 40 : 0;
    ctx.save();
    if (L.t <= L.warn) {
      // Uyarı: yanıp sönen şerit + ünlem
      const blink = Math.floor(L.t / 6) % 2 === 0;
      ctx.fillStyle = `rgba(255,40,80,${blink ? 0.16 : 0.07})`;
      ctx.fillRect(x - LANE_W / 2 + 6, top, LANE_W - 12, H - top);
      ctx.strokeStyle = 'rgba(255,60,90,0.7)'; ctx.lineWidth = 1.5; ctx.setLineDash([8, 8]);
      ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, H); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#ff5577'; ctx.font = 'bold 28px Courier New';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      if (blink) ctx.fillText('!', x, H - 230);
    } else {
      // Işın
      const k = 1 - (L.t - L.warn) / L.fire;
      const w = 34 * (0.4 + 0.6 * k);
      ctx.fillStyle = `rgba(200,40,255,${0.35 * k})`;
      ctx.fillRect(x - w, top, w * 2, H - top);
      ctx.fillStyle = `rgba(255,120,220,${0.8 * k})`;
      ctx.fillRect(x - w * 0.45, top, w * 0.9, H - top);
      ctx.fillStyle = `rgba(255,255,255,${0.9 * k})`;
      ctx.fillRect(x - 3, top, 6, H - top);
    }
    ctx.restore();
  });
}

// --- Draw: Asteroid ---
function drawAsteroid(a) {
  ctx.save();
  ctx.translate(a.x, a.y);
  ctx.rotate(a.rotation);
  ctx.globalAlpha = a.flash > 0 ? (a.flash % 4 < 2 ? 0.35 : 1) : 1;
  const r = a.size;
  const n = a.shape.length;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const angle = (i / n) * Math.PI * 2 - Math.PI / 2;
    const pr = r * a.shape[i];
    if (i === 0) ctx.moveTo(Math.cos(angle) * pr, Math.sin(angle) * pr);
    else ctx.lineTo(Math.cos(angle) * pr, Math.sin(angle) * pr);
  }
  ctx.closePath();
  if (a.type === 'iron') {
    ctx.fillStyle = '#4a5a6a';
    ctx.strokeStyle = '#8899aa'; ctx.lineWidth = 2.5;
  } else if (currentZone === 4) {
    // Kara deliğe çekilen enkaz: koyu metal, sıcak kenar
    ctx.fillStyle = '#3a2a40';
    ctx.strokeStyle = '#ff8a50'; ctx.lineWidth = 1.5;
  } else {
    ctx.fillStyle = '#7a5535';
    ctx.strokeStyle = '#9a7050'; ctx.lineWidth = 1.5;
  }
  ctx.fill(); ctx.stroke();
  // Highlight
  ctx.globalAlpha *= (a.type === 'iron' ? 0.45 : 0.55);
  ctx.fillStyle = a.type === 'iron' ? '#aabccc' : currentZone === 4 ? '#8a6a90' : '#c09060';
  ctx.beginPath(); ctx.arc(-r * 0.18, -r * 0.24, r * 0.22, 0, Math.PI * 2); ctx.fill();
  // Iron: warning X mark
  if (a.type === 'iron') {
    ctx.globalAlpha = 0.7;
    ctx.strokeStyle = '#ff6633'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-r*0.25, -r*0.25); ctx.lineTo(r*0.25, r*0.25); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r*0.25, -r*0.25); ctx.lineTo(-r*0.25, r*0.25); ctx.stroke();
  }
  // HP bar for destructible normal
  if (a.type === 'normal' && a.maxHp > 1) {
    ctx.globalAlpha = 0.8;
    const bw = r * 1.2, bh = 4, bx = -bw/2, by = r + 3;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = '#c09060'; ctx.fillRect(bx, by, bw * (a.hp / a.maxHp), bh);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

// --- Draw: Zone Transition ---
function drawZoneTransition() {
  ctx.fillStyle = '#000008';
  ctx.fillRect(0, 0, W, H);
  drawStars();

  ctx.save();

  // Fade overlay
  ctx.fillStyle = `rgba(0,0,8,${1 - zoneTransAlpha})`;
  ctx.fillRect(0, 0, W, H);

  ctx.globalAlpha = zoneTransAlpha;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Decorative separator line
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(40, H / 2 - 80); ctx.lineTo(W - 40, H / 2 - 80); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(40, H / 2 + 80); ctx.lineTo(W - 40, H / 2 + 80); ctx.stroke();

  // Message text — word-wrapped
  const text = ZONE_TRANSITION_MESSAGES[zoneTransIdx];
  ctx.font = '20px Courier New';
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = 'rgba(200,220,255,0.35)';
  ctx.shadowBlur = 8;

  const maxWidth = W - 80;
  const lineH = 32;
  const words = text.split(' ');
  const lines = [];
  let cur = '';
  words.forEach(w => {
    const test = cur ? cur + ' ' + w : w;
    if (ctx.measureText(test).width > maxWidth) { lines.push(cur); cur = w; }
    else cur = test;
  });
  lines.push(cur);

  const totalH = lines.length * lineH;
  const startY = H / 2 - totalH / 2;
  lines.forEach((line, i) => ctx.fillText(line, W / 2, startY + i * lineH));

  // "Tap to continue" hint
  if (zoneTransPhase === 'show') {
    const pulse = 0.5 + 0.5 * Math.sin(frameCount * 0.06);
    ctx.globalAlpha = zoneTransAlpha * pulse;
    ctx.font = '11px Courier New';
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.shadowBlur = 0;
    ctx.fillText('TAP TO CONTINUE', W / 2, H - 38);
  }

  ctx.globalAlpha = 1;
  ctx.restore();
}

// --- Draw: Intro Cinematic ---
function drawIntro() {
  ctx.fillStyle = '#000008';
  ctx.fillRect(0, 0, W, H);
  drawStars();

  ctx.save();

  // Fade overlay
  ctx.fillStyle = `rgba(0,0,8,${1 - introAlpha})`;
  ctx.fillRect(0, 0, W, H);

  ctx.globalAlpha = introAlpha;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Panel text — word-wrapped, large white
  const text = cinePanels[introPanelIdx];
  const isTheEnd = text === 'THE END';
  ctx.font = isTheEnd ? 'bold 40px Courier New' : 'bold 22px Courier New';
  if (isTheEnd) { ctx.fillStyle = '#ffe040'; ctx.shadowColor = '#ff8'; ctx.shadowBlur = 24; }
  if (!isTheEnd) {
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = 'rgba(200,220,255,0.4)';
    ctx.shadowBlur = 10;
  }

  const maxWidth = W - 80;
  const lineH = 36;
  const words = text.split(' ');
  const lines = [];
  let cur = '';
  words.forEach(w => {
    const test = cur ? cur + ' ' + w : w;
    if (ctx.measureText(test).width > maxWidth) { lines.push(cur); cur = w; }
    else cur = test;
  });
  lines.push(cur);

  const totalH = lines.length * lineH;
  const startY = H / 2 - totalH / 2;
  lines.forEach((line, i) => ctx.fillText(line, W / 2, startY + i * lineH));

  // Panel counter — bottom left
  ctx.shadowBlur = 0;
  ctx.font = '11px Courier New';
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.textAlign = 'left';
  ctx.fillText(`${introPanelIdx + 1} / ${cinePanels.length}`, 20, H - 24);

  // Skip button — top right
  ctx.font = 'bold 12px Courier New';
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  ctx.fillText('SKIP ▶▶', W - 16, 14);

  // Next / Start button — bottom right
  const isLast = introPanelIdx === cinePanels.length - 1;
  const btnLabel = isLast ? (cinePanels === ENDING_PANELS ? 'MENU ▶' : 'START ▶') : 'NEXT ▶';
  const pulse = 0.8 + 0.2 * Math.sin(frameCount * 0.07);
  const bw = 110, bh = 42, bx = W - bw - 14, by = H - bh - 14;
  ctx.globalAlpha = introAlpha * pulse;
  const bGrd = ctx.createLinearGradient(bx, by, bx, by + bh);
  bGrd.addColorStop(0, '#003366');
  bGrd.addColorStop(1, '#001133');
  ctx.fillStyle = bGrd;
  rrect(bx, by, bw, bh, 10); ctx.fill();
  ctx.strokeStyle = 'rgba(0,200,255,0.65)';
  ctx.lineWidth = 1.5;
  rrect(bx, by, bw, bh, 10); ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px Courier New';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(btnLabel, bx + bw / 2, by + bh / 2);

  ctx.globalAlpha = 1;
  ctx.restore();
}
