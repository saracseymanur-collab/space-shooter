<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Space Shooter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Exo+2:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block;
    position: fixed;
    top: 50%; left: 50%;
    width: 390px; height: 844px;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(var(--game-scale, 1));
    touch-action: none;
    image-rendering: pixelated;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const TEXT_FONT = "'Exo 2', sans-serif"; // butonlar ve metinler
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const spaceshipImg = new Image();
spaceshipImg.src = 'ASSETS/spaceship.png';

const enemyImgs = [null, new Image(), new Image(), new Image()];
enemyImgs[1].src = 'ASSETS/enemy1.png';
enemyImgs[2].src = 'ASSETS/enemy2.png';
enemyImgs[3].src = 'ASSETS/enemy3.png';

const bossImg = new Image();
bossImg.src = 'ASSETS/boss.png';
const BOSS_W = 190, BOSS_H = 127; // 1536×1024 oranında

// Düşman görsel boyutları — gerçek en/boy oranına göre (sıkı kırpılmış assetler)
// Şerit 130px: en büyük düşman şeridin ~%85'i (zikzakta komşu şeride taşmaz), küçükler okunur kalır
const ENEMY_SIZES = { 1: { w: 64, h: 42 }, 2: { w: 88, h: 60 }, 3: { w: 110, h: 90 } };

// Sabit oyun alanı boyutu (390×844 — iPhone standart)
const W = 390;
const H = 844;

// Retina/HiDPI: fiziksel piksel sayısını artır, mantıksal koordinatlar değişmez
const DPR = Math.min(window.devicePixelRatio || 1, 2);
canvas.width  = W * DPR;
canvas.height = H * DPR;

// --- CSS ölçeği: mobilde tam ekran doldur, masaüstünde telefon boyutu ---
function updateScale() {
  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
  let scale;
  if (isMobile) {
    scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  } else {
    scale = Math.min(1, window.innerWidth / W, window.innerHeight / H);
  }
  document.documentElement.style.setProperty('--game-scale', scale);
}
updateScale();
window.addEventListener('resize', updateScale);

// --- Ses: Web Audio ile üretilen efektler + bölgeye göre basit müzik (dosya gerekmez) ---
const Sound = (() => {
  let ac = null, master = null, sfxBus = null, musicBus = null, padFilter = null;
  let musicOn = true, sfxOn = true;
  try {
    if (localStorage.getItem('ss_muted') === '1') { musicOn = false; sfxOn = false; } // eski tek ayar
    if (localStorage.getItem('ss_music') === '0') musicOn = false;
    if (localStorage.getItem('ss_sfx') === '0') sfxOn = false;
  } catch(e) {}
  const save = () => { try { localStorage.setItem('ss_music', musicOn ? '1' : '0'); localStorage.setItem('ss_sfx', sfxOn ? '1' : '0'); localStorage.removeItem('ss_muted'); } catch(e) {} };

  // --- Ses sistemi kurulumu ---
  let needsRebuild = false, rebuildCheck = null;
  function create() {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = 0.7; master.connect(ac.destination);
    sfxBus = ac.createGain(); sfxBus.gain.value = sfxOn ? 0.9 : 0; sfxBus.connect(master);
    musicBus = ac.createGain(); musicBus.gain.value = 0; musicBus.connect(master);
    // Pad'ler için yavaşça açılıp kapanan alçak geçiren filtre (nefes alan ses)
    padFilter = ac.createBiquadFilter(); padFilter.type = 'lowpass'; padFilter.frequency.value = 1000; padFilter.Q.value = 0.6;
    padFilter.connect(musicBus);
    const lfo = ac.createOscillator(), lfoGain = ac.createGain();
    lfo.frequency.value = 0.06; lfoGain.gain.value = 350;
    lfo.connect(lfoGain); lfoGain.connect(padFilter.frequency); lfo.start();
    // iPhone sessizlikte ses sistemini askıya almasın diye duyulmayan sürekli bir ses
    const keep = ac.createOscillator(), kg = ac.createGain();
    kg.gain.value = 0.00001; keep.connect(kg); kg.connect(ac.destination); keep.start();
    voices = []; nextChordAt = 0; nextTwinkleAt = 0; nextPulseAt = 0; curDuck = -1;
  }
  // iPhone: ses yalnızca bir dokunuşun SONUNDA açılabilir; açılırken duyulmayan kısa bir ses çalınır.
  // Kesintiden (kilit ekranı, bildirim, uzun duraklama) sonra açılamazsa bir sonraki dokunuşta baştan kurulur.
  function init() {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch(e) {} // iOS 17+: medya sesi
    if (ac && (needsRebuild || ac.state === 'closed')) { try { ac.close(); } catch(e) {} ac = null; needsRebuild = false; }
    if (!ac) { try { create(); } catch(e) { ac = null; return; } }
    if (ac.state !== 'running') {
      try {
        const b = ac.createBuffer(1, 1, 22050), src = ac.createBufferSource();
        src.buffer = b; src.connect(ac.destination); src.start(0);
        const p = ac.resume(); if (p && p.catch) p.catch(() => {});
      } catch(e) {}
      clearTimeout(rebuildCheck);
      rebuildCheck = setTimeout(() => { if (ac && ac.state !== 'running') needsRebuild = true; }, 600);
    }
  }
  const live = () => ac && ac.state === 'running';
  const ready = () => live() && sfxOn;

  function tone({ type = 'square', f = 440, f2 = null, dur = 0.1, vol = 0.2, delay = 0, bus = sfxBus, attack = 0.005 }) {
    if (bus === sfxBus ? !ready() : !live()) return;
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(bus);
    o.start(t); o.stop(t + dur + 0.02);
  }
  let noiseBuf = null;
  function noise({ dur = 0.3, vol = 0.3, freq = 1200, delay = 0, bus = sfxBus, type = 'lowpass', q = 1, end = 80 }) {
    if (bus === sfxBus ? !ready() : !live()) return;
    if (!noiseBuf || noiseBuf.sampleRate !== ac.sampleRate) {
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t = ac.currentTime + delay;
    const src = ac.createBufferSource(), flt = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noiseBuf;
    flt.type = type; flt.Q.value = q; flt.frequency.setValueAtTime(freq, t); flt.frequency.exponentialRampToValueAtTime(end, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(flt); flt.connect(g); g.connect(bus);
    src.start(t); src.stop(t + dur);
  }

  let lastShot = 0;
  const sfx = {
    // Ateş: kısık, boğuk "pıf"; perdesi her atışta biraz değişir
    shoot()     { const n = performance.now(); if (n - lastShot < 90) return; lastShot = n;
                  noise({ dur: 0.045, vol: 0.02, freq: 1300 + Math.random() * 700 });
                  tone({ type: 'triangle', f: 200 + Math.random() * 50, f2: 110, dur: 0.05, vol: 0.014 }); },
    // İsabet (ölmeden): kısa metalik "tık"
    hit()       { const v = 0.9 + Math.random() * 0.2; tone({ type: 'square', f: 540 * v, f2: 320 * v, dur: 0.04, vol: 0.035 }); tone({ type: 'triangle', f: 1500 * v, dur: 0.03, vol: 0.02 }); },
    // Düşman gemisi patlaması: büyüklüğe göre farklı karakter, her seferinde perde biraz değişir
    shipBoom(tier = 1) {
      const v = 0.9 + Math.random() * 0.2;
      if (tier === 1) {        // küçük: keskin, parlak "pat"
        noise({ dur: 0.14, vol: 0.2, freq: 2600 * v, type: 'bandpass', q: 0.8, end: 600 });
        tone({ type: 'square', f: 700 * v, f2: 160, dur: 0.09, vol: 0.05 });
      } else if (tier === 2) { // orta: çatırdayan patlama
        noise({ dur: 0.28, vol: 0.24, freq: 1500 * v, end: 120 });
        tone({ type: 'triangle', f: 260 * v, f2: 60, dur: 0.24, vol: 0.13 });
        [0.05, 0.11, 0.18].forEach(d => noise({ dur: 0.04, vol: 0.06, freq: 4000, type: 'bandpass', q: 2, delay: d, end: 2000 }));
      } else {                 // büyük: derin gümbürtü + kuyruk
        noise({ dur: 0.55, vol: 0.32, freq: 900 * v, end: 60 });
        tone({ type: 'sine', f: 120 * v, f2: 32, dur: 0.5, vol: 0.26 });
        [0.12, 0.22, 0.34, 0.45].forEach(d => noise({ dur: 0.05, vol: 0.05, freq: 3000, type: 'bandpass', q: 2, delay: d, end: 1500 }));
      }
    },
    // Kaya kırılması: taşlı, kum gibi çıtırtı (gemi patlamasından ayrı)
    rockCrack(size = 20) {
      const v = 30 / Math.max(12, size);
      noise({ dur: 0.18, vol: 0.16, freq: 900 * v, type: 'bandpass', q: 1.4, end: 200 });
      tone({ type: 'square', f: 140 * v, f2: 70, dur: 0.07, vol: 0.04 });
      [0.03, 0.07].forEach(d => noise({ dur: 0.03, vol: 0.05, freq: 5000, type: 'highpass', q: 1, delay: d, end: 3000 }));
    },
    explode()   { this.shipBoom(2); },
    // Boss patlaması: uzun, katmanlı
    bigBoom()   { noise({ dur: 1.3, vol: 0.45, freq: 900, end: 50 }); tone({ type: 'sine', f: 110, f2: 28, dur: 1.1, vol: 0.35 });
                  [0.15, 0.35, 0.6, 0.85].forEach(d => { noise({ dur: 0.3, vol: 0.2, freq: 1400, delay: d, end: 100 }); }); },
    // Meteor geçişi: hışırtı
    whoosh()    { noise({ dur: 0.7, vol: 0.12, freq: 300, type: 'bandpass', q: 0.7, end: 3000 }); },
    hurt()      { tone({ type: 'sawtooth', f: 320, f2: 60, dur: 0.35, vol: 0.18 }); noise({ dur: 0.25, vol: 0.2, freq: 2500 }); },
    shield()    { tone({ type: 'sine', f: 900, f2: 1400, dur: 0.12, vol: 0.08 }); },
    powerup()   { [523, 659, 784, 1047].forEach((f, i) => tone({ type: 'triangle', f, dur: 0.1, vol: 0.12, delay: i * 0.055 })); },
    bomb()      { noise({ dur: 0.9, vol: 0.4, freq: 3000 }); tone({ type: 'sine', f: 200, f2: 40, dur: 0.7, vol: 0.3 }); },
    // Patlayıcı kaya: derin gümbürtü + cızırtılı kuyruk
    blast()     { noise({ dur: 0.8, vol: 0.38, freq: 1200, end: 60 }); tone({ type: 'sine', f: 90, f2: 30, dur: 0.6, vol: 0.32 });
                  noise({ dur: 0.9, vol: 0.06, freq: 6000, type: 'highpass', q: 0.5, delay: 0.1, end: 2500 }); },
    swipe()     { tone({ type: 'sine', f: 420, f2: 700, dur: 0.06, vol: 0.03 }); },
    crystal()   { tone({ type: 'triangle', f: 1500, f2: 2100, dur: 0.07, vol: 0.05 }); },
    click()     { tone({ type: 'square', f: 660, f2: 990, dur: 0.05, vol: 0.05 }); },
    laserWarn() { tone({ type: 'square', f: 880, dur: 0.07, vol: 0.06 }); tone({ type: 'square', f: 880, dur: 0.07, vol: 0.06, delay: 0.14 }); },
    laserFire() { tone({ type: 'sawtooth', f: 220, f2: 70, dur: 0.5, vol: 0.16 }); noise({ dur: 0.45, vol: 0.18, freq: 4000 }); },
    bossIn()    { tone({ type: 'sawtooth', f: 55, f2: 110, dur: 1.4, vol: 0.22, attack: 0.3 }); tone({ type: 'sawtooth', f: 82, f2: 165, dur: 1.4, vol: 0.14, attack: 0.3 }); },
    clear()     { [523, 659, 784].forEach((f, i) => tone({ type: 'triangle', f, dur: 0.22, vol: 0.13, delay: i * 0.1 })); tone({ type: 'triangle', f: 1047, dur: 0.5, vol: 0.13, delay: 0.3 }); },
    victory()   { [392, 523, 659, 784, 659, 784, 1047].forEach((f, i) => tone({ type: 'square', f, dur: i === 6 ? 0.7 : 0.14, vol: 0.07, delay: i * 0.13 })); },
    count(n)    { tone({ type: 'triangle', f: n === 1 ? 660 : 520, dur: 0.12, vol: 0.12 }); },
    go()        { tone({ type: 'triangle', f: 880, f2: 1320, dur: 0.25, vol: 0.13 }); noise({ dur: 0.3, vol: 0.06, freq: 3000 }); },
    wave()      { [784, 1047].forEach((f, i) => tone({ type: 'sine', f, dur: 0.18, vol: 0.08, delay: i * 0.08 })); },
    warning()   { [0, 0.42, 0.84].forEach(d => { tone({ type: 'sawtooth', f: 520, f2: 380, dur: 0.36, vol: 0.09, delay: d }); }); },
    gameover()  { [392, 330, 262, 196].forEach((f, i) => tone({ type: 'triangle', f, dur: 0.3, vol: 0.13, delay: i * 0.2 })); },
  };

  // --- Ambiyans müzik: bölgeye özel, yavaş değişen akorlar + ara ara ışıltılar; yoğun anlarda hafif ritim ---
  const midi = n => 440 * Math.pow(2, (n - 69) / 12);
  const ZONE_MUSIC = {
    1: { root: 57, cutoff: 1400, wave: 'sawtooth', tw: 'sine',     // Deep Space: sakin, açık
         prog: [[0, 7, 12, 15], [-4, 3, 8, 12], [3, 10, 15, 19], [-2, 5, 10, 14], [0, 7, 10, 15], [-5, 2, 7, 10], [-4, 3, 8, 15], [-2, 5, 9, 14]],
         scale: [12, 15, 19, 22, 24, 27] },
    2: { root: 50, cutoff: 950, wave: 'sawtooth', tw: 'triangle',  // Asteroid Belt: sıcak, ağır
         prog: [[0, 7, 10, 15], [-2, 5, 9, 14], [-4, 3, 8, 12], [-2, 5, 10, 14], [0, 7, 12, 17], [3, 10, 15, 19], [-4, 3, 7, 12], [-2, 5, 9, 12]],
         scale: [12, 14, 17, 19, 21, 24] },
    3: { root: 52, cutoff: 1150, wave: 'triangle', tw: 'sine',     // Nebula: gizemli
         prog: [[0, 7, 12, 17], [1, 8, 13, 17], [0, 5, 10, 15], [-2, 5, 10, 13], [0, 7, 12, 15], [1, 5, 8, 13], [-4, 3, 8, 12], [-2, 5, 12, 13]],
         scale: [12, 13, 17, 19, 22, 24] },
    4: { root: 48, cutoff: 650, wave: 'sawtooth', tw: 'sine',      // Black Hole: karanlık, derin
         prog: [[0, 7, 12, 15], [-4, 3, 8, 12], [-7, 0, 5, 8], [-5, 2, 7, 11], [0, 6, 12, 15], [-4, 3, 7, 12], [-7, 0, 3, 8], [-5, 2, 5, 11]],
         scale: [12, 15, 18, 19, 22, 24] },
  };
  const CHORD = 8; // saniye
  let voices = [], nextChordAt = 0, chordIdx = 0, nextTwinkleAt = 0, nextPulseAt = 0, pulseN = 0;
  let mZone = 1, mIntense = false, mDuck = 1, curDuck = -1;

  function playChord(z, t) {
    const out = ac.createGain();
    out.gain.setValueAtTime(0.0001, t);
    out.gain.exponentialRampToValueAtTime(1, t + 2.5);
    out.gain.setValueAtTime(1, t + CHORD);
    out.gain.exponentialRampToValueAtTime(0.0001, t + CHORD + 3.5);
    out.connect(padFilter);
    const notes = z.prog[chordIdx % z.prog.length];
    notes.forEach((n, i) => [-7, 7].forEach(det => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = z.wave; o.frequency.value = midi(z.root + n - 12); o.detune.value = det;
      g.gain.value = i === 0 ? 0.07 : 0.045;
      o.connect(g); g.connect(out); o.start(t); o.stop(t + CHORD + 3.7);
    }));
    // Derin bas
    const b = ac.createOscillator(), bg = ac.createGain();
    b.type = 'sine'; b.frequency.value = midi(z.root + notes[0] - 24); bg.gain.value = 0.16;
    b.connect(bg); bg.connect(out); b.start(t); b.stop(t + CHORD + 3.7);
    voices.push({ out, end: t + CHORD + 3.7 });
    chordIdx++;
  }
  function tick() {
    if (!live() || !musicOn) return;
    const now = ac.currentTime, z = ZONE_MUSIC[mZone] || ZONE_MUSIC[1];
    voices = voices.filter(v => v.end > now);
    // Ses seviyesi (durdurma ekranında kısık)
    const duck = mDuck * (mIntense ? 1.1 : 1);
    if (duck !== curDuck) { musicBus.gain.setTargetAtTime(0.5 * duck, now, 0.4); curDuck = duck; }
    padFilter.frequency.setTargetAtTime(z.cutoff * (mIntense ? 1.5 : 1), now, 1.5);
    if (now >= nextChordAt - 0.25) { const t = Math.max(now + 0.05, nextChordAt); playChord(z, t); nextChordAt = t + CHORD; }
    // Işıltılar: ara ara, akorun notalarından, yankılı
    if (now >= nextTwinkleAt) {
      const notes = z.prog[(chordIdx - 1 + z.prog.length) % z.prog.length];
      const n = z.root + 12 + z.scale[Math.floor(Math.random() * z.scale.length)] + (Math.random() < 0.3 ? notes[1] % 12 : 0);
      [0, 0.38, 0.76].forEach((d, k) => tone({ type: z.tw, f: midi(n), dur: 1.6, vol: 0.035 * Math.pow(0.45, k), delay: d, bus: musicBus, attack: 0.01 }));
      nextTwinkleAt = now + 2 + Math.random() * 3.5;
    }
    // Yoğun anlar (boss, son dalga): yumuşak nabız + hafif zil
    if (mIntense) {
      if (nextPulseAt < now) nextPulseAt = now + 0.05;
      while (nextPulseAt < now + 0.4) {
        const d = nextPulseAt - now;
        if (pulseN % 2 === 0) tone({ type: 'sine', f: 70, f2: 38, dur: 0.22, vol: 0.2, delay: d, bus: musicBus });
        else noise({ dur: 0.05, vol: 0.03, freq: 7000, delay: d, bus: musicBus });
        pulseN++; nextPulseAt += 0.25;
      }
    }
  }
  setInterval(tick, 200);

  function setMusic(zone, intense, duck) {
    if (zone !== mZone && live()) {
      // Bölge değişti: eski akoru yumuşakça söndür, yenisini hemen başlat
      const now = ac.currentTime;
      voices.forEach(v => { v.out.gain.cancelScheduledValues(now); v.out.gain.setTargetAtTime(0.0001, now, 0.8); });
      nextChordAt = 0; chordIdx = 0;
    }
    mZone = zone; mIntense = !!intense; mDuck = duck;
  }
  function apply() {
    if (!ac) return;
    sfxBus.gain.value = sfxOn ? 0.9 : 0;
    if (!musicOn) { musicBus.gain.value = 0; curDuck = -1; }
  }

  return {
    init, sfx, setMusic,
    get musicOn() { return musicOn; },
    get sfxOn() { return sfxOn; },
    get muted() { return !musicOn && !sfxOn; },
    get state() { return ac ? ac.state : 'none'; }, // hata ayıklama: 'running' = ses açık
    get debug() { return { voices: voices.length, zone: mZone, intense: mIntense, duck: mDuck, music: musicBus ? +musicBus.gain.value.toFixed(2) : null }; },
    toggleMusic() { musicOn = !musicOn; save(); apply(); },
    toggleSfx() { sfxOn = !sfxOn; save(); apply(); },
    toggle() { const on = !(musicOn || sfxOn); musicOn = on; sfxOn = on; save(); apply(); }, // menüdeki ♪: hepsi
  };
})();
// iOS/Android: ses ancak ilk dokunuştan sonra açılabilir
['touchstart', 'touchend', 'mousedown', 'pointerup', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, () => Sound.init(), { passive: true }));
// Arka plandan dönünce bir sonraki dokunuşta ses yeniden açılsın (iOS sesi 'interrupted' bırakır)
document.addEventListener('visibilitychange', () => { if (!document.hidden) Sound.init(); });

// --- Metin sarma: her cümle yeni satırdan başlar, satır sonunda tek kelime kalmaz ---
function wrapText(text, maxWidth) {
  const sentences = (text.match(/[^.!?]+[.!?]+["”]?|[^.!?]+$/g) || [text]).map(t => t.trim()).filter(Boolean);
  const lines = []; // { text, gap } — gap: yeni cümlenin ilk satırı
  sentences.forEach((sen, si) => {
    const words = sen.split(' ');
    const out = [];
    let cur = [];
    words.forEach(w => {
      if (cur.length && ctx.measureText([...cur, w].join(' ')).width > maxWidth) { out.push(cur); cur = [w]; }
      else cur.push(w);
    });
    out.push(cur);
    // Yetim kelime: son satır tek kelimeyse önceki satırdan bir kelime indir
    if (out.length > 1 && out[out.length - 1].length === 1 && out[out.length - 2].length > 2) {
      const moved = out[out.length - 2].pop();
      out[out.length - 1].unshift(moved);
    }
    out.forEach((l, li) => lines.push({ text: l.join(' '), gap: si > 0 && li === 0 }));
  });
  return lines;
}
// Satırları dikeyde ortalayarak çizer; cümleler arasında küçük boşluk bırakır
function drawWrapped(text, cx, cy, maxWidth, lineH) {
  const lines = wrapText(text, maxWidth);
  const gapH = lineH * 0.35;
  const totalH = lines.length * lineH + lines.filter(l => l.gap).length * gapH;
  let y = cy - totalH / 2 + lineH / 2;
  lines.forEach(l => { if (l.gap) y += gapH; ctx.fillText(l.text, cx, y); y += lineH; });
  return totalH;
}

// --- Lanes ---

function loadLevelStates() {
  if (TEST_MODE) return Array.from({length: LEVEL_COUNT}, () => 'unlocked');
  try {
    const saved = JSON.parse(localStorage.getItem('ss_levels'));
    if (Array.isArray(saved) && saved.length > 0 && saved.length <= LEVEL_COUNT) {
      // Eski kayıtlar (5 / 10 bölüm) 20'ye tamamlanır
      const s = [...saved, ...Array.from({length: LEVEL_COUNT - saved.length}, () => 'locked')];
      // Bir bölgenin boss'u bitmişse sonraki bölgenin ilk bölümü açık olmalı
      for (let z = 1; z < 4; z++) {
        if (s[z * 5 - 1] === 'completed' && s[z * 5] === 'locked') s[z * 5] = 'unlocked';
      }
      return s;
    }
  } catch(e) {}
  const s = Array.from({length: LEVEL_COUNT}, () => 'locked');
  s[0] = 'unlocked';
  return s;
}
function saveLevelStates() {
  try { localStorage.setItem('ss_levels', JSON.stringify(levelStates)); } catch(e) {}
}
function loadZoneUnlocked() {
  try {
    const saved = JSON.parse(localStorage.getItem('ss_zones'));
    if (Array.isArray(saved) && saved.length === 4) return saved;
  } catch(e) {}
  return [false, true, true, true]; // true = locked
}
function saveZoneStates() {

// Zorluk: tüm parametreler frameCount'tan türetilir (smooth, ayrık wave yok)
let playFrames = 0; // dalga / bölüm zamanı — animasyonlar için frameCount, oyun mantığı için bu
function gameSec()  { return playFrames / 60; }
function getWave()  { return Math.floor(gameSec() / 14) + 1; } // her 14s bir dalga

// Spawn aralığı: 80 frame → 36 frame, 160 saniyede lineer düşer
function getSpawnInterval() {
  return Math.max(36, Math.round(80 - gameSec() * 0.46));
}

// Düşman hızı: 1.3 → 3.0, 4 dakikada lineer artar
function getEnemySpeed() {
  return Math.min(3.0, 1.8 + gameSec() / 240 * 1.7) + Math.random() * 0.35;
}

// Düşman HP olasılığı: 2HP 30s'de yavaşça girer, 3HP 2dk'da girer
function getEnemyHp() {
  const t = gameSec();
  const p3 = Math.max(0, Math.min(0.38, (t - 120) / 200));
  const p2 = Math.max(0, Math.min(0.52, (t - 30)  / 160));
  const r = Math.random();
  return r < p3 ? 3 : r < p3 + p2 ? 2 : 1;
}

// Çift spawn şansı: 1 dakikadan itibaren %0 → %48 lineer
function getDoubleSpawnChance() {
  return Math.max(0, Math.min(0.48, (gameSec() - 60) / 200));
}

// Bölüm 1-4 için sabit level konfigürasyonu (5 = özel boss, 6+ smooth sistem)
function getLevelConfig() {
  switch (currentLevel) {
    case 1: {
      const lw = getWave() - (currentLevel - 1) * 5; // level içi dalga (1-4)
      return {
        interval: Math.max(34, 72 - (lw - 1) * 14),  // 72→58→44→34
        doubleChance: 0.12 + (lw - 1) * 0.2,         // 12%→32%→52%→72%
        speed: () => 1.4 + Math.random() * 0.35,
        hp: () => { const r = Math.random(); return r < 0.45 ? 1 : r < 0.78 ? 2 : 3; },
        canShoot: false, zigzag: false,
      };
    }
    case 2: return {
      interval: 58, doubleChance: 0.30,
      speed: () => 1.6 + Math.random() * 0.4,
      hp: () => Math.random() < 0.45 ? 2 : 1,
      canShoot: true, zigzag: false,
    };
    case 3: return {
      interval: 62, doubleChance: 0.3,

// --- Input ---
let keys = {};
let keyHandled = {};

document.addEventListener('keydown', e => {
  if (!keys[e.code]) keyHandled[e.code] = false;
  keys[e.code] = true;
  if (state === 'intro') {
    if (e.code === 'Escape') { endCinematic(); return; }
    if (e.code === 'ArrowLeft') { cinePrev(); return; }
    if ((e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowRight') && introPhase === 'show') {
      introPhase = 'fadeout'; return;
    }
    return;
  }
  if (state === 'zonetransition') {
    if ((e.code === 'Space' || e.code === 'Enter') && zoneTransPhase === 'show') {
      exitZoneTransition(); return;
    }
    return;
  }
  if (state === 'menu') {
    if (e.code === 'ArrowLeft')  menuIdx = Math.max(0, menuIdx - 1);
    if (e.code === 'ArrowRight') menuIdx = Math.min(MENU_CARDS.length - 1, menuIdx + 1);
    if ((e.code === 'Enter' || e.code === 'Space') && !isZoneLocked(menuIdx)) { currentZone = menuIdx + 1; state = 'map'; }
    return;
  }
  if (state === 'map') {
    if (e.code === 'Escape') state = 'menu';
  }
  if (state === 'gameover') {
    if (e.code === 'Space' || e.code === 'Enter') startLevel(currentLevel);
    if (e.code === 'Escape') state = 'map';
    return;
  }
  if (state === 'paused') {
    if (e.code === 'Escape' || e.code === 'KeyP' || e.code === 'Space') state = 'play';
    return;
  }
  if (state === 'play' && briefing) {
    if (e.code === 'Enter' || e.code === 'Space') beginLevelPlay();
    return;
  }
  if (state === 'play' && (e.code === 'Escape' || e.code === 'KeyP')) { state = 'paused'; return; }
  if (state === 'play') {
    if (e.code === 'ArrowLeft' && !keyHandled[e.code]) {
      keyHandled[e.code] = true;
      if (player.targetLane > 0) player.targetLane--;
    }
    if (e.code === 'ArrowRight' && !keyHandled[e.code]) {
      keyHandled[e.code] = true;
      if (player.targetLane < 2) player.targetLane++;
    }
  }
});
document.addEventListener('keyup', e => { keys[e.code] = false; keyHandled[e.code] = false; });

// --- Touch / Swipe Kontrolleri ---
// Document seviyesinde tüm default touch davranışlarını engelle
['touchstart','touchmove','touchend','touchcancel'].forEach(evt => {
  document.addEventListener(evt, e => { e.preventDefault(); }, { passive: false });
});

let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
let swipeFired = false; // her dokunuşta tek swipe

let mouseStartX = 0, mouseStartY = 0, mouseStartTime = 0;
let mouseSwipeFired = false;

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  touchStartX = t.clientX;
  touchStartY = t.clientY;
  touchStartTime = Date.now();
  swipeFired = false;
}, { passive: false });

// Oyun içi swipe: parmak kalkmadan, 10px hareket eder etmez anında tetikle
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (state !== 'play' || briefing || swipeFired) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) {
    if (dx < 0 && player.targetLane > 0) player.targetLane--;
    if (dx > 0 && player.targetLane < 2) player.targetLane++;
    swipeFired = true;
    if (tutorial) {
      if (dx > 0 && tutorial.step === 0) tutorial.step = 1;
      else if (dx < 0 && tutorial.step === 1) { localStorage.setItem('ss_tutorial', '1'); tutorial = null; }
    }
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  const dt = Date.now() - touchStartTime;
  const absDx = Math.abs(dx), absDy = Math.abs(dy);

  // Tap → click olarak ilet (swipe olmadıysa)
  if (!swipeFired && absDx < 12 && absDy < 12 && dt < 300) {
    canvas.dispatchEvent(new MouseEvent('click', {
      clientX: t.clientX, clientY: t.clientY, bubbles: true
    }));
    return;
  }

  // Sinematikte yatay kaydırma: sola → sonraki, sağa → önceki
  if (state === 'intro' && absDx > absDy && absDx > 30) {
    if (dx < 0) cineNext(); else cinePrev();
    return;
  }

  // Menüde yatay swipe → kart değiştir
  if (state === 'menu' && absDx > absDy && absDx > 20) {
    if (dx < 0) menuIdx = Math.min(MENU_CARDS.length - 1, menuIdx + 1);
    if (dx > 0) menuIdx = Math.max(0, menuIdx - 1);
  }
}, { passive: false });

canvas.addEventListener('touchcancel', e => { e.preventDefault(); swipeFired = false; }, { passive: false });

canvas.addEventListener('mousedown', e => {
  mouseStartX = e.clientX;
  mouseStartY = e.clientY;
  mouseStartTime = Date.now();
  mouseSwipeFired = false;
});

canvas.addEventListener('mousemove', e => {
  if (state !== 'play' || briefing || mouseSwipeFired) return;
  const dx = e.clientX - mouseStartX;
  const dy = e.clientY - mouseStartY;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) {
    if (dx < 0 && player.targetLane > 0) player.targetLane--;
    if (dx > 0 && player.targetLane < 2) player.targetLane++;
    mouseSwipeFired = true;
    if (tutorial) {
      if (dx > 0 && tutorial.step === 0) tutorial.step = 1;
      else if (dx < 0 && tutorial.step === 1) { localStorage.setItem('ss_tutorial', '1'); tutorial = null; }
    }
  }
});

let suppressClick = false;
canvas.addEventListener('mouseup', e => {
  mouseSwipeFired = false;
  const dx = e.clientX - mouseStartX, dy = e.clientY - mouseStartY;
  if (state === 'intro' && Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
    if (dx < 0) cineNext(); else cinePrev();
    suppressClick = true;
  }
});

canvas.addEventListener('click', e => {
  if (suppressClick) { suppressClick = false; return; } // kaydırmanın ardından gelen tıklamayı yut
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  const my = (e.clientY - rect.top)  * (H / rect.height);

  if (state === 'intro') {
    // Skip button: top right
    if (mx > W - 100 && my < 56) { endCinematic(); return; }
    // Anywhere else advances panel
    cineNext(); return;
    return;
  }

  if (state === 'gameover') {
    const b = GAMEOVER_BTNS.find(b => inBtn(b, mx, my));
    if (b) { Sound.sfx.click(); if (b.act === 'retry') startLevel(currentLevel); else state = 'map'; }
    return;
  }

  if (state === 'paused') {
    const b = PAUSE_BTNS.find(b => inBtn(b, mx, my));
    if (!b) return;
    Sound.sfx.click();
    if (b.act === 'resume') state = 'play';
    else if (b.act === 'retry') startLevel(currentLevel);
    else if (b.act === 'map') state = 'map';
    else if (b.act === 'music') Sound.toggleMusic();
    else if (b.act === 'sfx') { Sound.toggleSfx(); Sound.sfx.click(); }
    return;
  }

  if (state === 'menu') {
    // Sol / sağ ok (kart kenarının dışı)
    if (mx < 48 && my > CARD.y && my < CARD.y + CARD.h) { menuIdx = Math.max(0, menuIdx - 1); return; }
    if (mx > W - 48 && my > CARD.y && my < CARD.y + CARD.h) { menuIdx = Math.min(MENU_CARDS.length - 1, menuIdx + 1); return; }
    // Ses butonu (sol alt)
    if (mx < 60 && my > H - 40) { Sound.toggle(); Sound.sfx.click(); return; }
    // DEV butonu (sağ alt)
    if (mx > W - 52 && my > H - 36) {
      devMode = !devMode;
      levelStates = devMode ? levelStates.map(() => 'unlocked') : loadLevelStates();
      return;
    }
    // OYNA butonu (merkez kart, kilitli değilse)
    if (!isZoneLocked(menuIdx)) {
      const py = CARD.y + CARD_PLAY.dy;
      if (Math.abs(mx - W / 2) < CARD_PLAY.w / 2 && my > py && my < py + CARD_PLAY.h) { Sound.sfx.click(); currentZone = menuIdx + 1; state = 'map'; return; }
    }
    return;
  }

  if (state === 'levelcomplete' && victoryTime > RESULT_BTN_AT) {
    if (inBtn(RESULT_BTN, mx, my)) {
      Sound.sfx.click();
      returnToMap = false;
      if (levelCompleteType === 'clear') { state = 'map'; return; }
      const zone = Math.ceil(currentLevel / 5);
      if (zone >= 1 && zone <= 3) {
        zoneTransIdx = zone - 1;
        zoneTransAlpha = 0;
        zoneTransPhase = 'fadein';
        state = 'zonetransition';
      } else {
        startCinematic(ENDING_PANELS); // final boss → kapanış hikâyesi
      }
      return;
    }
  }

  if (state === 'zonetransition' && zoneTransPhase === 'show') {
    exitZoneTransition(); return;
  }

  if (state === 'play' && briefing) {
    // Talimat kartı: sadece START başlatır
    if (briefBtn && inBtn(briefBtn, mx, my)) { Sound.sfx.click(); beginLevelPlay(); }
    return;
  }
  if (state === 'play') {
    // Durdurma butonu (sol üst)
    if (mx < 48 && my < HUD_H) { Sound.sfx.click(); state = 'paused'; return; }
  }

  if (state === 'map') {
    if (mapPress) return;
    // Geri (sol üst)
    if (mx < 100 && my < 56) { Sound.sfx.click(); state = 'menu'; return; }
    for (let i = 0; i < 5; i++) {
      const R = mapNodeRect(i), li = (currentZone - 1) * 5 + i;
      if (mx > R.x && mx < R.x + R.w && my > R.y && my < R.y + R.h) {
        if (levelStates[li] === 'locked') return;
        Sound.sfx.click();
        mapPress = { i, lv: li + 1, t: 0 }; // kısa büyüme + parlama, ardından başlar
        return;
      }
    }
  }
});

// --- Spawn helpers ---
function spawnEnemy(yOffset = 0) {
  // Block lanes occupied by enemies or asteroids near the top
  const occupied = new Set(enemies.map(e => e.lane));
  asteroids.forEach(a => {
    if (a.y < H * 0.42) {
      LANE_CENTERS.forEach((lc, li) => { if (Math.abs(a.x - lc) < LANE_W * 0.65) occupied.add(li); });
    }
  });
  const free = [0, 1, 2].filter(l => !occupied.has(l));
  if (free.length === 0) return;

  const lane = free[Math.floor(Math.random() * free.length)];
  const cfg  = getLevelConfig();
  const hp    = cfg ? cfg.hp()    : getEnemyHp();
  const speed = cfg ? cfg.speed() : getEnemySpeed();
  const canShoot = cfg ? cfg.canShoot : true;
  const zigzag   = cfg ? cfg.zigzag   : false;
  const fireRate = hp === 3 ? 180 : hp === 2 ? 110 : 140;
  // Black Hole: çekim düşmanı yolun ortasında komşu şeride savurur
  let shiftAt = null, shiftTo = lane;
  if (cfg && cfg.gravity && Math.random() < cfg.gravity) {
    shiftTo = lane === 0 ? 1 : lane === 2 ? 1 : (Math.random() < 0.5 ? 0 : 2);
    shiftAt = H * (0.18 + Math.random() * 0.22);
  }
  enemies.push({
    lane, x: LANE_CENTERS[lane], y: -40 - yOffset, w: 38, h: 44,
    hp, maxHp: hp, speed, flash: 0,
    fireTimer: Math.floor(Math.random() * fireRate), fireRate,
    canShoot,
    zigzag, zigzagPhase: Math.random() * Math.PI * 2,
    phantom: !!(cfg && cfg.phantom && Math.random() < cfg.phantom),
    cloakCfg: (cfg && cfg.cloak) || { vis: 90, inv: 40 },
    cloakT: Math.floor(Math.random() * 60), alpha: 1,
    shiftAt, shiftTo, curveShots: !!(cfg && cfg.curveShots), shift2: cfg && cfg.shift2 ? cfg.shift2 : 0,
  });
}

// Oyuncuya hasar — kalkan varsa emer
function damagePlayer(cause) {
  if (player.dead) return;
  if (player.shieldTimer > 0) { player.flash = 20; Sound.sfx.shield(); return; }
  Sound.sfx.hurt();
  hurtFx = 26;
  try { if (navigator.vibrate) navigator.vibrate(60); } catch(e) {} // Android: kısa titreşim
  lives--;
  player.flash = 50;
  if (lives <= 0) {
    deathCause = cause;
    player.dead = true;
    spawnExplosion(player.x, player.y, true);
    spawnExplosion(player.x + 15, player.y - 10, true);
    spawnExplosion(player.x - 15, player.y + 5, true);
  }
}

// Oyuncunun şu an bulunduğu şerit (kayma sırasında en yakın şerit)

function spawnAsteroid(type, ox, oy, osize) {
  const sz = osize ?? (type === 'iron' ? 24 + Math.random() * 8
                                       : 14 + Math.random() * 20);
  const n = 8;
  const shape = Array.from({length: n}, () => 0.55 + Math.random() * 0.5);

  // Pick a free lane (not blocked by an enemy or another asteroid near the top)
  // Iron asteroids are restricted to side lanes (0 or 2) so the middle stays passable
  let ax;
  if (ox !== undefined) {
    ax = ox;
  } else {
    const blocked = new Set();
    enemies.forEach(e => { if (e.y < H * 0.45) blocked.add(e.lane); });
    asteroids.forEach(a => {
      if (a.y < H * 0.42) {
        LANE_CENTERS.forEach((lc, li) => { if (Math.abs(a.x - lc) < LANE_W * 0.65) blocked.add(li); });
      }
    });
    const candidates = [0, 1, 2].filter(l => !rockWouldWall(l, -sz - 10, sz, 2.6));
    if (candidates.length === 0) return null; // her şerit duvar oluşturuyor: bu kayayı atla
    const free = candidates.filter(l => !blocked.has(l));
    const pool = free.length > 0 ? free : candidates;
    const lane = pool[Math.floor(Math.random() * pool.length)];
    ax = LANE_CENTERS[lane];
  }

  asteroids.push({
    type,
    x: ax,
    y: oy ?? -sz - 10,
    size: sz,
    speed: (osize ? 1.6 : 1.0) + Math.random() * 1.2,
    hp: type === 'iron' ? Infinity : type === 'explosive' ? 1 : Math.max(1, Math.floor(sz / 14)),
    maxHp: type === 'iron' ? 1 : type === 'explosive' ? 1 : Math.max(1, Math.floor(sz / 14)),
    vx: 0,
    rotation: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.032,
    shape,
    flash: 0,
    isFragment: !!osize,
  });
  return asteroids[asteroids.length - 1];
}

// --- Kaçış yolu garantisi ---
// Her tehlikenin oyuncu hizasına ne zaman varacağı (kare cinsinden) ve hangi şeridi kapatacağı hesaplanır.
// Yeni bir tehlike eklenmeden önce: o an diğer iki şerit de kapalıysa (üç şerit duvarı) eklenmez / başka şeride kayar.
function hazardWindows() {
  const py = player.y, out = [];
  const lanesHit = (x, half) => [0, 1, 2].filter(l => Math.abs(x - LANE_CENTERS[l]) < half);
  asteroids.forEach(a => {
    if (a.speed <= 0) return;
    const t = (py - a.y) / a.speed, d = (a.size * 0.9 + 16) / a.speed;
    if (t + d > 0) lanesHit(a.x, a.size * 0.9 + 14).forEach(lane => out.push({ lane, t0: t - d, t1: t + d }));
  });
  eBullets.forEach(b => {
    if (!(b.vy > 0)) return;
    const t = (py - b.y) / b.vy, d = 40 / b.vy;
    if (t + d > 0) lanesHit(b.x + (b.vx || 0) * Math.max(0, t), 30).forEach(lane => out.push({ lane, t0: t - d, t1: t + d }));
  });
  lasers.forEach(L => out.push({ lane: L.lane, t0: L.warn - L.t, t1: L.warn - L.t + (L.meteor ? 60 : L.fire) }));
  return out;
}
const WALL_MARGIN = 20; // oyuncunun şerit değiştirmesine pay (~0.33 sn)
function wouldWall(lane, t0, t1) {
  const w = hazardWindows();
  return [0, 1, 2].filter(l => l !== lane)
    .every(l => w.some(h => h.lane === l && h.t0 < t1 + WALL_MARGIN && h.t1 > t0 - WALL_MARGIN));
}
function rockWouldWall(lane, y, size, speed) {
  const t = (player.y - y) / speed, d = (size * 0.9 + 16) / speed;
  return wouldWall(lane, t - d, t + d);
}
// Düşman / boss mermisi: duvar oluşturacaksa atılmaz
function pushShot(b) {
  if (b.vy > 0) {
    const t = (player.y - b.y) / b.vy, d = 40 / b.vy;
    const lane = nearestLane(b.x + (b.vx || 0) * Math.max(0, t));
    if (Math.abs(b.x + (b.vx || 0) * t - LANE_CENTERS[lane]) < 30 && wouldWall(lane, t - d, t + d)) return false;
  }
  eBullets.push(b);
  return true;
}

// --- Zone 2 yardımcıları ---
function nearestLane(x) {
  let best = 0;
  LANE_CENTERS.forEach((lc, i) => { if (Math.abs(x - lc) < Math.abs(x - LANE_CENTERS[best])) best = i; });
  return best;
}
function addFloat(x, y, text, color, big) { floatTexts.push({ x, y, text, color, big: !!big, t: 0 }); }
function dropCrystals(x, y, n) {
  for (let i = 0; i < n; i++) crystals.push({ x, y, vx: (Math.random() - 0.5) * 3.5, vy: 1.7 + Math.random() * 0.6, t: Math.random() * 100 });
}

function spawnAmbusher(rock, lane) {

    fireTimer: 0, fireRate, canShoot: cfg ? cfg.canShoot : true,

}
// Mermi–kaya çarpışması: vurulma alanı görselle uyumlu (en az 18px yarıçap),
// mermi karede 10px ilerlediği için aradaki yol da taranır (küçük kayadan atlamasın)
function bulletHitsRock(b, a) {
  const r = Math.max(18, a.size * 1.05);
  if (Math.abs(b.x - a.x) > r) return false;
  return a.y > b.y - r && a.y < b.y + (b.speed || 0) + a.speed + r;
}
// Kaya yok edildi: kombo puanı, kristal, parçalanma, patlama
function destroyRock(a, frags, blasts) {
  if (a.type !== 'explosive') Sound.sfx.rockCrack(a.size);
  spawnExplosion(a.x, a.y, a.size > 22);
  if (currentZone === 2 && !a.meteor) dropCrystals(a.x, a.y, a.isFragment ? 1 : a.size > 24 ? 3 : 2);
  if (a.type === 'explosive') {
    blasts.push({ x: a.x, y: a.y });
    Sound.sfx.blast();
    for (let i = 0; i < 6; i++) spawnExplosion(a.x + Math.cos(i) * 50, a.y + Math.sin(i) * 50, true);
    explosions.push({ x: a.x, y: a.y, vx: 0, vy: 0, life: 1, decay: 0.06, r: BLAST_R, color: 'rgba(255,120,40,0.25)', isBombFlash: true });
  }
  if (a.type === 'normal' && a.size > 24 && !a.isFragment) {
    for (let f = 0; f < 2; f++) {
      frags.push({
        type: 'normal', x: a.x + (f ? 14 : -14), y: a.y,
        size: a.size * 0.52, speed: a.speed * 1.3, hp: 1, maxHp: 1,
        vx: 0, rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.055,
        shape: Array.from({ length: 8 }, () => 0.55 + Math.random() * 0.5),
        flash: 0, isFragment: true,
      });
    }
  }
}

// --- Oyun içi arkaplan: bölgenin illüstrasyonu, karartılmış ve çok yavaş hareket eden ---
const BG_SRC = ['ASSETS/backgrounds/deep-space.jpg', 'ASSETS/backgrounds/asteroid-belt.jpg', 'ASSETS/backgrounds/nebula.jpg', 'ASSETS/backgrounds/black-hole.jpg'];
const bgImgs = BG_SRC.map(src => { const im = new Image(); im.src = src; return im; });
// Karartma: kayalı bölgede görseldeki kayalar gerçek kayalarla karışmasın diye daha koyu
const BG_DIM = [0.58, 0.78, 0.6, 0.62];
function drawZoneBackdrop(zone) {
  const img = bgImgs[zone - 1];
  if (!img || !img.complete || !img.naturalWidth) return false;
  const sc = Math.max(W / img.naturalWidth, H / img.naturalHeight) * 1.08; // kayma payı
  const iw = img.naturalWidth * sc, ih = img.naturalHeight * sc;
  const t = frameCount * 0.0012;
  const ox = (W - iw) / 2 + Math.sin(t) * (iw - W) * 0.4;
  const oy = (H - ih) / 2 + Math.cos(t * 0.7) * (ih - H) * 0.4;
  ctx.drawImage(img, ox, oy, iw, ih);
  if (zone >= 3) { // parlak bölgelerde rengi biraz soldur: düşmanlar ve mermiler öne çıksın
    ctx.globalCompositeOperation = 'saturation';
    ctx.fillStyle = 'rgba(128,128,128,0.3)'; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.fillStyle = `rgba(2,3,12,${BG_DIM[zone - 1]})`;
  ctx.fillRect(0, 0, W, H);
  // Önde akan yıldızlar (hız hissi)
  ctx.save();
  stars.forEach(st => {
    if (st.spd > 1.4) { // yakın katman: hızlı, kısa iz
      ctx.strokeStyle = `rgba(255,255,255,${0.2 + st.spd * 0.15})`; ctx.lineWidth = st.s;
      ctx.beginPath(); ctx.moveTo(st.x, st.y - st.spd * 5); ctx.lineTo(st.x, st.y); ctx.stroke();
    } else {            // uzak katman: soluk nokta
      ctx.fillStyle = `rgba(255,255,255,${0.15 + st.spd * 0.2})`;
      ctx.beginPath(); ctx.arc(st.x, st.y, st.s * 0.8, 0, Math.PI * 2); ctx.fill();
    }
  });
  ctx.restore();
  return true;
}

// --- Draw: Zone 2 Background ---
function drawZone2Background() {
  // Warm dark rocky space
  ctx.fillStyle = '#0c0804';
  ctx.fillRect(0, 0, W, H);
  // Amber nebula glow patches
  [[W*0.75, H*0.25, 260, 'rgba(90,45,8,0.18)'], [W*0.2, H*0.65, 200, 'rgba(70,30,5,0.14)'], [W*0.5, H*0.5, 320, 'rgba(50,20,2,0.09)']].forEach(([gx,gy,gr,gc]) => {
    const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
    g.addColorStop(0, gc); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  });
  // Stars with warm tint
  ctx.save();
  stars.forEach(s => {
    const warm = s.spd > 1.2;
    ctx.fillStyle = warm ? `rgba(255,220,160,${0.3 + s.spd * 0.15})` : `rgba(255,255,255,${0.3 + s.spd * 0.15})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2); ctx.fill();
  });

}

// --- Draw: Zone 3 Background (Nebula) ---
function drawZone3Background() {
  ctx.fillStyle = '#0a0414';
  ctx.fillRect(0, 0, W, H);
  // Yavaşça dalgalanan mor / pembe / camgöbeği gaz bulutları

  [[W*0.25 + Math.sin(t)*30, H*0.3, 280, 'rgba(120,30,160,0.22)'],
   [W*0.8, H*0.6 + Math.cos(t*0.8)*40, 260, 'rgba(170,30,120,0.16)'],
   [W*0.45 + Math.cos(t*1.3)*25, H*0.85, 230, 'rgba(30,110,150,0.14)']].forEach(([gx,gy,gr,gc]) => {
    const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
    g.addColorStop(0, gc); g.addColorStop(1, 'rgba(0,0,0,0)');

    ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2); ctx.fill();

// --- Draw: Nebula sis katmanı ---
// İki katmanlı, yavaşça akan yumuşak sis dokusu (bir kez üretilir). Düşmanların üstünde, mermilerin altında çizilir;
// ekranın alt kısmında incelir → oyuncuya yaklaşan düşman hiçbir zaman tamamen gizlenmez.
let fogLayers = null, fogCompose = null;
function buildFogLayer(seed, hues) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  let r = seed;
  const rnd = () => (r = (r * 16807) % 2147483647) / 2147483647;
  for (let k = 0; k < 90; k++) {
    const x = rnd() * W, y = rnd() * H, rad = 40 + rnd() * 120;
    const hue = hues[Math.floor(rnd() * hues.length)], a = 0.08 + rnd() * 0.16;
    [0, -H, H].forEach(dy => { // dikeyde döşenebilir olsun
      const gr = g.createRadialGradient(x, y + dy, 0, x, y + dy, rad);
      gr.addColorStop(0, `hsla(${hue},60%,55%,${a})`); gr.addColorStop(1, `hsla(${hue},60%,40%,0)`);
      g.fillStyle = gr; g.fillRect(x - rad, y + dy - rad, rad * 2, rad * 2);
    });
  }
  return c;
}
function drawFog(density) {
  if (!fogLayers) {
    fogLayers = [buildFogLayer(7, [280, 300, 320]), buildFogLayer(91, [260, 290, 200])];
    fogCompose = document.createElement('canvas'); fogCompose.width = W; fogCompose.height = H;
  }
  const g = fogCompose.getContext('2d');
  g.globalCompositeOperation = 'source-over';
  g.clearRect(0, 0, W, H);
  [[fogLayers[0], 0.35, 0], [fogLayers[1], 0.6, 1]].forEach(([L, spd, k]) => {
    // Tam sayı konum: iki kopyanın birleştiği yerde çizgi kalmasın
    const oy = Math.floor((frameCount * spd) % H), ox = Math.round(Math.sin(frameCount * 0.004 + k * 2) * 18);
    g.drawImage(L, ox, oy - H); g.drawImage(L, ox, oy);
  });
  // Alt bölgede sis kaybolur
  g.globalCompositeOperation = 'destination-out';
  const m = g.createLinearGradient(0, H * 0.55, 0, H * 0.78);
  m.addColorStop(0, 'rgba(0,0,0,0)'); m.addColorStop(1, 'rgba(0,0,0,1)');
  g.fillStyle = m; g.fillRect(0, H * 0.55, W, H * 0.45);
  ctx.save();
  // Yoğunluk: 0.3 hafif pus … 0.7 kalın sis (iki kat çizilir)
  ctx.globalAlpha = Math.min(1, density * 1.8);
  ctx.drawImage(fogCompose, 0, 0, W, H);
  if (density > 0.6) { ctx.globalAlpha = (density - 0.6) * 6; ctx.drawImage(fogCompose, 0, 0, W, H); }
  ctx.restore();
}

// --- İyon bulutları (Level 12, 14): içindeyken silahlar tutukluk yapar ---
let ionClouds = [], ionTimer = 0;
function updateIonClouds(cfg) {
  if (cfg && cfg.ion && !boss) {
    if (++ionTimer >= cfg.ion) {
      ionTimer = 0;
      const lane = Math.floor(Math.random() * 3);
      ionClouds.push({ lane, y: -70, h: 120, speed: 1.4 + Math.random() * 0.3, seed: Math.random() * 100 });
    }
  }
  ionClouds = ionClouds.filter(c => { c.y += c.speed; return c.y - c.h < H + 40; });
}
function weaponsJammed() {
  const l = playerLaneNow();
  return ionClouds.some(c => c.lane === l && Math.abs(c.y - player.y) < c.h / 2 + 18);
}
function drawIonClouds() {
  ionClouds.forEach(c => {
    const x = LANE_CENTERS[c.lane];
    ctx.save();
    const g = ctx.createRadialGradient(x, c.y, 4, x, c.y, c.h * 0.6);
    g.addColorStop(0, 'rgba(120,220,255,0.38)'); g.addColorStop(0.6, 'rgba(70,140,255,0.2)'); g.addColorStop(1, 'rgba(40,80,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(x, c.y, LANE_W * 0.46, c.h / 2, 0, 0, Math.PI * 2); ctx.fill();
    // Kıvılcımlar: birkaç karede bir yeniden çizilen kırık çizgiler
    const tick = Math.floor(frameCount / 4) + c.seed;
    ctx.strokeStyle = 'rgba(200,245,255,0.85)'; ctx.lineWidth = 1.4;
    ctx.shadowColor = '#7fe6ff'; ctx.shadowBlur = 8;
    for (let k = 0; k < 3; k++) {
      let px = x + Math.sin(tick * 1.7 + k * 3) * LANE_W * 0.3, py = c.y - c.h * 0.35 + k * c.h * 0.3;
      ctx.beginPath(); ctx.moveTo(px, py);
      for (let s = 0; s < 4; s++) { px += Math.sin(tick * 3.1 + s * 5 + k) * 12; py += 9; ctx.lineTo(px, py); }
      ctx.stroke();
    }
    ctx.restore();
  });
}

// İsabet parlaması için beyaz siluet
const whiteSprites = {};
function getWhiteSprite(img, key) {
  if (!img || !img.complete || !img.naturalWidth) return null;
  if (!whiteSprites[key]) {
    const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
    const g = c.getContext('2d'); g.drawImage(img, 0, 0);
    g.globalCompositeOperation = 'source-atop'; g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height);
    whiteSprites[key] = c;
  }
  return whiteSprites[key];
}
// Hayaletlerin dış hattı: gemi görselinin açık mor siluet kopyası
const phantomOutlines = {};
function getPhantomOutline(img, key) {
  if (!img || !img.complete || !img.naturalWidth) return null;
  if (!phantomOutlines[key]) {
    const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
    const g = c.getContext('2d');
    g.drawImage(img, 0, 0);
    g.globalCompositeOperation = 'source-atop';
    g.fillStyle = '#d9c2ff'; g.fillRect(0, 0, c.width, c.height);

  }

}

// --- Draw: Zone 4 Background (Black Hole) ---
function drawZone4Background() {
  ctx.fillStyle = '#030208';
  ctx.fillRect(0, 0, W, H);
  const bx = W / 2, by = 150;
  // Yıldızlar kara deliğe doğru hafifçe kıvrılır
  ctx.save();
  stars.forEach(s => {
    const dx = s.x - bx, dy = s.y - by;
    const d = Math.hypot(dx, dy);
    const pull = Math.min(0.35, 2200 / (d * d + 1));
    const sx = s.x - dx * pull, sy = s.y - dy * pull;
    ctx.fillStyle = `rgba(255,${200 + s.spd * 20},${170 + s.spd * 40},${0.3 + s.spd * 0.18})`;
    ctx.beginPath(); ctx.arc(sx, sy, s.s, 0, Math.PI * 2); ctx.fill();
  });
  ctx.restore();
  // Dış parıltı
  const halo = ctx.createRadialGradient(bx, by, 40, bx, by, 230);
  halo.addColorStop(0, 'rgba(255,120,40,0.28)');
  halo.addColorStop(0.4, 'rgba(160,40,120,0.12)');
  halo.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = halo; ctx.fillRect(0, 0, W, H);
  // Dönen yığılma diski
  ctx.save();
  ctx.translate(bx, by);
  for (let i = 0; i < 4; i++) {
    const rot = frameCount * (0.004 + i * 0.002) + i;
    ctx.strokeStyle = `rgba(255,${150 - i * 25},${60 + i * 20},${0.5 - i * 0.09})`;
    ctx.lineWidth = 7 - i * 1.3;
    ctx.beginPath(); ctx.ellipse(0, 0, 92 + i * 16, 20 + i * 5, -0.18, rot, rot + Math.PI * 1.6); ctx.stroke();
  }
  // Olay ufku
  ctx.fillStyle = '#000';
  ctx.shadowColor = 'rgba(255,140,60,0.9)'; ctx.shadowBlur = 24;
  ctx.beginPath(); ctx.arc(0, 0, 44, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,200,140,0.75)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, 0, 46, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

// --- Kaya görselleri: 3 boyut × 3 çeşit; tipler renklendirilmiş kopyalarla ayrılır ---
const ROCK_CLASSES = ['small', 'medium', 'large'];
const rockImgs = {};
ROCK_CLASSES.forEach(c => { rockImgs[c] = [1, 2, 3].map(n => { const im = new Image(); im.src = `ASSETS/rocks/rock-${c}-${n}.png`; return im; }); });
const ROCK_TINTS = { iron: '#8aa2bb', explosive: '#ff2a10', debris: '#a070e0' };
const rockSprites = {};
function getRockSprite(cls, idx, tint) {
  const img = rockImgs[cls][idx];
  if (!img.complete || !img.naturalWidth) return null;
  if (!tint) return img;
  const key = `${cls}${idx}${tint}`;
  if (!rockSprites[key]) {
    const c = document.createElement('canvas');
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    const g = c.getContext('2d');
    g.drawImage(img, 0, 0);
    g.globalCompositeOperation = 'color';          // gölgelendirme korunur, renk değişir
    g.fillStyle = ROCK_TINTS[tint]; g.fillRect(0, 0, c.width, c.height);
    g.globalCompositeOperation = 'destination-in'; // şeffaf alanları geri getir
    g.drawImage(img, 0, 0);
    rockSprites[key] = c;
  }
  return rockSprites[key];
}

// --- Draw: Asteroid ---
function drawAsteroid(a) {
  if (a.meteor) {
    // Meteor: arkasında alev izi
    const tg = ctx.createLinearGradient(a.x, a.y - 110, a.x, a.y);
    tg.addColorStop(0, 'rgba(255,90,20,0)'); tg.addColorStop(1, 'rgba(255,170,60,0.75)');
    ctx.fillStyle = tg;
    ctx.beginPath(); ctx.moveTo(a.x - a.size * 0.8, a.y); ctx.lineTo(a.x, a.y - 110); ctx.lineTo(a.x + a.size * 0.8, a.y); ctx.closePath(); ctx.fill();
  }

  // Görselli kaya
  const cls = a.size > 25 ? 'large' : a.size >= 17 ? 'medium' : 'small';
  if (a.spr == null) a.spr = Math.floor(Math.random() * 3);
  const tint = a.type === 'iron' ? 'iron' : a.type === 'explosive' ? 'explosive' : currentZone === 4 ? 'debris' : null;
  const spr = getRockSprite(cls, a.spr, tint);
  if (spr) {
    const long = a.size * 2.35;
    const k = long / Math.max(spr.width, spr.height);
    const dw = spr.width * k, dh = spr.height * k;
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.globalAlpha = a.flash > 0 ? (a.flash % 4 < 2 ? 0.45 : 1) : 1;
    if (a.type === 'explosive') {
      const pulse = 0.6 + 0.4 * Math.sin(frameCount * 0.2 + a.x);
      ctx.shadowColor = '#ff3a10'; ctx.shadowBlur = 22 * pulse;
    } else if (a.type === 'iron') {
      ctx.shadowColor = 'rgba(150,200,255,0.8)'; ctx.shadowBlur = 10;
    }
    ctx.save();
    ctx.rotate(a.rotation);
    ctx.drawImage(spr, -dw / 2, -dh / 2, dw, dh);
    ctx.restore();
    ctx.shadowBlur = 0;
    // Çok canlı kayalarda can barı
    if (a.type === 'normal' && a.maxHp > 1) {
      ctx.globalAlpha = 0.85;
      const bw = a.size * 1.2, bh = 4, bx = -bw / 2, by = a.size + 4;
      ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = '#ff9a40'; ctx.fillRect(bx, by, bw * (a.hp / a.maxHp), bh);
    }
    ctx.restore();
    return;
  }

  // Görseller yüklenmediyse çizimle yedekle
  ctx.save();
  ctx.translate(a.x, a.y);
  ctx.rotate(a.rotation);
  ctx.globalAlpha = a.flash > 0 ? (a.flash % 4 < 2 ? 0.35 : 1) : 1;
  const r = a.size;
  const n = a.shape.length;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const angle = (i / n) * Math.PI * 2 - Math.PI / 2;
    const pr = r * a.shape[i];
    if (i === 0) ctx.moveTo(Math.cos(angle) * pr, Math.sin(angle) * pr);
    else ctx.lineTo(Math.cos(angle) * pr, Math.sin(angle) * pr);
  }
  ctx.closePath();
  if (a.type === 'iron') {
    ctx.fillStyle = '#4a5a6a';
    ctx.strokeStyle = '#8899aa'; ctx.lineWidth = 2.5;
  } else if (a.type === 'explosive') {
    // Patlayıcı kaya: kızgın kırmızı, nabız gibi parlayan
    const pulse = 0.6 + 0.4 * Math.sin(frameCount * 0.2 + a.x);
    ctx.fillStyle = '#7a1a10';
    ctx.strokeStyle = `rgba(255,${90 + 60 * pulse},40,1)`; ctx.lineWidth = 2.5;
    ctx.shadowColor = '#ff4020'; ctx.shadowBlur = 14 * pulse;
  } else if (currentZone === 4) {
    // Kara deliğe çekilen enkaz: koyu metal, sıcak kenar
    ctx.fillStyle = '#3a2a40';
    ctx.strokeStyle = '#ff8a50'; ctx.lineWidth = 1.5;
  } else {
    ctx.fillStyle = '#7a5535';
    ctx.strokeStyle = '#9a7050'; ctx.lineWidth = 1.5;
  }
  ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0;
  if (a.type === 'explosive') {
    // Çatlaklardan sızan ışık
    ctx.strokeStyle = 'rgba(255,200,80,0.9)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-r * 0.4, -r * 0.1); ctx.lineTo(0, r * 0.15); ctx.lineTo(r * 0.35, -r * 0.25); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, r * 0.15); ctx.lineTo(r * 0.05, r * 0.45); ctx.stroke();
    ctx.restore();
    return;
  }
  // Highlight
  ctx.globalAlpha *= (a.type === 'iron' ? 0.45 : 0.55);
  ctx.fillStyle = a.type === 'iron' ? '#aabccc' : currentZone === 4 ? '#8a6a90' : '#c09060';
  ctx.beginPath(); ctx.arc(-r * 0.18, -r * 0.24, r * 0.22, 0, Math.PI * 2); ctx.fill();
  // Iron: warning X mark
  if (a.type === 'iron') {
    ctx.globalAlpha = 0.7;
    ctx.strokeStyle = '#ff6633'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-r*0.25, -r*0.25); ctx.lineTo(r*0.25, r*0.25); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r*0.25, -r*0.25); ctx.lineTo(-r*0.25, r*0.25); ctx.stroke();
  }
  // HP bar for destructible normal
  if (a.type === 'normal' && a.maxHp > 1) {
    ctx.globalAlpha = 0.8;
    const bw = r * 1.2, bh = 4, bx = -bw/2, by = r + 3;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = '#c09060'; ctx.fillRect(bx, by, bw * (a.hp / a.maxHp), bh);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

// --- Draw: Intro Cinematic ---
function drawIntro() {
  ctx.fillStyle = '#000008';
  ctx.fillRect(0, 0, W, H);
  drawStars();

  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Sabit çerçeve: etiket, iki çizgi ve noktalar her panelde aynı yerde durur (sadece metin değişir)
  const isEnding = cinePanels === ENDING_PANELS;
  const col = isEnding ? '#ffd040' : '#3fd3ff';

  grd.addColorStop(0, 'rgba(255,255,255,0)'); grd.addColorStop(0.5, col); grd.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.strokeStyle = grd; ctx.lineWidth = 1; ctx.globalAlpha = 0.6;
  ctx.beginPath(); ctx.moveTo(40, top); ctx.lineTo(W - 40, top); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(40, bot); ctx.lineTo(W - 40, bot); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 12;
  drawSpaced(isEnding ? 'EPILOGUE' : 'PROLOGUE', W / 2, top - 30, 14, 700, UI_FONT, 5);
  ctx.shadowBlur = 0;
  const n = cinePanels.length, dg = 14;

    ctx.beginPath(); ctx.arc(dx, bot + 36, k === introPanelIdx ? 3.5 : 2.5, 0, Math.PI * 2); ctx.fill();
  }

  // Panel metni — iki çizginin ortasında, sadece bu kısım yumuşakça geçiş yapar
  ctx.globalAlpha = introAlpha;
  const text = cinePanels[introPanelIdx];
  const isTheEnd = text === 'THE END';

    ctx.font = `700 34px ${UI_FONT}`;

  } else {
    ctx.font = STORY_FONT;

  }

  drawWrapped(text, W / 2, (top + bot) / 2, W - 80, isTheEnd ? 44 : STORY_LINE_H);
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;

  // Skip — sağ üst, haritadaki BACK ile aynı stil (metin + ok çizgisi)

  ctx.restore();
}

// --- Draw: Ship ---
const SHIP_W = 90, SHIP_H = 90; // görsel boyutu (1024×1024 kare)

function drawShip(x, y) {
  ctx.save();
  ctx.translate(x, y);

  // Hasar yanıp sönme
  ctx.globalAlpha = player.flash > 0 ? (Math.sin(player.flash * 1.5) > 0 ? 0.25 : 1) : 1;

  // Overdrive: altın alev halesi
  if (overdriveTimer > 0) {
    const op = 0.6 + 0.4 * Math.sin(frameCount * 0.4);
    const og = ctx.createRadialGradient(0, 10, 10, 0, 10, 60);
    og.addColorStop(0, `rgba(255,200,60,${0.45 * op})`); og.addColorStop(1, 'rgba(255,140,0,0)');
    ctx.fillStyle = og; ctx.beginPath(); ctx.arc(0, 10, 60, 0, Math.PI * 2); ctx.fill();
  }

  // Motor alevleri
  const fl = 0.75 + 0.25 * Math.sin(frameCount * 0.6);
  [[-15, 22, 30], [0, 34, 44], [15, 22, 30]].forEach(([fx, fy, len]) => {
    const fg = ctx.createLinearGradient(0, fy, 0, fy + len * fl);
    fg.addColorStop(0, 'rgba(200,240,255,0.95)');
    fg.addColorStop(0.35, 'rgba(70,170,255,0.8)');
    fg.addColorStop(1, 'rgba(30,90,255,0)');
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.moveTo(fx - 4.5, fy); ctx.lineTo(fx + 4.5, fy); ctx.lineTo(fx, fy + len * fl); ctx.closePath(); ctx.fill();
  });

  // Spaceship görseli (altta)
  if (spaceshipImg.complete && spaceshipImg.naturalWidth > 0) {
    ctx.drawImage(spaceshipImg, -SHIP_W / 2, -SHIP_H / 2, SHIP_W, SHIP_H);
  }

  // Kalkan efekti (geminin üstünde, stroke yok)
  if (player.shieldTimer > 0) {
    const pulse = 0.6 + 0.4 * Math.sin(frameCount * 0.15);
    const shieldAlpha = Math.min(1, player.shieldTimer / 40) * pulse;
    // Halka: içi boş, kenarda yoğunlaşan gradient — net koruyucu balon hissi
    const sg = ctx.createRadialGradient(0, 0, 42, 0, 0, 62);
    sg.addColorStop(0,    `rgba(0, 180, 255, 0)`);
    sg.addColorStop(0.72, `rgba(0, 200, 255, ${shieldAlpha * 0.25})`);
    sg.addColorStop(0.88, `rgba(80, 220, 255, ${shieldAlpha * 0.75})`);
    sg.addColorStop(1,    `rgba(180, 240, 255, ${shieldAlpha * 0.55})`);
    ctx.globalAlpha = 1;
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.arc(0, 0, 62, 0, Math.PI * 2);
    ctx.fill();
    // parlak dış kenar + yavaş dönen altıgen ızgara
    ctx.strokeStyle = `rgba(150,230,255,${0.85 * shieldAlpha})`; ctx.lineWidth = 2;
    ctx.shadowColor = '#4fc8ff'; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(0, 0, 60, 0, Math.PI * 2); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.save(); ctx.rotate(frameCount * 0.01);
    ctx.strokeStyle = `rgba(150,230,255,${0.22 * shieldAlpha})`; ctx.lineWidth = 1;
    for (let k = 0; k < 6; k++) { const a = k / 6 * Math.PI * 2; ngonPath(Math.cos(a) * 44, Math.sin(a) * 44, 11, 6, 0); ctx.stroke(); }
    ctx.restore();
    // son 1.5 saniyede yanıp söner: bitmek üzere
    if (player.shieldTimer < 90 && Math.floor(player.shieldTimer / 8) % 2 === 0) { ctx.fillStyle = 'rgba(150,230,255,0.12)'; ctx.beginPath(); ctx.arc(0, 0, 60, 0, Math.PI * 2); ctx.fill(); }
  }

  ctx.globalAlpha = 1;
  ctx.restore();
}

// --- Draw: Enemy ---
// Tier özellikleri: 1HP=küçük+mavi, 2HP=orta+turuncu, 3HP=büyük+kırmızı
const ENEMY_TIER = {
  1: { sc: 0.95, body: '#1e7acc', core: '#7dd4ff', glow: '#1e7acc' },
  2: { sc: 1.30, body: '#c86010', core: '#ffcc77', glow: '#ff8820' },
  3: { sc: 1.75, body: '#c01818', core: '#ff8888', glow: '#ff2020' },
};

function drawEnemy(e) {
  const sz   = ENEMY_SIZES[e.maxHp] ?? { w: 80, h: 60 };
  const dw   = sz.w, dh = sz.h;
  const img  = enemyImgs[e.maxHp];

  ctx.save();
  ctx.translate(e.x, e.y);
  const baseAlpha = e.phantom ? e.alpha : 1;
  ctx.globalAlpha = baseAlpha;

  // Hayalet: titreyen açık mor dış hat (görünmezken de takip edilebilir)
  const outline = e.phantom ? getPhantomOutline(img, e.maxHp) : null;
  if (outline) {
    const fl = 0.5 + 0.5 * Math.sin(frameCount * 0.45 + e.x);
    ctx.save();
    ctx.globalAlpha = (baseAlpha < 0.45 ? 0.22 : 0.3) * (0.6 + 0.4 * fl);
    ctx.shadowColor = '#c9a0ff'; ctx.shadowBlur = 10;
    ctx.drawImage(outline, -dw * 0.54, -dh * 0.54, dw * 1.08, dh * 1.08);
    ctx.restore();
  }
  // Çekimle savrulan düşman: girdap izi
  if (e.shifting > 0) {
    ctx.strokeStyle = `rgba(255,140,60,${e.shifting / 40 * 0.8})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, dw * 0.6, frameCount * 0.3, frameCount * 0.3 + Math.PI * 1.3); ctx.stroke();
  }

  // Görsel — merkeze hizalı, gerçek en/boy oranıyla
  if (img && img.complete && img.naturalWidth > 0) {
    if (e.phantom && baseAlpha < 0.995) {
      // Görünmez olurken parazitli dağılma: yatay dilimler sağa sola kayar
      const slices = 7, sh = img.naturalHeight / slices, dsh = dh / slices, k = 1 - baseAlpha;
      for (let q = 0; q < slices; q++) {
        const off = Math.sin(frameCount * 0.9 + q * 2.3 + e.x) * 12 * k;
        ctx.drawImage(img, 0, q * sh, img.naturalWidth, sh, -dw / 2 + off, -dh / 2 + q * dsh, dw, dsh + 0.5);
      }
    } else {
      ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 9;
      ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);
      ctx.shadowBlur = 0;
      if (e.flash > 8) { // isabet: çok kısa beyaz parlama
        const wsp = getWhiteSprite(img, e.maxHp);
        if (wsp) { ctx.globalAlpha = baseAlpha * (e.flash - 8) / 6; ctx.drawImage(wsp, -dw / 2, -dh / 2, dw, dh); ctx.globalAlpha = baseAlpha; }
      }
    }
  }
  if (e.phantom && baseAlpha < 0.45) { ctx.restore(); return; } // görünmezken can barı yok

  // HP bar — geminin gerçek alt kenarına dayalı
  const barY = dh / 2 + 4;
  const barW = dw * 0.30 * e.maxHp, barH = 5; // 1x / 2x / 3x
  // Bar rengi: düşman tipine göre ton, can azaldıkça açılır
  const ENEMY_HUE = { 1: 125, 2: 48, 3: 350 }; // yeşil / sarı / kırmızı
  const ratio = e.hp / e.maxHp;
  const hue = ENEMY_HUE[e.maxHp] ?? 0;
  const sat  = Math.round(15 + ratio * 45);  // tam can=orta doygun(%60) → sıfır=soluk(%15)
  const lum  = Math.round(22 + ratio * 18);  // tam can=orta(%40) → sıfır=koyu(%22)
  const barColor = `hsl(${hue}, ${sat}%, ${lum}%)`;
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = `hsla(${hue}, 40%, 10%, 0.7)`;
  ctx.fillRect(-barW / 2, barY, barW, barH);
  ctx.fillStyle = barColor;
  ctx.fillRect(-barW / 2, barY, barW * ratio, barH);
  ctx.globalAlpha = 1;
  ctx.restore();
}

// --- Boss görseli: bölgeye göre renklendirilmiş kopyalar (bir kez üretilir) ---
const BOSS_TINTS = { 3: 'rgba(40,220,200,0.42)', 4: 'rgba(20,0,30,0.55)' };
const bossSprites = {};
function getBossSprite(zone) {
  const tint = BOSS_TINTS[zone];
  if (!tint) return bossImg;
  if (!bossSprites[zone]) {
    const c = document.createElement('canvas');
    c.width = bossImg.naturalWidth; c.height = bossImg.naturalHeight;
    const g = c.getContext('2d');
    g.drawImage(bossImg, 0, 0);
    g.globalCompositeOperation = 'source-atop';
    g.fillStyle = tint;
    g.fillRect(0, 0, c.width, c.height);
    if (zone === 4) { // Void Leader: kızıl damarlar
      const rg = g.createRadialGradient(c.width/2, c.height/2, 0, c.width/2, c.height/2, c.width/2);
      rg.addColorStop(0, 'rgba(255,60,40,0.35)'); rg.addColorStop(1, 'rgba(255,60,40,0)');
      g.fillStyle = rg; g.fillRect(0, 0, c.width, c.height);
    }
    bossSprites[zone] = c;
  }
  return bossSprites[zone];
}

// --- Draw: Boss ---
function drawBoss(b) {
  const sc    = b.special ? 1.45 : 1.0;
  const phase = b.phase || 1;
  const pulse = 0.6 + 0.4 * Math.sin(frameCount * (phase === 3 ? 0.22 : 0.07));
  const flashAlpha = b.flash > 0 ? (b.flash % 6 < 3 ? 0.25 : 1) : 1;

  // Faz renk paleti
  const palettes = {
    1: { aura1: '180,0,255', aura2: '100,0,200', wing: '#550099', wingGlow: '#9900cc', body: '#7700bb', bodyGlow: '#cc44ff', core1: '255,220,255', core2: '210,80,255', core3: '140,0,255', gun: '#ff99ff' },
    2: { aura1: '220,0,180', aura2: '140,0,120', wing: '#880055', wingGlow: '#dd0088', body: '#aa0066', bodyGlow: '#ff22aa', core1: '255,200,240', core2: '255,60,180', core3: '180,0,120', gun: '#ff88cc' },
    3: { aura1: '255,40,0',  aura2: '180,0,0',   wing: '#991100', wingGlow: '#ff3300', body: '#cc2200', bodyGlow: '#ff6600', core1: '255,220,180', core2: '255,100,20', core3: '200,40,0',  gun: '#ffaa44' },
  };
  const p = palettes[phase];

  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.scale(sc, sc);
  ctx.globalAlpha = flashAlpha * (b.cloak ? 0.16 + 0.06 * Math.sin(frameCount * 0.3) : 1);

  // Dış aura — gradient yerine 2 transparan circle
  ctx.fillStyle = `rgba(${p.aura1},${0.18 * pulse})`;
  ctx.beginPath(); ctx.arc(0, 0, 75, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = `rgba(${p.aura1},${0.22 * pulse})`;
  ctx.beginPath(); ctx.arc(0, 0, 48, 0, Math.PI * 2); ctx.fill();

  // Boss görseli
  if (bossImg.complete && bossImg.naturalWidth > 0) {
    const bw = BOSS_W, bh = BOSS_H;
    ctx.shadowColor = p.bodyGlow; ctx.shadowBlur = 18;
    ctx.drawImage(getBossSprite(b.zone), -bw / 2, -bh / 2, bw, bh);
    ctx.shadowBlur = 0;
  }

  // Çekirdek parıltısı — faz renginde nabız
  ctx.fillStyle = `rgba(${p.core2},${0.35 * pulse})`; ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = `rgba(${p.core1},${0.55 * pulse})`; ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2); ctx.fill();

  // Faz 3: alev efekti — gradient yerine transparan circle'lar
  if (phase === 3) {
    ctx.globalAlpha = flashAlpha * 0.45 * pulse;
    [-28, 0, 28].forEach(fx => {
      ctx.fillStyle = 'rgba(255,80,0,0.5)';  ctx.beginPath(); ctx.arc(fx,62,18,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,180,0,0.7)'; ctx.beginPath(); ctx.arc(fx,58,10,0,Math.PI*2); ctx.fill();
    });
  }

  ctx.globalAlpha = 1;
  ctx.restore();
}

// --- Draw: Enemy Bullet ---
// Gradient ve shadowBlur yerine katmanlı circle — çok daha hızlı
function drawEBullet(b) {
  ctx.save();
  ctx.translate(b.x, b.y);

  if (b.big) {
    const r = 16 + 3 * Math.sin(frameCount * 0.18);
    ctx.fillStyle = 'rgba(150,24,45,0.22)';  ctx.beginPath(); ctx.arc(0,0,r+10,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(200,40,60,0.55)';  ctx.beginPath(); ctx.arc(0,0,r+4,0,Math.PI*2);  ctx.fill();
    ctx.fillStyle = 'rgba(240,80,90,0.9)';   ctx.beginPath(); ctx.arc(0,0,r-2,0,Math.PI*2);  ctx.fill();
    ctx.fillStyle = '#ffaaaa';               ctx.beginPath(); ctx.arc(0,0,r*0.4,0,Math.PI*2); ctx.fill();
    ctx.restore();
    return;
  }

  // En hızlı fark edilen öğe: koyu dış halka + sıcak turuncu-kırmızı parıltı + parlak çekirdek
  const r = b.fromBoss ? 11 : 9.5;
  ctx.fillStyle = 'rgba(255,70,30,0.22)'; ctx.beginPath(); ctx.arc(0, 0, r + 8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(12,0,4,0.85)';    ctx.beginPath(); ctx.arc(0, 0, r + 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ff3b2a';              ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffb347';              ctx.beginPath(); ctx.arc(0, 0, r * 0.62, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff7d6';              ctx.beginPath(); ctx.arc(0, 0, r * 0.3, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

// --- Draw: Player Bullet ---
function drawTutorial() {
  const step = tutorial.step;
  const dir  = step === 0 ? 1 : -1; // 1=sağ, -1=sol
  const label = step === 0 ? 'SWIPE RIGHT' : 'SWIPE LEFT';

  // Ok animasyonu: ileri-geri kayma + nabız
  const slide   = Math.sin(frameCount * 0.07) * 14;
  const opacity = 0.55 + 0.45 * Math.sin(frameCount * 0.07);

  const cx = W / 2;
  const cy = H - 110;

  ctx.save();
  ctx.globalAlpha = opacity;
  ctx.translate(cx + dir * slide, cy);

  // Ok gövdesi
  const aw = 52, ah = 18, tipW = 30, tipH = 38;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  if (dir === 1) {
    // → sağ ok
    ctx.moveTo(-aw, -ah / 2);
    ctx.lineTo(aw - tipW, -ah / 2);
    ctx.lineTo(aw - tipW, -tipH / 2);
    ctx.lineTo(aw, 0);
    ctx.lineTo(aw - tipW, tipH / 2);
    ctx.lineTo(aw - tipW, ah / 2);
    ctx.lineTo(-aw, ah / 2);
  } else {
    // ← sol ok
    ctx.moveTo(aw, -ah / 2);
    ctx.lineTo(-aw + tipW, -ah / 2);
    ctx.lineTo(-aw + tipW, -tipH / 2);
    ctx.lineTo(-aw, 0);
    ctx.lineTo(-aw + tipW, tipH / 2);
    ctx.lineTo(-aw + tipW, ah / 2);
    ctx.lineTo(aw, ah / 2);
  }
  ctx.closePath();
  ctx.fill();

  // Yazı
  ctx.globalAlpha = opacity;
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 15px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText(label, 0, 28);

  ctx.restore();
}

function drawBullet(b) {
  ctx.save();
  ctx.translate(b.x, b.y);
  const BULLET_COLORS = {
    triple: ['rgba(180,255,200,1)', 'rgba(0,220,100,0.8)'],  // yeşil
    double: ['rgba(255,255,80,1)',  'rgba(255,180,0,0.8)'],   // sarı
    normal: ['rgba(255,255,180,1)', 'rgba(0,220,255,0.8)'],   // mavi/beyaz
    overdrive: ['rgba(255,250,200,1)', 'rgba(255,190,40,0.9)'], // altın
  };
  const color = BULLET_COLORS[b.color] ?? BULLET_COLORS.normal;
  const grd = ctx.createRadialGradient(0, 0, 0, 0, 0, 7);
  grd.addColorStop(0, color[0]);
  grd.addColorStop(0.4, color[1]);
  grd.addColorStop(1, 'rgba(0,100,255,0)');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(0, 0, 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(0, 0, 2.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// --- Draw: Power-up ---
const POWERUP_COLORS = { triple: '#00ffaa', double: '#ffee00', bomb: '#ff4444', shield: '#2299ff', fuel: '#44ff66' };
const POWERUP_GLOW = {
  triple: ['rgba(0,255,170,0.65)',  'rgba(0,255,170,0)'],
  double: ['rgba(255,238,0,0.65)',  'rgba(255,238,0,0)'],
  bomb:   ['rgba(255,68,68,0.65)',  'rgba(255,68,68,0)'],
  shield: ['rgba(34,153,255,0.65)', 'rgba(34,153,255,0)'],
  fuel:   ['rgba(68,255,102,0.65)', 'rgba(68,255,102,0)'],
};

function drawPowerupIcon(type, size) {
  ctx.save();
  if (type === 'triple') {
    // Üç mermi
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#00ffaa';
    ctx.shadowBlur = 6;
    for (const sx of [-size * 0.52, 0, size * 0.52]) {
      ctx.beginPath();
      ctx.moveTo(sx, -size * 0.7);
      ctx.lineTo(sx + size * 0.2, size * 0.4);
      ctx.lineTo(sx, size * 0.2);
      ctx.lineTo(sx - size * 0.2, size * 0.4);
      ctx.closePath();
      ctx.fill();
    }
  } else if (type === 'double') {
    // İki mermi
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#ffee00';
    ctx.shadowBlur = 6;
    for (let sx of [-size * 0.38, size * 0.38]) {
      ctx.beginPath();
      ctx.moveTo(sx, -size * 0.7);
      ctx.lineTo(sx + size * 0.25, size * 0.4);
      ctx.lineTo(sx, size * 0.2);
      ctx.lineTo(sx - size * 0.25, size * 0.4);
      ctx.closePath();
      ctx.fill();
    }
  } else if (type === 'shield') {
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#2299ff';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.moveTo(0, -size * 0.75);
    ctx.lineTo(size * 0.65, -size * 0.35);
    ctx.lineTo(size * 0.65, size * 0.1);
    ctx.quadraticCurveTo(0, size * 0.85, 0, size * 0.85);
    ctx.quadraticCurveTo(-size * 0.65, size * 0.1, -size * 0.65, size * 0.1);
    ctx.lineTo(-size * 0.65, -size * 0.35);
    ctx.closePath();
    ctx.fill();
  } else if (type === 'fuel') {
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#44ff66';
    ctx.shadowBlur = 6;
    // Barrel body
    ctx.fillRect(-size * 0.38, -size * 0.55, size * 0.76, size * 0.9);
    // Cap
    ctx.fillRect(-size * 0.22, -size * 0.72, size * 0.44, size * 0.2);
    // Green tint stripe
    ctx.fillStyle = '#88ffaa';
    ctx.fillRect(-size * 0.28, -size * 0.2, size * 0.56, size * 0.22);
  } else {
    // Bomba: daire + patlama çizgileri
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#ff4444';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(0, size * 0.1, size * 0.45, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    const rays = 6;
    for (let i = 0; i < rays; i++) {
      const a = (i / rays) * Math.PI * 2 - Math.PI / 2;
      const r1 = size * 0.55, r2 = size * 0.82;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * r1, size * 0.1 + Math.sin(a) * r1);
      ctx.lineTo(Math.cos(a) * r2, size * 0.1 + Math.sin(a) * r2);
      ctx.stroke();
    }
    // Fitil
    ctx.strokeStyle = '#ff8';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(size * 0.22, -size * 0.32);
    ctx.quadraticCurveTo(size * 0.5, -size * 0.7, size * 0.15, -size * 0.82);
    ctx.stroke();
  }
  ctx.restore();
}

function drawPowerup(p) {
  const color = POWERUP_COLORS[p.type];
  const bob = Math.sin(p.bobTimer * 0.07) * 3;
  ctx.save();
  ctx.translate(p.x, p.y + bob);

  // Parlak rozet: geniş ışık halesi, nabız gibi atan altıgen, dönen kesikli dış halka, ışıltı
  const pulse = 0.5 + 0.5 * Math.sin(p.bobTimer * 0.12);
  const glow = POWERUP_GLOW[p.type];
  const grd = ctx.createRadialGradient(0, 0, 6, 0, 0, 38);
  grd.addColorStop(0, glow[0]);
  grd.addColorStop(1, glow[1]);
  ctx.fillStyle = grd;
  ctx.globalAlpha = 0.7 + 0.3 * pulse;
  ctx.beginPath(); ctx.arc(0, 0, 38, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  // dönen kesikli halka
  ctx.save(); ctx.rotate(p.bobTimer * 0.03);
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.setLineDash([6, 7]); ctx.globalAlpha = 0.8;
  ctx.beginPath(); ctx.arc(0, 0, 29, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
  // altıgen gövde: renkli iç dolgu + parlak kenar
  const sc = 1 + 0.06 * pulse;
  ctx.scale(sc, sc);
  ngonPath(0, 0, 22, 6, -Math.PI / 2);
  const ig = ctx.createRadialGradient(0, -6, 2, 0, 0, 24);
  ig.addColorStop(0, color + '66'); ig.addColorStop(1, 'rgba(6,14,30,0.92)');
  ctx.fillStyle = ig; ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 2.6;
  ctx.shadowColor = color; ctx.shadowBlur = 18 + 10 * pulse;
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1;
  ngonPath(0, 0, 17, 6, -Math.PI / 2); ctx.stroke();

  // İkon (daha büyük, beyaz parıltılı)
  ctx.shadowColor = '#fff'; ctx.shadowBlur = 6;
  drawPowerupIcon(p.type, 12);
  ctx.shadowBlur = 0;
  // köşede küçük ışıltı
  const tw = (p.bobTimer % 60) / 60;
  ctx.globalAlpha = Math.sin(tw * Math.PI);
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.moveTo(16, -20); ctx.lineTo(18, -16); ctx.lineTo(22, -14); ctx.lineTo(18, -12); ctx.lineTo(16, -8); ctx.lineTo(14, -12); ctx.lineTo(10, -14); ctx.lineTo(14, -16); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;

  ctx.restore();
}

// --- Draw: Kristaller ---
function drawCrystals() {
  crystals.forEach(c => {
    const bob = Math.sin(c.t * 0.15) * 0.25;
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(bob);
    ctx.fillStyle = 'rgba(80,220,255,0.25)';
    ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0, -9); ctx.lineTo(6, 0); ctx.lineTo(0, 9); ctx.lineTo(-6, 0); ctx.closePath();
    const g = ctx.createLinearGradient(-6, -9, 6, 9);
    g.addColorStop(0, '#e8fbff'); g.addColorStop(0.5, '#4fd8ff'); g.addColorStop(1, '#9a6bff');
    ctx.fillStyle = g; ctx.fill();
    ctx.restore();
  });
}
// --- Draw: Uçan puan yazıları ---
function drawFloatTexts() {
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  floatTexts.forEach(f => {
    const life = f.big ? 90 : 50;
    ctx.globalAlpha = Math.min(1, (life - f.t) / 15);
    ctx.font = f.big ? `700 30px ${TEXT_FONT}` : `700 12px ${TEXT_FONT}`;
    ctx.fillStyle = f.color;
    if (f.big) { ctx.shadowColor = f.color; ctx.shadowBlur = 18; }
    const sc = f.big ? 1 + 0.3 * Math.max(0, 1 - f.t / 12) : 1;
    ctx.save(); ctx.translate(f.x, f.y); ctx.scale(sc, sc);
    ctx.fillText(f.text, 0, 0);
    ctx.restore();
    ctx.shadowBlur = 0;
  });
  ctx.restore();
}

// --- Draw: Explosions ---
function drawExplosions() {
  // shadowBlur per-particle yerine toplu: önce büyük glow circle'lar, sonra core circle'lar
  ctx.save();
  explosions.forEach(p => {
    ctx.globalAlpha = p.life * 0.35;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 2.2, 0, Math.PI * 2); ctx.fill();
  });
  explosions.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalAlpha = 1;
  ctx.restore();
}
