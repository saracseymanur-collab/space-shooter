<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Space Shooter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Exo+2:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block;
    position: fixed;
    top: 50%; left: 50%;
    width: 390px; height: 844px;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(var(--game-scale, 1));
    touch-action: none;
    image-rendering: pixelated;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const TEXT_FONT = "'Exo 2', sans-serif"; // butonlar ve metinler
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const spaceshipImg = new Image();
spaceshipImg.src = 'ASSETS/spaceship.png';

const enemyImgs = [null, new Image(), new Image(), new Image()];
enemyImgs[1].src = 'ASSETS/enemy1.png';
enemyImgs[2].src = 'ASSETS/enemy2.png';
enemyImgs[3].src = 'ASSETS/enemy3.png';

const bossImg = new Image();
bossImg.src = 'ASSETS/boss.png';
const BOSS_W = 190, BOSS_H = 127; // 1536×1024 oranında
const bossShieldImg = new Image();
bossShieldImg.src = 'ASSETS/shields/boss-shield-v2.png'; // sektör 1 boss kalkanı (512×352, siyah zeminden ayıklandı; v1: SOURCES/SHIELD)
const BOSS_SHIELD_W = 220, BOSS_SHIELD_H = 151;

// Düşman görsel boyutları — gerçek en/boy oranına göre (sıkı kırpılmış assetler)
// Şerit 130px: en büyük düşman şeridin ~%85'i (zikzakta komşu şeride taşmaz), küçükler okunur kalır
const ENEMY_SIZES = { 1: { w: 64, h: 42 }, 2: { w: 88, h: 60 }, 3: { w: 110, h: 90 } };

// Sabit oyun alanı boyutu (390×844 — iPhone standart)
const W = 390;
const H = 844;

// Retina/HiDPI: fiziksel piksel sayısını artır, mantıksal koordinatlar değişmez
const DPR = Math.min(window.devicePixelRatio || 1, 2);
canvas.width  = W * DPR;
canvas.height = H * DPR;

// --- CSS ölçeği: mobilde tam ekran doldur, masaüstünde telefon boyutu ---
function updateScale() {
  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
  let scale;
  if (isMobile) {
    scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  } else {
    scale = Math.min(1, window.innerWidth / W, window.innerHeight / H);
  }
  document.documentElement.style.setProperty('--game-scale', scale);
}
updateScale();
window.addEventListener('resize', updateScale);

// --- Ses: Web Audio ile üretilen efektler + bölgeye göre basit müzik (dosya gerekmez) ---
const Sound = (() => {
  let ac = null, master = null, sfxBus = null, musicBus = null, padFilter = null;
  let musicOn = true, sfxOn = true;
  try {
    if (localStorage.getItem('ss_muted') === '1') { musicOn = false; sfxOn = false; } // eski tek ayar
    if (localStorage.getItem('ss_music') === '0') musicOn = false;
    if (localStorage.getItem('ss_sfx') === '0') sfxOn = false;
  } catch(e) {}
  const save = () => { try { localStorage.setItem('ss_music', musicOn ? '1' : '0'); localStorage.setItem('ss_sfx', sfxOn ? '1' : '0'); localStorage.removeItem('ss_muted'); } catch(e) {} };

  // --- Ses sistemi kurulumu ---
  let needsRebuild = false, rebuildCheck = null;
  function create() {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = 0.7; master.connect(ac.destination);
    sfxBus = ac.createGain(); sfxBus.gain.value = sfxOn ? 0.9 : 0; sfxBus.connect(master);
    musicBus = ac.createGain(); musicBus.gain.value = 0; musicBus.connect(master);
    // Pad'ler için yavaşça açılıp kapanan alçak geçiren filtre (nefes alan ses)
    padFilter = ac.createBiquadFilter(); padFilter.type = 'lowpass'; padFilter.frequency.value = 1000; padFilter.Q.value = 0.6;
    padFilter.connect(musicBus);
    const lfo = ac.createOscillator(), lfoGain = ac.createGain();
    lfo.frequency.value = 0.06; lfoGain.gain.value = 350;
    lfo.connect(lfoGain); lfoGain.connect(padFilter.frequency); lfo.start();
    // iPhone sessizlikte ses sistemini askıya almasın diye duyulmayan sürekli bir ses
    const keep = ac.createOscillator(), kg = ac.createGain();
    kg.gain.value = 0.00001; keep.connect(kg); kg.connect(ac.destination); keep.start();
    voices = []; nextChordAt = 0; nextTwinkleAt = 0; nextPulseAt = 0; curDuck = -1;
  }
  // iPhone: ses yalnızca bir dokunuşun SONUNDA açılabilir; açılırken duyulmayan kısa bir ses çalınır.
  // Kesintiden (kilit ekranı, bildirim, uzun duraklama) sonra açılamazsa bir sonraki dokunuşta baştan kurulur.
  function init() {
    try { if (navigator.audioSession) navigator.audioSession.type = 'ambient'; } catch(e) {} // iOS 17+: oyun sesi — sessiz anahtarına uyar ('playback' anahtarı yok sayıyordu)
    if (ac && (needsRebuild || ac.state === 'closed')) { try { ac.close(); } catch(e) {} ac = null; needsRebuild = false; }
    if (!ac) { try { create(); } catch(e) { ac = null; return; } }
    if (ac.state !== 'running') {
      try {
        const b = ac.createBuffer(1, 1, 22050), src = ac.createBufferSource();
        src.buffer = b; src.connect(ac.destination); src.start(0);
        const p = ac.resume(); if (p && p.catch) p.catch(() => {});
      } catch(e) {}
      clearTimeout(rebuildCheck);
      rebuildCheck = setTimeout(() => { if (ac && ac.state !== 'running') needsRebuild = true; }, 600);
    }
  }
  const live = () => ac && ac.state === 'running';
  const ready = () => live() && sfxOn;

  function tone({ type = 'square', f = 440, f2 = null, dur = 0.1, vol = 0.2, delay = 0, bus = sfxBus, attack = 0.005 }) {
    if (bus === sfxBus ? !ready() : !live()) return;
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(bus);
    o.start(t); o.stop(t + dur + 0.02);
  }
  let noiseBuf = null;
  function noise({ dur = 0.3, vol = 0.3, freq = 1200, delay = 0, bus = sfxBus, type = 'lowpass', q = 1, end = 80 }) {
    if (bus === sfxBus ? !ready() : !live()) return;
    if (!noiseBuf || noiseBuf.sampleRate !== ac.sampleRate) {
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t = ac.currentTime + delay;
    const src = ac.createBufferSource(), flt = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noiseBuf;
    flt.type = type; flt.Q.value = q; flt.frequency.setValueAtTime(freq, t); flt.frequency.exponentialRampToValueAtTime(end, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(flt); flt.connect(g); g.connect(bus);
    src.start(t); src.stop(t + dur);
  }

  let lastShot = 0;
  const sfx = {
    // Ateş: kısık, boğuk "pıf"; perdesi her atışta biraz değişir
    shoot()     { const n = performance.now(); if (n - lastShot < 90) return; lastShot = n;
                  noise({ dur: 0.045, vol: 0.02, freq: 1300 + Math.random() * 700 });
                  tone({ type: 'triangle', f: 200 + Math.random() * 50, f2: 110, dur: 0.05, vol: 0.014 }); },
    // İsabet (ölmeden): kısa metalik "tık"
    hit()       { const v = 0.9 + Math.random() * 0.2; tone({ type: 'square', f: 540 * v, f2: 320 * v, dur: 0.04, vol: 0.035 }); tone({ type: 'triangle', f: 1500 * v, dur: 0.03, vol: 0.02 }); },
    // Düşman gemisi patlaması: büyüklüğe göre farklı karakter, her seferinde perde biraz değişir
    // Gemi parçalanması: tek, tok "gümp" (büyük gemi daha pes ve dolgun). Kısa vuruş + alçalan bas, kuyruk yok
    shipBoom(tier = 1) {
      const v = 0.94 + Math.random() * 0.12, k = [0, 1, 0.82, 0.66][tier] || 1;
      tone({ type: 'sine', f: 170 * k * v, f2: 42 * k, dur: 0.2 + 0.05 * tier, vol: 0.2 + 0.04 * tier, attack: 0.003 });
      noise({ dur: 0.07, vol: 0.1 + 0.02 * tier, freq: 700 * k, end: 150 });
    },
    // Kaya kırılması: taşlı, kum gibi çıtırtı (gemi patlamasından ayrı)
    rockCrack(size = 20) {
      const v = 30 / Math.max(12, size);
      noise({ dur: 0.18, vol: 0.16, freq: 900 * v, type: 'bandpass', q: 1.4, end: 200 });
      tone({ type: 'square', f: 140 * v, f2: 70, dur: 0.07, vol: 0.04 });
      [0.03, 0.07].forEach(d => noise({ dur: 0.03, vol: 0.05, freq: 5000, type: 'highpass', q: 1, delay: d, end: 3000 }));
    },
    explode()   { this.shipBoom(2); },
    // Boss patlaması: uzun, katmanlı
    bigBoom()   { noise({ dur: 1.3, vol: 0.45, freq: 900, end: 50 }); tone({ type: 'sine', f: 110, f2: 28, dur: 1.1, vol: 0.35 });
                  [0.15, 0.35, 0.6, 0.85].forEach(d => { noise({ dur: 0.3, vol: 0.2, freq: 1400, delay: d, end: 100 }); }); },
    // Meteor geçişi: hışırtı
    whoosh()    { noise({ dur: 0.7, vol: 0.12, freq: 300, type: 'bandpass', q: 0.7, end: 3000 }); },
    hurt()      { tone({ type: 'sawtooth', f: 320, f2: 60, dur: 0.35, vol: 0.18 }); noise({ dur: 0.25, vol: 0.2, freq: 2500 }); },
    shield()    { tone({ type: 'sine', f: 900, f2: 1400, dur: 0.12, vol: 0.08 }); },
    powerup()   { [523, 659, 784, 1047].forEach((f, i) => tone({ type: 'triangle', f, dur: 0.1, vol: 0.12, delay: i * 0.055 })); },
    bomb()      { noise({ dur: 0.9, vol: 0.4, freq: 3000 }); tone({ type: 'sine', f: 200, f2: 40, dur: 0.7, vol: 0.3 }); },
    // Patlayıcı kaya: derin gümbürtü + cızırtılı kuyruk
    blast()     { noise({ dur: 0.8, vol: 0.38, freq: 1200, end: 60 }); tone({ type: 'sine', f: 90, f2: 30, dur: 0.6, vol: 0.32 });
                  noise({ dur: 0.9, vol: 0.06, freq: 6000, type: 'highpass', q: 0.5, delay: 0.1, end: 2500 }); },
    swipe()     { tone({ type: 'sine', f: 420, f2: 700, dur: 0.06, vol: 0.03 }); },
    thunder()   { noise({ dur: 1.0, vol: 0.34, freq: 2600, end: 70 }); tone({ type: 'sine', f: 75, f2: 28, dur: 0.9, vol: 0.3 });
                  noise({ dur: 0.12, vol: 0.14, freq: 6000, type: 'highpass', q: 0.7, end: 3000 }); },
    crackle()   { noise({ dur: 0.18, vol: 0.05, freq: 5000, type: 'highpass', q: 1, end: 2500 }); },
    ping()      { tone({ type: 'sine', f: 1500, f2: 1100, dur: 0.22, vol: 0.025 }); },
    crystal()   { tone({ type: 'triangle', f: 1500, f2: 2100, dur: 0.07, vol: 0.05 }); },
    click()     { tone({ type: 'square', f: 660, f2: 990, dur: 0.05, vol: 0.05 }); },
    laserWarn() { tone({ type: 'square', f: 880, dur: 0.07, vol: 0.06 }); tone({ type: 'square', f: 880, dur: 0.07, vol: 0.06, delay: 0.14 }); },
    laserFire() { tone({ type: 'sawtooth', f: 220, f2: 70, dur: 0.5, vol: 0.16 }); noise({ dur: 0.45, vol: 0.18, freq: 4000 }); },
    bossIn()    { tone({ type: 'sawtooth', f: 55, f2: 110, dur: 1.4, vol: 0.22, attack: 0.3 }); tone({ type: 'sawtooth', f: 82, f2: 165, dur: 1.4, vol: 0.14, attack: 0.3 }); },
    clear()     { [523, 659, 784].forEach((f, i) => tone({ type: 'triangle', f, dur: 0.22, vol: 0.13, delay: i * 0.1 })); tone({ type: 'triangle', f: 1047, dur: 0.5, vol: 0.13, delay: 0.3 }); },
    victory()   { [392, 523, 659, 784, 659, 784, 1047].forEach((f, i) => tone({ type: 'square', f, dur: i === 6 ? 0.7 : 0.14, vol: 0.07, delay: i * 0.13 })); },
    count(n)    { tone({ type: 'triangle', f: n === 1 ? 660 : 520, dur: 0.12, vol: 0.12 }); },
    go()        { tone({ type: 'triangle', f: 880, f2: 1320, dur: 0.25, vol: 0.13 }); noise({ dur: 0.3, vol: 0.06, freq: 3000 }); },
    wave()      { [784, 1047].forEach((f, i) => tone({ type: 'sine', f, dur: 0.18, vol: 0.08, delay: i * 0.08 })); },
    warning()   { [0, 0.42, 0.84].forEach(d => { tone({ type: 'sawtooth', f: 520, f2: 380, dur: 0.36, vol: 0.09, delay: d }); }); },
    gameover()  { [392, 330, 262, 196].forEach((f, i) => tone({ type: 'triangle', f, dur: 0.3, vol: 0.13, delay: i * 0.2 })); },
  };

  // --- Ambiyans müzik: bölgeye özel, yavaş değişen akorlar + ara ara ışıltılar; yoğun anlarda hafif ritim ---
  const midi = n => 440 * Math.pow(2, (n - 69) / 12);
  const ZONE_MUSIC = {
    1: { root: 57, cutoff: 1400, wave: 'sawtooth', tw: 'sine',     // Deep Space: sakin, açık
         prog: [[0, 7, 12, 15], [-4, 3, 8, 12], [3, 10, 15, 19], [-2, 5, 10, 14], [0, 7, 10, 15], [-5, 2, 7, 10], [-4, 3, 8, 15], [-2, 5, 9, 14]],
         scale: [12, 15, 19, 22, 24, 27] },
    2: { root: 50, cutoff: 950, wave: 'sawtooth', tw: 'triangle',  // Asteroid Belt: sıcak, ağır
         prog: [[0, 7, 10, 15], [-2, 5, 9, 14], [-4, 3, 8, 12], [-2, 5, 10, 14], [0, 7, 12, 17], [3, 10, 15, 19], [-4, 3, 7, 12], [-2, 5, 9, 12]],
         scale: [12, 14, 17, 19, 21, 24] },
    3: { root: 52, cutoff: 1150, wave: 'triangle', tw: 'sine',     // Nebula: gizemli
         prog: [[0, 7, 12, 17], [1, 8, 13, 17], [0, 5, 10, 15], [-2, 5, 10, 13], [0, 7, 12, 15], [1, 5, 8, 13], [-4, 3, 8, 12], [-2, 5, 12, 13]],
         scale: [12, 13, 17, 19, 22, 24] },
    4: { root: 48, cutoff: 650, wave: 'sawtooth', tw: 'sine',      // Black Hole: karanlık, derin
         prog: [[0, 7, 12, 15], [-4, 3, 8, 12], [-7, 0, 5, 8], [-5, 2, 7, 11], [0, 6, 12, 15], [-4, 3, 7, 12], [-7, 0, 3, 8], [-5, 2, 5, 11]],
         scale: [12, 15, 18, 19, 22, 24] },
  };
  // Menü/harita: sakin, açık (majör), daha yumuşak dalga
  const MENU_MUSIC = { root: 55, cutoff: 900, wave: 'triangle', tw: 'sine',
    prog: [[0, 7, 12, 16], [5, 12, 16, 21], [-3, 4, 9, 12], [2, 9, 14, 17], [0, 7, 11, 16], [-5, 2, 7, 11]],
    scale: [12, 14, 16, 19, 21, 24] };
  // Boss: bölgenin kökünde, gergin (yarım ton kaymalı) ve hızlı akor değişimi + bas ostinato
  const BOSS_PROG = [[0, 7, 12, 15], [1, 8, 13, 17], [-2, 5, 10, 15], [0, 7, 11, 14], [-4, 3, 8, 12], [1, 8, 13, 16]];
  const CHORD = 8; // saniye (boss'ta 4)
  // Bölüm varyasyonu (bölge içindeki sıra): kök kayması + ek katman
  const VARIANTS = [{ shift: 0, layer: null }, { shift: 2, layer: 'arp' }, { shift: -3, layer: 'heart' }, { shift: 5, layer: 'arp' }];
  let voices = [], nextChordAt = 0, chordIdx = 0, nextTwinkleAt = 0, nextPulseAt = 0, pulseN = 0, nextLayerAt = 0, layerN = 0;
  let mZone = 1, mIntense = false, mDuck = 1, curDuck = -1, mTrack = 'zone', mVar = 0, mKey = '', chordN = 0, cycleRot = 0;
  // Çalan temanın tanımı: { root, cutoff, wave, tw, prog, scale, len, boss }
  function trackDef() {
    if (mTrack === 'menu') return { ...MENU_MUSIC, len: CHORD };
    const z = ZONE_MUSIC[mZone] || ZONE_MUSIC[1];
    if (mTrack === 'boss') return { ...z, prog: BOSS_PROG, cutoff: z.cutoff * 1.4, tw: 'triangle', len: CHORD / 2, boss: true };
    return { ...z, root: z.root + VARIANTS[mVar % 4].shift, len: CHORD };
  }
  // Her 20 akorda 2 akorluk nefes arası (pad susar, sadece alçak bas + seyrek ışıltı) — boss/yoğun anda yok
  const resting = () => mTrack !== 'boss' && !mIntense && chordN % 20 >= 18;

  const curNotes = z => z.prog[(chordIdx - 1 + cycleRot + z.prog.length * 4) % z.prog.length];
  function playChord(z, t) {
    const L = z.len, rest = resting(), atk = z.boss ? 0.8 : 2.5;
    const out = ac.createGain();
    out.gain.setValueAtTime(0.0001, t);
    out.gain.exponentialRampToValueAtTime(1, t + atk);
    out.gain.setValueAtTime(1, t + L);
    out.gain.exponentialRampToValueAtTime(0.0001, t + L + (z.boss ? 1.5 : 3.5));
    out.connect(padFilter);
    // her döngünün başında akor sırası kayar → aynı 64 sn tekrar etmez
    if (chordIdx > 0 && chordIdx % z.prog.length === 0) cycleRot = Math.floor(Math.random() * z.prog.length);
    const notes = z.prog[(chordIdx + cycleRot) % z.prog.length];
    if (!rest) notes.forEach((n, i) => [-7, 7].forEach(det => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = z.wave; o.frequency.value = midi(z.root + n - 12); o.detune.value = det;
      g.gain.value = i === 0 ? 0.07 : 0.045;
      o.connect(g); g.connect(out); o.start(t); o.stop(t + L + 3.7);
    }));
    // Derin bas (nefes arasında da kalır, daha kısık)
    const b = ac.createOscillator(), bg = ac.createGain();
    b.type = 'sine'; b.frequency.value = midi(z.root + notes[0] - 24); bg.gain.value = rest ? 0.07 : 0.16;
    b.connect(bg); bg.connect(out); b.start(t); b.stop(t + L + 3.7);
    voices.push({ out, end: t + L + 3.7 });
    chordIdx++; chordN++;
  }
  function tick() {
    if (!live() || !musicOn) return;
    const now = ac.currentTime, z = trackDef();
    voices = voices.filter(v => v.end > now);
    // Ses seviyesi (durdurma ekranında kısık)
    const duck = mDuck * (mIntense ? 1.1 : 1);
    if (duck !== curDuck) { musicBus.gain.setTargetAtTime(0.5 * duck, now, 0.4); curDuck = duck; }
    padFilter.frequency.setTargetAtTime(z.cutoff * (mIntense ? 1.5 : 1), now, 1.5);
    if (now >= nextChordAt - 0.25) { const t = Math.max(now + 0.05, nextChordAt); playChord(z, t); nextChordAt = t + z.len; }
    // Işıltılar: ara ara, akorun notalarından, yankılı
    if (now >= nextTwinkleAt) {
      const notes = curNotes(z);
      const n = z.root + 12 + z.scale[Math.floor(Math.random() * z.scale.length)] + (Math.random() < 0.3 ? notes[1] % 12 : 0);
      [0, 0.38, 0.76].forEach((d, k) => tone({ type: z.tw, f: midi(n), dur: 1.6, vol: 0.035 * Math.pow(0.45, k), delay: d, bus: musicBus, attack: 0.01 }));
      nextTwinkleAt = now + (resting() ? 5 : 2) + Math.random() * 3.5;
    }
    // Bölüm varyasyon katmanı: yavaş arpej ya da kalp atışı gibi alçak nabız (nefes arasında susar)
    const layer = mTrack === 'zone' && !resting() ? VARIANTS[mVar % 4].layer : null;
    if (layer && now >= nextLayerAt - 0.2) {
      const t0 = Math.max(now + 0.05, nextLayerAt), notes = curNotes(z);
      if (layer === 'arp') {
        const n = z.root + notes[[0, 1, 2, 3, 2, 1][layerN % 6]];
        tone({ type: 'triangle', f: midi(n), dur: 0.9, vol: 0.022, delay: t0 - now, bus: musicBus, attack: 0.02 });
        nextLayerAt = t0 + 0.5;
      } else {
        tone({ type: 'sine', f: midi(z.root + notes[0] - 24), f2: midi(z.root + notes[0] - 26), dur: 0.35, vol: 0.12, delay: t0 - now, bus: musicBus });
        tone({ type: 'sine', f: midi(z.root + notes[0] - 24), dur: 0.25, vol: 0.06, delay: t0 - now + 0.28, bus: musicBus });
        nextLayerAt = t0 + 2;
      }
      layerN++;
    }
    // Boss: sekizlik bas ostinato (kök – kök – beşli – kök)
    if (mTrack === 'boss') {
      if (nextLayerAt < now) nextLayerAt = now + 0.05;
      while (nextLayerAt < now + 0.4) {
        const notes = curNotes(z), n = z.root + notes[0] - 24 + [0, 0, 7, 0][layerN % 4];
        tone({ type: 'triangle', f: midi(n), dur: 0.16, vol: 0.09, delay: nextLayerAt - now, bus: musicBus, attack: 0.005 });
        layerN++; nextLayerAt += 0.2;
      }
    }
    // Yoğun anlar (boss, son dalga): yumuşak nabız + hafif zil

// --- Metin sarma: her cümle yeni satırdan başlar, satır sonunda tek kelime kalmaz ---
function wrapText(text, maxWidth) {
  const sentences = (text.match(/[^.!?]+[.!?]+["”]?|[^.!?]+$/g) || [text]).map(t => t.trim()).filter(Boolean);
  const lines = []; // { text, gap } — gap: yeni cümlenin ilk satırı
  sentences.forEach((sen, si) => {
    const words = sen.split(' ');
    const out = [];
    let cur = [];
    words.forEach(w => {
      if (cur.length && ctx.measureText([...cur, w].join(' ')).width > maxWidth) { out.push(cur); cur = [w]; }
      else cur.push(w);
    });
    out.push(cur);
    // Yetim kelime: son satır tek kelimeyse önceki satırdan bir kelime indir
    if (out.length > 1 && out[out.length - 1].length === 1 && out[out.length - 2].length > 2) {
      const moved = out[out.length - 2].pop();
      out[out.length - 1].unshift(moved);
    }
    out.forEach((l, li) => lines.push({ text: l.join(' '), gap: si > 0 && li === 0 }));
  });
  return lines;
}
// Satırları dikeyde ortalayarak çizer; cümleler arasında küçük boşluk bırakır
function drawWrapped(text, cx, cy, maxWidth, lineH) {
  const lines = wrapText(text, maxWidth);
  const gapH = lineH * 0.35;
  const totalH = lines.length * lineH + lines.filter(l => l.gap).length * gapH;
  let y = cy - totalH / 2 + lineH / 2;
  lines.forEach(l => { if (l.gap) y += gapH; ctx.fillText(l.text, cx, y); y += lineH; });
  return totalH;
}

    // ── Zone 3: Nebula — sis bulutları + görünmez olabilen hayalet düşmanlar ──
    // fog: sis yoğunluğu (0-1) · cloak: hayaletin görünür/görünmez süreleri (kare) · ion: iyon bulutu aralığı
    case 11: { // RADAR PING: düşmanlar bulutsuda görünmez, radar dalgası kısa süre gösterir
      const lw = Math.min(5, Math.max(1, getWave() - (currentLevel - 1) * 5)), R = RADAR_WAVES[lw - 1];
      return {
        interval: R.interval, doubleChance: R.dbl,
        speed: () => R.spd + Math.random() * 0.4,
        hp: () => Math.random() < R.hp2 ? 2 : 1,
        canShoot: true, zigzag: false, fog: 0.3, radar: R,
      };
    }
    case 12: { // ION STORM: şimşek şeridi önce parlatır, sonra vurur
      const lw = Math.min(5, Math.max(1, getWave() - (currentLevel - 1) * 5)), S = STORM_WAVES[lw - 1];
      return {
        interval: S.interval, doubleChance: S.dbl,
        speed: () => S.spd + Math.random() * 0.4,
        hp: () => Math.random() < S.hp2 ? 2 : 1,
        canShoot: true, zigzag: false, fog: 0.15, fireMul: 1.3, storm: S,
      };
    }
    case 13: { // GHOST FLEET: gemiler titrer, hepsi birden ileri ışınlanır
      const lw = Math.min(5, Math.max(1, getWave() - (currentLevel - 1) * 5)), G = WARP_WAVES[lw - 1];
      return {
        interval: G.interval, doubleChance: G.dbl,
        speed: () => G.spd + Math.random() * 0.3,
        hp: () => { const r = Math.random(); return r < G.hp3 ? 3 : r < G.hp3 + G.hp2 ? 2 : 1; },
        canShoot: true, zigzag: false, fog: 0.2, warp: G,
      };
    }
    case 14: { // DATA STREAM: şeritten şeride kayan veri akışı, içinde kalınca arşiv dolar
      const lw = Math.min(5, Math.max(1, getWave() - (currentLevel - 1) * 5)), D = DATA_WAVES[lw - 1];
      return {
        interval: D.interval, doubleChance: D.dbl,
        speed: () => D.spd + Math.random() * 0.4,
        hp: () => { const r = Math.random(); return r < D.hp3 ? 3 : r < D.hp3 + D.hp2 ? 2 : 1; },
        canShoot: true, zigzag: false, fog: 0.2, stream: D,
      };
    }
    case 15: return { // zikzak hayaletler + iyon bulutları
      interval: 66, doubleChance: 0.25,
      speed: () => 1.8 + Math.random() * 0.5,
      hp: () => { const r = Math.random(); return r < 0.15 ? 3 : r < 0.55 ? 2 : 1; },
      canShoot: true, zigzag: true, phantom: 0.5, fog: 0.45, ion: 560,
    };
    // ── Zone 4: Black Hole — çekim şerit değiştirtir, mermiler kıvrılır, enkaz ──
    case 16: return { // shift2: ikinci kez savrulma ihtimali
      interval: 62, doubleChance: 0.25,
      speed: () => 1.8 + Math.random() * 0.4,
      hp: () => Math.random() < 0.5 ? 2 : 1,
      canShoot: true, zigzag: false, gravity: 0.8, shift2: 0.45,
    };
    case 17: return {
      interval: 64, doubleChance: 0.25,
      speed: () => 1.8 + Math.random() * 0.4,
      hp: () => Math.random() < 0.45 ? 2 : 1,
      canShoot: true, zigzag: false, gravity: 0.6, shift2: 0.25, curveShots: true,
    };
    case 18: return {
      interval: 72, doubleChance: 0.2,
      speed: () => 1.8 + Math.random() * 0.5,
      hp: () => Math.random() < 0.5 ? 2 : 1,
      canShoot: true, zigzag: false, gravity: 0.6, shift2: 0.25, curveShots: true, curve: 1.35, debris: 80,
    };
    case 19: case 20: return {
      interval: 66, doubleChance: 0.25,
      speed: () => 1.9 + Math.random() * 0.5,
      hp: () => { const r = Math.random(); return r < 0.2 ? 3 : r < 0.6 ? 2 : 1; },
      canShoot: true, zigzag: false, gravity: 0.7, shift2: 0.35, curveShots: true, curve: 1.35, debris: 64,
    };
    default: return null;
  }
}

// --- Input ---
let keys = {};

document.addEventListener('keydown', e => {
  if (!keys[e.code]) keyHandled[e.code] = false;
  keys[e.code] = true;
  if (state === 'intro') {
    if (e.code === 'Escape') { endCinematic(); return; }
    if (e.code === 'ArrowLeft') { cinePrev(); return; }
    if ((e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowRight') && introPhase === 'show') {
      introPhase = 'fadeout'; return;
    }
    return;
  }
  if (state === 'zonetransition') {
    if ((e.code === 'Space' || e.code === 'Enter') && zoneTransPhase === 'show') {
      exitZoneTransition(); return;
    }
    return;
  }
  if (state === 'menu') {
    if (e.code === 'ArrowLeft')  menuIdx = Math.max(0, menuIdx - 1);
    if (e.code === 'ArrowRight') menuIdx = Math.min(MENU_CARDS.length - 1, menuIdx + 1);
    if ((e.code === 'Enter' || e.code === 'Space') && !isZoneLocked(menuIdx)) { currentZone = menuIdx + 1; state = 'map'; }
    return;
  }
  if (state === 'map') {
    if (e.code === 'Escape') state = 'menu';
  }
  if (state === 'gameover') {
    if (e.code === 'Space' || e.code === 'Enter') startLevel(currentLevel);
    if (e.code === 'Escape') state = 'map';
    return;
  }
  if (state === 'paused') {
    if (e.code === 'Escape' || e.code === 'KeyP' || e.code === 'Space') state = 'play';
    return;
  }
  if (state === 'play' && introCard) {
    if ((e.code === 'Enter' || e.code === 'Space') && introCard.t > 15) closeIntroCard();
    return;
  }
  if (state === 'play' && archiveCard) { if (e.code === 'Enter' || e.code === 'Space') closeArchiveCard(); return; }
  if (state === 'play' && briefing) {
    if (e.code === 'Enter' || e.code === 'Space') beginLevelPlay();
    return;
  }
  if (state === 'play' && (e.code === 'Escape' || e.code === 'KeyP')) { state = 'paused'; return; }
  if (state === 'play') {
    if (e.code === 'Space' && !keyHandled[e.code] && convoyOn()) { keyHandled[e.code] = true; toggleFire(); }
    if (e.code === 'Space' && !keyHandled[e.code] && currentLevel === 10) { keyHandled[e.code] = true; useTitanBomb(); }
    if (e.code === 'ArrowLeft' && !keyHandled[e.code]) {
      keyHandled[e.code] = true;
      if (player.targetLane > 0) player.targetLane--;
    }
    if (e.code === 'ArrowRight' && !keyHandled[e.code]) {
      keyHandled[e.code] = true;
      if (player.targetLane < 2) player.targetLane++;
    }
  }
});
document.addEventListener('keyup', e => { keys[e.code] = false; keyHandled[e.code] = false; });

// --- Touch / Swipe Kontrolleri ---
// Document seviyesinde tüm default touch davranışlarını engelle
['touchstart','touchmove','touchend','touchcancel'].forEach(evt => {
  document.addEventListener(evt, e => { e.preventDefault(); }, { passive: false });
});

let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
let swipeFired = false; // her dokunuşta tek swipe

let mouseStartX = 0, mouseStartY = 0, mouseStartTime = 0;
let mouseSwipeFired = false;

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  touchStartX = t.clientX;
  touchStartY = t.clientY;
  touchStartTime = Date.now();
  swipeFired = false;
}, { passive: false });

// Oyun içi swipe: parmak kalkmadan, 10px hareket eder etmez anında tetikle
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (state !== 'play' || briefing || introCard || archiveCard || swipeFired) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) {
    if (dx < 0 && player.targetLane > 0) player.targetLane--;
    if (dx > 0 && player.targetLane < 2) player.targetLane++;
    swipeFired = true;
    if (tutorial) {
      if (dx > 0 && tutorial.step === 0) tutorial.step = 1;
      else if (dx < 0 && tutorial.step === 1) { localStorage.setItem('ss_tutorial', '1'); tutorial = null; }
    }
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  const dt = Date.now() - touchStartTime;
  const absDx = Math.abs(dx), absDy = Math.abs(dy);

  // Tap → click olarak ilet (swipe olmadıysa)
  if (!swipeFired && absDx < 12 && absDy < 12 && dt < 300) {
    canvas.dispatchEvent(new MouseEvent('click', {
      clientX: t.clientX, clientY: t.clientY, bubbles: true
    }));
    return;
  }

  // Sinematikte yatay kaydırma: sola → sonraki, sağa → önceki
  if (state === 'intro' && absDx > absDy && absDx > 30) {
    if (dx < 0) cineNext(); else cinePrev();
    return;
  }

  // Menüde yatay swipe → kart değiştir
  if (state === 'menu' && absDx > absDy && absDx > 20) {
    if (dx < 0) menuIdx = Math.min(MENU_CARDS.length - 1, menuIdx + 1);
    if (dx > 0) menuIdx = Math.max(0, menuIdx - 1);
  }
}, { passive: false });

canvas.addEventListener('touchcancel', e => { e.preventDefault(); swipeFired = false; }, { passive: false });

canvas.addEventListener('mousedown', e => {
  mouseStartX = e.clientX;
  mouseStartY = e.clientY;
  mouseStartTime = Date.now();
  mouseSwipeFired = false;
});

canvas.addEventListener('mousemove', e => {
  if (state !== 'play' || briefing || introCard || archiveCard || mouseSwipeFired) return;
  const dx = e.clientX - mouseStartX;
  const dy = e.clientY - mouseStartY;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) {
    if (dx < 0 && player.targetLane > 0) player.targetLane--;
    if (dx > 0 && player.targetLane < 2) player.targetLane++;
    mouseSwipeFired = true;
    if (tutorial) {
      if (dx > 0 && tutorial.step === 0) tutorial.step = 1;
      else if (dx < 0 && tutorial.step === 1) { localStorage.setItem('ss_tutorial', '1'); tutorial = null; }
    }
  }
});

let suppressClick = false;
canvas.addEventListener('mouseup', e => {
  mouseSwipeFired = false;
  const dx = e.clientX - mouseStartX, dy = e.clientY - mouseStartY;
  if (state === 'intro' && Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
    if (dx < 0) cineNext(); else cinePrev();
    suppressClick = true;
  }
});

canvas.addEventListener('click', e => {
  if (suppressClick) { suppressClick = false; return; } // kaydırmanın ardından gelen tıklamayı yut
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  const my = (e.clientY - rect.top)  * (H / rect.height);

  if (state === 'intro') {
    // Skip button: top right
    if (mx > W - 100 && my < 56) { endCinematic(); return; }
    // Anywhere else advances panel
    cineNext(); return;
    return;
  }

  if (state === 'gameover') {
    const b = GAMEOVER_BTNS.find(b => inBtn(b, mx, my));
    if (b) { Sound.sfx.click(); if (b.act === 'retry') startLevel(currentLevel); else state = 'map'; }
    return;
  }

  if (state === 'paused') {
    const b = PAUSE_BTNS.find(b => inBtn(b, mx, my));
    if (!b) return;
    Sound.sfx.click();
    if (b.act === 'resume') state = 'play';
    else if (b.act === 'retry') startLevel(currentLevel);
    else if (b.act === 'map') state = 'map';
    else if (b.act === 'music') Sound.toggleMusic();
    else if (b.act === 'sfx') { Sound.toggleSfx(); Sound.sfx.click(); }
    return;
  }

  if (state === 'menu') {
    // Sol / sağ ok (kart kenarının dışı)
    if (mx < 48 && my > CARD.y && my < CARD.y + CARD.h) { menuIdx = Math.max(0, menuIdx - 1); return; }
    if (mx > W - 48 && my > CARD.y && my < CARD.y + CARD.h) { menuIdx = Math.min(MENU_CARDS.length - 1, menuIdx + 1); return; }
    // Ses butonu (sol alt)
    if (mx < 60 && my > H - 40) { Sound.toggle(); Sound.sfx.click(); return; }
    // RESET (yalnızca DEV modunda, iki dokunuşla): tüm ilerlemeyi ve açıklamaları sıfırlar
    if (devMode && mx > W - 112 && mx < W - 58 && my > H - 36) {
      Sound.sfx.click();
      if (resetConfirmT > 0) {
        ['ss_levels', 'ss_zones', 'ss_complete', 'ss_seen', 'ss_tutorial'].forEach(k => { try { localStorage.removeItem(k); } catch(e) {} });
        seenIntro = {};
        MENU_CARDS.forEach((c, i) => { c.locked = i > 0; });
        resetConfirmT = 0; resetDoneT = 120;
      } else resetConfirmT = 150;
      return;
    }
    // DEV butonu (sağ alt)
    if (mx > W - 52 && my > H - 36) {
      devMode = !devMode;
      levelStates = devMode ? levelStates.map(() => 'unlocked') : loadLevelStates();
      if (!devMode) { // kayıtlı ilerlemeye dön (DEV sırasında açılan bölge kartları kilitlensin)
        const zl = loadZoneUnlocked();
        MENU_CARDS.forEach((c, i) => { c.locked = zl[i] && !(i > 0 && levelStates[i * 5] !== 'locked'); });
      }
      return;
    }
    // OYNA butonu (merkez kart, kilitli değilse)
    if (!isZoneLocked(menuIdx)) {
      const py = CARD.y + CARD_PLAY.dy;
      if (Math.abs(mx - W / 2) < CARD_PLAY.w / 2 && my > py && my < py + CARD_PLAY.h) { Sound.sfx.click(); currentZone = menuIdx + 1; state = 'map'; return; }
    }
    return;
  }

  if (state === 'levelcomplete' && victoryTime > RESULT_BTN_AT) {
    if (inBtn(RESULT_BTN, mx, my)) {
      Sound.sfx.click();
      returnToMap = false;
      if (levelCompleteType === 'clear') { state = 'map'; return; }
      const zone = Math.ceil(currentLevel / 5);
      if (zone >= 1 && zone <= 3) {
        zoneTransIdx = zone - 1;
        zoneTransAlpha = 0;
        zoneTransPhase = 'fadein';
        state = 'zonetransition';
      } else {
        startCinematic(ENDING_PANELS); // final boss → kapanış hikâyesi
      }
      return;
    }
  }

  if (state === 'zonetransition' && zoneTransPhase === 'show') {
    exitZoneTransition(); return;
  }

  if (state === 'play' && introCard) {
    if (introCard.t > 15 && introBtn && inBtn(introBtn, mx, my)) closeIntroCard();
    return;
  }
  if (state === 'play' && archiveCard) { closeArchiveCard(); return; }
  if (state === 'play' && briefing) {
    // Talimat kartı: START başlatır; kartın dışı ve sol üstteki MAP haritaya döner
    if (briefBtn && inBtn(briefBtn, mx, my)) { Sound.sfx.click(); beginLevelPlay(); }
    else if (briefCard && !inBtn(briefCard, mx, my)) { Sound.sfx.click(); briefing = false; state = 'map'; }
    return;
  }
  if (state === 'play') {
    // Durdurma butonu (sol üst)
    if (mx < 48 && my < HUD_H) { Sound.sfx.click(); state = 'paused'; return; }
    if (convoyOn()) { toggleFire(); return; } // L9: dokunuş ateşi açar / keser
    if (currentLevel === 10) { useTitanBomb(); return; } // L10: dokunuş bomba atar
  }

  if (state === 'map') {
    if (mapPress) return;
    // Geri (sol üst)
    if (mx < 100 && my < 56) { Sound.sfx.click(); state = 'menu'; return; }
    for (let i = 0; i < 5; i++) {
      const R = mapNodeRect(i), li = (currentZone - 1) * 5 + i;
      if (mx > R.x && mx < R.x + R.w && my > R.y && my < R.y + R.h) {
        if (levelStates[li] === 'locked') return;
        Sound.sfx.click();
        mapPress = { i, lv: li + 1, t: 0 }; // kısa büyüme + parlama, ardından başlar
        return;
      }
    }
  }
});

  bullets = []; eBullets = []; enemies = []; explosions = []; shards = []; powerups = [];

  boss = null; bossKillTimer = 0; returnToMap = false;
  lasers = []; deathCause = '';
  countdown = 0; levelPlayT = 0; toasts = []; tipPlan = []; pendingEnemies = []; snakes = []; snakeT = 300; sweepT = 120; burstT = 160; lastWaveSeen = 1; gunT = 99999; linkT = 300; hunT = 420; runnerDone = false; slowMoT = 0; formOn = false; formGap = -1; hurtFx = 0; bossWarn = 0; crystalFly = []; crystalPulse = 0; introCard = null; // ilk bağlı çift / Hunter ~3 sn sonra
  briefing = !!LEVEL_BRIEFS[level];

// --- Spawn helpers ---
function spawnEnemy(yOffset = 0) {
  // Block lanes occupied by enemies or asteroids near the top
  // stack: aynı şeritte üst üste düşman (öndekiyle en az bu kadar px aralık); yoksa şeritte tek düşman
  const stackCfg = getLevelConfig(), stack = stackCfg && stackCfg.stack;
  const occupied = new Set(enemies.filter(e => !stack || e.y < stack).map(e => e.lane));
  if (currentLevel === 11) nebMines.forEach(m => { if (m.y < NEB_MINE_GAP) occupied.add(m.lane); }); // L11: mayının hemen arkasından gemi gelmesin (kaçıp geri dönmeye vakit kalsın)
  enemies.forEach(e => { if (e.burster) occupied.add(e.lane); }); // mor Burster'ın şeridine başka gemi girmesin (kullanıcı kararı)
  asteroids.forEach(a => {
    if (a.y < H * 0.42) {
      LANE_CENTERS.forEach((lc, li) => { if (Math.abs(a.x - lc) < LANE_W * 0.65) occupied.add(li); });
    }
  });
  const free = [0, 1, 2].filter(l => !occupied.has(l));
  if (free.length === 0) return;

  let lane = free[Math.floor(Math.random() * free.length)];
  if (currentLevel === 14 && free.includes(streamLane) && Math.random() < (getLevelConfig().stream || {}).bias) lane = streamLane; // düşman da akışı sever
  const cfg  = getLevelConfig();
  const hp    = cfg ? cfg.hp()    : getEnemyHp();
  const speed = cfg ? cfg.speed() : getEnemySpeed();
  const canShoot = cfg ? cfg.canShoot : true;
  const zigzag   = cfg ? cfg.zigzag   : false;
  const fireRate = Math.round((hp === 3 ? 180 : hp === 2 ? 110 : 140) * (cfg && cfg.fireMul || 1)); // fireMul<1: daha sık ateş
  // Black Hole: çekim düşmanı yolun ortasında komşu şeride savurur
  let shiftAt = null, shiftTo = lane;
  if (cfg && cfg.gravity && Math.random() < cfg.gravity) {
    shiftTo = lane === 0 ? 1 : lane === 2 ? 1 : (Math.random() < 0.5 ? 0 : 2);
    shiftAt = H * (0.18 + Math.random() * 0.22);
  }
  enemies.push({
    lane, x: LANE_CENTERS[lane], y: -40 - yOffset, w: 38, h: 44,
    hp, maxHp: hp, speed, flash: 0,
    fireTimer: Math.floor(Math.random() * fireRate), fireRate,
    canShoot,
    zigzag, zigzagPhase: Math.random() * Math.PI * 2,
    phantom: !!(cfg && cfg.phantom && Math.random() < cfg.phantom),
    cloakCfg: (cfg && cfg.cloak) || { vis: 90, inv: 40 },
    cloakT: Math.floor(Math.random() * 60), alpha: 1,
    shiftAt, shiftTo, curveShots: !!(cfg && cfg.curveShots), shift2: cfg && cfg.shift2 ? cfg.shift2 : 0,
    diver: !!(cfg && cfg.diver && Math.random() < cfg.diver), diveAt: H * (0.2 + Math.random() * 0.18), diveState: 0,
    armor: (cfg && cfg.armor) || 1,
    splitter: false,
  });

// Oyuncuya hasar — kalkan varsa emer
function damagePlayer(cause) {
  if (player.dead) return;
  if (player.invuln > 0) return; // hasar sonrası kısa dokunulmazlık: 5'li seri tek hatada birden çok can almasın
  if (player.shieldTimer > 0) { player.flash = 20; Sound.sfx.shield(); return; }
  Sound.sfx.hurt();
  hurtFx = 26;
  try { if (navigator.vibrate) navigator.vibrate(60); } catch(e) {} // Android: kısa titreşim
  lives--;
  player.flash = 50; player.invuln = 60;
  if (lives <= 0) {
    deathCause = cause;
    player.dead = true;
    spawnExplosion(player.x, player.y, true);
    spawnExplosion(player.x + 15, player.y - 10, true);
    spawnExplosion(player.x - 15, player.y + 5, true);
  }
}

// Oyuncunun şu an bulunduğu şerit (kayma sırasında en yakın şerit)
function playerLaneNow() {
  let best = 0;
  LANE_CENTERS.forEach((lc, i) => { if (Math.abs(player.x - lc) < Math.abs(player.x - LANE_CENTERS[best])) best = i; });
  return best;
}

  const pts = [[0, 44], [40, 12], [70, 36], [100, -34], [118, -34], [126, 22], [165, 48], [188, -66], [204, -66], [212, 30], [250, 52], [284, -12], [300, -12], [320, 38], [360, 20], [390, 46]];

function spawnSlalomScout(lane, y) {

    lane, x: LANE_CENTERS[lane], y, w: 38, h: 44,
    hp: 1, maxHp: 1, speed: slalomSpd, flash: 0,
    fireTimer: 0, fireRate: 999, canShoot: false,

function updateSlalom(w) {
  if (!slalomSpd) { slalomSpd = w.spd; slalomWait = w.every; }
  slalomSpd += (w.spd - slalomSpd) * 0.02; // dalga değişince saha yumuşakça hızlanır
  asteroids.forEach(a => { if (a.sl) a.speed = slalomSpd; });
  enemies.forEach(e => { if (e.sl) e.speed = slalomSpd; });
  asteroidSpawnTimer++;
  // Yol dışı gemi: boşluğun yanındaki şeritte, hemen arkasında demir kaya var (slalomPin): vur, kaya gelmeden boşluğa kaç.
  // Bu kapıdan oraya bir hamlede gidilir; kapı aralığı açık olduğu için hem vurmaya hem dönmeye vakit kalır
  if (asteroidSpawnTimer === Math.floor(slalomWait * 0.8) && slalomChase) {
    const ls = [0, 1, 2].filter(l => Math.abs(l - slalomNext) === 1 && Math.abs(l - slalomGap) <= 1);
    if (ls.length) { slalomPin = ls[Math.floor(Math.random() * ls.length)]; spawnSlalomScout(slalomPin, -46); }
  }
  if (asteroidSpawnTimer < slalomWait) return;
  asteroidSpawnTimer = 0;
  slalomGap = slalomNext;
  slalomShort = !slalomShort && Math.random() < w.dbl; // çift kapı: bir sonraki kapı erken gelir
  slalomChase = !slalomShort && Math.random() < w.chase; // yol dışı gemi varsa kapı aralığı açılır: git, vur, dön mümkün olsun
  slalomWait = slalomShort ? Math.max(24, Math.round(w.every * 0.7)) : slalomChase ? Math.max(w.every, 56) : w.every;
  slalomNext = pickSlalomGap(slalomGap, w, slalomShort);
  const others = [0, 1, 2].filter(l => l !== slalomGap).sort(() => Math.random() - 0.5);
  const lanes = slalomPin >= 0 || Math.random() < w.two ? others : others.slice(0, 1);
  // Tek büyük kaya: yan yana iki kapalı şeridin ortasında, ikisini birden kapatır
  const bigRock = lanes.length === 2 && Math.abs(lanes[0] - lanes[1]) === 1 && !slalomShort && Math.random() < w.big;
  if (bigRock) {
    const a = spawnAsteroid('iron', LANE_W * (Math.max(lanes[0], lanes[1])));
    a.size = 56; a.y = -a.size - 10; a.speed = slalomSpd; a.sl = true; a.hitH = 50; // yatık durur, iki şeridi kaplar
    a.rotation = (Math.random() - 0.5) * 0.3; a.rotSpeed = 0;
  } else lanes.forEach((l, i) => {
    const brk = i > 0 && l !== slalomPin && Math.random() < w.brk;
    const a = spawnAsteroid(brk ? 'normal' : 'iron', LANE_CENTERS[l]);
    a.size = brk ? 22 : 26; // 24: kırılınca parçalanmaz (hızlı parça şeritte haksız olur)
    a.y = -a.size - 10; a.speed = slalomSpd; a.sl = true; a.rotSpeed = brk ? 0.02 : 0.01;
    if (brk) a.hp = a.maxHp = 2;
  });
  slalomPin = -1;
  if (lanes.includes(0)) addSlalomFiller(14);
  if (lanes.includes(2)) addSlalomFiller(W - 14);
  if (!bigRock && lanes.includes(0) && lanes.includes(1)) addSlalomFiller(LANE_W);
  if (!bigRock && lanes.includes(1) && lanes.includes(2)) addSlalomFiller(LANE_W * 2);
  const half = w.every * slalomSpd / 2; // iki kapının ortası
  if (Math.random() < w.scout) spawnSlalomScout(slalomGap, -46);
  if (w.cargo && !runnerDone && spawnRunner()) {
    const e = enemies[enemies.length - 1];
    e.lane = slalomGap; e.x = LANE_CENTERS[slalomGap]; e.shiftTo = slalomGap; e.y = -half; e.speed = slalomSpd; e.sl = true;
    runnerDone = true;
  }
}

// L7 Sızma. every: tarama aralığı · spd: kaya hızı · decoy: iki tarama arasında engel kaya.

const STEALTH_WAVES = [

const SCAN_SPD = 12, SCAN_WARN = 70, SHADOW_LEN = 190, SHELTER_GAP = 120; // tarama geçerken sığınak oyuncunun 120 px üstünde

function updateStealth(w) {

function inRockShadow() {
  return asteroids.some(a => a.amb && Math.abs(a.x - player.x) < 48 && a.y < player.y && player.y - a.y < SHADOW_LEN);
}
function spawnAlarmRammer() {
  const lane = playerLaneNow();
  enemies.push({
    lane, x: LANE_CENTERS[lane], y: -40, w: 38, h: 44, hp: 2, maxHp: 2, speed: 5, flash: 0,
    fireTimer: 0, fireRate: 999, canShoot: false, zigzag: false, zigzagPhase: 0, phantom: false, cloakCfg: { vis: 90, inv: 40 }, cloakT: 0, alpha: 1,
    shiftAt: null, shiftTo: lane, curveShots: false, shift2: 0, rammer: true, rState: 'fall', ramAt: H * 0.08,

}
function updateScans() {
  if (alarmFx > 0) alarmFx--;
  stealthScans.forEach(c => {
    c.t--;
    if (c.t <= 0 && !c.done) {
      c.done = true;
      if (!player.dead && !inRockShadow()) { alarmFx = 40; showToast('ALARM', '#ff4d66', 70); Sound.sfx.hit(); spawnAlarmRammer(); }
    }

  stealthScans = stealthScans.filter(c => player.y - c.t * SCAN_SPD < H + 170);
}
// Karanlık + tarama ışığı + kaya gölgeleri (kayalardan önce çizilir)
// L7 görünüm: koyu maden, tepede tarayıcı ray, yumuşak kenarlı gerçek gölge (çizgisiz, uzaklaştıkça dağılır)
let shadowSprite = null;
function getShadowSprite() { // bir kez çizilir: üstte dar ve koyu, aşağı indikçe genişler, kenarı yumuşar, ucu söner
  if (shadowSprite) return shadowSprite;
  const SW = 150, TAIL = 50, c = document.createElement('canvas'); c.width = SW; c.height = SHADOW_LEN + TAIL;
  const g = c.getContext('2d');
  for (let y = 0; y < SHADOW_LEN + TAIL; y++) { // güvenli bölge sonuna kadar koyu, sonrası (TAIL) yavaşça söner
    const t = Math.min(1, y / SHADOW_LEN), core = 30 + 10 * t, soft = 6 + 30 * t + Math.max(0, y - SHADOW_LEN) * 0.4;
    const a = (0.94 - 0.3 * t) * (y > SHADOW_LEN ? 1 - (y - SHADOW_LEN) / TAIL : 1) * Math.min(1, y / 6);
    const lg = g.createLinearGradient(SW / 2 - core - soft, 0, SW / 2 + core + soft, 0), e = soft / (2 * (core + soft));
    lg.addColorStop(0, 'rgba(0,0,4,0)'); lg.addColorStop(e, `rgba(0,0,4,${a})`);
    lg.addColorStop(1 - e, `rgba(0,0,4,${a})`); lg.addColorStop(1, 'rgba(0,0,4,0)');
    g.fillStyle = lg; g.fillRect(0, y, SW, 1);
  }

}
function stealthScanState() { // k: ışığın gücü (0 yok · uyarıda artar · 1 tarama), y: ışığın ön kenarı
  const c = stealthScans[0], sweepAt = player.y / SCAN_SPD;
  if (!c || c.t >= sweepAt + SCAN_WARN) return null;
  if (c.t > sweepAt) return { warn: true, k: 1 - (c.t - sweepAt) / SCAN_WARN, y: null };
  return { warn: false, k: 1, y: player.y - c.t * SCAN_SPD };
}
function drawStealth() { // arka plan üstü, kayalar ve gemiden önce
  ctx.save();
  // karanlık: sadece geminin çevresi hafif aydınlık
  const v = ctx.createRadialGradient(player.x, player.y, 40, player.x, player.y, 330);
  v.addColorStop(0, 'rgba(2,3,10,0.35)'); v.addColorStop(1, 'rgba(2,3,10,0.82)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  const S = stealthScanState();
  if (S && !S.warn) { // tarama ışığı: arkasında kalan alan aydınlanır
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createLinearGradient(0, HUD_H, 0, S.y);
    g.addColorStop(0, 'rgba(255,226,150,0.04)'); g.addColorStop(0.75, 'rgba(255,226,150,0.12)'); g.addColorStop(1, 'rgba(255,236,180,0.38)');
    ctx.fillStyle = g; ctx.fillRect(0, HUD_H, W, Math.max(0, S.y - HUD_H));
    const e = ctx.createLinearGradient(0, S.y - 6, 0, S.y + 26);
    e.addColorStop(0, 'rgba(255,245,215,0.7)'); e.addColorStop(1, 'rgba(255,245,215,0)');
    ctx.fillStyle = e; ctx.fillRect(0, S.y - 6, W, 32);
    ctx.globalCompositeOperation = 'source-over';
  }
  // tepede tarayıcı ray: lambalar boştayken sönük kırmızı, uyarıda yanıp söner, taramada beyaz
  const ry = HUD_H + 4;
  ctx.fillStyle = '#0d0b0a'; ctx.fillRect(0, ry, W, 12);
  ctx.fillStyle = '#2a2420'; ctx.fillRect(0, ry + 10, W, 2);
  const pulse = 0.5 + 0.5 * Math.sin(frameCount * 0.35);
  for (let i = 0; i < 7; i++) {
    const x = W * (i + 0.5) / 7;
    const lit = !S ? 0 : S.warn ? S.k * pulse : 1;
    ctx.fillStyle = lit > 0.05 ? `rgba(255,240,${Math.round(170 + 60 * lit)},${0.35 + 0.65 * lit})` : 'rgba(150,30,30,0.6)';
    ctx.fillRect(x - 9, ry + 3, 18, 5);
    if (lit > 0.05) {
      const h = ctx.createRadialGradient(x, ry + 8, 2, x, ry + 8, 40 * lit + 10);
      h.addColorStop(0, `rgba(255,236,170,${0.5 * lit})`); h.addColorStop(1, 'rgba(255,236,170,0)');
      ctx.fillStyle = h; ctx.fillRect(x - 50, ry - 40, 100, 100);
    }

}
function drawStealthShadows() { // gemi ve kayalardan sonra: gölgeye giren gemi kararır

  ctx.save(); ctx.globalAlpha = fade;
  asteroids.forEach(a => {
    if (!a.amb || a.y < -30 || a.y > player.y + 60) return;
    ctx.drawImage(spr, a.x - spr.width / 2, a.y + 6);
  });
  ctx.restore();
  // gölge kayanın altında kalsın: sığınak kayaları gölgenin üstüne yeniden çizilir (gemi yine gölgede kararır)
  asteroids.forEach(a => { if (a.amb && a.y > -30 && a.y < player.y + 60) drawAsteroid(a); });
}
function drawAlarmFx() {

  ctx.fillStyle = `rgba(255,34,68,${alarmFx / 40 * 0.3})`; ctx.fillRect(0, 0, W, H);
}

// L8 Maden Tüneli. spd: akış hızı · run: düz yol boyu (px) · turn: iki şeridin de açık olduğu dönüş boyu (px)
// fork: dönüşte yol eski şeritte de devam edebilir (hangi şeridin kapandığına bak) · jump: üç şeridin açıldığı uzun dönüş
// ship / door: düz yolda gemi ve kırılır kaya olasılığı · cargo: bu dalgada kargo
const TUNNEL_WAVES = [
  { spd: 4.8, run: [240, 320], turn: 170, fork: 0,   jump: 0,   ship: 0.4,  door: 0.2 },
  { spd: 5.4, run: [200, 280], turn: 150, fork: 0.2, jump: 0.1, ship: 0.5,  door: 0.3 },
  { spd: 5.8, run: [180, 250], turn: 140, fork: 0.3, jump: 0.15, ship: 0.5, door: 0.3, cargo: true },
  { spd: 5.2, run: [260, 340], turn: 150, fork: 0.5, jump: 0.2, ship: 0.3,  door: 0.5 },
  { spd: 6.6, run: [150, 210], turn: 135, fork: 0.35, jump: 0.2, ship: 0.5, door: 0.3 },
];
let tunnelSegs = [], tunnelLane = 1, tunnelSpd = 0, tunnelCargo = false;
function tunnelAt(y) { return tunnelSegs.find(g => y >= g.y && y < g.y + g.h); }
function addTunnelSeg(open, h) {
  const top = tunnelSegs.length ? tunnelSegs[tunnelSegs.length - 1].y : H;
  const g = { y: top - h, h, open, seed: Math.floor(Math.random() * 1000) };
  tunnelSegs.push(g);
  return g;
}
function tunnelFill(g, w) { // düz yolun ortasına gemi / kırılır kaya
  const lane = g.open[0], y = g.y + g.h * 0.4;
  if (w.cargo && !tunnelCargo && spawnRunner()) {
    const e = enemies[enemies.length - 1];
    e.lane = lane; e.x = LANE_CENTERS[lane]; e.shiftTo = lane; e.y = y; e.speed = tunnelSpd; e.sl = true;
    tunnelCargo = true; runnerDone = true;
  } else if (Math.random() < w.ship) {
    spawnSlalomScout(lane, y);
    enemies[enemies.length - 1].speed = tunnelSpd;
  } else if (Math.random() < w.door) {
    const a = spawnAsteroid('normal', LANE_CENTERS[lane]);
    a.size = 22; a.y = y; a.speed = tunnelSpd; a.sl = true; a.rotSpeed = 0.02; a.hp = a.maxHp = 2;
  }
}
function updateTunnel(w, ending) {
  if (!tunnelSpd) { tunnelSpd = w.spd; addTunnelSeg([0, 1, 2], 420); addTunnelSeg([0, 1, 2], 260); addTunnelSeg([1], 300); }
  tunnelSpd += (w.spd - tunnelSpd) * 0.02;
  tunnelSegs.forEach(g => { g.y += tunnelSpd; });
  asteroids.forEach(a => { if (a.sl) a.speed = tunnelSpd; });
  enemies.forEach(e => { if (e.sl) e.speed = tunnelSpd; });
  tunnelSegs = tunnelSegs.filter(g => g.y < H + 20);
  // Yol ekranın üstünde önceden üretilir
  while (tunnelSegs.length && tunnelSegs[tunnelSegs.length - 1].y > -120) {
    if (ending) { addTunnelSeg([0, 1, 2], 400); continue; }
    const cur = tunnelLane, opts = [cur - 1, cur + 1].filter(l => l >= 0 && l <= 2);
    const next = opts[Math.floor(Math.random() * opts.length)];
    if (cur !== 1 && Math.random() < w.jump) { // uzun dönüş: karşı şeride kadar açılır
      addTunnelSeg([0, 1, 2], w.turn * 1.3); tunnelLane = 2 - cur;
    } else {
      addTunnelSeg([cur, next].sort(), w.turn);
      tunnelLane = Math.random() < w.fork ? cur : next; // çatal: iki şeritten biri kapanır
    }
    const g = addTunnelSeg([tunnelLane], w.run[0] + Math.random() * (w.run[1] - w.run[0]));
    tunnelFill(g, w);
  }
  // Duvara çarpma: gövdenin iki ucu da açık yolda olmalı
  if (player.dead) return;
  const inWall = [player.y - 24, player.y + 12].some(y => {
    const g = tunnelAt(y);
    if (!g) return false;
    const a = Math.min(...g.open) * LANE_W + 4, b = (Math.max(...g.open) + 1) * LANE_W - 4;
    return player.x - 16 < a || player.x + 16 > b;
  });
  if (inWall && !(player.invuln > 0)) {
    spawnExplosion(player.x, player.y - 20, true);
    damagePlayer('Hit the tunnel wall!');
    const g = tunnelAt(player.y - 60) || tunnelAt(player.y);
    if (g) { const l = playerLaneNow(); player.targetLane = g.open.reduce((m, o) => Math.abs(o - l) < Math.abs(m - l) ? o : m, g.open[0]); } // yola geri itilir
  }
}
// Duvarlar: kapalı şeritler koyu kaya, sana bakan ön kenarlar turuncu
function drawTunnel() {
  ctx.save();
  tunnelSegs.forEach((g, i) => {
    if (g.y > H || g.y + g.h < 0 || g.open.length === 3) return;
    const below = tunnelSegs[i - 1];
    for (let l = 0; l < 3; l++) {
      if (g.open.includes(l)) continue;
      const x = l * LANE_W;
      ctx.fillStyle = '#17100f'; ctx.fillRect(x, g.y, LANE_W, g.h + 1);
      ctx.fillStyle = '#231815';
      for (let k = 0; k < 5; k++) { // kaya dokusu (kayarken sabit kalır)
        const r = ((g.seed + l * 37 + k * 71) * 13) % 97 / 97, q = ((g.seed + l * 53 + k * 29) * 17) % 89 / 89;
        ctx.beginPath(); ctx.arc(x + 14 + r * (LANE_W - 28), g.y + 12 + q * Math.max(1, g.h - 24), 9 + r * 15, 0, Math.PI * 2); ctx.fill();
      }
      if (below && !below.open.includes(l)) continue;
      ctx.fillStyle = '#ff8a3c'; ctx.fillRect(x, g.y + g.h - 3, LANE_W, 4); // ön kenar: buraya girersen çarparsın
    }
    ctx.fillStyle = 'rgba(255,138,60,0.75)';
    const a = Math.min(...g.open) * LANE_W, b = (Math.max(...g.open) + 1) * LANE_W;
    if (a > 0) ctx.fillRect(a - 2, g.y, 3, g.h);
    if (b < W) ctx.fillRect(b - 1, g.y, 3, g.h);
  });
  ctx.restore();
}

// L8 Kovalayan Kazıcı. every: kaya sırası aralığı · hp: kırılır kayanın canı · two: iki kırılır kaya · drift: kazıcının yaklaşma hızı · back: temiz sırada geri düşme
const DIGGER_WAVES = [
  { spd: 4.6, every: 72, hp: 2, two: 0.5,  drift: 0.05, back: 10 },
  { spd: 5.2, every: 62, hp: 2, two: 0.3,  drift: 0.07, back: 9 },
  { spd: 5.6, every: 58, hp: 2, two: 0.2,  drift: 0.08, back: 8, cargo: true },
  { spd: 4.8, every: 70, hp: 3, two: 0.3,  drift: 0.06, back: 10 },
  { spd: 6.2, every: 52, hp: 2, two: 0.15, drift: 0.1,  back: 7 },
];
const DIG_START = H - 34, DIG_CATCH = 724, DIG_CRASH = 32; // kazıcının üst kenarı: başlangıç, oyuncuya ulaştığı yer, çarpınca yaklaşma
let digY = 0, digSpd = 0, digT = 0, digLane = 1, digCargo = false, digHeat = 0;
function updateDigger(w, ending) {
  if (!digSpd) { digSpd = w.spd; digY = DIG_START; digT = w.every - 40; showToast('THE DIGGER IS BEHIND YOU', '#ff8a3c', 130); }
  digSpd += (w.spd - digSpd) * 0.02;
  asteroids.forEach(a => { if (a.sl) a.speed = digSpd; });
  enemies.forEach(e => { if (e.sl) e.speed = digSpd; });
  if (digHeat > 0) digHeat--;
  if (ending) { digY = Math.min(H + 60, digY + 2.5); return; } // kazıcı geride kaldı
  digY -= w.drift;
  if (digY <= DIG_CATCH && !player.dead) {
    damagePlayer('Caught by the digger!');
    spawnExplosion(player.x, player.y + 20, true);
    digY = DIG_START;
  }
  if (++digT < w.every) return;
  digT = 0; digY = Math.min(DIG_START, digY + w.back);
  // Sıra: üç şerit de dolu, en az bir şeritte kırılır kaya var (önceki zayıf şeritten farklı)
  const opts = [0, 1, 2].filter(l => l !== digLane);

// L8 Dev Matkaplar. every: matkap aralığı · long: iki şerit uzanan matkap · pair: iki yandan birden · per: uzanıp çekilme süresi (kare)
// cross: art arda iki uzun matkap, hizaya gelince tam uzanmış: bir kenardan öbür kenara geçmek gerekir

const DRILL_WAVES = [

  { spd: 5.2, every: 66, long: 0.5,  pair: 0.25, cross: 0.18, per: 74, ship: 0.5 },
  { spd: 5.6, every: 60, long: 0.55, pair: 0.3,  cross: 0.25, per: 66, ship: 0.5, cargo: true },
  { spd: 4.8, every: 78, long: 0.6,  pair: 0.3,  cross: 0.38, per: 60, ship: 0.4 },
  { spd: 6.2, every: 52, long: 0.55, pair: 0.3,  cross: 0.32, per: 58, ship: 0.55 },

let drills = [], drillSpd = 0, drillT = 0, drillSide = 0, drillSame = 0, drillCargo = false, drillForce = false, drillSparks = [], mineWallY = 0;
const DRILL_OUT = 0.7; // döngünün %70'inde uzanıp çekilir, kalanında duvarda bekler (uyarı bu sırada)

}
function drillWarn(d) { const f = d.ph % 1; return f < DRILL_OUT ? 0 : (f - DRILL_OUT) / (1 - DRILL_OUT); }
function addDrill(side, reach, w) {
  drills.push({ y: -30, side, reach, per: w.per, ph: Math.random() });
}
function updateDrills(w, ending) {
  if (!drillSpd) { drillSpd = w.spd; drillT = w.every - 30; }
  drillSpd += (w.spd - drillSpd) * 0.02;
  asteroids.forEach(a => { if (a.sl) a.speed = drillSpd; });

  drills.forEach(d => {

      const dir = d.side === 0 ? 1 : -1, tip = (d.side === 0 ? 0 : W) + dir * (drillLen(d) + 16);
      drillSparks.push({ x: tip, y: d.y + (Math.random() - 0.5) * 16, vx: dir * (1 + Math.random() * 3), vy: (Math.random() - 0.5) * 3 + drillSpd, life: 1 });
    }
  });
  mineWallY = (mineWallY + drillSpd) % 400;
  drillSparks = drillSparks.filter(p => { p.x += p.vx; p.y += p.vy; p.life -= 0.06; return p.life > 0; });
  drills = drills.filter(d => d.y < H + 40);
  if (!player.dead && !(player.invuln > 0)) for (const d of drills) {
    if (Math.abs(d.y - player.y) > 42) continue;
    const len = drillLen(d) + 16; // sivri uç
    if (d.side === 0 ? player.x - 16 < len : player.x + 16 > W - len) {

  drillT = 0;
  // Yan seçimi tekrara düşmesin: yarı yarıya aynı yandan (en fazla üç kez üst üste), çaprazın ikinci matkabı hep karşıdan
  if (drillForce) drillSide = 1 - drillSide;
  else if (drillSame < 2 && Math.random() < 0.5) drillSame++;
  else { drillSide = 1 - drillSide; drillSame = 0; }
  if (drillForce || Math.random() < w.cross) { // hizaya gelince tam uzanmış olur; hemen arkasından karşı taraftan bir tane daha
    addDrill(drillSide, 2.1, w); drills[drills.length - 1].ph = DRILL_OUT / 2 - ((player.y + 30) / drillSpd) / w.per + 2;
    drillForce = !drillForce; if (drillForce) drillT = Math.round(w.every * 0.25);
  } else if (Math.random() < w.pair) { addDrill(0, 1.1, w); addDrill(1, 1.1, w); }
  else addDrill(drillSide, Math.random() < w.long ? 2.1 : 1.1, w);

}
// Maden duvarları: bir kez çizilen kaya şeridi, oyun hızıyla aşağı akar
const MINE_WALL = 22;
let mineWallSprite = null;
function getMineWallSprite() {

  const g = c.getContext('2d');

  for (let y = 0; y <= 400; y += 20) g.lineTo(MINE_WALL - 4 + 8 * Math.abs(Math.sin(y * 0.37) * Math.cos(y * 0.11)) + (y % 40 ? 3 : 0), y);
  g.lineTo(0, 400); g.closePath(); g.fill();

function drawDrills() {
  ctx.save();
  drills.forEach(d => {
    if (d.y < -40) return;
    const len = drillLen(d), dir = d.side === 0 ? 1 : -1, x0 = d.side === 0 ? 0 : W, neck = x0 + dir * len, tip = neck + dir * 20; // uç çarpma alanıyla (len + 16) yaklaşık aynı
    const R = 14;
    if (len > 2) {
      // yuvarlak gövde: yukarıdan aşağı ışık

      ctx.restore();

      tg.addColorStop(0, '#ffc08a'); tg.addColorStop(0.45, '#ff8a3c'); tg.addColorStop(1, '#8a3812');
      ctx.fillStyle = tg; ctx.beginPath(); ctx.moveTo(neck, d.y - R - 4); ctx.lineTo(tip, d.y); ctx.lineTo(neck, d.y + R + 4); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(90,30,8,0.7)'; ctx.lineWidth = 2;

  });

  ctx.restore();
}

// iron: demir kaya oranı · rock: kaya hızı · n: aynı anda gemi · gold: bu dalganın ilk gemisi altın (hızlı kaçar, güçlü rozet)
const HAULER_WAVES = [

const BG_DIM = [0.12, 0.12, 0.15, 0.1]; // yeni arkaplanlar zaten koyu ve sade: hafif karartma yeter
function drawZoneBackdrop(zone) {

}

// --- Draw: Nebula sis katmanı ---
// İki katmanlı, yavaşça akan yumuşak sis dokusu (bir kez üretilir). Düşmanların üstünde, mermilerin altında çizilir;

let fogLayers = null, fogCompose = null;
function buildFogLayer(seed, hues) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  let r = seed;
  const rnd = () => (r = (r * 16807) % 2147483647) / 2147483647;
  for (let k = 0; k < 90; k++) {
    const x = rnd() * W, y = rnd() * H, rad = 40 + rnd() * 120;
    const hue = hues[Math.floor(rnd() * hues.length)], a = 0.08 + rnd() * 0.16;
    [0, -H, H].forEach(dy => { // dikeyde döşenebilir olsun
      const gr = g.createRadialGradient(x, y + dy, 0, x, y + dy, rad);
      gr.addColorStop(0, `hsla(${hue},60%,55%,${a})`); gr.addColorStop(1, `hsla(${hue},60%,40%,0)`);
      g.fillStyle = gr; g.fillRect(x - rad, y + dy - rad, rad * 2, rad * 2);
    });
  }
  return c;
}
function drawFog(density) {
  if (!fogLayers) {
    fogLayers = [buildFogLayer(7, [280, 300, 320]), buildFogLayer(91, [260, 290, 200])];
    fogCompose = document.createElement('canvas'); fogCompose.width = W; fogCompose.height = H;
  }
  const g = fogCompose.getContext('2d');
  g.globalCompositeOperation = 'source-over';
  g.clearRect(0, 0, W, H);
  [[fogLayers[0], 0.35, 0], [fogLayers[1], 0.6, 1]].forEach(([L, spd, k]) => {
    // Tam sayı konum: iki kopyanın birleştiği yerde çizgi kalmasın
    const oy = Math.floor((frameCount * spd) % H), ox = Math.round(Math.sin(frameCount * 0.004 + k * 2) * 18);
    g.drawImage(L, ox, oy - H); g.drawImage(L, ox, oy);
  });
  // Alt bölgede sis kaybolur
  g.globalCompositeOperation = 'destination-out';
  const m = g.createLinearGradient(0, H * 0.55, 0, H * 0.78);
  m.addColorStop(0, 'rgba(0,0,0,0)'); m.addColorStop(1, 'rgba(0,0,0,1)');
  g.fillStyle = m; g.fillRect(0, H * 0.55, W, H * 0.45);
  ctx.save();
  // Yoğunluk: 0.3 hafif pus … 0.7 kalın sis (iki kat çizilir)
  ctx.globalAlpha = Math.min(1, density * 1.8);
  ctx.drawImage(fogCompose, 0, 0, W, H);
  if (density > 0.6) { ctx.globalAlpha = (density - 0.6) * 6; ctx.drawImage(fogCompose, 0, 0, W, H); }
  ctx.restore();
}

function updateStormClouds(S, ending) {

function drawStormClouds() { // düşmanların üstünde, düşman mermilerinin ve oyuncunun altında

function updateStorm(S, ending) {

    stormT = 0;
    const r = Math.random();
    if (r < S.chain) {
      const order = Math.random() < 0.5 ? [0, 1, 2] : [2, 1, 0];
      order.forEach((lane, k) => bolts.push({ lane, t: -k * STORM_CHAIN, warn: S.warn, fire: S.fire, seed: Math.random() * 99 }));
    } else {
      const two = r < S.chain + S.dblB;
      const hz = hazardWindows();
      const freeDuring = l => !hz.some(h => h.lane === l && h.t0 < S.warn + S.fire + WALL_MARGIN && h.t1 > S.warn - WALL_MARGIN);
      let combos = two ? [[0, 1], [0, 2], [1, 2]] : [[0], [1], [2]];
      if (!two && stormLast >= 0) combos = combos.filter(c => c[0] !== stormLast || Math.random() < 0.35); // aynı şerit üst üste az

let stormCloudSprite = null;

function boltPath(x, top, bot, seed) { // kırık şimşek çizgisi: birkaç karede bir şekil değişir
  let s2 = seed + Math.floor(frameCount / 3) * 13.7;
  const rnd = () => { s2 = (s2 * 9301 + 49297) % 233280; return s2 / 233280; };
  const pts = [[x, top]], n = 14;
  for (let i = 1; i < n; i++) pts.push([x + (rnd() - 0.5) * 34, top + (bot - top) * i / n]);
  pts.push([x + (rnd() - 0.5) * 10, bot]);

        px[i] = R; px[i + 1] = G; px[i + 2] = B; // Uint8ClampedArray kırpar
      }
      g.putImageData(d, 0, 0);
    } catch (err) { /* okunamazsa orijinal görsel */ }
    neonSprites[key] = c;
  }
  return neonSprites[key];
}
// Hayaletlerin dış hattı: gemi görselinin açık mor siluet kopyası
const phantomOutlines = {};
function getPhantomOutline(img, key) {
  if (!img || !img.complete || !img.naturalWidth) return null;
  if (!phantomOutlines[key]) {
    const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
    const g = c.getContext('2d');
    g.drawImage(img, 0, 0);
    g.globalCompositeOperation = 'source-atop';
    g.fillStyle = '#d9c2ff'; g.fillRect(0, 0, c.width, c.height);
    phantomOutlines[key] = c;
  }
  return phantomOutlines[key];
}

// --- Draw: Zone 4 Background (Black Hole) ---
function drawZone4Background() {
  ctx.fillStyle = '#030208';
  ctx.fillRect(0, 0, W, H);
  const bx = W / 2, by = 150;
  // Yıldızlar kara deliğe doğru hafifçe kıvrılır
  ctx.save();
  stars.forEach(s => {
    const dx = s.x - bx, dy = s.y - by;
    const d = Math.hypot(dx, dy);
    const pull = Math.min(0.35, 2200 / (d * d + 1));
    const sx = s.x - dx * pull, sy = s.y - dy * pull;
    ctx.fillStyle = `rgba(255,${200 + s.spd * 20},${170 + s.spd * 40},${0.3 + s.spd * 0.18})`;
    ctx.beginPath(); ctx.arc(sx, sy, s.s, 0, Math.PI * 2); ctx.fill();
  });
  ctx.restore();
  // Dış parıltı
  const halo = ctx.createRadialGradient(bx, by, 40, bx, by, 230);
  halo.addColorStop(0, 'rgba(255,120,40,0.28)');
  halo.addColorStop(0.4, 'rgba(160,40,120,0.12)');
  halo.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = halo; ctx.fillRect(0, 0, W, H);
  // Dönen yığılma diski
  ctx.save();
  ctx.translate(bx, by);
  for (let i = 0; i < 4; i++) {
    const rot = frameCount * (0.004 + i * 0.002) + i;
    ctx.strokeStyle = `rgba(255,${150 - i * 25},${60 + i * 20},${0.5 - i * 0.09})`;
    ctx.lineWidth = 7 - i * 1.3;
    ctx.beginPath(); ctx.ellipse(0, 0, 92 + i * 16, 20 + i * 5, -0.18, rot, rot + Math.PI * 1.6); ctx.stroke();
  }
  // Olay ufku
  ctx.fillStyle = '#000';
  ctx.shadowColor = 'rgba(255,140,60,0.9)'; ctx.shadowBlur = 24;
  ctx.beginPath(); ctx.arc(0, 0, 44, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,200,140,0.75)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, 0, 46, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

// --- Draw: Void Leader lazerleri ---
function drawLasers() {
  lasers.forEach(L => {
    const x = LANE_CENTERS[L.lane];
    const top = boss ? boss.y + 40 : HUD_H;
    if (L.meteor && L.t > L.warn) return; // meteorların kendisi çizilir
    ctx.save();
    if (L.t <= L.warn) {
      // Uyarı: yanıp sönen şerit + ünlem
      const blink = Math.floor(L.t / 6) % 2 === 0;
      ctx.fillStyle = `rgba(255,34,68,${blink ? 0.16 : 0.07})`;
      ctx.fillRect(x - LANE_W / 2 + 6, top, LANE_W - 12, H - top);
      ctx.strokeStyle = 'rgba(255,77,102,0.7)'; ctx.lineWidth = 1.5; ctx.setLineDash([8, 8]);
      ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, H); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#ff4d66'; ctx.font = `700 28px ${TEXT_FONT}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      if (blink) ctx.fillText('!', x, H - 230);
    } else {
      // Işın
      const k = 1 - (L.t - L.warn) / L.fire;
      const w = 34 * (0.4 + 0.6 * k);

    }

}

// --- Kaya görselleri: 3 boyut × 3 çeşit; tipler renklendirilmiş kopyalarla ayrılır ---
const ROCK_CLASSES = ['small', 'medium', 'large'];
const rockImgs = {};
ROCK_CLASSES.forEach(c => { rockImgs[c] = [1, 2, 3].map(n => { const im = new Image(); im.src = `ASSETS/rocks/rock-${c}-${n}.png`; return im; }); });
const ROCK_TINTS = { iron: '#8aa2bb', explosive: '#ff2a10', debris: '#a070e0' };
const rockSprites = {};
function getRockSprite(cls, idx, tint) {
  const img = rockImgs[cls][idx];
  if (!img.complete || !img.naturalWidth) return null;
  if (!tint) return img;
  const key = `${cls}${idx}${tint}`;
  if (!rockSprites[key]) {
    const c = document.createElement('canvas');
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    const g = c.getContext('2d');
    g.drawImage(img, 0, 0);
    g.globalCompositeOperation = 'color';          // gölgelendirme korunur, renk değişir
    g.fillStyle = ROCK_TINTS[tint]; g.fillRect(0, 0, c.width, c.height);
    g.globalCompositeOperation = 'destination-in'; // şeffaf alanları geri getir
    g.drawImage(img, 0, 0);
    rockSprites[key] = c;
  }
  return rockSprites[key];
}

// --- Draw: Asteroid ---
function drawAsteroid(a) {
  if (a.meteor) {
    // Meteor: arkasında alev izi
    const tg = ctx.createLinearGradient(a.x, a.y - 110, a.x, a.y);
    tg.addColorStop(0, 'rgba(255,90,20,0)'); tg.addColorStop(1, 'rgba(255,170,60,0.75)');
    ctx.fillStyle = tg;
    ctx.beginPath(); ctx.moveTo(a.x - a.size * 0.8, a.y); ctx.lineTo(a.x, a.y - 110); ctx.lineTo(a.x + a.size * 0.8, a.y); ctx.closePath(); ctx.fill();
  }

  // Görselli kaya
  const cls = a.size > 25 ? 'large' : a.size >= 17 ? 'medium' : 'small';
  if (a.spr == null) a.spr = Math.floor(Math.random() * 3);
  const tint = a.type === 'iron' ? 'iron' : a.type === 'explosive' ? 'explosive' : currentZone === 4 ? 'debris' : null;
  const spr = getRockSprite(cls, a.spr, tint);
  if (spr) {
    const long = a.size * 2.35;
    const k = long / Math.max(spr.width, spr.height);
    const dw = spr.width * k, dh = spr.height * k;
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.globalAlpha = a.flash > 0 ? (a.flash % 4 < 2 ? 0.45 : 1) : 1;
    if (a.type === 'explosive') {
      const pulse = 0.6 + 0.4 * Math.sin(frameCount * 0.2 + a.x);
      ctx.shadowColor = '#ff3a10'; ctx.shadowBlur = 22 * pulse;
    } else if (a.type === 'iron') {
      ctx.shadowColor = 'rgba(150,200,255,0.8)'; ctx.shadowBlur = 10;
    }
    ctx.save();
    ctx.rotate(a.rotation);
    ctx.drawImage(spr, -dw / 2, -dh / 2, dw, dh);
    ctx.restore();
    ctx.shadowBlur = 0;
    // Çok canlı kayalarda can barı
    if (a.type === 'normal' && a.maxHp > 1) {
      ctx.globalAlpha = 0.85;
      const bw = a.size * 1.2, bh = 4, bx = -bw / 2, by = a.size + 4;
      ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = '#ff9a40'; ctx.fillRect(bx, by, bw * (a.hp / a.maxHp), bh);
    }
    ctx.restore();
    return;
  }

  // Görseller yüklenmediyse çizimle yedekle
  ctx.save();
  ctx.translate(a.x, a.y);
  ctx.rotate(a.rotation);
  ctx.globalAlpha = a.flash > 0 ? (a.flash % 4 < 2 ? 0.35 : 1) : 1;
  const r = a.size;
  const n = a.shape.length;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const angle = (i / n) * Math.PI * 2 - Math.PI / 2;
    const pr = r * a.shape[i];
    if (i === 0) ctx.moveTo(Math.cos(angle) * pr, Math.sin(angle) * pr);
    else ctx.lineTo(Math.cos(angle) * pr, Math.sin(angle) * pr);
  }
  ctx.closePath();
  if (a.type === 'iron') {
    ctx.fillStyle = '#4a5a6a';
    ctx.strokeStyle = '#8899aa'; ctx.lineWidth = 2.5;
  } else if (a.type === 'explosive') {
    // Patlayıcı kaya: kızgın kırmızı, nabız gibi parlayan
    const pulse = 0.6 + 0.4 * Math.sin(frameCount * 0.2 + a.x);
    ctx.fillStyle = '#7a1a10';
    ctx.strokeStyle = `rgba(255,${90 + 60 * pulse},40,1)`; ctx.lineWidth = 2.5;
    ctx.shadowColor = '#ff4020'; ctx.shadowBlur = 14 * pulse;
  } else if (currentZone === 4) {
    // Kara deliğe çekilen enkaz: koyu metal, sıcak kenar
    ctx.fillStyle = '#3a2a40';
    ctx.strokeStyle = '#ff8a50'; ctx.lineWidth = 1.5;
  } else {
    ctx.fillStyle = '#7a5535';
    ctx.strokeStyle = '#9a7050'; ctx.lineWidth = 1.5;
  }
  ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0;
  if (a.type === 'explosive') {
    // Çatlaklardan sızan ışık
    ctx.strokeStyle = 'rgba(255,200,80,0.9)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-r * 0.4, -r * 0.1); ctx.lineTo(0, r * 0.15); ctx.lineTo(r * 0.35, -r * 0.25); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, r * 0.15); ctx.lineTo(r * 0.05, r * 0.45); ctx.stroke();
    ctx.restore();
    return;
  }
  // Highlight
  ctx.globalAlpha *= (a.type === 'iron' ? 0.45 : 0.55);
  ctx.fillStyle = a.type === 'iron' ? '#aabccc' : currentZone === 4 ? '#8a6a90' : '#c09060';
  ctx.beginPath(); ctx.arc(-r * 0.18, -r * 0.24, r * 0.22, 0, Math.PI * 2); ctx.fill();
  // Iron: warning X mark
  if (a.type === 'iron') {
    ctx.globalAlpha = 0.7;
    ctx.strokeStyle = '#ff6633'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-r*0.25, -r*0.25); ctx.lineTo(r*0.25, r*0.25); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r*0.25, -r*0.25); ctx.lineTo(-r*0.25, r*0.25); ctx.stroke();
  }
  // HP bar for destructible normal
  if (a.type === 'normal' && a.maxHp > 1) {
    ctx.globalAlpha = 0.8;
    const bw = r * 1.2, bh = 4, bx = -bw/2, by = r + 3;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = '#c09060'; ctx.fillRect(bx, by, bw * (a.hp / a.maxHp), bh);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

// --- Draw: Intro Cinematic ---
function drawIntro() {
  ctx.fillStyle = '#000008';
  ctx.fillRect(0, 0, W, H);
  const pImg = cinePanels === INTRO_PANELS ? INTRO_IMGS[introPanelIdx] : null;
  const hasImg = pImg && pImg.complete && pImg.naturalWidth > 0;
  if (hasImg) { // görsel panelle birlikte kararıp açılır; alt kısım metin için koyulaşır
    ctx.globalAlpha = introAlpha; ctx.drawImage(pImg, 0, 0, W, H); ctx.globalAlpha = 1;
    const sh = ctx.createLinearGradient(0, H * 0.42, 0, H * 0.62);
    sh.addColorStop(0, 'rgba(0,0,8,0)'); sh.addColorStop(1, 'rgba(0,0,8,0.75)');
    ctx.fillStyle = sh; ctx.fillRect(0, H * 0.42, W, H * 0.58);
  } else drawStars();

  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Sabit çerçeve: etiket, iki çizgi ve noktalar her panelde aynı yerde durur (sadece metin değişir)
  const isEnding = cinePanels === ENDING_PANELS;
  const col = isEnding ? '#ffd040' : '#3fd3ff';
  const top = Math.round(H * (hasImg ? 0.6 : 0.33)), bot = Math.round(H * (hasImg ? 0.86 : 0.67)); // görsel varsa metin altta
  const grd = ctx.createLinearGradient(40, 0, W - 40, 0);
  grd.addColorStop(0, 'rgba(255,255,255,0)'); grd.addColorStop(0.5, col); grd.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.strokeStyle = grd; ctx.lineWidth = 1; ctx.globalAlpha = 0.6;
  ctx.beginPath(); ctx.moveTo(40, top); ctx.lineTo(W - 40, top); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(40, bot); ctx.lineTo(W - 40, bot); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 12;
  drawSpaced(isEnding ? 'EPILOGUE' : 'PROLOGUE', W / 2, top - 30, 14, 700, UI_FONT, 5);
  ctx.shadowBlur = 0;
  const n = cinePanels.length, dg = 14;
  for (let k = 0; k < n; k++) {
    const dx = W / 2 + (k - (n - 1) / 2) * dg;
    ctx.fillStyle = k === introPanelIdx ? col : 'rgba(255,255,255,0.22)';
    ctx.beginPath(); ctx.arc(dx, bot + 36, k === introPanelIdx ? 3.5 : 2.5, 0, Math.PI * 2); ctx.fill();
  }

  // Panel metni — iki çizginin ortasında, sadece bu kısım yumuşakça geçiş yapar
  ctx.globalAlpha = introAlpha;
  const text = cinePanels[introPanelIdx];
  const isTheEnd = text === 'THE END';
  if (isTheEnd) {
    ctx.font = `700 34px ${UI_FONT}`;
    ctx.fillStyle = '#ffe040'; ctx.shadowColor = '#ff8'; ctx.shadowBlur = 24;
  } else {
    ctx.font = STORY_FONT;
    ctx.fillStyle = '#ffffff'; ctx.shadowColor = 'rgba(200,220,255,0.3)'; ctx.shadowBlur = 6;
  }
  ctx.textAlign = 'center'; // drawSpaced hizalamayı sola bırakır
  drawWrapped(text, W / 2, (top + bot) / 2, W - 80, isTheEnd ? 44 : STORY_LINE_H);
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;

  // Skip — sağ üst, haritadaki BACK ile aynı stil (metin + ok çizgisi)
  ctx.fillStyle = '#3fd3ff'; ctx.strokeStyle = '#3fd3ff'; ctx.lineWidth = 2;
  ctx.font = `700 13px ${TEXT_FONT}`;
  const skipW = ctx.measureText('SKIP').width + 3 * 2;

  ctx.restore();
}

// --- Draw: Ship ---
const SHIP_W = 90, SHIP_H = 90; // görsel boyutu (1024×1024 kare)

function drawShip(x, y) {
  ctx.save();
  ctx.translate(x, y);

  // Hasar yanıp sönme
  ctx.globalAlpha = player.flash > 0 ? (Math.sin(player.flash * 1.5) > 0 ? 0.25 : 1) : 1;

  // Overdrive: altın alev halesi
  if (overdriveTimer > 0) {
    const op = 0.6 + 0.4 * Math.sin(frameCount * 0.4);
    const og = ctx.createRadialGradient(0, 10, 10, 0, 10, 60);
    og.addColorStop(0, `rgba(255,200,60,${0.45 * op})`); og.addColorStop(1, 'rgba(255,140,0,0)');
    ctx.fillStyle = og; ctx.beginPath(); ctx.arc(0, 10, 60, 0, Math.PI * 2); ctx.fill();
  }

  // Motor alevleri
  const fl = 0.75 + 0.25 * Math.sin(frameCount * 0.6);
  [[-15, 22, 30], [0, 34, 44], [15, 22, 30]].forEach(([fx, fy, len]) => {
    const fg = ctx.createLinearGradient(0, fy, 0, fy + len * fl);
    fg.addColorStop(0, 'rgba(200,240,255,0.95)');
    fg.addColorStop(0.35, 'rgba(70,170,255,0.8)');
    fg.addColorStop(1, 'rgba(30,90,255,0)');
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.moveTo(fx - 4.5, fy); ctx.lineTo(fx + 4.5, fy); ctx.lineTo(fx, fy + len * fl); ctx.closePath(); ctx.fill();
  });

  // Spaceship görseli (altta)
  if (spaceshipImg.complete && spaceshipImg.naturalWidth > 0) {
    ctx.drawImage(spaceshipImg, -SHIP_W / 2, -SHIP_H / 2, SHIP_W, SHIP_H);
  }

  // Kalkan efekti (geminin üstünde, stroke yok)
  if (player.shieldTimer > 0) {
    const pulse = 0.6 + 0.4 * Math.sin(frameCount * 0.15);
    const shieldAlpha = Math.min(1, player.shieldTimer / 40) * pulse;
    // Halka: içi boş, kenarda yoğunlaşan gradient — net koruyucu balon hissi
    const sg = ctx.createRadialGradient(0, 0, 42, 0, 0, 62);
    sg.addColorStop(0,    `rgba(0, 180, 255, 0)`);
    sg.addColorStop(0.72, `rgba(0, 200, 255, ${shieldAlpha * 0.25})`);
    sg.addColorStop(0.88, `rgba(80, 220, 255, ${shieldAlpha * 0.75})`);
    sg.addColorStop(1,    `rgba(180, 240, 255, ${shieldAlpha * 0.55})`);
    ctx.globalAlpha = 1;
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.arc(0, 0, 62, 0, Math.PI * 2);
    ctx.fill();
    // parlak dış kenar + yavaş dönen altıgen ızgara
    ctx.strokeStyle = `rgba(150,230,255,${0.85 * shieldAlpha})`; ctx.lineWidth = 2;
    ctx.shadowColor = '#4fc8ff'; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(0, 0, 60, 0, Math.PI * 2); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.save(); ctx.rotate(frameCount * 0.01);
    ctx.strokeStyle = `rgba(150,230,255,${0.22 * shieldAlpha})`; ctx.lineWidth = 1;
    for (let k = 0; k < 6; k++) { const a = k / 6 * Math.PI * 2; ngonPath(Math.cos(a) * 44, Math.sin(a) * 44, 11, 6, 0); ctx.stroke(); }
    ctx.restore();
    // son 1.5 saniyede yanıp söner: bitmek üzere
    if (player.shieldTimer < 90 && Math.floor(player.shieldTimer / 8) % 2 === 0) { ctx.fillStyle = 'rgba(150,230,255,0.12)'; ctx.beginPath(); ctx.arc(0, 0, 60, 0, Math.PI * 2); ctx.fill(); }
  }

  ctx.globalAlpha = 1;
  ctx.restore();

    bossGlowCache[key] = { c, w: bw + pad * 2, h: bh + pad * 2 };
  }

// --- Draw: Boss ---
function drawBoss(b) {
  if (b.zone === 2) { drawTitan(b); return; }
  const sc    = b.special ? 1.45 : 1.0;
  const phase = b.phase || 1;
  const pulse = 0.6 + 0.4 * Math.sin(frameCount * (phase === 3 ? 0.22 : 0.07));
  const flashAlpha = b.flash > 0 ? (b.flash % 6 < 3 ? 0.25 : 1) : 1;

  // Faz renk paleti
  const palettes = {
    1: { aura1: '180,0,255', aura2: '100,0,200', wing: '#550099', wingGlow: '#9900cc', body: '#7700bb', bodyGlow: '#cc44ff', core1: '255,220,255', core2: '210,80,255', core3: '140,0,255', gun: '#ff99ff' },
    2: { aura1: '220,0,180', aura2: '140,0,120', wing: '#880055', wingGlow: '#dd0088', body: '#aa0066', bodyGlow: '#ff22aa', core1: '255,200,240', core2: '255,60,180', core3: '180,0,120', gun: '#ff88cc' },
    3: { aura1: '255,40,0',  aura2: '180,0,0',   wing: '#991100', wingGlow: '#ff3300', body: '#cc2200', bodyGlow: '#ff6600', core1: '255,220,180', core2: '255,100,20', core3: '200,40,0',  gun: '#ffaa44' },
  };
  const p = palettes[phase];

  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.scale(sc, sc);
  ctx.globalAlpha = flashAlpha * (b.cloak ? 0.16 + 0.06 * Math.sin(frameCount * 0.3) : 1);

  // Boss görseli
  if (bossImg.complete && bossImg.naturalWidth > 0) {
    const g = getBossGlowSprite(b.zone, b.zone === 1 && b.mood ? BOSS_MOODS[b.mood].glow : p.bodyGlow); // sektör 1: ruh haline göre
    if (g) ctx.drawImage(g.c, -g.w / 2, -g.h / 2, g.w, g.h);
  }

  ctx.globalAlpha = 1;
  ctx.restore();
}
