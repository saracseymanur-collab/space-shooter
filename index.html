// --- Update ---
function update() {
  frameCount++;

  // Müzik: o anki ekrana göre bölge, yoğunluk ve ses seviyesi
  {
    const mz = state === 'menu' ? menuIdx + 1 : state === 'zonetransition' ? zoneTransIdx + 2 : state === 'intro' ? (cinePanels === ENDING_PANELS ? 4 : 1) : currentZone;
    const lastWave = !boss && currentLevel % 5 !== 0 && getWave() >= currentLevel * 5;
    const intense = state === 'play' && !briefing && !introCard && (!!boss || lastWave) && currentLevel !== 7;
    const inLevel = state === 'play' || state === 'paused' || state === 'gameover' || state === 'levelcomplete';
    const track = state === 'menu' || state === 'map' ? 'menu' : inLevel && boss ? 'boss' : 'zone';
    Sound.setMusic(mz, intense, state === 'paused' ? 0.45 : state === 'play' && !briefing ? (currentLevel === 7 ? 0.35 : 1) : 0.75, track, inLevel ? (currentLevel - 1) % 5 : 0);
  }

  const starMul = slalomFast() ? 4 : 1; // L6: hız hissi
  stars.forEach(s => {
    s.y += s.spd * starMul;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
  });

  if (resetConfirmT > 0) resetConfirmT--;
  if (resetDoneT > 0) resetDoneT--;
  // Harita: göreve dokunma animasyonu bitince bölümü başlat
  if (mapPress) { if (state !== 'map') mapPress = null; else if (++mapPress.t >= 12) { const lv = mapPress.lv; mapPress = null; startLevel(lv); } }

  // Zone transition update
  if (state === 'zonetransition') {
    if (zoneTransPhase === 'fadein') {
      zoneTransAlpha = Math.min(1, zoneTransAlpha + 0.022);
      if (zoneTransAlpha >= 1) zoneTransPhase = 'show';
    }
    return;
  }

  // Intro cinematic update
  if (state === 'intro') {
    if (introPhase === 'fadein') {
      introAlpha = Math.min(1, introAlpha + 0.033);
      if (introAlpha >= 1) introPhase = 'show';
    } else if (introPhase === 'fadeout') {
      introAlpha = Math.max(0, introAlpha - 0.05);
      if (introAlpha <= 0) {
        introPanelIdx++;
        if (introPanelIdx >= cinePanels.length) {
          endCinematic();
        } else {
          introPhase = 'fadein';
        }
      }
    }
    return;
  }

  // Menu kart animasyonu
  menuAnimX += (menuIdx * (W - 60) - menuAnimX) * 0.14;

  if (state === 'levelcomplete') {
    victoryTime++;
    // Yıldızlar sırayla belirir
    {
      // Tek seferlik konfeti patlaması (boss zaferinde daha büyük)
      const burst = levelCompleteType === 'boss' ? 26 : 16;
      const spawnCount = victoryTime === 8 ? burst : 0;
      const VCOL = SECTOR_COLORS[currentZone - 1];
      for (let i = 0; i < spawnCount; i++) {
        const a = Math.random() * Math.PI * 2;
        const spd = 1.5 + Math.random() * 3;
        victoryParticles.push({
          x: W / 2 + Math.cos(a) * 60,
          y: RESULT_CARD.y + 82 + Math.sin(a) * 20,
          vx: Math.cos(a) * spd,
          vy: Math.sin(a) * spd * 0.6 - 0.4,
          life: 1,
          decay: 0.02 + Math.random() * 0.015,
          r: 1.2 + Math.random() * 1.8,
          color: i % 4 === 0 ? '#ffffff' : VCOL,
        });
      }
      victoryParticles = victoryParticles.filter(p => {
        p.x += p.vx; p.y += p.vy;
        p.vx *= 0.96; p.vy *= 0.96;
        p.life -= p.decay;
        return p.life > 0;
      });
    }
    return;
  }
  if (state !== 'play') return;
  if (briefing) return; // talimat kartı açık: oyun donmuş
  if (countdown > 0) { // 3-2-1: oyun hâlâ donuk
    countdown--;
    if (countdown > 0 && countdown % 30 === 0) Sound.sfx.count(countdown / 30);
    if (countdown === 0) Sound.sfx.go();
    return;
  }
  if (introCard) { introCard.t++; return; } // ilk karşılaşma açıklaması: oyun donuk
  if (archiveCard) { archiveCard.t++; return; } // L14 sonu: arşiv mesajı
  checkFirstSeen();
  if (introCard) return;
  levelPlayT++;
  if (currentLevel === 14 && !boss) playFrames = (currentLevel - 1) * LEVEL_SEC * 60 + Math.round(archive * LEVEL_SEC * 60); // L14: dalgalar arşivle ilerler, %100'de biter
  else playFrames++;
  tipPlan.forEach(tp => { if (levelPlayT === tp.at) showToast(tp.text); });
  if (toasts.length && ++toasts[0].t >= toasts[0].dur) toasts.shift();
  if (hurtFx > 0) hurtFx--;
  if (bossWarn > 0) bossWarn--;
  if (crystalPulse > 0) crystalPulse--;
  crystalFly = crystalFly.filter(c => { if (++c.t >= 22) { crystalPulse = 10; return false; } return true; });
  if (!boss) {
    const lvWaveNow = Math.min(currentLevel % 5 === 0 ? bossPreWaves() : 5, Math.floor(Math.max(0, gameSec() - (currentLevel - 1) * LEVEL_SEC) / WAVE_SEC) + 1);
    if (lvWaveNow > lastWaveSeen) {
      if (lvWaveNow === (currentLevel % 5 === 0 ? bossPreWaves() : 5)) showToast('FINAL WAVE', '#ff4d66', 110);
      else showToast(`WAVE ${lastWaveSeen} CLEAR`, null, 90);
      Sound.sfx.wave(); lastWaveSeen = lvWaveNow;
    }
  }

  // Tutorial progress on lane change

  if (player.targetLane !== prevTargetLane) {
    Sound.sfx.swipe();
    if (player.targetLane > prevTargetLane && tutorial && tutorial.step === 0) tutorial.step = 1;
    else if (player.targetLane < prevTargetLane && tutorial && tutorial.step === 1) { localStorage.setItem('ss_tutorial', '1'); tutorial = null; }
    prevTargetLane = player.targetLane;
  }

  const targetX = LANE_CENTERS[player.targetLane];
  const slideFactor = 0.35;
  player.x += (targetX - player.x) * slideFactor;
  if (Math.abs(targetX - player.x) < 1) player.x = targetX;

  if (player.flash > 0) player.flash--;
  if (player.invuln > 0) player.invuln--;
  if (player.shieldTimer > 0) player.shieldTimer--;
  if (player.doubleTimer > 0) player.doubleTimer--;
  if (player.tripleTimer > 0) player.tripleTimer--;

  // Death animation
  if (player.dead) {
    player.deathTimer++;
    if (player.deathTimer > 80) { state = 'gameover'; Sound.sfx.gameover(); }
    return;
  }

  // Auto fire
  player.fireTimer++;
  if (currentLevel === 7 || currentLevel === 8 || (currentLevel === 9 && fireHold)) player.fireTimer = 0; // L7-8: silahlar kapalı (madenin içinde gizlice) · L9: ateş kesildi
  if (player.fireTimer >= (overdriveTimer > 0 ? 5 : player.fireRate) && weaponsJammed()) {
    player.fireTimer = 0;
    if (frameCount % 3 === 0) spawnCollectEffect(player.x + (Math.random() - 0.5) * 30, player.y - 30, '#9fe8ff'); // kıvılcım
  } else if (player.fireTimer >= (overdriveTimer > 0 ? 5 : player.fireRate)) {
    player.fireTimer = 0;
    Sound.sfx.shoot();
    const bColor = overdriveTimer > 0 ? 'overdrive' : player.tripleTimer > 0 ? 'triple' : player.doubleTimer > 0 ? 'double' : 'normal';
    if (player.tripleTimer > 0 || overdriveTimer > 0) {
      bullets.push({ x: player.x - 13, y: player.y - 20, speed: 10, color: bColor });
      bullets.push({ x: player.x,      y: player.y - 28, speed: 10, color: bColor });
      bullets.push({ x: player.x + 13, y: player.y - 20, speed: 10, color: bColor });
    } else if (player.doubleTimer > 0) {
      bullets.push({ x: player.x - 10, y: player.y - 24, speed: 10, color: bColor });
      bullets.push({ x: player.x + 10, y: player.y - 24, speed: 10, color: bColor });
    } else {
      bullets.push({ x: player.x, y: player.y - 28, speed: 10, color: bColor });
    }
  }

  // Bullets move
  bullets = bullets.filter(b => { b.y -= b.speed; return b.y > -10; });

  // Boss spawn tespiti: sadece 5. bölümde
  const currentWave = getWave();
  if (currentWave !== lastWaveForBoss) lastWaveForBoss = currentWave;
  // boss: ön dalgalar bitti VE ekrandaki tüm gemiler vuruldu → hemen uyarı + boss yukarıdan süzülür
  // (her karede kontrol: eskiden sadece dalga değişiminde bakılıyordu → son gemiden sonra ~10 sn boşluk)
  if (currentLevel === currentZone * 5 && currentWave - (currentLevel - 1) * 5 > bossPreWaves() && !boss && !enemies.length && !pendingEnemies.length) spawnBoss(currentLevel * 5);

  // Level tamamlama: 5 dalgayı geçince bölüm biter (boss seviyesi hariç)
  const _zoneLastLevel = currentZone * 5;
  if (slowMoT > 0) slowMoT--;
  if (currentLevel !== _zoneLastLevel && !boss && currentWave > currentLevel * 5 && enemies.length === 0 && slowMoT <= 0 && !asteroids.some(a => a.sl) && !stealthScans.length && !haulers.length && !drifters.length && slalomSpd > 0 && slalomOutro < SLALOM_OUTRO) {
    if (slalomOutro === 0 && survivors > 0) addFloat(W / 2, H * 0.42, survivors + ' SURVIVORS', '#9fe8ff', true);
    if (slalomOutro++ === 0) showToast(currentLevel === 9 ? 'SOMETHING WOKE UP' : currentLevel === 7 ? 'THE GATES CLOSE BEHIND YOU' : 'SOMETHING IS OUT THERE', currentLevel === 9 ? '#ff4d66' : '#ffb347', SLALOM_OUTRO);
    if (currentLevel === 9) hurtFx = Math.max(hurtFx, 10); // yer sarsılır: Rock Titan uyanıyor
  } else if (currentLevel === 14 && !archiveDone && !boss && currentWave > currentLevel * 5 && enemies.length === 0 && slowMoT <= 0) {
    if (!archiveCard) { archiveCard = { t: 0 }; Sound.sfx.wave(); } // önce çözülen mesaj, sonra LEVEL CLEAR
  } else if (currentLevel !== _zoneLastLevel && !boss && currentWave > currentLevel * 5 && enemies.length === 0 && slowMoT <= 0 && !asteroids.some(a => a.sl) && !stealthScans.length && !tunnelSegs.some(g => g.open.length < 3) && !drills.length && !haulers.length && !drifters.length) {
    levelStates[currentLevel - 1] = 'completed';
    levelStates[currentLevel] = 'unlocked';
    saveLevelStates();
    levelCompleteType = 'clear';
    victoryTime = 0; victoryParticles = [];
    Sound.sfx.clear();
    state = 'levelcomplete';
  }

  // Boss güncelleme
  if (boss) {
    const ratio = boss.hp / boss.maxHp;
    const prevPhase = boss.phase || 1;
    boss.phase = boss.zone === 1 ? (ratio > 0.8 ? 1 : ratio > 0.45 ? 2 : 3) : boss.zone === 2 ? (ratio > 0.7 ? 1 : ratio > 0.35 ? 2 : 3) : // Void Vanguard: 1 zincirleme sıçrama · 2 Dev Dalış · 3 Ateş Koridoru
 ratio > 0.6 ? 1 : ratio > 0.3 ? 2 : 3;
    if (boss.phase !== prevPhase) { boss.flash = 20; boss.fireTimer = 0; } // faz geçişinde flash

    // Yatay hareket hızı faza göre
    const baseSpeed = (boss.special ? 1.9 : 1.2 + boss.bossNum * 0.2)
                    * (boss.phase === 1 ? 1.0 : boss.phase === 2 ? 1.7 : 2.8);
    if (boss.zone > 2) { // Void Vanguard ve Rock Titan devriye yapmaz: şeride oturur, sıçrar (updateRecoil)
      const sign = boss.vx >= 0 ? 1 : -1;
      boss.vx = sign * baseSpeed;
      boss.x += boss.vx;
      if (boss.x < 55) { boss.x = 55; boss.vx = baseSpeed; }
      if (boss.x > W - 55) { boss.x = W - 55; boss.vx = -baseSpeed; }
    }

    // Dikey: her fazda üstte sabit
    const homeY = boss.special ? H * 0.14 : H * 0.13;
    if (boss.zone !== 2 && !(boss.zone === 1 && (boss.rState === 'dive' || boss.rState === 'slam' || boss.rState === 'rise' || (boss.rState === 'dmark' && boss.dives > 0)))) boss.y += (homeY - boss.y) * (boss.rState === 'rise' ? 0.035 : bossWarn > 0 ? 0.06 : 0.025); // girişte hızlı süzülür

    if (boss.flash > 0) boss.flash--;
    if (boss.zone === 2) updateTitan();
    if (!boss) return;
    if (boss.zone === 1) updateRecoil(); // yardımcı gemiler kaldırıldı (kullanıcı: küçükleri kovalamaktan boss'u vuramıyordu) — updateBossMinions kullanılmıyor

    // Komuta Merkezi: faz 2'den itibaren periyodik olarak görünmez olur (mermi işlemez, ateş etmez)
    if (boss.zone === 3 && boss.phase >= 2) {
      boss.cloakCycle = (boss.cloakCycle || 0) + 1;
      boss.cloak = boss.cloakCycle % 300 > 215 ? 1 : 0;
    } else {
      boss.cloak = 0;
    }

    // Drone gönderme: Komuta Merkezi her fazda, Void Leader son fazda
    if (boss.zone === 3 || (boss.zone === 4 && boss.phase === 3)) {
      boss.droneTimer++;
      const droneEvery = (boss.zone === 4 ? 210 : [0, 230, 190, 160][boss.phase]) * (BOSS_FIRE_MUL[currentLevel] || 1);
      if (boss.droneTimer >= droneEvery) {
        boss.droneTimer = 0;
        // Drone, boss'un son atışta boş bıraktığı şeritten iner
        spawnDrone(boss.x, boss.zone === 3 && boss.phase >= 2 && Math.random() < 0.5, boss.safeLane);
      }
    }

    // Void Leader: şerit lazerleri (önce uyarı, sonra ışın)
    if (boss.zone === 4 && boss.phase >= 2) {
      boss.laserTimer++;
      const laserEvery = (boss.phase === 2 ? 170 : 135) * (BOSS_FIRE_MUL[currentLevel] || 1);
      if (boss.laserTimer >= laserEvery && lasers.length === 0) {
        boss.laserTimer = 0;
        const count = boss.phase === 2 ? 1 : 2;
        const hz = hazardWindows();
        const laneFreeDuring = l => !hz.some(h => h.lane === l && h.t0 < 90 + WALL_MARGIN && h.t1 > 62 - WALL_MARGIN);
        const combos = count === 1 ? [[0], [1], [2]] : [[0, 1], [0, 2], [1, 2]];
        // en az bir şerit (ışın dışı) ışın süresince tehlikesiz kalmalı
        const ok = combos.filter(c => [0, 1, 2].some(l => !c.includes(l) && laneFreeDuring(l)));
        const pick = (ok.length ? ok : combos)[Math.floor(Math.random() * (ok.length || combos.length))];
        pick.forEach(l => lasers.push({ lane: l, t: 0, warn: 62, fire: 28, hit: false }));
      }
    }

    // Boss ateş ediyor
    boss.fireTimer++;
    if (boss.fireTimer >= boss.nextFireIn * (BOSS_FIRE_MUL[currentLevel] || 1)) {
      boss.fireTimer = 0;
      const bY  = boss.y + 44;
      const mk  = (x, vy, big) => ({ x, y: bY, vx: 0, vy, hp: 3, lane: -1, fromBoss: true, big: !!big });
      // Bossun ağzından hedef şeride nişanlı mermi (Void Leader)
      const aimed = (lane, vy) => {
        const b = mk(boss.x, vy);
        b.vx = (LANE_CENTERS[lane] - boss.x) / ((player.y - bY) / vy);
        b.lane = lane; b.aimLane = lane;
        return b;
      };

      if (boss.zone === 3) {
        // Komuta Merkezi: daima 1 şerit güvenli; görünmezken ateş etmez
        if (boss.cloak) {
          boss.nextFireIn = 20;
        } else {
          const phase = boss.phase || 1;
          boss.nextFireIn = phase === 1 ? 64 + Math.random() * 16 : phase === 2 ? 48 + Math.random() * 14 : 34 + Math.random() * 10;
          // İnen drone varsa onun şeridi güvenli kalır (vurmak için girmen gerekiyor)
          const lowDrone = enemies.filter(e => e.drone && e.y < player.y).sort((a, b) => b.y - a.y)[0];
          const safe = lowDrone ? lowDrone.lane : Math.floor(Math.random() * 3);
          boss.safeLane = safe;
          const vy = phase === 1 ? 4.5 : phase === 2 ? 5.2 : 6.0;
          [0, 1, 2].filter(l => l !== safe).forEach(l => pushShot(mk(LANE_CENTERS[l], vy)));
          if (phase === 3 && Math.random() < 0.2) pushShot(mk(LANE_CENTERS[safe === 1 ? 0 : 1], 2.8, true));
        }
      } else if (boss.zone === 4) {
        // Void Leader: nişanlı yelpaze; lazer varken mermiler lazer şeritlerine gider (güvenli şerit korunur)
        const phase = boss.phase || 1;
        boss.nextFireIn = phase === 1 ? 52 + Math.random() * 16 : phase === 2 ? 70 + Math.random() * 18 : 58 + Math.random() * 16;
        const vy = phase === 1 ? 4.6 : 5.4;
        let targets;
        if (lasers.length > 0) targets = lasers.map(L => L.lane);
        else {
          const safe = Math.floor(Math.random() * 3);
          targets = [0, 1, 2].filter(l => l !== safe);
          if (phase === 2) targets = [targets[Math.floor(Math.random() * 2)]];
        }
        targets.forEach(l => pushShot(aimed(l, vy)));
      } else {
        boss.nextFireIn = 9999; // Void Vanguard'ın ateşi updateRecoil()'de
      }
    }

    // Oyuncu mermileri bossa çarpıyor
    bullets = bullets.filter(b => {
      if (!boss) return true; // boss aynı frame'de öldüyse kalan mermilere dokunma
      if (boss.cloak) return true; // görünmez boss'tan mermi geçer
      if (boss.shielded && Math.abs(b.x - boss.x) < 90 && Math.abs(b.y - boss.y) < 70) { boss.shieldHit = 8; return false; } // dron kalkanı
      const bsc = boss.special ? 1.45 : 1.0;
      const hit = Math.abs(b.x - boss.x) < 62 * bsc && Math.abs(b.y - boss.y) < 48 * bsc;
      if (hit) {
        boss.hp -= boss.zone === 2 ? TITAN_GUN : 1; // Titan'a silah az işler: asıl hasar bomba
        boss.flash = 8;
        Sound.sfx.hit();
        spawnExplosion(b.x, b.y, false);
        if (boss.hp <= 0) {
          if (boss.zone === 2) { boss.dying = 110; boss.shielded = true; lasers = []; eBullets = []; asteroids = []; Sound.sfx.bigBoom(); } // Titan yavaşça çöker
          else bossDefeated();
        }
      }
      return !hit;
    });
  }

  // Lazerler: uyarı süresi bitince ışın, oyuncu o şeritteyse tek sefer hasar
  lasers = lasers.filter(L => {
    L.t++;
    if (L.t === 1 && L === lasers[0]) Sound.sfx.laserWarn();
    if (L.meteor) {
      // Meteor yağmuru: uyarıdan sonra şeritten 3 hızlı meteor geçer
      if ([1, 10, 19].includes(L.t - L.warn)) {
        spawnAsteroid('normal', LANE_CENTERS[L.lane], -30, 15 + Math.random() * 5);
        const m = asteroids[asteroids.length - 1];
        m.speed = 10; m.rotSpeed = 0.2; m.meteor = true;
        if (L.y0 != null) m.y = L.y0; // Titan'ın fırlattığı kaya
        if (L.t - L.warn === 1) Sound.sfx.whoosh();
      }
      return L.t <= L.warn + L.fire;
    }
    if (L.t === L.warn + 1 && L === lasers[0]) Sound.sfx.laserFire();
    if (L.t > L.warn && !L.hit && !player.dead && playerLaneNow() === L.lane) {
      L.hit = true;
      damagePlayer('Vaporized by the void beam!');
    }
    return L.t <= L.warn + L.fire;
  });

  // Nebula: iyon bulutları
  updateIonClouds(currentZone === 3 ? getLevelConfig() : null);

  // --- Zone 2: Asteroid Belt — kristal madenciliği, pusu, meteor yağmuru, patlayıcı kayalar ---
  if (overdriveTimer > 0) overdriveTimer--;

  // Black Hole: kara deliğe çekilen enkaz
  const _zcfg = getLevelConfig();
  if (currentZone === 4 && _zcfg && _zcfg.debris && !boss && state === 'play' && !player.dead) {
    asteroidSpawnTimer++;
    if (asteroidSpawnTimer >= _zcfg.debris) {
      asteroidSpawnTimer = 0;
      const a = spawnAsteroid('normal');
      if (a) { a.speed = 2.4 + Math.random() * 0.6; a.rotSpeed = (Math.random() - 0.5) * 0.06; }
    }
  }

  if (currentLevel === 14 && !boss && state === 'play' && _zcfg && _zcfg.stream) updateStream(_zcfg.stream, getWave() > currentLevel * 5);
  if (currentLevel === 13 && !boss && state === 'play' && !player.dead && _zcfg && _zcfg.warp) updateWarp(_zcfg.warp);
  if (currentLevel === 12 && !boss && state === 'play' && !player.dead && _zcfg && _zcfg.storm) updateStorm(_zcfg.storm, getWave() > currentLevel * 5);
  if (radarOn() && state === 'play' && !player.dead && _zcfg && _zcfg.radar) { updateRadar(_zcfg.radar); updateNebMines(_zcfg.radar, getWave() > currentLevel * 5); }
  if ((currentZone === 2 || currentZone === 4) && state === 'play' && !player.dead) {
    // Asteroid spawning (zone 2)
    const levelEnd = currentLevel % 5 !== 0 && getWave() > currentLevel * 5;
    if (currentLevel === 7) updateScans();
    if (_zcfg && _zcfg.tunnel && !boss) updateTunnel(_zcfg.tunnel, levelEnd);
    if (_zcfg && _zcfg.digger && !boss) updateDigger(_zcfg.digger, levelEnd);
    if (_zcfg && _zcfg.drills && !boss) updateDrills(_zcfg.drills, levelEnd);
    if (_zcfg && _zcfg.haulers && !boss) updateHaulers(_zcfg.haulers, levelEnd);
    if (_zcfg && _zcfg.convoy && !boss) updateConvoy(_zcfg.convoy, levelEnd);
    if (currentLevel === 10) updateTitanBombs();
    if (currentZone === 2 && !boss && !levelEnd && _zcfg && _zcfg.slalom) updateSlalom(_zcfg.slalom);
    else if (currentZone === 2 && !boss && !levelEnd && _zcfg && _zcfg.stealth) updateStealth(_zcfg.stealth);
    else if (currentZone === 2 && !boss && _zcfg && (_zcfg.tunnel || _zcfg.digger || _zcfg.drills || _zcfg.haulers || _zcfg.convoy)) { /* L8: kaya üretimi kendi fonksiyonunda */ }
    else if (currentZone === 2 && !boss && !levelEnd) {
      asteroidSpawnTimer++;
      const astLvl = Math.min(5, currentLevel - 5); // 1-5: L6-L10
      const astInterval = [64, 60, 58, 56, 60][astLvl - 1];
      if (asteroidSpawnTimer >= astInterval) {
        asteroidSpawnTimer = 0;
        const spd = [2.2, 2.4, 2.6, 2.8, 2.6][astLvl - 1];
        const ironCount = asteroids.filter(a => a.type === 'iron').length;
        const ironChance = [0.15, 0.3, 0.2, 0.2, 0.2][astLvl - 1];
        let atype = (ironCount < 2 && Math.random() < ironChance) ? 'iron' : 'normal';

        // Pusucu dışarıdayken yeni demir kaya gelmez
        const ambushActive = enemies.some(e => e.escort || e.ambushT > 0);
        if (atype === 'iron' && ambushActive) atype = 'normal';
        let made = null;
        if (atype === 'iron') {
          const ironLanes = new Set();
          asteroids.forEach(a => { if (a.type === 'iron') ironLanes.add(nearestLane(a.x)); });
          const available = [0, 1, 2].filter(l =>
            new Set([...ironLanes, l]).size < 3 &&                                 // en az 1 şerit demirsiz kalsın
            !enemies.some(e => !e.escort && e.lane === l && e.y < player.y) &&   // düşmanı arkadan kıstırmasın
            !rockWouldWall(l, -40, 28, spd));
          if (available.length > 0) {
            const lane = available[Math.floor(Math.random() * available.length)];
            made = spawnAsteroid('iron', LANE_CENTERS[lane]);
            made.speed = spd; made.rotSpeed = 0.01;
            // Pusu (L7+): düşman demir kayanın arkasına saklanır, kaya ilerleyince boş yan şeride çıkar
            if (currentLevel >= 7 && Math.random() < (currentLevel === 7 ? 0.6 : 0.35)) spawnAmbusher(made, lane);
          } else {
            made = spawnAsteroid('normal');
          }
        } else {
          made = spawnAsteroid(atype);
        }
        if (made && made.type !== 'iron') { made.speed = spd; made.rotSpeed = (Math.random() - 0.5) * 0.03; }

        // Ekstra normal kayalar (madencilik için)
        const extra = [0.25, 0.15, 0.2, 0.25, 0.2][astLvl - 1];
        if (Math.random() < extra) {
          const a2 = spawnAsteroid('normal');
          if (a2) { a2.speed = spd; a2.rotSpeed = 0.02; }
        }
      }
    }

    // Asteroid update + collisions
    const newFragments = [];
    const blasts = []; // patlayıcı kaya patlamaları
    asteroids = asteroids.filter(a => {
      a.y += a.speed;
      a.rotation += a.rotSpeed;
      if (a.flash > 0) a.flash--;
      if (a.y > H + 60 || a.x < -60 || a.x > W + 60) return false;
      if (a.blasted) { destroyRock(a, newFragments, blasts); return false; }

      if (a.type === 'iron') {
        // Demir kaya: kırılmaz ve mermileri durdurur (siper)
        bullets = bullets.filter(b => {
          if (bulletHitsRock(b, a)) { a.flash = 4; spawnExplosion(b.x, b.y, false); return false; }
          return true;
        });
      } else if (!a.meteor) { // meteorlar mermiyle kırılmaz — tek çare kaçmak
        let hit = false;
        bullets = bullets.filter(b => {
          if (hit) return true;
          if (bulletHitsRock(b, a)) {
            a.hp--;
            a.flash = 10;
            spawnExplosion(b.x, b.y, false);
            if (a.hp <= 0) hit = true;
            return false;
          }
          return true;
        });
        if (hit) { destroyRock(a, newFragments, blasts); return false; }
      }

      // Player collision (bir meteor yağmuru en fazla 1 can alır)
      // Çarpma alanı görselle uyumlu (önceden görselden ~10px büyüktü)
      if (!player.dead && Math.abs(a.x - player.x) < a.size * 0.9 + (a.sl || a.amb ? 24 : 12) && Math.abs(a.y - player.y) < (a.hitH || a.size * 0.9 + 16)) { // L6: küçük kaya, gemi gövdesi kadar pay
        spawnExplosion(a.x, a.y, true);
        if (a.dig) { digCrash(); return false; }
        if (!(a.meteor && frameCount < meteorImmuneUntil)) {
          damagePlayer(a.meteor ? 'Hit by a meteor!' : 'Hit by an asteroid!');
          if (a.meteor) meteorImmuneUntil = frameCount + 45;
        }
        return false;
      }
      return true;
    });
    asteroids.push(...newFragments);

    // Patlayıcı kaya: yakındaki düşmanları ve kayaları da patlatır (zincirleme)
    blasts.forEach(bl => {
      enemies.forEach(e => {
        if (Math.hypot(e.x - bl.x, e.y - bl.y) < BLAST_R) {
          e.hp = 0;
          spawnShipDeath(e);
        }
      });
      enemies = enemies.filter(e => e.hp > 0);
      asteroids.forEach(a => { if (a.type !== 'iron' && Math.hypot(a.x - bl.x, a.y - bl.y) < BLAST_R) a.blasted = true; });
    });
  }

  // Kristaller: düşer, overdrive'da gemiye çekilir, toplanınca barı doldurur
  crystals = crystals.filter(c => {
    c.t++;
    if (overdriveTimer > 0 || Math.hypot(c.x - player.x, c.y - player.y) < 90) {
      const dx = player.x - c.x, dy = player.y - c.y, d = Math.hypot(dx, dy) || 1;
      c.x += dx / d * 7; c.y += dy / d * 7;
    } else {
      c.x += c.vx; c.vx *= 0.94;
      c.y += c.vy;
    }
    if (c.y > H + 20) return false;
    if (!player.dead && Math.abs(c.x - player.x) < 34 && Math.abs(c.y - player.y) < 40) {
      Sound.sfx.crystal();
      crystalFly.push({ x: c.x, y: c.y, tx: 34, ty: HUD_H + 15 + (boss ? 26 : 0), t: 0 });
      if (overdriveTimer === 0) {
        crystalMeter = Math.min(CRYSTAL_MAX, crystalMeter + 1);
        if (crystalMeter >= CRYSTAL_MAX) {
          crystalMeter = 0;
          overdriveTimer = OVERDRIVE_TIME;
          Sound.sfx.powerup();
          addFloat(W / 2, H * 0.45, 'OVERDRIVE!', '#ffd040', true);
        }
      }
      return false;
    }
    return true;
  });

  floatTexts = floatTexts.filter(f => { f.t++; f.y -= f.big ? 0.4 : 0.9; return f.t < (f.big ? 90 : 50); });

  // Normal spawn — boss savaşında ve level bitiş bekleme aşamasında durur
  const levelEnding = currentLevel !== currentZone * 5 ? getWave() > currentLevel * 5 : getWave() - (currentLevel - 1) * 5 > bossPreWaves(); // boss bölümünde: ön dalgalar bitti
  if (!boss && !levelEnding) {
    spawnTimer++;
    const cfg      = getLevelConfig();
    const interval = (cfg ? cfg.interval : getSpawnInterval()) * (enemies.some(e => e.gunner) ? 1.5 : 1); // Gunner varken daha seyrek
    const dChance  = cfg ? cfg.doubleChance  : getDoubleSpawnChance();
    if (cfg && cfg.gunner && gunT === 99999) gunT = cfg.gunner - 240;
    if (cfg && cfg.gunner && ++gunT >= cfg.gunner && !enemies.some(e => e.gunner)) {
      const free = [0, 1, 2].filter(l => !enemies.some(e => e.lane === l && e.y < H * 0.4) &&
        !asteroids.some(a => a.y < H * 0.4 && Math.abs(a.x - LANE_CENTERS[l]) < LANE_W * 0.65));
      if (free.length) { gunT = 0; spawnGunner(free[Math.floor(Math.random() * free.length)]); }
    }
    if (cfg && cfg.hunter && ++hunT >= cfg.hunter && !enemies.some(e => e.hunter)) {
      const free = [0, 1, 2].filter(l => !enemies.some(e => e.lane === l && e.y < H * 0.35));
      if (free.length) { hunT = 0; spawnHunter(free[Math.floor(Math.random() * free.length)]); }
    }
    if (cfg && cfg.snake && ++snakeT >= cfg.snake && !snakes.length) { snakeT = 0; spawnSnake(); }
    if (cfg && cfg.sweeper && ++sweepT >= cfg.sweeper && !enemies.some(e => e.sweeper)) { sweepT = 0; spawnSweeper(); }
    if (cfg && cfg.burster && ++burstT >= cfg.burster && enemies.filter(e => e.burster).length < 2 && spawnBurster()) burstT = 0;
    if (cfg && cfg.link && ++linkT >= cfg.link && !enemies.some(e => e.guarding) && spawnLinkPair()) linkT = 0;
    const lw = getWave() - (currentLevel - 1) * 5;
    if (lw === 3 && !runnerDone && !(cfg && (cfg.slalom || cfg.stealth || cfg.tunnel || cfg.digger || cfg.drills || cfg.haulers)) && (Math.random() < 1 / 360 || getWave() * WAVE_SEC - gameSec() < 2)) runnerDone = spawnRunner();
    // formation: true → sadece son dalga; dizi → o dalgalarda
    const formWave = cfg && (Array.isArray(cfg.formation) ? cfg.formation.includes(lw) : cfg.formation && lw >= 5);
    if (!formWave) formOn = false;
    if (formWave) {
      if (!formOn) { formOn = true; formT = 999; showToast('FORMATION · FIND THE GAP', '#ff4d66', 120); }
      if (++formT >= (cfg.formEvery || 150) && !enemies.some(e => e.y < 150)) {
        formT = 0; spawnFormationRow();
        // ikili sıra: farklı boşluklu ikinci sıra hemen arkadan → iki kez yer değiştir
        if (cfg.formDouble && Math.random() < cfg.formDouble) spawnFormationRow(120);
      }
    } else if (cfg && (cfg.slalom || cfg.stealth || cfg.tunnel || cfg.digger || cfg.drills || cfg.haulers || cfg.convoy)) {
      spawnTimer = 0; // L6: gemiler kapılarla gelir · L7: düşman yok
    } else if (spawnTimer >= interval) {
      spawnTimer = 0;
      spawnEnemy();
      // Suppress double enemy spawn when an iron asteroid is blocking a lane
      const ironActive = currentZone === 2 && asteroids.some(a => a.type === 'iron');
      if (Math.random() < dChance && !ironActive) spawnEnemy(Math.floor(Math.random() * 80 + 60));
    }
  }

  // Power-ups move + collect
  powerups = powerups.filter(p => {
    p.y += p.speed;
    p.bobTimer++;
    // Güçlendirmeler her zaman bir şeridin ortasına kayar (zikzak düşmandan düşse bile)
    let nl = 0;
    LANE_CENTERS.forEach((lc, i) => { if (Math.abs(p.x - lc) < Math.abs(p.x - LANE_CENTERS[nl])) nl = i; });
    p.x += (LANE_CENTERS[nl] - p.x) * 0.2;
    if (p.y > H + 20) return false;

    // Oyuncu topladı mı?
    if (Math.abs(p.x - player.x) < 32 && Math.abs(p.y - player.y) < 38) {
      if (p.type === 'shield') {
        player.shieldTimer = POWERUP_DURATION;
      } else if (p.type === 'triple') {
        player.tripleTimer = POWERUP_DURATION;
      } else if (p.type === 'double') {
        player.doubleTimer = POWERUP_DURATION;
      } else if (p.type === 'bomb') {
        activateBomb();
      } else if (p.type === 'heart') {
        addFloat(p.x, p.y - 30, lives >= 3 ? 'FULL' : '+1 LIFE', '#ff5a7a', false);
        lives = Math.min(3, lives + 1);
      }
      // Toplama efekti
      if (p.type === 'bomb') Sound.sfx.bomb(); else Sound.sfx.powerup();
      spawnCollectEffect(p.x, p.y, POWERUP_COLORS[p.type]);
      return false;
    }
    return true;
  });

  if (eBullets.length > 30) eBullets.splice(0, eBullets.length - 30); // unbounded growth engeli

  // Düşman mermileri: hareket + oyuncuya çarpma
  eBullets = eBullets.filter(b => {
    // Black Hole: kara delik mermiyi ortaya doğru büker
    if (b.curve) { const k = b.curve === true ? 1 : b.curve; b.vx = Math.max(-1.6 * k, Math.min(1.6 * k, b.vx + (W / 2 - b.x) * 0.00012 * k)); }
    b.x += b.vx;
    b.y += b.vy;
    if (b.y > H + 10) return false;
    // Demir kayalar düşman mermisini de durdurur
    if (currentZone === 2 && asteroids.some(a => a.type === 'iron' && Math.hypot(b.x - a.x, b.y - a.y) < a.size)) return false;

    if (!player.dead && Math.abs(b.x - player.x) < 24 && Math.abs(b.y - player.y) < 40) {
      damagePlayer('Your ship was destroyed!');
      return false;
    }
    return true;
  });

  // Enemies
  updateSnakes();
  const sweepActive = enemies.some(e => e.sweeper && (e.sState === 'warn' || e.sState === 'sweep')) || bossSolo(); // ateş tutma
  enemies = enemies.filter(e => {
    if (e.gone) return false; // kaçan yılan parçaları
    // Pusu: demir kayanın arkasında saklanır (bu sırada vurulamaz, ateş etmez)
    if (e.escort) {
      if (asteroids.includes(e.escort) && e.escort.y < e.breakAt) {
        e.y = e.escort.y - 58; e.x = e.escort.x;
        return true;
      }
      // Boş yan şerit seç (kaya / mermi olmayan); yoksa ilk planlanan şerit
      const opts = [e.lane - 1, e.lane + 1].filter(l => l >= 0 && l <= 2);
      const clear = opts.filter(l =>
        !asteroids.some(a => nearestLane(a.x) === l && Math.abs(a.y - e.y) < 150) &&
        !eBullets.some(b => nearestLane(b.x) === l && b.y > e.y - 40));
      e.escort = null; e.lane = clear.length ? clear[Math.floor(Math.random() * clear.length)] : e.breakTo; e.shifting = 40;
      e.fireTimer = -60;   // çıktıktan sonra ~1 sn ateş etmez
      e.ambushT = 120;     // bu sürede yeni demir kaya gelmez
    }
    if (e.ambushT > 0) e.ambushT--;
    if (!(warpWarn > 0 && e.warpTo != null)) e.y += e.speed; // L13: ışınlanmadan önce yerinde titrer
    // Dalan düşman: durur (uyarı) → komşu şeride dalar, hızlanır, inince bir kez ateş eder
    if (e.diver && !e.diveState && e.y > e.diveAt) {
      const pl = playerLaneNow();
      const opts = [e.lane - 1, e.lane + 1].filter(l => l >= 0 && l <= 2 &&
        !enemies.some(o => o !== e && o.lane === l && Math.abs(o.y - e.y) < 100));
      e.diveTo = opts.includes(pl) ? pl : opts[Math.floor(Math.random() * opts.length)];
      if (e.diveTo == null) e.diveState = 2; else { e.diveState = 1; e.diveT = 42; }
    }
    if (e.diveState === 1) {
      e.y -= e.speed;
      if (--e.diveT <= 0) { e.diveState = 2; e.lane = e.diveTo; e.shifting = 20; e.speed = 3.4; e.fireTimer = e.fireRate - 28; }
    }
    if (e.gunner) {
      if (e.shieldHit > 0) e.shieldHit--;
      if (e.gState === 'enter') { if (e.y >= e.hoverY) { e.y = e.hoverY; e.gState = 'charge'; e.gT = 45; } }
      else {
        e.y -= e.speed; // yerinde durur
        if (--e.gT <= 0) {
          if (e.gState === 'charge') { e.gState = 'burst'; e.gT = 60; }
          else if (e.gState === 'burst') { e.gState = 'cool'; e.gT = 170; } // ~1 sn mermi kuyruğu + ~2 sn güvenli vuruş
          else { e.gState = 'charge'; e.gT = 45; }
        }
        if (e.gState === 'burst' && e.gT % 10 === 0)
          pushShot({ x: e.x, y: e.y + 34, vx: 0, vy: 9, hp: 3, lane: e.lane, curve: false, gun: true });
      }
    }
    if (!e.gunner && e.shieldHit > 0) e.shieldHit--;
    if (e.burster) {
      if (e.sparks) e.sparks = e.sparks.filter(p => ++p.t < p.life);
      if (e.launch) e.x += (LANE_CENTERS[e.lane] - e.x) * 0.2;
      if (e.bState === 'enter') { if (e.y >= e.hoverY) { e.y = e.hoverY; e.bState = 'charge'; e.bT = 26; } }
      else {
        e.y -= e.speed; // yerinde durur
        if (e.bState === 'charge') {
          if (e.bT % 3 === 0) { // burna çekilen kıvılcımlar (boss'taki gibi, daha az)
            const a = Math.random() * Math.PI * 2, r = 34 + Math.random() * 22;
            (e.sparks || (e.sparks = [])).push({ ox: Math.cos(a) * r, oy: Math.sin(a) * r * 0.7, t: 0, life: 12 + Math.random() * 5, col: Math.random() < 0.5 ? '#ffd27a' : '#ff6a3a' });
          }
          if (--e.bT <= 0) { e.bState = 'burst'; e.bT = 0; e.bN = 0; }
        }
        else if (e.bState === 'burst') {
          if (e.bT++ % 6 === 0) { pushShot({ x: e.x, y: e.y + 30, vx: 0, vy: 8, hp: 3, lane: e.lane, curve: false }); e.bN++; }
          if (e.bN >= 5) { e.bState = 'rest'; e.bT = 84; }
        } else if (--e.bT <= 0 && !sweepActive) { e.bState = 'charge'; e.bT = 26; }
      }
    }
    if (e.sweeper) {
      if (e.sState === 'enter') { if (e.y >= e.hoverY) { e.y = e.hoverY; e.sState = 'warn'; e.sT = 42; } }
      else if (e.sState === 'leave') { e.y -= e.speed + 7; if (e.y < -80) return false; } // yukarı çekilir (+ normal iniş telafisi)
      else {
        e.y -= e.speed; // yerinde durur
        if (e.sState === 'warn') { if (--e.sT <= 0) { e.sState = 'sweep'; e.sT = 0; } }
        else { // lazer açık: başlangıçtan bitiş şeridine kayar, sonra geri döner (güvenli şerit hep aynı üçüncü şerit)
          const t = ++e.sT, q = t < 44 ? t / 44 : t < 54 ? 1 : Math.max(0, 1 - (t - 54) / 44), ez = q * q * (3 - 2 * q);
          e.beamX = LANE_CENTERS[e.from] + (LANE_CENTERS[e.to] - LANE_CENTERS[e.from]) * ez;
          if (!e.hitDone && !player.dead && Math.abs(player.x - e.beamX) < 32) { e.hitDone = true; damagePlayer('Swept by the laser!'); }
          if (t >= 104) e.sState = 'leave';
        }
        e.x = e.beamX; e.lane = nearestLane(e.x);
      }
    }
    if (e.rammer) {
      if (e.rState === 'fall' && e.y > e.ramAt && !sweepActive) { e.rState = 'aim'; e.rT = 36; e.lane = e.ramLane = playerLaneNow(); } // süpürmede bekler
      else if (e.rState === 'aim') { // durmaz: sırasıyla inmeye devam eder, hedef şeride hızlı kayar
        e.x += (LANE_CENTERS[e.ramLane] - e.x) * 0.18;
        if (--e.rT <= 0) { e.rState = 'dash'; e.speed = 13; e.dashY0 = e.y; }
      }
      else if (e.rState === 'dash') {
        if (!player.dead && Math.abs(e.x - player.x) < 30 && Math.abs(e.y - player.y) < 44) {
          spawnShipDeath(e); Sound.sfx.shipBoom(2); damagePlayer('Rammed!'); return false;
        }
        if (e.y > H + 50) return false; // kaçtın: dalıp gitti
      }
    }
    if (e.spreader) {
      if (e.sprCharge > 0) {
        if (--e.sprCharge === 0) {
          spreadTargets(e.lane).forEach(l => pushShot({ x: e.x, y: e.y + 24, vx: spreadVel(e, l, 4.4), vy: 4.4, hp: 2, lane: l, curve: false }));
          e.sprT = 130;
        }
      } else if (--e.sprT <= 0 && e.y > 10 && e.y < H * 0.5 && Math.abs(e.x - LANE_CENTERS[e.lane]) < 4) e.sprCharge = 26;
    }
    if (e.hunter) {
      if (e.hState === 'enter') { if (e.y >= e.hoverY) { e.y = e.hoverY; e.hState = 'track'; e.hT = 72; } }
      else {
        e.y -= e.speed; // yerinde durur
        if (e.hState === 'track') { // nişangâh gecikmeyle oyuncunun şeridine kayar
          const pl = playerLaneNow();
          if (pl !== e.aim) { if (++e.aimLag >= 10) { e.aim = pl; e.aimLag = 0; } } else e.aimLag = 0;
        }
        if (--e.hT <= 0) {
          if (e.hState === 'track') { e.hState = 'lock'; e.hT = 20; } // kısa kilit: en fazla 2 isabet → ateşi engelleyemezsin
          else if (e.hState === 'lock') {
            const vy = 11, y0 = e.y + 30, tx = LANE_CENTERS[e.aim];
            pushShot({ x: e.x, y: y0, vx: (tx - e.x) / ((player.y - y0) / vy), vy, hp: 3, lane: e.aim, curve: false });
            e.hState = 'rest'; e.hT = 80;
          } else { e.hState = 'track'; e.hT = 72; e.aim = playerLaneNow(); }
        }
      }
    }
    if (e.formation && !e.volleyed && e.y >= e.volleyAt) {
      // birden çok yaylım: aşağıda bir kez daha şarj olup ateş eder (sıradaki hep aynı boşluk)
      if (e.volleysLeft > 0) { e.volleysLeft--; e.volleyAt += H * 0.2; } else e.volleyed = true;
      e.armored = false;
      pushShot({ x: e.x, y: e.y + 20, vx: 0, vy: 5, hp: 1, lane: e.lane, curve: false });
    }
    // Black Hole: çekim düşmanı komşu şeride savurur
    if (e.shiftAt !== null && e.y > e.shiftAt) {
      e.lane = e.shiftTo; e.shiftAt = null; e.shifting = 40;
      // Bazıları bir kez daha savrulur (oyuncunun hizasına gelmeden)
      if (e.shift2 && Math.random() < e.shift2 && e.y < H * 0.5) {
        e.shift2 = 0;
        e.shiftTo = e.lane === 1 ? (Math.random() < 0.5 ? 0 : 2) : 1;
        e.shiftAt = e.y + 110 + Math.random() * 80;
      }
    }
    if (e.shifting > 0) e.shifting--;
    // Zikzak hareketi (bölüm 4)
    if (e.zigzag) {
      e.zigzagPhase += 0.055;
      const zx = LANE_CENTERS[e.lane] + Math.sin(e.zigzagPhase) * 40;
      e.x += (zx - e.x) * (e.shifting > 0 ? 0.08 : 1);
    } else {
      if (!e.seg && !e.sweeper) e.x += (LANE_CENTERS[e.lane] - e.x) * (e.kid || e.launch ? 0.2 : 0.08); // bölünen parçalar yana fırlar (yılanı updateSnakes taşır)
    }
    if (e.flash > 0) e.flash--;

    // Nebula hayaletleri: görünür → kaybolur → görünmez → belirir döngüsü
    if (e.phantom) {
      const C = e.cloakCfg || { vis: 90, inv: 40 };
      e.cloakT = (e.cloakT + 1) % (C.vis + C.inv + 40);
      const t = e.cloakT, v = C.vis, iv = v + 20 + C.inv;
      e.alpha = t < v ? 1 : t < v + 20 ? 1 - (t - v) / 20 * 0.92 : t < iv ? 0.08 : 0.08 + (t - iv) / 20 * 0.92;
    }
    const cloaked = e.phantom && e.alpha < 0.45;

    // Ateş etme — canShoot false ise hiç ateş etme (süpürme sırasında sayaç durur → bitince toplu ateş olmasın)
    if (!sweepActive) e.fireTimer++;
    if (e.canShoot && !cloaked && e.fireTimer >= e.fireRate && e.y > 0 && !sweepActive) { // süpürme sırasında ateş yok
      e.fireTimer = 0;
      const activeLanes = new Set(eBullets.map(b => b.lane));
      if (activeLanes.size < 2 || activeLanes.has(e.lane)) {
        pushShot({
          x: e.x, y: e.y + 20,
          vx: 0, vy: 5,
          hp: e.maxHp,
          lane: e.lane,
          curve: e.curveShots ? ((getLevelConfig() || {}).curve || true) : false,
        });
      }
    }

    // Bullet hits (görünmez hayaletten mermi geçer)
    if (!cloaked) bullets = bullets.filter(b => {
      if (e.hp <= 0) return true; // aynı karede ölen düşmana ikinci mermi işlemez (çift ölüm/çift drop olmasın)
      const sc  = ENEMY_TIER[e.maxHp].sc;
      const hit = Math.abs(b.x - e.x) < 24 * sc && Math.abs(b.y - e.y) < 29 * sc;
      if (hit && ((e.gunner && e.gState !== 'cool') || e.armored || e.guardedBy || (e.hunter && (e.hState === 'enter' || e.hState === 'track')) || e.rammer || e.sweeper)) { e.shieldHit = 8; return false; } // kalkan: hasar yok (rammer vurulamaz: tek çare kaçmak)
      if (hit) {
        e.hp -= 1 / (e.armor || 1); // zırh: mermi başına hasar azalır (görünüş/can barı aynı, daha yavaş erir)
        if (e.hp < 0.001) e.hp = 0;
        e.flash = 14;
        if (e.hp <= 0) {
          spawnShipDeath(e);
          if (e.splitter) spawnSplitKids(e);
          Sound.sfx.shipBoom(e.maxHp);
                spawnPowerup(e.x, e.y);
        } else {
          spawnExplosion(e.x, e.y, false);
          Sound.sfx.hit();
        }
      }
      return !hit;
    });

    if (e.hp <= 0) return false;

    // Reached player — kalkan varsa engelle (kalkan hasarı emer, ama bitmez)
    if (e.runner && e.y > H + 40) return false; // kargo kaçtı: sadece ödül kaçtı
    if (e.free) { if (e.y > H + 40) return false; }
    else if (e.y > H - 55 && !e.runner && !e.seg && !e.rammer && !e.sweeper && !e.burster) {
      spawnShipDeath(e);
      damagePlayer('The enemy reached the ship!');
      return false;
    }

    return true;
  });

  if (pendingEnemies.length) { enemies.push(...pendingEnemies); pendingEnemies = []; }
  // Explosions
  updateShards();
  explosions = explosions.filter(p => {
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.96; p.vy *= 0.96;
    p.life -= p.decay;
    return p.life > 0;
  });
}

// --- Draw: yuvarlak köşe yardımcısı ---
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// --- Menü kartı illüstrasyonları (bölgeye göre) ---
function drawCardArt(i, cx, CY, CW) {
  const px = cx + CW * 0.62, py = CY + 140;
  if (i === 0) {
    // Dekoratif gezegen + halka
    const pg = ctx.createRadialGradient(px, py, 20, px, py, 80);
    pg.addColorStop(0, '#1a4aaa'); pg.addColorStop(0.5, '#0a2060'); pg.addColorStop(1, '#040820');
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.arc(px, py, 72, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(100,160,255,0.35)'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.ellipse(px, py + 8, 105, 22, -0.3, 0, Math.PI * 2); ctx.stroke();
  } else if (i === 1) {
    // Asteroid kümesi
    [[px, py, 46], [px - 110, py - 50, 22], [px - 70, py + 70, 30], [px + 40, py - 85, 16], [px - 140, py + 30, 14]].forEach(([ax, ay, r], k) => {
      ctx.save(); ctx.translate(ax, ay); ctx.rotate(k);
      ctx.fillStyle = k === 0 ? '#6a4a2e' : '#7a5535'; ctx.strokeStyle = '#9a7050'; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let j = 0; j < 8; j++) {
        const a = j / 8 * Math.PI * 2, rr = r * (0.75 + 0.25 * Math.sin(j * 2.3 + k));
        j === 0 ? ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    });
  } else if (i === 2) {
    // Nebula bulutları + gizli komuta merkezi
    [[px, py, 110, 'rgba(160,50,200,0.45)'], [px - 120, py + 40, 90, 'rgba(200,50,150,0.35)'], [px - 60, py - 60, 80, 'rgba(50,150,190,0.3)']].forEach(([gx, gy, gr, gc]) => {
      const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
      g.addColorStop(0, gc); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(gx, gy, gr, 0, Math.PI * 2); ctx.fill();
    });
    ctx.strokeStyle = 'rgba(80,240,220,0.6)'; ctx.lineWidth = 2;
    ctx.strokeRect(px - 30, py - 12, 60, 24);
    ctx.beginPath(); ctx.moveTo(px, py - 12); ctx.lineTo(px, py - 34); ctx.stroke();
  } else {
    // Kara delik
    const halo = ctx.createRadialGradient(px - 30, py, 30, px - 30, py, 130);
    halo.addColorStop(0, 'rgba(255,120,40,0.4)'); halo.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(px - 30, py, 130, 0, Math.PI * 2); ctx.fill();
    for (let k = 0; k < 3; k++) {
      ctx.strokeStyle = `rgba(255,${160 - k * 30},${70 + k * 20},${0.7 - k * 0.15})`; ctx.lineWidth = 5 - k;
      ctx.beginPath(); ctx.ellipse(px - 30, py, 90 + k * 14, 18 + k * 4, -0.2, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(px - 30, py, 40, 0, Math.PI * 2); ctx.fill();
  }
  // Küçük düşman silüetleri
  [[cx + 55, CY + 80, 0.55], [cx + 90, CY + 210, 0.45], [cx + 195, CY + 195, 0.5]].forEach(([ex, ey, sc]) => {
    ctx.save(); ctx.translate(ex, ey); ctx.scale(sc, sc);
    ctx.fillStyle = 'rgba(255,34,68,0.55)';
    ctx.beginPath();
    ctx.moveTo(0,16); ctx.lineTo(-14,-14); ctx.lineTo(-6,-8); ctx.lineTo(0,-16); ctx.lineTo(6,-8); ctx.lineTo(14,-14);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  });
}

// --- Ana menü: sektör kartları ---
const UI_FONT = "'Orbitron', 'Exo 2', sans-serif";
const MONO_FONT = "'Exo 2', sans-serif"; // küçük etiketler (eskiden Share Tech Mono)
const SECTOR_COLORS = ['#3fd3ff', '#ffc531', '#ff4fd8', '#ff7a2f'];
// Kart görselleri (yoksa çizimle yedeklenir)
const CARD_IMG_SRC = ['ASSETS/cards/deep-space.jpg', 'ASSETS/cards/asteroid-belt.jpg', 'ASSETS/cards/nebula.jpg', 'ASSETS/cards/black-hole.jpg'];
const cardImgs = CARD_IMG_SRC.map(src => { if (!src) return null; const im = new Image(); im.src = src; return im; });
// Harf aralıklı metin; maxW'ya sığmazsa yazı küçülür
function drawSpaced(text, x, y, size, weight, family, spacing, maxW, align = 'center') {
  let sz = size;
  const width = s => { ctx.font = `${weight} ${s}px ${family}`; return ctx.measureText(text).width + spacing * (s / size) * (text.length - 1); };
  while (maxW && width(sz) > maxW && sz > 8) sz -= 0.5;
  const total = width(sz), sp = spacing * (sz / size);
  let cx = align === 'center' ? x - total / 2 : x;
  const prevAlign = ctx.textAlign;
  ctx.textAlign = 'left';
  for (const ch of text) { ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + sp; }
  ctx.textAlign = prevAlign; // çağıranın hizalamasını bozma
}
// Köşeleri kesik çerçeve
function chamferPath(x, y, w, h, c) {
  ctx.beginPath();
  ctx.moveTo(x + c, y); ctx.lineTo(x + w - c, y); ctx.lineTo(x + w, y + c);
  ctx.lineTo(x + w, y + h - c); ctx.lineTo(x + w - c, y + h); ctx.lineTo(x + c, y + h);
  ctx.lineTo(x, y + h - c); ctx.lineTo(x, y + c); ctx.closePath();
}
// Kart çerçevesi (referans çizime göre, 300×560 ölçeğinde):
// dışta kalın parlak çizgi, içte ona paralel ince çizgi; sol üstte koyu sekme,
// sağ üstte basamak + üstünde ince çizgi, altta sol taraf yüksek, sağ altta //// yuvası
function polyPath(x, y, pts) {
  ctx.beginPath();
  pts.forEach(([px, py], k) => k ? ctx.lineTo(x + px, y + py) : ctx.moveTo(x + px, y + py));
  ctx.closePath();
}
function cardOuterPts(w, h) {
  return [
    [0, 32], [31, 0], [180, 0], [193, 15], [w - 22, 15], [w, 35],   // üst: sekme + basamak
    [w, h - 32], [w - 27, h - 3],                                     // sağ alt pah
    [101, h - 3], [92, h - 14], [31, h - 14], [0, h - 32],            // alt: sol taraf yüksek
  ];
}
function cardInnerPts(w, h) {
  return [
    [10, 68], [30, 49], [161, 49], [186, 22], [w - 25, 22], [w - 10, 38],
    [w - 10, h - 36], [w - 31, h - 13],
    [106, h - 13], [97, h - 23], [35, h - 23], [10, h - 38],
  ];
}
function drawCardFrame(cx, CY, CW, CH, col, glow) {
  // Gövde
  polyPath(cx, CY, cardOuterPts(CW, CH));
  const bg = ctx.createLinearGradient(0, CY, 0, CY + CH);
  bg.addColorStop(0, '#071022'); bg.addColorStop(1, '#040814');
  ctx.fillStyle = bg; ctx.fill();
  // Sol üst koyu sekme (dış ve iç çizgi arasında)
  polyPath(cx, CY, [[2, 33], [32, 2], [179, 2], [189, 14], [160, 47], [30, 47], [9, 68], [2, 68]]);
  ctx.fillStyle = '#031017'; ctx.fill();
  // Dış çizgi: önce geniş parlama, sonra net çekirdek
  polyPath(cx, CY, cardOuterPts(CW, CH));
  ctx.strokeStyle = col; ctx.lineJoin = 'miter';
  ctx.lineWidth = 5; ctx.globalAlpha = glow ? 0.55 : 0.35;
  ctx.shadowColor = col; ctx.shadowBlur = glow ? 18 : 8;
  ctx.stroke();
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  ctx.lineWidth = 2.6; ctx.stroke();
  // İç ince paralel çizgi
  polyPath(cx, CY, cardInnerPts(CW, CH));
  ctx.lineWidth = 1.3; ctx.globalAlpha = 0.85; ctx.stroke();
  ctx.globalAlpha = 1;
  // Sağ üst basamağın üstündeki ayrı ince çizgi
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx + 196, CY + 7); ctx.lineTo(cx + 248, CY + 7); ctx.lineTo(cx + 252, CY + 10); ctx.stroke();
  // Sol alttaki ayrı ince çizgi
  ctx.beginPath(); ctx.moveTo(cx + 34, CY + CH - 6); ctx.lineTo(cx + 66, CY + CH - 6); ctx.stroke();
  // Sağ alt //// yuvası
  polyPath(cx, CY, [[206, CH - 13], [244, CH - 13], [238, CH - 3], [200, CH - 3]]);
  ctx.fillStyle = '#031017'; ctx.fill();
  ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = col;
  for (let k = 0; k < 4; k++) {
    const sx = cx + 208 + k * 8;
    ctx.beginPath(); ctx.moveTo(sx, CY + CH - 5); ctx.lineTo(sx + 4, CY + CH - 5); ctx.lineTo(sx + 8, CY + CH - 11); ctx.lineTo(sx + 4, CY + CH - 11); ctx.closePath(); ctx.fill();
  }
}

// Kart ölçüleri — çizim ve dokunma alanı aynı yerden
const MENU_Y = 48; // başlık + kart grubunu dikeyde ortalamak için kaydırma
const CARD = { w: 300, h: 560, y: 118 + MENU_Y };
const CARD_PLAY = { w: 220, h: 48, dy: 474 }; // kart üstünden uzaklık
function drawMenu() {
  ctx.fillStyle = '#03040d';
  ctx.fillRect(0, 0, W, H);
  drawStars();

  // Başlık + kanat çizgileri
  ctx.save();
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#8ef0ff'; ctx.shadowColor = '#3fd3ff'; ctx.shadowBlur = 16;
  ctx.translate(0, MENU_Y);
  drawSpaced('SPACE SHOOTER', W / 2, 46, 26, 700, UI_FONT, 2, W - 110);
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(63,211,255,0.75)'; ctx.lineWidth = 1.5;
  [-1, 1].forEach(s => {
    ctx.beginPath();
    ctx.moveTo(W / 2 + s * 140, 34); ctx.lineTo(W / 2 + s * 160, 50); ctx.lineTo(W / 2 + s * 186, 50);
    ctx.moveTo(W / 2 + s * 150, 41); ctx.lineTo(W / 2 + s * 184, 41);
    ctx.stroke();
  });
  ctx.beginPath(); ctx.moveTo(W / 2 - 140, 60); ctx.lineTo(W / 2 + 140, 60); ctx.strokeStyle = 'rgba(63,211,255,0.35)'; ctx.stroke();
  let gameDone = false;
  try { gameDone = localStorage.getItem('ss_complete') === '1'; } catch(e) {}
  ctx.fillStyle = devMode ? '#ffd23a' : gameDone ? '#ffd23a' : 'rgba(220,240,255,0.75)';
  drawSpaced(devMode ? 'TEST MODE' : gameDone ? 'GAME COMPLETE' : 'SELECT A SECTOR', W / 2, 80, 11, 600, MONO_FONT, 5);
  ctx.restore();

  const { w: CW, h: CH, y: CY } = CARD;
  const GAP = W - 60; // kartlar arası mesafe (menuAnimX ile aynı birim)

  MENU_CARDS.forEach((card, i) => {
    const cx = W / 2 - CW / 2 + i * GAP - menuAnimX;
    if (cx > W + CW || cx < -CW) return;
    const locked = isZoneLocked(i);
    const col = locked ? '#3a3f5c' : SECTOR_COLORS[i];
    ctx.save();
    // Seçili kart %100, komşular uzaklaştıkça %92'ye küçülür ve kararır
    const dist = Math.min(1, Math.abs(cx + CW / 2 - W / 2) / GAP);
    const csc = 1 - 0.08 * dist;
    ctx.translate(cx + CW / 2, CY + CH / 2); ctx.scale(csc, csc); ctx.translate(-(cx + CW / 2), -(CY + CH / 2));

    // Çerçeve
    drawCardFrame(cx, CY, CW, CH, col, !locked && i === menuIdx);

    // Görsel penceresi
    const ax = cx + 20, ay = CY + 60, aw = CW - 40, ah = 318;
    ctx.save();
    chamferPath(ax, ay, aw, ah, 16); ctx.clip();
    ctx.fillStyle = card.col1; ctx.fillRect(ax, ay, aw, ah);
    const img = cardImgs[i];
    if (img && img.complete && img.naturalWidth) {
      // cover: pencereyi doldur, ortala
      const sc = Math.max(aw / img.naturalWidth, ah / img.naturalHeight);
      const iw = img.naturalWidth * sc, ih = img.naturalHeight * sc;
      ctx.drawImage(img, ax + (aw - iw) / 2, ay + (ah - ih) / 2, iw, ih);
    } else {
      drawCardArt(i, cx, CY + 40, CW);
    }
    // Alttan karartma: gemi ve yazı öne çıksın
    const fade = ctx.createLinearGradient(0, ay + ah * 0.55, 0, ay + ah);
    fade.addColorStop(0, 'rgba(4,8,20,0)'); fade.addColorStop(1, 'rgba(4,8,20,0.65)');
    ctx.fillStyle = fade; ctx.fillRect(ax, ay, aw, ah);
    if (locked) { ctx.fillStyle = 'rgba(3,4,13,0.72)'; ctx.fillRect(ax, ay, aw, ah); }
    ctx.restore();
    chamferPath(ax, ay, aw, ah, 16);
    ctx.strokeStyle = col; ctx.globalAlpha = 0.3; ctx.lineWidth = 0.8; ctx.stroke();
    ctx.globalAlpha = 1;

    if (locked) {
      // Kilit
      const lx = cx + CW / 2, ly = ay + ah / 2;
      ctx.strokeStyle = '#59607f'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(lx, ly - 12, 14, Math.PI, 0); ctx.stroke();
      ctx.fillStyle = '#59607f'; rrect(lx - 22, ly - 12, 44, 34, 6); ctx.fill();
      ctx.fillStyle = '#03040d'; ctx.beginPath(); ctx.arc(lx, ly + 2, 5, 0, Math.PI * 2); ctx.fill();
    }

    // "SECTOR 0X" etiketi
    ctx.textBaseline = 'middle';
    ctx.fillStyle = locked ? col : '#ffffff';
    if (!locked) { ctx.shadowColor = col; ctx.shadowBlur = 10; }
    drawSpaced('SECTOR', cx + 30, CY + 25, 13, 700, UI_FONT, 2.5, null, 'left');
    ctx.fillStyle = col;
    drawSpaced(`0${i + 1}`, cx + 122, CY + 25, 15, 700, UI_FONT, 2, null, 'left');
    ctx.shadowBlur = 0;

    // İsim + alt başlık
    ctx.fillStyle = locked ? '#6a7090' : '#f2f8ff';
    drawSpaced(card.name.toUpperCase(), cx + CW / 2, CY + 412, 21, 700, UI_FONT, 4, CW - 40);
    ctx.fillStyle = locked ? '#4a5070' : col;
    drawSpaced(locked ? 'Defeat the previous boss' : card.sub, cx + CW / 2, CY + 442, 12, 600, MONO_FONT, 0.6, CW - 40);

    // PLAY butonu
    const bx = cx + CW / 2 - CARD_PLAY.w / 2, by = CY + CARD_PLAY.dy;
    chamferPath(bx, by, CARD_PLAY.w, CARD_PLAY.h, 14);
    const pg = ctx.createLinearGradient(0, by, 0, by + CARD_PLAY.h);
    if (locked) { pg.addColorStop(0, '#0b0e1c'); pg.addColorStop(1, '#080a14'); }
    else { pg.addColorStop(0, col + '55'); pg.addColorStop(1, col + '18'); } // bölge renginde dolgu
    ctx.fillStyle = '#060a18'; ctx.fill();
    ctx.fillStyle = pg; ctx.fill();
    ctx.strokeStyle = locked ? '#3a3f5c' : col; ctx.lineWidth = 2;
    if (!locked && i === menuIdx) { ctx.shadowColor = col; ctx.shadowBlur = 14; }
    ctx.stroke(); ctx.shadowBlur = 0;
    ctx.fillStyle = locked ? '#59607f' : '#eafcff';
    if (locked) {
      drawSpaced('LOCKED', bx + CARD_PLAY.w / 2, by + CARD_PLAY.h / 2 + 1, 16, 700, UI_FONT, 3);
    } else {
      drawSpaced('PLAY', bx + CARD_PLAY.w / 2, by + CARD_PLAY.h / 2 + 1, 16, 700, UI_FONT, 4);
    }
    // Komşu kartı karart (seçili kart öne çıksın)
    if (dist > 0.02) {
      polyPath(cx, CY, cardOuterPts(CW, CH));
      ctx.fillStyle = `rgba(3,4,13,${0.5 * dist})`; ctx.fill();
    }

    ctx.restore();
  });

  // Oklar
  [[menuIdx > 0, 22, '‹'], [menuIdx < MENU_CARDS.length - 1, W - 22, '›']].forEach(([show, ax, ch]) => {
    if (!show) return;
    ctx.save(); ctx.globalAlpha = 0.75;
    ctx.fillStyle = 'rgba(63,211,255,0.15)';
    ctx.beginPath(); ctx.arc(ax, CY + CH / 2, 17, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3fd3ff'; ctx.font = `700 22px ${TEXT_FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(ch, ax, CY + CH / 2 - 1);
    ctx.restore();
  });

  // Sayfa göstergesi
  ctx.save();
  let dx = W / 2 - (22 + 3 * 12 + 3 * 8) / 2;
  MENU_CARDS.forEach((_, i) => {
    const active = i === menuIdx, w = active ? 22 : 12;
    ctx.fillStyle = active ? SECTOR_COLORS[i] : '#2a3350';
    if (active) { ctx.shadowColor = SECTOR_COLORS[i]; ctx.shadowBlur = 8; }
    rrect(dx, CY + CH + 24, w, 6, 3); ctx.fill();
    ctx.shadowBlur = 0;
    dx += w + 8;
  });

  // DEV butonu (sağ alt köşe)
  ctx.font = `700 11px ${TEXT_FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = devMode ? 'rgba(255,200,0,0.25)' : 'rgba(255,255,255,0.08)';
  ctx.fillRect(W - 52, H - 36, 44, 26);
  ctx.strokeStyle = devMode ? 'rgba(255,200,0,0.6)' : 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 1;
  ctx.strokeRect(W - 52, H - 36, 44, 26);
  ctx.fillStyle = devMode ? '#fc0' : 'rgba(255,255,255,0.4)';
  ctx.fillText('DEV', W - 30, H - 23);
  if (devMode) { // RESET: ilk dokunuşta SURE?, ikincide sıfırlar
    const armed = resetConfirmT > 0;
    ctx.fillStyle = armed ? 'rgba(255,34,68,0.3)' : 'rgba(255,255,255,0.08)';
    ctx.fillRect(W - 112, H - 36, 54, 26);
    ctx.strokeStyle = armed ? 'rgba(255,77,102,0.8)' : 'rgba(255,255,255,0.2)';
    ctx.strokeRect(W - 112, H - 36, 54, 26);
    ctx.fillStyle = armed ? '#ff8a9a' : resetDoneT > 0 ? '#7dffb0' : 'rgba(255,255,255,0.5)';
    ctx.fillText(armed ? 'SURE?' : resetDoneT > 0 ? 'DONE' : 'RESET', W - 85, H - 23);
  }

  // Ses butonu (sol alt köşe)
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillRect(8, H - 36, 52, 26);
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.strokeRect(8, H - 36, 52, 26);
  ctx.fillStyle = Sound.muted ? 'rgba(255,255,255,0.35)' : '#0cf';
  ctx.fillText(Sound.muted ? '♪ OFF' : '♪ ON', 34, H - 23);
  ctx.restore();
}

}
let mapPress = null; // { i, lv, t } — dokunma geri bildirimi, ardından bölüm başlar
let mapShip = null;  // { zone, p }: haritadaki gemi; bölüm bitince yeni hedefe uçar
function mapPathY(p) { // p: 0 = giriş, 1 = ilk durak … 5 = boss, 6 = çıkış
  const stop = k => {
    if (k <= 0) return MAP_PATH_IN;
    if (k >= 6) return MAP_PATH_OUT;
    const R = mapNodeRect(k - 1); return R.y + R.h / 2;
  };
  const k = Math.max(0, Math.min(5, Math.floor(p))), t = Math.max(0, Math.min(1, p - k));
  return stop(k) + (stop(k + 1) - stop(k)) * t;
}
function drawMapPath(zc, base, nextI) {
  const reached = nextI < 0 ? 5 : nextI; // bitirilen durak sayısı
  const target = reached + 0.62;         // gemi sıradaki durağa yaklaşmış bekler
  if (!mapShip || mapShip.zone !== currentZone || mapShip.p > target) mapShip = { zone: currentZone, p: target };
  if (mapShip.p < target) mapShip.p = Math.min(target, mapShip.p + 0.014);
  const X = MAP_PATH_X, shipY = mapPathY(mapShip.p), pulse = 0.5 + 0.5 * Math.sin(frameCount * 0.08);

  // Yol: geminin geçtiği kısım dolu, kalan kısım kesikli
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2.5; ctx.setLineDash([3, 10]);
  ctx.beginPath(); ctx.moveTo(X, shipY); ctx.lineTo(X, MAP_PATH_OUT); ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle = zc; ctx.lineWidth = 3; ctx.shadowColor = zc; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.moveTo(X, MAP_PATH_IN); ctx.lineTo(X, shipY); ctx.stroke();
  ctx.shadowBlur = 0;

  // Giriş ve çıkış
  const [from, to] = MAP_ENDS[currentZone];
  [[MAP_PATH_IN, from, zc], [MAP_PATH_OUT, to, nextI < 0 ? zc : 'rgba(220,230,250,0.6)']].forEach(([y, label, col]) => {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(X, y - 6); ctx.lineTo(X + 6, y); ctx.lineTo(X, y + 6); ctx.lineTo(X - 6, y); ctx.closePath(); ctx.fill();
    drawSpaced(label, X + 16, y, 10, 600, MONO_FONT, 2, null, 'left');
  });

  // Duraklar: her kartın hizasında nokta + karta giden kısa çizgi
  for (let i = 0; i < 5; i++) {
    const R = mapNodeRect(i), y = R.y + R.h / 2, st = levelStates[base + i];
    const locked = st === 'locked', isNext = i === nextI, isBoss = i === 4;
    const col = locked ? 'rgba(150,160,190,0.45)' : isBoss ? '#ff4d66' : zc, r = isBoss ? 7 : 5.5;
    ctx.strokeStyle = col; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(X + r, y); ctx.lineTo(R.x, y); ctx.stroke();
    if (isNext) { ctx.globalAlpha = 0.6 * (1 - pulse); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(X, y, r + 3 + pulse * 7, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1; }
    ctx.beginPath(); ctx.arc(X, y, r, 0, Math.PI * 2);
    ctx.fillStyle = st === 'completed' ? col : '#070a18'; ctx.fill();
    ctx.lineWidth = 2; ctx.stroke();
  }

  // Gemi
  if (spaceshipImg.complete && spaceshipImg.naturalWidth) {
    ctx.save();
    ctx.shadowColor = zc; ctx.shadowBlur = 12;
    ctx.drawImage(spaceshipImg, X - 21, shipY + Math.sin(frameCount * 0.06) * 2 - 21, 42, 42);
    ctx.restore();
  }
}

function drawMap() {
  const zc = SECTOR_COLORS[currentZone - 1];
  // Arka plan: bölge görseli, oyundakinden daha koyu
  if (drawZoneBackdrop(currentZone)) { ctx.fillStyle = 'rgba(2,3,12,0.55)'; ctx.fillRect(0, 0, W, H); }
  else { ctx.fillStyle = '#03040d'; ctx.fillRect(0, 0, W, H); drawStars(); }

  ctx.save();
  ctx.textBaseline = 'middle';
  // Üst satır: geri + sektör
  ctx.fillStyle = zc;
  ctx.beginPath(); ctx.moveTo(22, 26); ctx.lineTo(15, 32); ctx.lineTo(22, 38); ctx.lineWidth = 2; ctx.strokeStyle = zc; ctx.stroke();
  drawSpaced('BACK', 30, 32, 13, 700, TEXT_FONT, 2, null, 'left');
  ctx.fillStyle = 'rgba(220,235,255,0.6)';
  ctx.textAlign = 'right';
  drawSpaced(`SECTOR 0${currentZone}`, W - 16 - 92, 32, 11, 600, MONO_FONT, 2.5, null, 'left');

  // Başlık + ilerleme
  const base = (currentZone - 1) * 5;
  const done = levelStates.slice(base, base + 5).filter(st => st === 'completed').length;
  ctx.fillStyle = '#fff'; ctx.shadowColor = zc; ctx.shadowBlur = 16;
  drawSpaced(MENU_CARDS[currentZone - 1].name.toUpperCase(), W / 2, 104, 24, 700, UI_FONT, 3, W - 40);
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(200,225,255,0.7)';
  drawSpaced(`MISSION PROGRESS  ·  ${done} / 5`, W / 2, 138, 11, 600, MONO_FONT, 2);
  // küçük ilerleme şeridi
  for (let k = 0; k < 5; k++) {
    const sx = W / 2 - 62 + k * 26;
    ctx.beginPath(); ctx.moveTo(sx + 3, 154); ctx.lineTo(sx + 22, 154); ctx.lineTo(sx + 19, 160); ctx.lineTo(sx, 160); ctx.closePath();
    ctx.fillStyle = k < done ? zc : 'rgba(255,255,255,0.12)'; ctx.fill();
  }

  // Sıradaki görev: kilidi açık, tamamlanmamış ilk bölüm
  let nextI = -1;
  for (let i = 0; i < 5; i++) if (levelStates[base + i] === 'unlocked') { nextI = i; break; }
  drawMapPath(zc, base, nextI);

  for (let i = 0; i < 5; i++) {
    const R = mapNodeRect(i), st = levelStates[base + i], lv = base + i + 1;
    const isBoss = i === 4, isNext = i === nextI, locked = st === 'locked', completed = st === 'completed';
    const pressed = mapPress && mapPress.i === i;
    const pulse = 0.5 + 0.5 * Math.sin(frameCount * 0.08);
    const accent = locked ? 'rgba(150,160,190,0.35)' : completed ? zc : isBoss ? '#ff4d66' : zc;
    ctx.save();
    const sc = pressed ? 1 + 0.06 * Math.sin(Math.min(1, mapPress.t / 10) * Math.PI) : 1;
    const cx = R.x + R.w / 2;
    ctx.translate(cx, R.y + R.h / 2); ctx.scale(sc, sc); ctx.translate(-cx, -(R.y + R.h / 2));
    chamferPath(R.x, R.y, R.w, R.h, 12);
    const g = ctx.createLinearGradient(0, R.y, 0, R.y + R.h);
    if (locked) { g.addColorStop(0, 'rgba(14,16,30,0.9)'); g.addColorStop(1, 'rgba(8,9,18,0.9)'); }
    else if (completed) { g.addColorStop(0, zc + '38'); g.addColorStop(1, zc + '14'); } // tamamlanan: bölge rengiyle hafif dolu
    else if (isBoss) { g.addColorStop(0, 'rgba(70,14,36,0.85)'); g.addColorStop(1, 'rgba(32,6,18,0.9)'); }
    else { g.addColorStop(0, 'rgba(12,36,62,0.85)'); g.addColorStop(1, 'rgba(6,16,32,0.9)'); }
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = accent; ctx.lineWidth = isNext || pressed ? 2.2 : 1.5;
    if (isNext || pressed) { ctx.shadowColor = accent; ctx.shadowBlur = pressed ? 24 : 8 + 10 * pulse; }
    ctx.stroke(); ctx.shadowBlur = 0;
    // iç ince çizgi
    ctx.globalAlpha = 0.35; ctx.lineWidth = 1; chamferPath(R.x + 5, R.y + 5, R.w - 10, R.h - 10, 9); ctx.stroke(); ctx.globalAlpha = 1;

    const cy = R.y + R.h / 2;
    const brief = LEVEL_BRIEFS[lv];
    const title = isBoss ? BOSS_NAMES[currentZone] : brief ? brief.title : `LEVEL ${String(i + 1).padStart(2, '0')}`;
    ctx.fillStyle = locked ? 'rgba(200,210,230,0.45)' : '#fff';
    drawSpaced(title, R.x + 54, cy, isBoss ? 18 : 15, 700, UI_FONT, 3, R.w - 78, 'left');

    // Sol simge: tik / kilit / sıradaki görev
    const ix = R.x + 28;
    ctx.strokeStyle = accent; ctx.fillStyle = accent; ctx.lineWidth = 2.2;
    if (completed) {
      ctx.beginPath(); ctx.moveTo(ix - 7, cy); ctx.lineTo(ix - 2, cy + 5); ctx.lineTo(ix + 8, cy - 6); ctx.stroke();
    } else if (locked) {
      ctx.beginPath(); ctx.arc(ix, cy - 4, 5, Math.PI, 0); ctx.stroke();
      ctx.fillRect(ix - 7, cy - 4, 14, 10);
    } else {
      // sıradaki görev: nabız gibi atan elmas işareti
      ctx.globalAlpha = 0.6 + 0.4 * pulse;
      ctx.beginPath(); ctx.moveTo(ix, cy - 7); ctx.lineTo(ix + 6, cy); ctx.lineTo(ix, cy + 7); ctx.lineTo(ix - 6, cy); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }
  ctx.restore();
}

// --- Collect effect ---
function spawnCollectEffect(x, y, color) {
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * Math.PI * 2;
    const spd = Math.random() * 2.5 + 1;
    explosions.push({
      x, y,
      vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
      life: 1, decay: 0.04,
      r: Math.random() * 3 + 1.5,
      color,
    });
  }
}

// --- Draw: Bölüm sonucu (normal bölüm ve boss zaferi aynı kart) ---
const RESULT_CARD = { x: 30, y: H / 2 - 150, w: W - 60, h: 210 };
const RESULT_BTN  = { label: 'CONTINUE', x: BTN_X, y: H / 2 - 22, w: BTN_W, h: BTN_H };
const RESULT_BTN_AT = 40;
function drawResult() {
  const vt = victoryTime;
  const isBoss = levelCompleteType === 'boss';
  const accent = SECTOR_COLORS[currentZone - 1];
  const ease = t => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);
  const appear = ease(vt / 22);
  const C = RESULT_CARD;

  ctx.save();
  ctx.fillStyle = `rgba(0,0,12,${0.78 * appear})`;
  ctx.fillRect(0, 0, W, H);

  // Kart
  ctx.globalAlpha = appear;
  ctx.translate(W / 2, C.y + C.h / 2);
  const sc = 0.88 + 0.12 * appear;
  ctx.scale(sc, sc);
  ctx.translate(-W / 2, -(C.y + C.h / 2));
  const g = ctx.createLinearGradient(0, C.y, 0, C.y + C.h);
  g.addColorStop(0, '#0c1838'); g.addColorStop(1, '#050a1c');
  ctx.fillStyle = g;
  ctx.shadowColor = accent; ctx.shadowBlur = 24;
  chamferPath(C.x, C.y, C.w, C.h, 18); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = accent; ctx.lineWidth = 2;
  chamferPath(C.x, C.y, C.w, C.h, 18); ctx.stroke();
  ctx.globalAlpha *= 0.5; ctx.lineWidth = 1;
  chamferPath(C.x + 6, C.y + 6, C.w - 12, C.h - 12, 14); ctx.stroke();
  ctx.globalAlpha = appear;

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `700 11px ${TEXT_FONT}`; ctx.fillStyle = 'rgba(200,230,255,0.65)';
  const label = isBoss ? `${BOSS_NAMES[currentZone]} DEFEATED` : `${MENU_CARDS[currentZone - 1].name.toUpperCase()} · LEVEL ${currentLevel}`;
  ctx.fillText(label, W / 2, C.y + 40);
  const title = isBoss ? (currentLevel === LEVEL_COUNT ? 'VICTORY' : 'ZONE CLEAR') : 'LEVEL CLEAR';
  ctx.fillStyle = '#fff';
  ctx.shadowColor = accent; ctx.shadowBlur = 14;
  drawSpaced(title, W / 2, C.y + 82, 24, 700, UI_FONT, 3, C.w - 40);
  ctx.shadowBlur = 0;
  // ışık süpürmesi: yazının üstünden bir kez soldan sağa geçer
  const sw = (vt - 14) / 26;
  if (sw > 0 && sw < 1) {
    const sx = C.x - 40 + (C.w + 80) * sw;
    const lg = ctx.createLinearGradient(sx - 40, 0, sx + 40, 0);
    lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(0.5, accent); lg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = lg;
    drawSpaced(title, W / 2, C.y + 82, 24, 700, UI_FONT, 3, C.w - 40);
  }

  ctx.restore();

  // Başlıktan yayılan iki ince halka (düşman patlamasıyla aynı dil) + bölge renginde kıvılcımlar
  ctx.save();
  [0, 9].forEach(d => {
    const t = (vt - 8 - d) / 34;
    if (t <= 0 || t >= 1) return;
    const e = 1 - (1 - t) * (1 - t);
    ctx.globalAlpha = (1 - t) * 0.55; ctx.strokeStyle = accent; ctx.lineWidth = 0.8 + 2 * (1 - t);
    ctx.beginPath(); ctx.ellipse(W / 2, C.y + 82, 70 + e * 85, 22 + e * 30, 0, 0, Math.PI * 2); ctx.stroke();
  });
  victoryParticles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  });
  ctx.restore();

  if (vt > RESULT_BTN_AT) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, (vt - RESULT_BTN_AT) / 15);
    drawButton(RESULT_BTN, true);
    ctx.restore();
  }
}

// --- Render ---
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (hurtFx > 0 && (state === 'play' || state === 'gameover')) { const k = hurtFx / 26 * 5; ctx.translate((Math.random() - 0.5) * k, (Math.random() - 0.5) * k); }

  if (state === 'intro') { drawIntro(); return; }
  if (state === 'zonetransition') { drawZoneTransition(); return; }
  if (state === 'menu') { drawMenu(); return; }
  if (state === 'map') { drawMap(); return; }

  if (!drawZoneBackdrop(currentZone)) {
    // Görsel yüklenmediyse eski çizim arkaplanları
    if (currentZone === 2) drawZone2Background();
    else if (currentZone === 3) drawZone3Background();
    else if (currentZone === 4) drawZone4Background();
    else { ctx.fillStyle = '#000010'; ctx.fillRect(0, 0, W, H); drawStars(); }
  }
  drawLanes();
  drawShards();
  drawExplosions();

  if (currentLevel === 7 && state !== 'levelcomplete') drawStealth();
  if (currentLevel === 8) drawTunnel();
  if (currentLevel === 8 && drillSpd > 0) drawMineBack();
  asteroids.forEach(drawAsteroid);
  drawIonClouds();
  if (slalomOutro > 0 && currentLevel !== 9) drawMineSilhouette();
  drawCrystals();
  bullets.forEach(b => {
    if (currentLevel === 9 && !boss) ctx.globalAlpha = bulletAlpha(b);
    drawBullet(b);
    ctx.globalAlpha = 1;
  });
  drawSnakeBodies();
  drawLinks();
  if (currentLevel === 13) drawWarp();
  if (currentLevel === 14 && state === 'play') drawStream();
  enemies.forEach(drawEnemy);
  drawRecoilFx('under');
  if (boss) drawBoss(boss);
  drawRecoilFx('top');
  if (currentLevel === 12 && stormClouds.length) drawStormClouds();
  if (currentZone === 3) { const fc = getLevelConfig(); drawFog(fc && fc.fog ? fc.fog : 0.4); } // sis düşmanları örter, mermileri değil
  if (radarOn()) { drawNebMines(); drawRadar(); }
  if (currentLevel === 12 && state !== 'levelcomplete') drawStorm();
  powerups.forEach(drawPowerup); // güçlendirmeler her zaman net: sisin üstünde
  drawLasers();
  eBullets.forEach(drawEBullet);
  if (digSpd > 0) drawDigger();
  if (drillSpd > 0) drawDrills();
  drawHaulers();
  drawDrifters();
  drawTitanBombs();
  drawAlarmFx();

  if ((state === 'play' || state === 'paused' || state === 'gameover') && !player.dead) {
    drawShip(player.x, player.y);
  }
  if (currentLevel === 7 && state !== 'levelcomplete') drawStealthShadows(); // gölgeye giren gemi kararır
  drawAlarmFx();
  drawHunterAim(); // geminin üstünde: nişangâh gemiyi çevreler


  drawFloatTexts();
  if (state === 'play' && tutorial) drawTutorial();


  if (state === 'gameover') drawOverlay('GAME OVER', deathCause || 'The enemy reached the ship!');

  if (state === 'levelcomplete') drawResult();
  if (state === 'paused') { drawHUD(); drawPause(); return; }

  drawHUD();
  if (state === 'play') drawFeedbackOverlays();
  if (state === 'play' && currentLevel === 14 && !briefing) drawArchiveBar();
  if (state === 'play' && archiveCard) drawArchiveCard();
  if (state === 'play' && introCard) drawIntroCard();
  if (state === 'play' && briefing) drawBriefing();
}

// --- Loop ---
let _lastTime = 0;
let _accum = 0;
const _STEP = 1000 / 60;

// Oynanış hızı: düşman, mermi, gemi kayması, dalga süreleri hep birlikte hızlanır (2026-11-04: kullanıcı
// "yoğunluk yerine hızlandıralım" dedi). Bot kare kare çalıştığından etkisini react/GAME_SPEED ile taklit et.
const GAME_SPEED = 1.2;
function loop(timestamp) {
  requestAnimationFrame(loop);
  if (_lastTime === 0) { _lastTime = timestamp; }
  const delta = Math.min(timestamp - _lastTime, 100);
  _lastTime = timestamp;
  _accum += delta * (state === 'play' && !briefing && !(countdown > 0) && !introCard ? GAME_SPEED : 1); // oynanış hızı (menü, kart, 3-2-1 normal)
  while (_accum >= _STEP) {
    _slowFlip = !_slowFlip;
    if (!(slowMoT > 0 && _slowFlip)) update(); // ağır çekimde her ikinci adım atlanır
    _accum -= _STEP;
  }
  render();
}

// Resim yüklenemezse (anlık ağ hatası) birkaç kez yeniden dene — yoksa tarayıcı onu kalıcı bozuk sayıyor
// ve gemi gibi görseller sayfa yenilenene kadar görünmüyordu.
(function retryBrokenImages() {
  const all = [spaceshipImg, ...enemyImgs, bossImg, bossShieldImg, ...bgImgs, eShotImg, ...Object.values(powerupImgs), ...cardImgs,
    ...Object.values(rockImgs).flat()].filter(Boolean);
  const retry = im => {
    im._tries = (im._tries || 0) + 1;
    if (im._tries > 4) return;
    setTimeout(() => { const base = im.src.split('?')[0]; im.src = base + '?r=' + im._tries; }, 500 * im._tries);
  };
  all.forEach(im => {
    im.addEventListener('error', () => retry(im));
    if (im.complete && !im.naturalWidth) retry(im); // dinleyici eklenmeden önce düşmüş olabilir
  });
})();
if (BOSS_MODE) {
  levelStates = levelStates.map(() => 'unlocked');
  const lv = BOSS_PARAM === '10' ? 10 : 5;
  currentZone = lv === 10 ? 2 : 1;
  startLevel(lv);
  spawnBoss(25);
  if (lv === 10) titanBombs = TITAN_BOMB_NEED;
}

requestAnimationFrame(loop);

// Canvas yazı tiplerini önceden yükle (yüklenene kadar Courier ile çizilir)
if (document.fonts) ['700 20px Orbitron', '500 20px Orbitron', '500 14px "Exo 2"', '600 14px "Exo 2"', '700 14px "Exo 2"'].forEach(f => document.fonts.load(f).catch(() => {}));

// Uygulama arka plana geçince oyunu durdur
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play' && !briefing) state = 'paused'; });

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
