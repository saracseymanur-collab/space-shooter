// --- Draw: Player Bullet ---
function drawTutorial() {
  const step = tutorial.step;
  const dir  = step === 0 ? 1 : -1; // 1=sağ, -1=sol
  const label = step === 0 ? 'SWIPE RIGHT' : 'SWIPE LEFT';

  // Ok animasyonu: ileri-geri kayma + nabız
  const slide   = Math.sin(frameCount * 0.07) * 14;
  const opacity = 0.55 + 0.45 * Math.sin(frameCount * 0.07);

  const cx = W / 2;
  const cy = H - 110;

  ctx.save();
  ctx.globalAlpha = opacity;
  ctx.translate(cx + dir * slide, cy);

  // Ok gövdesi
  const aw = 52, ah = 18, tipW = 30, tipH = 38;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  if (dir === 1) {
    // → sağ ok
    ctx.moveTo(-aw, -ah / 2);
    ctx.lineTo(aw - tipW, -ah / 2);
    ctx.lineTo(aw - tipW, -tipH / 2);
    ctx.lineTo(aw, 0);
    ctx.lineTo(aw - tipW, tipH / 2);
    ctx.lineTo(aw - tipW, ah / 2);
    ctx.lineTo(-aw, ah / 2);
  } else {
    // ← sol ok
    ctx.moveTo(aw, -ah / 2);
    ctx.lineTo(-aw + tipW, -ah / 2);
    ctx.lineTo(-aw + tipW, -tipH / 2);
    ctx.lineTo(-aw, 0);
    ctx.lineTo(-aw + tipW, tipH / 2);
    ctx.lineTo(-aw + tipW, ah / 2);
    ctx.lineTo(aw, ah / 2);
  }
  ctx.closePath();
  ctx.fill();

  // Yazı
  ctx.globalAlpha = opacity;
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 15px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText(label, 0, 28);

  ctx.restore();
}

function drawBullet(b) {
  ctx.save();
  ctx.translate(b.x, b.y);
  const BULLET_COLORS = {
    triple: ['rgba(180,255,200,1)', 'rgba(0,220,100,0.8)'],  // yeşil
    double: ['rgba(255,255,80,1)',  'rgba(255,180,0,0.8)'],   // sarı
    normal: ['rgba(255,255,180,1)', 'rgba(0,220,255,0.8)'],   // mavi/beyaz
    overdrive: ['rgba(255,250,200,1)', 'rgba(255,190,40,0.9)'], // altın
  };
  const color = BULLET_COLORS[b.color] ?? BULLET_COLORS.normal;

  grd.addColorStop(0, color[0]);
  grd.addColorStop(0.4, color[1]);
  grd.addColorStop(1, 'rgba(0,100,255,0)');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(0, 0, 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(0, 0, 2.5, 0, Math.PI * 2);

}

// --- Draw: Power-up ---
// Renkler güçlendirme rozetlerinin (ASSETS/powerups) kenar renkleriyle aynı
const POWERUP_COLORS = { triple: '#4cff3a', double: '#ffe11a', bomb: '#ff2244', shield: '#1fb0ff', fuel: '#44ff66', heart: '#ff4d66' };
const POWERUP_IMG_SRC = { shield: 'ASSETS/powerups/shield.png', triple: 'ASSETS/powerups/triple-shot.png', double: 'ASSETS/powerups/double-shot.png', bomb: 'ASSETS/powerups/bomb.png' };
const powerupImgs = {};
Object.entries(POWERUP_IMG_SRC).forEach(([k, src]) => { const im = new Image(); im.src = src; powerupImgs[k] = im; });
const powerupImgReady = t => powerupImgs[t] && powerupImgs[t].complete && powerupImgs[t].naturalWidth > 0;

function drawPowerupIcon(type, size) {
  ctx.save();
  if (type === 'triple') {
    // Üç mermi
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#00ffaa';
    ctx.shadowBlur = 6;
    for (const sx of [-size * 0.52, 0, size * 0.52]) {
      ctx.beginPath();
      ctx.moveTo(sx, -size * 0.7);
      ctx.lineTo(sx + size * 0.2, size * 0.4);
      ctx.lineTo(sx, size * 0.2);
      ctx.lineTo(sx - size * 0.2, size * 0.4);
      ctx.closePath();
      ctx.fill();
    }
  } else if (type === 'double') {
    // İki mermi
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#ffee00';
    ctx.shadowBlur = 6;
    for (let sx of [-size * 0.38, size * 0.38]) {
      ctx.beginPath();
      ctx.moveTo(sx, -size * 0.7);
      ctx.lineTo(sx + size * 0.25, size * 0.4);
      ctx.lineTo(sx, size * 0.2);
      ctx.lineTo(sx - size * 0.25, size * 0.4);
      ctx.closePath();
      ctx.fill();
    }
  } else if (type === 'shield') {
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#2299ff';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.moveTo(0, -size * 0.75);
    ctx.lineTo(size * 0.65, -size * 0.35);
    ctx.lineTo(size * 0.65, size * 0.1);
    ctx.quadraticCurveTo(0, size * 0.85, 0, size * 0.85);
    ctx.quadraticCurveTo(-size * 0.65, size * 0.1, -size * 0.65, size * 0.1);
    ctx.lineTo(-size * 0.65, -size * 0.35);
    ctx.closePath();
    ctx.fill();
  } else if (type === 'fuel') {
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#44ff66';
    ctx.shadowBlur = 6;
    // Barrel body
    ctx.fillRect(-size * 0.38, -size * 0.55, size * 0.76, size * 0.9);
    // Cap
    ctx.fillRect(-size * 0.22, -size * 0.72, size * 0.44, size * 0.2);
    // Green tint stripe
    ctx.fillStyle = '#88ffaa';
    ctx.fillRect(-size * 0.28, -size * 0.2, size * 0.56, size * 0.22);
  } else {
    // Bomba: daire + patlama çizgileri
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#ff4444';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(0, size * 0.1, size * 0.45, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    const rays = 6;
    for (let i = 0; i < rays; i++) {
      const a = (i / rays) * Math.PI * 2 - Math.PI / 2;
      const r1 = size * 0.55, r2 = size * 0.82;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * r1, size * 0.1 + Math.sin(a) * r1);
      ctx.lineTo(Math.cos(a) * r2, size * 0.1 + Math.sin(a) * r2);
      ctx.stroke();
    }
    // Fitil
    ctx.strokeStyle = '#ff8';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(size * 0.22, -size * 0.32);
    ctx.quadraticCurveTo(size * 0.5, -size * 0.7, size * 0.15, -size * 0.82);
    ctx.stroke();
  }
  ctx.restore();
}

function drawPowerup(p) {

  if (powerupImgReady(p.type)) {
    // tasarım rozeti (ASSETS/powerups) — parıltı kodla eklenir
    ctx.shadowColor = color; ctx.shadowBlur = 8 + 4 * pulse;

  } else {
  // yedek: altıgen gövde, renkli iç dolgu + parlak kenar
  ngonPath(0, 0, 22, 6, -Math.PI / 2);
  const ig = ctx.createRadialGradient(0, -6, 2, 0, 0, 24);
  ig.addColorStop(0, color + '66'); ig.addColorStop(1, 'rgba(6,14,30,0.92)');
  ctx.fillStyle = ig; ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 2.6;
  ctx.shadowColor = color; ctx.shadowBlur = 18 + 10 * pulse;
  ctx.stroke();

  ctx.shadowBlur = 0;
  }
  ctx.restore();
}

function drawExplosions() {

  });

}

function drawBriefing() {
  const B = LEVEL_BRIEFS[currentLevel];
  if (!B) { briefing = false; return; }
  const zc = SECTOR_COLORS[currentZone - 1];
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,12,0.62)';
  ctx.fillRect(0, 0, W, H);

  const cw = W - 48, cx = 24;
  ctx.font = `600 15px ${TEXT_FONT}`;
  // Ana cümle + ipuçları; boş satır araya boşluk koyar
  const lines = [B.line, ...B.tips].flatMap((t, i) => [...(i ? [''] : []), ...wrapText(t, cw - 50).map(r => r.text)]);
  const lineH = 21;
  const ch = 92 + 100 + lines.length * lineH + 22 + 48 + 24;
  const cy = Math.max(HUD_H + 20, H * 0.46 - ch / 2);
  briefCard = { x: cx, y: cy, w: cw, h: ch };

  // Sol üst: kart açıkken durdurma yerine haritaya dönüş
  chamferPath(12, 13, 34, 34, 7);
  ctx.fillStyle = HUD_FILL; ctx.fill();
  ctx.strokeStyle = zc; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#e6f6ff'; ctx.textBaseline = 'middle';
  drawSpaced('MAP', 29, 30, 9, 700, UI_FONT, 0.5);

  chamferPath(cx, cy, cw, ch, 18);
  const g = ctx.createLinearGradient(0, cy, 0, cy + ch);
  g.addColorStop(0, 'rgba(10,22,50,0.96)'); g.addColorStop(1, 'rgba(5,10,26,0.96)');
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = zc; ctx.lineWidth = 2; ctx.shadowColor = zc; ctx.shadowBlur = 14; ctx.stroke(); ctx.shadowBlur = 0;
  ctx.globalAlpha = 0.45; ctx.lineWidth = 1; chamferPath(cx + 6, cy + 6, cw - 12, ch - 12, 14); ctx.stroke(); ctx.globalAlpha = 1;

  ctx.textBaseline = 'middle';
  ctx.fillStyle = zc;
  drawSpaced(`${MENU_CARDS[currentZone - 1].name.toUpperCase()}  ·  LEVEL ${String(currentLevel).padStart(2, '0')}`, W / 2, cy + 30, 11, 600, MONO_FONT, 2.5);
  ctx.fillStyle = '#fff';
  drawSpaced(B.title, W / 2, cy + 62, 20, 700, UI_FONT, 3, cw - 40);

  // Görsel anlatım
  drawBriefVisual(B.vis, W / 2, cy + 92 + 48, zc);

  // Tek temel mekanik
  ctx.font = `600 15px ${TEXT_FONT}`; ctx.fillStyle = '#e8f3ff'; ctx.textAlign = 'center';
  lines.forEach((t, k) => ctx.fillText(t, W / 2, cy + 92 + 100 + lineH / 2 + k * lineH));

  // START butonu
  const bw = 200, bh = 48, bx = W / 2 - bw / 2, by = cy + ch - 24 - bh;
  briefBtn = { x: bx, y: by, w: bw, h: bh };
  chamferPath(bx, by, bw, bh, 14);
  const pg = ctx.createLinearGradient(0, by, 0, by + bh);
  pg.addColorStop(0, '#0c3a48'); pg.addColorStop(1, '#06202c');
  ctx.fillStyle = pg; ctx.fill();
  const pulse = 0.6 + 0.4 * Math.sin(frameCount * 0.08);
  ctx.strokeStyle = zc; ctx.lineWidth = 2; ctx.shadowColor = zc; ctx.shadowBlur = 8 + 8 * pulse; ctx.stroke(); ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  drawSpaced('START', W / 2, by + bh / 2 + 1, 16, 700, UI_FONT, 4);
  ctx.restore();
}

let seenIntro = {};
try { seenIntro = JSON.parse(localStorage.getItem('ss_seen') || '{}') || {}; } catch(e) { seenIntro = {}; }
let introCard = null;   // { key, x, y, t }
let introBtn = null;
function markSeen(key) { seenIntro[key] = 1; try { localStorage.setItem('ss_seen', JSON.stringify(seenIntro)); } catch(e) {} }
// Ekranda yeni bir şey var mı? (oyuncunun tepki verecek vakti olacak yükseklikteyken)
function checkFirstSeen() {
  const vis = y => y > HUD_H + 30 && y < H * 0.62;
  const want = (key, x, y) => { if (!seenIntro[key] && !introCard) { introCard = { key, x, y, t: 0 }; Sound.sfx.click(); } };
  for (const p of powerups) if (FIRST_SEEN[p.type] && vis(p.y)) want(p.type, p.x, p.y);
  for (const c of crystals) if (vis(c.y)) want('crystal', c.x, c.y);
  for (const d of bombDrops) if (vis(d.y)) want('titanBomb', d.x, d.y);
  if (titanCoreOpen()) want('titanCore', boss.x, boss.y);
  if (radarReveal) want('radar', radarReveal.x, radarReveal.y);
  if (mineReveal) want('nebMine', mineReveal.x, mineReveal.y);
  if (currentLevel === 14 && levelPlayT === 40 && streamX) want('stream', streamX, H * 0.45);
  if (warpSeen) { want('warp', warpSeen.x, warpSeen.y); warpSeen = null; }
  for (const B of bolts) if (B.t > 6 && B.t < B.warn - 20) want('bolt', LANE_CENTERS[B.lane], H * 0.3);
  if (overdriveTimer > OVERDRIVE_TIME - 3) want('overdrive', player.x, player.y);
  for (const a of asteroids) {
    if (a.type === 'iron' && vis(a.y)) want('iron', a.x, a.y);
    if (a.type === 'explosive' && vis(a.y)) want('explosive', a.x, a.y);
  }
  for (const L of lasers) if (L.t > 2) want(L.meteor ? 'meteor' : 'beam', LANE_CENTERS[L.lane], H * 0.45);
  for (const e of enemies) if (e.phantom && e.alpha > 0.9 && vis(e.y)) want('phantom', e.x, e.y);
  for (const e of enemies) if (e.runner && e.y > HUD_H + 60) want('runner', e.x, e.y);
  for (const e of enemies) if (e.diveState === 1) want('diver', e.x, e.y);
  for (const c of ionClouds) if (vis(c.y)) want('ion', LANE_CENTERS[c.lane], c.y);
  for (const b of eBullets) if (vis(b.y)) want('shot', b.x, b.y);
}

  const pulse = 0.5 + 0.5 * Math.sin(frameCount * 0.15);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.shadowColor = zc; ctx.shadowBlur = 14;
  ctx.beginPath(); ctx.arc(C.x, C.y, 36 + pulse * 6, 0, Math.PI * 2); ctx.stroke(); ctx.shadowBlur = 0;
  // Kart: nesne üst yarıdaysa altında, alt yarıdaysa üstünde
  ctx.font = `600 14px ${TEXT_FONT}`;
  const lines = wrapText(D.text, W - 110).map(r => r.text);
  const cw = W - 60, ch = 64 + lines.length * 20 + 60, cx = 30;
  const cy = C.y < H / 2 ? Math.min(H - ch - 30, C.y + 60) : Math.max(HUD_H + 20, C.y - 60 - ch);
  // bağlantı çizgisi
  ctx.strokeStyle = zc; ctx.globalAlpha = a * 0.6; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(C.x, C.y + (C.y < H / 2 ? 42 : -42)); ctx.lineTo(Math.max(cx + 30, Math.min(cx + cw - 30, C.x)), C.y < H / 2 ? cy : cy + ch); ctx.stroke();
  ctx.globalAlpha = a;
  chamferPath(cx, cy, cw, ch, 14);
  const bg = ctx.createLinearGradient(0, cy, 0, cy + ch);
  bg.addColorStop(0, 'rgba(10,22,50,0.97)'); bg.addColorStop(1, 'rgba(5,10,26,0.97)');
  ctx.fillStyle = bg; ctx.fill();
  ctx.strokeStyle = zc; ctx.lineWidth = 2; ctx.shadowColor = zc; ctx.shadowBlur = 12; ctx.stroke(); ctx.shadowBlur = 0;
  ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
  ctx.fillStyle = zc;
  drawSpaced('NEW', W / 2, cy + 20, 10, 700, MONO_FONT, 4);
  ctx.fillStyle = '#fff';
  drawSpaced(D.title, W / 2, cy + 42, 16, 700, UI_FONT, 3, cw - 30);
  ctx.font = `600 14px ${TEXT_FONT}`; ctx.fillStyle = '#e8f3ff';
  lines.forEach((t, k) => ctx.fillText(t, W / 2, cy + 68 + k * 20));
  const bw = 150, bh = 40, bx = W / 2 - bw / 2, by = cy + ch - bh - 14;
  introBtn = { x: bx, y: by, w: bw, h: bh };
  chamferPath(bx, by, bw, bh, 11);
  ctx.fillStyle = zc + '33'; ctx.fill();
  ctx.strokeStyle = zc; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#fff';
  drawSpaced('GOT IT', W / 2, by + bh / 2 + 1, 14, 700, UI_FONT, 3);
  ctx.restore();
}

// --- Oyun içi geri bildirimler ---
// Bildirim (ipucu / dalga tamamlandı): üstte kısa süre görünen köşeli şerit
let toasts = [];     // { text, color, t, dur }
let tipPlan = [];    // { at, text } — bölüm başladıktan sonra kare cinsinden
let levelPlayT = 0;  // START'tan sonra geçen kare
let countdown = 0;   // 3-2-1 geri sayım (kare)
let hurtFx = 0;      // hasar: kırmızı kenar + sarsıntı
let bossWarn = 0;    // boss yaklaşıyor uyarısı
let lastWaveSeen = 1;
let crystalFly = []; // HUD barına akan kristaller
let crystalPulse = 0;
function showToast(text, color, dur = 150) { toasts.push({ text, color: color || SECTOR_COLORS[currentZone - 1], t: 0, dur }); }
function beginLevelPlay() {
  briefing = false;
  countdown = 90; // 3 · 2 · 1 (her biri 0.5 sn), ardından GO
  levelPlayT = 0; lastWaveSeen = 1; toasts = []; formOn = false; formGap = -1; runnerDone = false; slowMoT = 0; gunT = 99999; // ilk Gunner ~4 sn sonra (aşağıda aralığa göre ayarlanır)
  const B = LEVEL_BRIEFS[currentLevel];
  tipPlan = []; // ipuçları artık ilk karşılaşmada duraklayarak anlatılıyor

}
function drawFeedbackOverlays() {
  // Hasar: kırmızı kenar parlaması
  if (hurtFx > 0) {
    const k = hurtFx / 26;
    const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.32, W / 2, H / 2, H * 0.7);
    g.addColorStop(0, 'rgba(255,34,68,0)'); g.addColorStop(1, `rgba(255,34,68,${0.55 * k})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  // Boss uyarısı: üstte ve altta kırmızı şerit, yanıp sönen yazı
  if (bossWarn > 0) {
    const a = Math.min(1, bossWarn / 20, (bossWarnMax - bossWarn) / 12 + 0.2);
    const blink = Math.floor(bossWarn / 10) % 2 === 0;
    ctx.save(); ctx.globalAlpha = a;
    const wy = H * 0.42, gapH = 76; // iki çizgi arası; metin bloğu (24 + 8 + 10 px) tam ortada, çizgilerle arasında ~15 px boşluk
    [wy, wy + gapH].forEach(y => {
      ctx.fillStyle = 'rgba(255,34,68,0.18)'; ctx.fillRect(0, y - 2, W, 4);
      ctx.save(); ctx.beginPath(); ctx.rect(0, y - 2, W, 4); ctx.clip();
      ctx.fillStyle = 'rgba(255,77,102,0.8)';
      for (let x = -40 + (frameCount * 2) % 40; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, y + 2); ctx.lineTo(x + 20, y - 2); ctx.lineTo(x + 30, y - 2); ctx.lineTo(x + 10, y + 2); ctx.fill(); }
      ctx.restore();
    });
    ctx.fillStyle = blink ? '#ff4d66' : '#ffd0d8';
    ctx.shadowColor = '#ff2a4a'; ctx.shadowBlur = 16; ctx.textBaseline = 'middle';
    drawSpaced('WARNING', W / 2, wy + gapH / 2 - 9, 24, 700, UI_FONT, 6);
    ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255,220,225,0.85)';
    drawSpaced(`${(boss && boss.special ? BOSS_NAMES[boss.zone] : 'BOSS')} APPROACHING`, W / 2, wy + gapH / 2 + 16, 10, 700, MONO_FONT, 3);
    ctx.restore();
  }
  // Bildirimler
  if (toasts.length) {
    const T = toasts[0];
    const a = Math.min(1, T.t / 12, (T.dur - T.t) / 18);
    ctx.save(); ctx.globalAlpha = Math.max(0, a);
    ctx.font = `600 13px ${TEXT_FONT}`;
    const tw = Math.min(W - 60, ctx.measureText(T.text).width + 44), tx = W / 2 - tw / 2, ty = HUD_H + (boss ? 40 : currentZone === 2 ? 34 : 14);
    chamferPath(tx, ty, tw, 30, 8);
    ctx.fillStyle = 'rgba(4,12,28,0.88)'; ctx.fill();
    ctx.strokeStyle = T.color; ctx.lineWidth = 1.3; ctx.stroke();
    ctx.fillStyle = '#eef6ff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(T.text, W / 2, ty + 15.5);
    ctx.restore();
  }
  // Geri sayım
  if (countdown > 0) {
    const n = Math.ceil(countdown / 30), f = (countdown % 30) / 30;
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,12,0.25)'; ctx.fillRect(0, 0, W, H);
    ctx.translate(W / 2, H * 0.44); ctx.scale(1 + f * 0.5, 1 + f * 0.5);
    ctx.globalAlpha = 0.4 + 0.6 * (1 - f * 0.6);
    ctx.fillStyle = '#fff'; ctx.shadowColor = SECTOR_COLORS[currentZone - 1]; ctx.shadowBlur = 20;
    ctx.font = `700 64px ${UI_FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(n), 0, 0);
    ctx.restore();
  } else if (levelPlayT > 0 && levelPlayT < 30) {
    const f = levelPlayT / 30;
    ctx.save(); ctx.globalAlpha = 1 - f;
    ctx.translate(W / 2, H * 0.44); ctx.scale(1 + f * 0.6, 1 + f * 0.6);
    ctx.fillStyle = SECTOR_COLORS[currentZone - 1]; ctx.shadowColor = SECTOR_COLORS[currentZone - 1]; ctx.shadowBlur = 24;
    ctx.font = `700 52px ${UI_FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('GO!', 0, 0);
    ctx.restore();
  }
  // HUD barına akan kristaller
  crystalFly.forEach(c => {
    const k = Math.min(1, c.t / 22), e = k * k;
    const x = c.x + (c.tx - c.x) * e, y = c.y + (c.ty - c.y) * e;
    ctx.save(); ctx.globalAlpha = 1 - k * 0.3;
    briefCrystal(x, y, 8 - k * 3);
    ctx.restore();
  });
}

function drawHeart(x, y, r, filled) {
  ctx.beginPath();
  ctx.moveTo(x, y + r * 0.9);
  ctx.bezierCurveTo(x - r * 1.6, y - r * 0.1, x - r * 0.7, y - r * 1.2, x, y - r * 0.35);
  ctx.bezierCurveTo(x + r * 0.7, y - r * 1.2, x + r * 1.6, y - r * 0.1, x, y + r * 0.9);
  ctx.closePath();
  // Renk: oyunun tek kırmızı ailesi (#ff2244 / açık #ff4d66) — neon kırmızı düşman gemisiyle aynı
  if (filled) {
    const g = ctx.createLinearGradient(0, y - r, 0, y + r);
    g.addColorStop(0, '#ff4d66'); g.addColorStop(1, '#ff2244'); // üstte hafif açık: küçük boyutta seçilsin
    ctx.fillStyle = g; ctx.shadowColor = '#ff2244'; ctx.shadowBlur = 7; ctx.fill(); ctx.shadowBlur = 0;
  }
  else { ctx.strokeStyle = 'rgba(255,34,68,0.6)'; ctx.lineWidth = 1.5; ctx.stroke(); }
}

const HUD_H = 50;
let HUD_COL = '#3fd3ff'; // drawHUD başında bölge rengine ayarlanır
const HUD_FILL = 'rgba(4,14,30,0.78)';
// Düzgün çokgen (altıgen / sekizgen) yolu
function ngonPath(x, y, r, n, rot = 0) {
  ctx.beginPath();
  for (let k = 0; k < n; k++) {
    const a = rot + k / n * Math.PI * 2;
    k ? ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r) : ctx.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
  }
  ctx.closePath();
}
function hudPanel(pts, glow) {
  ctx.beginPath();
  pts.forEach(([x, y], k) => k ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  ctx.closePath();
  ctx.fillStyle = HUD_FILL; ctx.fill();
  ctx.strokeStyle = HUD_COL; ctx.lineWidth = 1.5;
  if (glow) { ctx.shadowColor = HUD_COL; ctx.shadowBlur = 8; }
  ctx.stroke(); ctx.shadowBlur = 0;
}
// Ekran kenarı neon çerçevesi (oyun alanını sarar, dikkat dağıtmayacak kadar soluk)
// Oyun sahnesi kenarı: çizgi yok (telefonun yuvarlak köşelerinde kesiliyordu ve dikkat dağıtıyordu).
// Yerine üst ve alt kenarda bölge renginde çok hafif bir renk geçişi: atmosfer + arayüz arka plandan ayrışır.
function drawScreenFrame() {
  ctx.save();
  const top = ctx.createLinearGradient(0, 0, 0, 110);
  top.addColorStop(0, HUD_COL + '2e'); top.addColorStop(1, HUD_COL + '00');
  ctx.fillStyle = top; ctx.fillRect(0, 0, W, 110);
  const bot = ctx.createLinearGradient(0, H - 120, 0, H);
  bot.addColorStop(0, HUD_COL + '00'); bot.addColorStop(1, HUD_COL + '26');
  ctx.fillStyle = bot; ctx.fillRect(0, H - 120, W, 120);
  ctx.restore();
}
function drawHUD() {
  HUD_COL = SECTOR_COLORS[currentZone - 1] || '#3fd3ff';
  ctx.save();
  drawScreenFrame();
  ctx.textBaseline = 'middle';

  // Üst bar ortak hizası: durdurma butonu ve kalpler aynı yükseklikte (34px, merkez y=30)
  const TOP_Y = 30, TOP_H = 34;
  // Durdurma: köşeli kare buton (sol üst)
  chamferPath(12, TOP_Y - TOP_H / 2, TOP_H, TOP_H, 7);
  ctx.fillStyle = HUD_FILL; ctx.fill();
  ctx.strokeStyle = HUD_COL; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#e6f6ff'; ctx.fillRect(23, TOP_Y - 7, 4, 14); ctx.fillRect(31, TOP_Y - 7, 4, 14);

  // Canlar: sağ üstte üç kalp
  for (let k = 0; k < 3; k++) drawHeart(W - 70 + k * 24, TOP_Y + 1, 8.5, k < lives);

  // Ortada dalga ilerlemesi: etiket + eğik segmentler
  if (!boss) {
    const lvT = Math.max(0, gameSec() - (currentLevel - 1) * LEVEL_SEC);
    const segs = currentLevel % 5 === 0 ? bossPreWaves() : 5;
    const curWave = Math.min(segs, Math.floor(lvT / WAVE_SEC) + 1);
    ctx.fillStyle = 'rgba(220,240,255,0.8)';
    drawSpaced(`WAVE ${curWave}/${segs}`, W / 2, TOP_Y - 9, 9, 700, MONO_FONT, 2);
    const sw = 18, gap = 4, total = segs * sw + (segs - 1) * gap;
    for (let k = 0; k < segs; k++) {
      const sx = W / 2 - total / 2 + k * (sw + gap);
      const f = Math.max(0, Math.min(1, lvT / WAVE_SEC - k));
      ctx.beginPath(); ctx.moveTo(sx + 3, 32); ctx.lineTo(sx + sw, 32); ctx.lineTo(sx + sw - 3, 40); ctx.lineTo(sx, 40); ctx.closePath();
      ctx.save(); ctx.globalAlpha *= 0.16; ctx.fillStyle = HUD_COL; ctx.fill(); ctx.restore();
      if (f > 0) {
        ctx.save(); ctx.clip();
        ctx.fillStyle = HUD_COL; ctx.shadowColor = HUD_COL; ctx.shadowBlur = 6;
        ctx.fillRect(sx, 32, sw * f, 8);
        ctx.restore();
      }
    }
  }

  // Boss HP barı
  let barY = HUD_H + 6;
  if (boss) {
    const bx = 16, by = barY, bw = W - 32, bh = 20;
    hudPanel([[bx + 8, by], [bx + bw - 8, by], [bx + bw, by + 8], [bx + bw - 8, by + bh], [bx + 8, by + bh], [bx, by + 8]]);
    const bRatio = boss.hp / boss.maxHp;
    const bPhase = boss.phase || 1;
    const barColors = [['#aa00ff','#ff44ff','#cc44ff'], ['#cc0066','#ff44aa','#ff22aa'], ['#cc2200','#ff6600','#ff4400']];
    const [bc0, bc1, bshadow] = barColors[bPhase - 1];
    const bGrd = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    bGrd.addColorStop(0, bc0); bGrd.addColorStop(1, bc1);
    ctx.fillStyle = bGrd; ctx.shadowColor = bshadow; ctx.shadowBlur = 10;
    ctx.fillRect(bx + 8, by + 4, (bw - 16) * bRatio, bh - 8);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff'; ctx.font = `700 9px ${UI_FONT}`; ctx.textAlign = 'center';
    ctx.shadowColor = '#000'; ctx.shadowBlur = 4;
    const bName = boss.special ? BOSS_NAMES[boss.zone] : 'BOSS';
    ctx.fillText(`${bName}  ·  PHASE ${bPhase}`, W / 2, by + bh / 2 + 1);
    ctx.shadowBlur = 0;
    barY += bh + 6;
  }

  // Zone 2: kristal / overdrive barı (üstte); L6-L9'da yok
  if (false) { // kristal kaldırıldı (2026-11-07)
    const od = overdriveTimer > 0;
    if (crystalPulse > 0) { ctx.save(); ctx.shadowColor = '#7fe6ff'; ctx.shadowBlur = 18 * crystalPulse / 10; ctx.strokeStyle = `rgba(127,230,255,${crystalPulse / 10})`; ctx.lineWidth = 2; ctx.strokeRect(16, barY, W - 32, 18); ctx.restore(); }
    drawTimerBar(16, barY, W - 32, od ? overdriveTimer / OVERDRIVE_TIME : crystalMeter / CRYSTAL_MAX,
      od ? '#ffc531' : '#7fe6ff', od ? 'OVERDRIVE' : `CRYSTALS ${crystalMeter}/${CRYSTAL_MAX}`, od ? 'bolt' : 'crystal');
  }

  // Altta: aktif güçlendirmelerin süreleri (yalnızca aktifken)
  const active = [];
  if (player.shieldTimer > 0) active.push(['shield', player.shieldTimer / POWERUP_DURATION, POWERUP_COLORS.shield, 'SHIELD']);
  if (player.tripleTimer > 0) active.push(['triple', player.tripleTimer / POWERUP_DURATION, POWERUP_COLORS.triple, 'TRIPLE SHOT']);
  if (player.doubleTimer > 0) active.push(['double', player.doubleTimer / POWERUP_DURATION, POWERUP_COLORS.double, 'DOUBLE SHOT']);
  active.forEach(([type, ratio, col, label], k) => {
    drawTimerBar(40, H - 38 - k * 26, W - 80, ratio, col, label, type);
  });

  ctx.restore();
}

// Süre çubuğu: köşeli panel + ikon + eğik segmentli dolgu + etiket
function drawTimerBar(x, y, w, ratio, col, label, icon) {
  const h = 18;
  hudPanel([[x + 8, y], [x + w, y], [x + w - 8, y + h], [x, y + h]]);
  // İkon
  ctx.save(); ctx.translate(x + 18, y + h / 2);
  if (icon === 'bolt') {
    ctx.fillStyle = col; ctx.beginPath();
    ctx.moveTo(2, -7); ctx.lineTo(-4, 1); ctx.lineTo(0, 1); ctx.lineTo(-2, 7); ctx.lineTo(4, -2); ctx.lineTo(0, -2); ctx.closePath(); ctx.fill();
  } else if (icon === 'crystal') {
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(5, 0); ctx.lineTo(0, 7); ctx.lineTo(-5, 0); ctx.closePath(); ctx.fill();
  } else {
    if (powerupImgReady(icon)) ctx.drawImage(powerupImgs[icon], -10, -10, 20, 20); else drawPowerupIcon(icon, 6);
  }
  ctx.restore();
  // Etiket (ikonun yanında, çubuğun içinde)
  ctx.font = `600 9px ${MONO_FONT}`; ctx.fillStyle = col; ctx.textAlign = 'left';
  ctx.fillText(label, x + 30, y + h / 2 + 1);
  const lw = ctx.measureText(label).width;
  // Segmentler
  const sx0 = x + 38 + lw, sw0 = w - 50 - lw, segs = 10, sw = sw0 / segs;
  for (let k = 0; k < segs; k++) {
    const f = Math.max(0, Math.min(1, ratio * segs - k));
    const sx = sx0 + k * sw;
    ctx.beginPath(); ctx.moveTo(sx + 3, y + 4); ctx.lineTo(sx + sw - 1, y + 4); ctx.lineTo(sx + sw - 4, y + h - 4); ctx.lineTo(sx, y + h - 4); ctx.closePath();
    ctx.save(); ctx.globalAlpha *= 0.12; ctx.fillStyle = HUD_COL; ctx.fill(); ctx.restore();
    if (f > 0) {
      ctx.save(); ctx.clip();
      ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 6;
      ctx.fillRect(sx, y, sw * f, h);
      ctx.restore();
    }
  }
}

// --- Ekran butonu: çizim + dokunma alanı aynı tanımdan ---
function drawButton(b, primary) {
  ctx.save();
  const g = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
  if (primary) { g.addColorStop(0, '#0088cc'); g.addColorStop(1, '#0050a0'); }
  else { g.addColorStop(0, 'rgba(255,255,255,0.10)'); g.addColorStop(1, 'rgba(255,255,255,0.04)'); }
  ctx.fillStyle = g;
  if (primary) { ctx.shadowColor = '#0cf'; ctx.shadowBlur = 12; }
  chamferPath(b.x, b.y, b.w, b.h, 12); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = primary ? 'rgba(120,220,255,0.9)' : 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.2;
  chamferPath(b.x, b.y, b.w, b.h, 12); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = `700 15px ${TEXT_FONT}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 1);
  ctx.restore();
}
