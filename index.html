let briefing = false;
let briefBtn = null; // çizimde hesaplanır, dokunma için kullanılır

// Küçük çizim yardımcıları (talimat kartı görselleri)
function briefEnemy(tier, x, y, k = 0.7, alpha = 1) {
  const img = enemyImgs[tier], sz = ENEMY_SIZES[tier];
  if (!img || !img.complete || !img.naturalWidth) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.drawImage(img, x - sz.w * k / 2, y - sz.h * k / 2, sz.w * k, sz.h * k); ctx.restore();
}
function briefRock(type, x, y, size) {
  const spr = getRockSprite('medium', 1, type === 'iron' ? 'iron' : type === 'explosive' ? 'explosive' : null);
  if (!spr) return;
  const k = size * 2.2 / Math.max(spr.width, spr.height);
  ctx.drawImage(spr, x - spr.width * k / 2, y - spr.height * k / 2, spr.width * k, spr.height * k);
}
function briefShot(x, y) {
  ctx.fillStyle = 'rgba(12,0,4,0.85)'; ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ff3b2a'; ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffb347'; ctx.beginPath(); ctx.arc(x, y, 2.5, 0, Math.PI * 2); ctx.fill();
}
function briefArrow(x1, y1, x2, y2, col) {
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  const a = Math.atan2(y2 - y1, x2 - x1);
  ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - Math.cos(a - 0.5) * 8, y2 - Math.sin(a - 0.5) * 8); ctx.lineTo(x2 - Math.cos(a + 0.5) * 8, y2 - Math.sin(a + 0.5) * 8); ctx.closePath(); ctx.fill();
}
function briefCrystal(x, y, r) {
  ctx.beginPath(); ctx.moveTo(x, y - r); ctx.lineTo(x + r * 0.7, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r * 0.7, y); ctx.closePath();
  const g = ctx.createLinearGradient(x - r, y - r, x + r, y + r);
  g.addColorStop(0, '#e8fbff'); g.addColorStop(0.5, '#4fd8ff'); g.addColorStop(1, '#9a6bff');
  ctx.fillStyle = g; ctx.fill();
}
function briefBolt(x, y, s, col) {
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(x + 3 * s, y - 14 * s); ctx.lineTo(x - 8 * s, y + 2 * s); ctx.lineTo(x - 1 * s, y + 2 * s); ctx.lineTo(x - 5 * s, y + 14 * s);
  ctx.lineTo(x + 8 * s, y - 3 * s); ctx.lineTo(x + 1 * s, y - 3 * s); ctx.closePath(); ctx.fill();
}
// Her mekanik için küçük, hareketli bir sahne (kart içinde ~280×88 alan)
function drawBriefVisual(kind, cx, cy, zc) {
  const t = frameCount * 0.04, L = [-70, 0, 70];
  ctx.save();
  // şerit çizgileri: her sahnede ortak zemin
  if (kind !== 'crystal' && kind !== 'boss') L.forEach(dx => { ctx.fillStyle = 'rgba(255,255,255,0.07)'; ctx.fillRect(cx + dx - 1, cy - 40, 2, 80); });
  switch (kind) {
    case 'swipe': {
      const sx = cx + Math.sin(t) * 70;
      [-1, 1].forEach(d => { ctx.fillStyle = (d > 0) === (Math.cos(t) > 0) ? zc : 'rgba(255,255,255,0.2)';
        const ax = cx + d * 118; ctx.beginPath(); ctx.moveTo(ax, cy - 10); ctx.lineTo(ax + d * 12, cy); ctx.lineTo(ax, cy + 10); ctx.closePath(); ctx.fill(); });
      if (spaceshipImg.complete) ctx.drawImage(spaceshipImg, sx - 24, cy - 24, 48, 48);
      break;
    }
    case 'dodge': {
      briefEnemy(2, cx, cy - 26, 0.55);
      const sy = cy - 6 + ((t * 30) % 46);
      briefShot(cx, sy);
      const px = cx + 70 * Math.min(1, Math.max(0, (sy - cy + 6) / 20));
      if (spaceshipImg.complete) ctx.drawImage(spaceshipImg, px - 20, cy + 16, 40, 40);
      break;
    }
    case 'fast': {
      briefEnemy(1, cx - 70, cy - 10 + Math.sin(t) * 4, 0.7);
      const fy = cy - 34 + ((t * 70) % 70);
      briefEnemy(1, cx + 30, fy, 0.7);
      ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1.5;
      [-10, 0, 10].forEach(o => { ctx.beginPath(); ctx.moveTo(cx + 30 + o, fy - 16); ctx.lineTo(cx + 30 + o, fy - 34); ctx.stroke(); });
      break;
    }
    case 'zigzag': {
      ctx.strokeStyle = zc; ctx.globalAlpha = 0.5; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]);
      ctx.beginPath(); for (let k = 0; k <= 40; k++) { const y = cy - 38 + k * 2, x = cx + Math.sin(k * 0.35) * 40; k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
      briefEnemy(2, cx + Math.sin(t * 2) * 40, cy, 0.55);
      break;
    }
    case 'boss': {
      const spr = getBossSprite(currentZone);
      if (bossImg.complete && bossImg.naturalWidth) { ctx.shadowColor = '#ff5a7a'; ctx.shadowBlur = 16; ctx.drawImage(spr, cx - 70, cy - 46, 140, 93); ctx.shadowBlur = 0; }
      break;
    }
    case 'crystal': {
      briefRock('normal', cx - 92, cy, 20);
      briefArrow(cx - 64, cy, cx - 36, cy, 'rgba(255,255,255,0.5)');
      [0, 1, 2].forEach(k => briefCrystal(cx - 16 + k * 14, cy + Math.sin(t * 2 + k) * 4, 9));
      briefArrow(cx + 34, cy, cx + 62, cy, 'rgba(255,255,255,0.5)');
      ctx.shadowColor = '#ffc531'; ctx.shadowBlur = 14; briefBolt(cx + 90, cy, 1.4, '#ffc531'); ctx.shadowBlur = 0;
      break;
    }
    case 'ambush': {
      const out = (Math.sin(t) + 1) / 2;
      briefEnemy(2, cx + out * 70, cy - 18 - out * 6, 0.55);
      briefRock('iron', cx, cy + 8, 22);
      briefArrow(cx + 26, cy - 30, cx + 56, cy - 30, zc);
      break;
    }
    case 'meteor': {
      const blink = Math.floor(frameCount / 8) % 2 === 0;
      ctx.fillStyle = `rgba(255,40,80,${blink ? 0.25 : 0.1})`; ctx.fillRect(cx - 32, cy - 40, 64, 80);
      ctx.fillStyle = '#ff5577'; ctx.font = `700 26px ${TEXT_FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      if (blink) ctx.fillText('!', cx, cy);
      const my = cy - 40 + ((t * 60) % 80);
      const tg = ctx.createLinearGradient(0, my - 40, 0, my); tg.addColorStop(0, 'rgba(255,90,20,0)'); tg.addColorStop(1, 'rgba(255,170,60,0.8)');
      ctx.fillStyle = tg; ctx.beginPath(); ctx.moveTo(cx - 8, my); ctx.lineTo(cx, my - 40); ctx.lineTo(cx + 8, my); ctx.closePath(); ctx.fill();
      briefRock('normal', cx, my, 9);
      if (spaceshipImg.complete) ctx.drawImage(spaceshipImg, cx + 70 - 18, cy + 4, 36, 36);
      break;
    }
    case 'explosive': {
      const p = (t % 2) / 2;
      briefEnemy(1, cx - 70, cy - 14, 0.6, 1 - p); briefEnemy(1, cx + 70, cy - 14, 0.6, 1 - p);
      briefRock('explosive', cx, cy, 16);
      ctx.strokeStyle = `rgba(255,140,60,${1 - p})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx, cy, 20 + p * 70, 0, Math.PI * 2); ctx.stroke();
      break;
    }
    case 'phantom': {
      [0, 1, 2].forEach(k => {
        const img = enemyImgs[2], ol = getPhantomOutline(img, 2), x = cx - 80 + k * 80, a = [1, 0.45, 0.1][k];
        if (ol) { ctx.save(); ctx.globalAlpha = 0.3; ctx.shadowColor = '#c9a0ff'; ctx.shadowBlur = 8; ctx.drawImage(ol, x - 30, cy - 22, 60, 41); ctx.restore(); }
        briefEnemy(2, x, cy, 0.62, a);
      });
      break;
    }
    case 'ion': {
      const g = ctx.createRadialGradient(cx, cy, 4, cx, cy, 44);
      g.addColorStop(0, 'rgba(120,220,255,0.45)'); g.addColorStop(1, 'rgba(40,80,255,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(cx, cy, 36, 40, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(200,245,255,0.9)'; ctx.lineWidth = 1.4;
      const tick = Math.floor(frameCount / 5);
      for (let k = 0; k < 2; k++) { let px = cx + Math.sin(tick + k * 3) * 14, py = cy - 22 + k * 18; ctx.beginPath(); ctx.moveTo(px, py); for (let q = 0; q < 3; q++) { px += Math.sin(tick * 2 + q + k) * 9; py += 8; ctx.lineTo(px, py); } ctx.stroke(); }
      if (spaceshipImg.complete) ctx.drawImage(spaceshipImg, cx + 70 - 18, cy - 4, 36, 36);
      ctx.fillStyle = '#9fe8ff'; ctx.font = `700 10px ${TEXT_FONT}`; ctx.textAlign = 'center'; ctx.fillText('JAMMED', cx, cy + 34);
      break;
    }
    case 'fog': {
      briefEnemy(2, cx - 60, cy - 6, 0.6, 0.35); briefEnemy(1, cx + 50, cy + 6, 0.7, 0.35);
      const fg = ctx.createLinearGradient(0, cy - 40, 0, cy + 40);
      fg.addColorStop(0, 'rgba(150,80,200,0.55)'); fg.addColorStop(1, 'rgba(150,80,200,0.1)');
      ctx.fillStyle = fg; ctx.fillRect(cx - 120, cy - 40, 240, 80);
      briefShot(cx + 50, cy + 26);
      break;
    }
    case 'gravity': {
      ctx.fillStyle = '#000'; ctx.strokeStyle = 'rgba(255,150,70,0.8)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx + 110, cy - 26, 12, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      const k = (Math.sin(t) + 1) / 2;
      briefEnemy(2, cx - 70 + k * 70, cy - 10 + k * 14, 0.55);
      ctx.strokeStyle = 'rgba(255,140,60,0.7)'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(cx - 70, cy - 30); ctx.quadraticCurveTo(cx - 60, cy + 10, cx, cy + 20); ctx.stroke(); ctx.setLineDash([]);
      break;
    }
    case 'bent': case 'horizon': {
      briefEnemy(2, cx - 70, cy - 30, 0.5);
      ctx.strokeStyle = 'rgba(255,120,60,0.6)'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(cx - 70, cy - 16); ctx.quadraticCurveTo(cx - 64, cy + 20, cx - 8, cy + 36); ctx.stroke(); ctx.setLineDash([]);
      const q = (t % 1.6) / 1.6;
      const bx = (1 - q) * (1 - q) * (cx - 70) + 2 * (1 - q) * q * (cx - 64) + q * q * (cx - 8);
      const by = (1 - q) * (1 - q) * (cy - 16) + 2 * (1 - q) * q * (cy + 20) + q * q * (cy + 36);
      briefShot(bx, by);
      if (kind === 'horizon') { briefRock('normal', cx + 70, cy - 10 + ((t * 30) % 50), 12); }
      break;
    }
    case 'debris': {
      [-70, 10, 70].forEach((dx, k) => briefRock('normal', cx + dx, cy - 30 + ((t * 40 + k * 30) % 70), 11 + k * 2));
      break;
    }
    case 'beam': {
      const ph = (t % 3) / 3, warn = ph < 0.6;
      if (warn) { const blink = Math.floor(frameCount / 6) % 2 === 0; ctx.fillStyle = `rgba(255,40,80,${blink ? 0.22 : 0.08})`; ctx.fillRect(cx - 30, cy - 40, 60, 80); }
      else { const k = 1 - (ph - 0.6) / 0.4; ctx.fillStyle = `rgba(200,40,255,${0.4 * k})`; ctx.fillRect(cx - 22, cy - 40, 44, 80); ctx.fillStyle = `rgba(255,255,255,${0.9 * k})`; ctx.fillRect(cx - 3, cy - 40, 6, 80); }
      if (spaceshipImg.complete) ctx.drawImage(spaceshipImg, cx + 70 - 18, cy + 2, 36, 36);
      break;
    }
  }
  ctx.restore();
}

function drawBriefing() {
  const B = LEVEL_BRIEFS[currentLevel];
  if (!B) { briefing = false; return; }
  const zc = SECTOR_COLORS[currentZone - 1];
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,12,0.62)';
  ctx.fillRect(0, 0, W, H);

  const cw = W - 48, cx = 24;
  ctx.font = `600 15px ${TEXT_FONT}`;
  const lines = wrapText(B.line, cw - 50).map(r => r.text);
  const lineH = 21;
  const ch = 92 + 100 + lines.length * lineH + 22 + 48 + 24;
  const cy = Math.max(HUD_H + 20, H * 0.46 - ch / 2);

  chamferPath(cx, cy, cw, ch, 18);
  const g = ctx.createLinearGradient(0, cy, 0, cy + ch);
  g.addColorStop(0, 'rgba(10,22,50,0.96)'); g.addColorStop(1, 'rgba(5,10,26,0.96)');
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = zc; ctx.lineWidth = 2; ctx.shadowColor = zc; ctx.shadowBlur = 14; ctx.stroke(); ctx.shadowBlur = 0;
  ctx.globalAlpha = 0.45; ctx.lineWidth = 1; chamferPath(cx + 6, cy + 6, cw - 12, ch - 12, 14); ctx.stroke(); ctx.globalAlpha = 1;

  ctx.textBaseline = 'middle';
  ctx.fillStyle = zc;
  drawSpaced(`${MENU_CARDS[currentZone - 1].name.toUpperCase()}  ·  LEVEL ${String(currentLevel).padStart(2, '0')}`, W / 2, cy + 30, 11, 600, MONO_FONT, 2.5);
  ctx.fillStyle = '#fff';
  drawSpaced(B.title, W / 2, cy + 62, 20, 700, UI_FONT, 3, cw - 40);

  // Görsel anlatım
  drawBriefVisual(B.vis, W / 2, cy + 92 + 48, zc);

  // Tek temel mekanik
  ctx.font = `600 15px ${TEXT_FONT}`; ctx.fillStyle = '#e8f3ff'; ctx.textAlign = 'center';
  lines.forEach((t, k) => ctx.fillText(t, W / 2, cy + 92 + 100 + lineH / 2 + k * lineH));

  // START butonu
  const bw = 200, bh = 48, bx = W / 2 - bw / 2, by = cy + ch - 24 - bh;
  briefBtn = { x: bx, y: by, w: bw, h: bh };
  chamferPath(bx, by, bw, bh, 14);
  const pg = ctx.createLinearGradient(0, by, 0, by + bh);
  pg.addColorStop(0, '#0c3a48'); pg.addColorStop(1, '#06202c');
  ctx.fillStyle = pg; ctx.fill();
  const pulse = 0.6 + 0.4 * Math.sin(frameCount * 0.08);
  ctx.strokeStyle = zc; ctx.lineWidth = 2; ctx.shadowColor = zc; ctx.shadowBlur = 8 + 8 * pulse; ctx.stroke(); ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  drawSpaced('START', W / 2, by + bh / 2 + 1, 16, 700, UI_FONT, 4);
  ctx.restore();
}

// --- Oyun içi geri bildirimler ---
// Bildirim (ipucu / dalga tamamlandı): üstte kısa süre görünen köşeli şerit
let toasts = [];     // { text, color, t, dur }
let tipPlan = [];    // { at, text } — bölüm başladıktan sonra kare cinsinden
let levelPlayT = 0;  // START'tan sonra geçen kare
let countdown = 0;   // 3-2-1 geri sayım (kare)
let hurtFx = 0;      // hasar: kırmızı kenar + sarsıntı
let bossWarn = 0;    // boss yaklaşıyor uyarısı
let lastWaveSeen = 1;
let crystalFly = []; // HUD barına akan kristaller
let crystalPulse = 0;
function showToast(text, color, dur = 150) { toasts.push({ text, color: color || SECTOR_COLORS[currentZone - 1], t: 0, dur }); }
function beginLevelPlay() {
  briefing = false;
  countdown = 90; // 3 · 2 · 1 (her biri 0.5 sn), ardından GO
  levelPlayT = 0; lastWaveSeen = 1; toasts = [];
  const B = LEVEL_BRIEFS[currentLevel];
  tipPlan = B && B.tips ? B.tips.map((text, k) => ({ at: 150 + k * 900, text })) : [];
  Sound.sfx.count(3);
}
function drawFeedbackOverlays() {
  // Hasar: kırmızı kenar parlaması
  if (hurtFx > 0) {
    const k = hurtFx / 26;
    const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.32, W / 2, H / 2, H * 0.7);
    g.addColorStop(0, 'rgba(255,30,50,0)'); g.addColorStop(1, `rgba(255,30,50,${0.55 * k})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  // Boss uyarısı: üstte ve altta kırmızı şerit, yanıp sönen yazı
  if (bossWarn > 0) {
    const a = Math.min(1, bossWarn / 20, (150 - bossWarn) / 12 + 0.2);
    const blink = Math.floor(bossWarn / 10) % 2 === 0;
    ctx.save(); ctx.globalAlpha = a;
    [H * 0.42, H * 0.42 + 58].forEach(y => {
      ctx.fillStyle = 'rgba(255,40,60,0.18)'; ctx.fillRect(0, y - 2, W, 4);
      ctx.save(); ctx.beginPath(); ctx.rect(0, y - 2, W, 4); ctx.clip();
      ctx.fillStyle = 'rgba(255,60,80,0.8)';
      for (let x = -40 + (frameCount * 2) % 40; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, y + 2); ctx.lineTo(x + 20, y - 2); ctx.lineTo(x + 30, y - 2); ctx.lineTo(x + 10, y + 2); ctx.fill(); }
      ctx.restore();
    });
    ctx.fillStyle = blink ? '#ff5a7a' : '#ffd0d8';
    ctx.shadowColor = '#ff2a4a'; ctx.shadowBlur = 16;
    drawSpaced('WARNING', W / 2, H * 0.42 + 22, 24, 700, UI_FONT, 6);
    ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255,220,225,0.85)';
    drawSpaced(`${(boss && boss.special ? BOSS_NAMES[boss.zone] : 'BOSS')} APPROACHING`, W / 2, H * 0.42 + 44, 10, 700, MONO_FONT, 3);
    ctx.restore();
  }
  // Bildirimler
  if (toasts.length) {
    const T = toasts[0];
    const a = Math.min(1, T.t / 12, (T.dur - T.t) / 18);
    ctx.save(); ctx.globalAlpha = Math.max(0, a);
    ctx.font = `600 13px ${TEXT_FONT}`;
    const tw = Math.min(W - 60, ctx.measureText(T.text).width + 44), tx = W / 2 - tw / 2, ty = HUD_H + (boss ? 40 : currentZone === 2 ? 34 : 14);
    chamferPath(tx, ty, tw, 30, 8);
    ctx.fillStyle = 'rgba(4,12,28,0.88)'; ctx.fill();
    ctx.strokeStyle = T.color; ctx.lineWidth = 1.3; ctx.stroke();
    ctx.fillStyle = '#eef6ff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(T.text, W / 2, ty + 15.5);
    ctx.restore();
  }
  // Geri sayım
  if (countdown > 0) {
    const n = Math.ceil(countdown / 30), f = (countdown % 30) / 30;
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,12,0.25)'; ctx.fillRect(0, 0, W, H);
    ctx.translate(W / 2, H * 0.44); ctx.scale(1 + f * 0.5, 1 + f * 0.5);
    ctx.globalAlpha = 0.4 + 0.6 * (1 - f * 0.6);
    ctx.fillStyle = '#fff'; ctx.shadowColor = SECTOR_COLORS[currentZone - 1]; ctx.shadowBlur = 20;
    ctx.font = `700 64px ${UI_FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(n), 0, 0);
    ctx.restore();
  } else if (levelPlayT > 0 && levelPlayT < 30) {
    const f = levelPlayT / 30;
    ctx.save(); ctx.globalAlpha = 1 - f;
    ctx.translate(W / 2, H * 0.44); ctx.scale(1 + f * 0.6, 1 + f * 0.6);
    ctx.fillStyle = SECTOR_COLORS[currentZone - 1]; ctx.shadowColor = SECTOR_COLORS[currentZone - 1]; ctx.shadowBlur = 24;
    ctx.font = `700 52px ${UI_FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('GO!', 0, 0);
    ctx.restore();
  }
  // HUD barına akan kristaller
  crystalFly.forEach(c => {
    const k = Math.min(1, c.t / 22), e = k * k;
    const x = c.x + (c.tx - c.x) * e, y = c.y + (c.ty - c.y) * e;
    ctx.save(); ctx.globalAlpha = 1 - k * 0.3;
    briefCrystal(x, y, 8 - k * 3);
    ctx.restore();
  });
}

function drawHeart(x, y, r, filled) {
  ctx.beginPath();
  ctx.moveTo(x, y + r * 0.9);
  ctx.bezierCurveTo(x - r * 1.6, y - r * 0.1, x - r * 0.7, y - r * 1.2, x, y - r * 0.35);
  ctx.bezierCurveTo(x + r * 0.7, y - r * 1.2, x + r * 1.6, y - r * 0.1, x, y + r * 0.9);
  ctx.closePath();
  if (filled) { ctx.fillStyle = '#ff4d6d'; ctx.shadowColor = '#ff4d6d'; ctx.shadowBlur = 6; ctx.fill(); ctx.shadowBlur = 0; }
  else { ctx.strokeStyle = 'rgba(255,77,109,0.45)'; ctx.lineWidth = 1.5; ctx.stroke(); }
}

const HUD_H = 50;
let HUD_COL = '#3fd3ff'; // drawHUD başında bölge rengine ayarlanır
const HUD_FILL = 'rgba(4,14,30,0.78)';
// Düzgün çokgen (altıgen / sekizgen) yolu
function ngonPath(x, y, r, n, rot = 0) {
  ctx.beginPath();
  for (let k = 0; k < n; k++) {
    const a = rot + k / n * Math.PI * 2;
    k ? ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r) : ctx.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
  }
  ctx.closePath();
}
function hudPanel(pts, glow) {
  ctx.beginPath();
  pts.forEach(([x, y], k) => k ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  ctx.closePath();
  ctx.fillStyle = HUD_FILL; ctx.fill();
  ctx.strokeStyle = HUD_COL; ctx.lineWidth = 1.5;
  if (glow) { ctx.shadowColor = HUD_COL; ctx.shadowBlur = 8; }
  ctx.stroke(); ctx.shadowBlur = 0;
}
// Ekran kenarı neon çerçevesi (oyun alanını sarar, dikkat dağıtmayacak kadar soluk)
// Ekran kenarı neon çerçevesi: köşelerde parlak, kenar ortalarına doğru söner; içe doğru hafif ışık sızar
function drawScreenFrame() {
  ctx.save();
  const m = 4, c = 16;
  const path = () => {
    ctx.beginPath();
    ctx.moveTo(m + c, m); ctx.lineTo(W - m - c, m); ctx.lineTo(W - m, m + c);
    ctx.lineTo(W - m, 150); ctx.lineTo(W - m - 6, 160); ctx.lineTo(W - m - 6, H - 240); ctx.lineTo(W - m, H - 230);
    ctx.lineTo(W - m, H - m - c); ctx.lineTo(W - m - c, H - m); ctx.lineTo(m + c, H - m); ctx.lineTo(m, H - m - c);
    ctx.lineTo(m, H - 230); ctx.lineTo(m + 6, H - 240); ctx.lineTo(m + 6, 160); ctx.lineTo(m, 150);
    ctx.lineTo(m, m + c); ctx.closePath();
  };
  // Dikey gradyan: üst ve alt köşeler parlak, orta kısım soluk
  const vg = ctx.createLinearGradient(0, 0, 0, H);
  vg.addColorStop(0, HUD_COL); vg.addColorStop(0.2, HUD_COL + '55'); vg.addColorStop(0.5, HUD_COL + '22');
  vg.addColorStop(0.8, HUD_COL + '55'); vg.addColorStop(1, HUD_COL);
  path();
  ctx.strokeStyle = vg; ctx.lineWidth = 4; ctx.globalAlpha = 0.25; ctx.shadowColor = HUD_COL; ctx.shadowBlur = 14; ctx.stroke();
  ctx.shadowBlur = 0; ctx.globalAlpha = 0.85; ctx.lineWidth = 1.3; ctx.stroke();
  // Köşe vurguları
  ctx.globalAlpha = 0.9; ctx.lineWidth = 2.2; ctx.strokeStyle = HUD_COL;
  [[m, m + c + 22, m, m + c, m + c, m, m + c + 22, m], [W - m, m + c + 22, W - m, m + c, W - m - c, m, W - m - c - 22, m],
   [m, H - m - c - 22, m, H - m - c, m + c, H - m, m + c + 22, H - m], [W - m, H - m - c - 22, W - m, H - m - c, W - m - c, H - m, W - m - c - 22, H - m]]
    .forEach(([x1, y1, x2, y2, x3, y3, x4, y4]) => { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.lineTo(x4, y4); ctx.stroke(); });
  // Kenarlardan içe sızan hafif renk (çok düşük opaklık)
  ctx.globalAlpha = 1;
  [[0, 0, 26, 0], [W, 0, W - 26, 0]].forEach(([x0, , x1]) => {
    const g = ctx.createLinearGradient(x0, 0, x1, 0);
    g.addColorStop(0, HUD_COL + '1c'); g.addColorStop(1, HUD_COL + '00');
    ctx.fillStyle = g; ctx.fillRect(Math.min(x0, x1), 0, 26, H);
  });
  ctx.restore();
}
function drawHUD() {
  HUD_COL = SECTOR_COLORS[currentZone - 1] || '#3fd3ff';
  ctx.save();
  drawScreenFrame();
  ctx.textBaseline = 'middle';

  // Üst bar ortak hizası: durdurma butonu ve kalpler aynı yükseklikte (34px, merkez y=30)
  const TOP_Y = 30, TOP_H = 34;
  // Durdurma: köşeli kare buton (sol üst)
  chamferPath(12, TOP_Y - TOP_H / 2, TOP_H, TOP_H, 7);
  ctx.fillStyle = HUD_FILL; ctx.fill();
  ctx.strokeStyle = HUD_COL; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#e6f6ff'; ctx.fillRect(23, TOP_Y - 7, 4, 14); ctx.fillRect(31, TOP_Y - 7, 4, 14);

  // Canlar: sağ üstte üç kalp — çerçevesiz, sadece altta ince bir çizgi
  for (let k = 0; k < 3; k++) drawHeart(W - 70 + k * 24, TOP_Y + 1, 8.5, k < lives);
  ctx.strokeStyle = HUD_COL; ctx.globalAlpha = 0.35; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(W - 86, TOP_Y + TOP_H / 2); ctx.lineTo(W - 14, TOP_Y + TOP_H / 2); ctx.stroke();
  ctx.globalAlpha = 1;

  // Ortada dalga ilerlemesi: etiket + eğik segmentler
  if (!boss) {
    const lvT = Math.max(0, gameSec() - (currentLevel - 1) * 70);
    const segs = currentLevel % 5 === 0 ? 4 : 5;
    const curWave = Math.min(segs, Math.floor(lvT / 14) + 1);
    ctx.fillStyle = 'rgba(220,240,255,0.8)';
    drawSpaced(`WAVE ${curWave}/${segs}`, W / 2, TOP_Y - 9, 9, 700, MONO_FONT, 2);
    const sw = 18, gap = 4, total = segs * sw + (segs - 1) * gap;
    for (let k = 0; k < segs; k++) {
      const sx = W / 2 - total / 2 + k * (sw + gap);
      const f = Math.max(0, Math.min(1, lvT / 14 - k));
      ctx.beginPath(); ctx.moveTo(sx + 3, 32); ctx.lineTo(sx + sw, 32); ctx.lineTo(sx + sw - 3, 40); ctx.lineTo(sx, 40); ctx.closePath();
      ctx.save(); ctx.globalAlpha *= 0.16; ctx.fillStyle = HUD_COL; ctx.fill(); ctx.restore();
      if (f > 0) {
        ctx.save(); ctx.clip();
        ctx.fillStyle = HUD_COL; ctx.shadowColor = HUD_COL; ctx.shadowBlur = 6;
        ctx.fillRect(sx, 32, sw * f, 8);
        ctx.restore();
      }
    }
  }

  // Boss HP barı
  let barY = HUD_H + 6;
  if (boss) {
    const bx = 16, by = barY, bw = W - 32, bh = 20;
    hudPanel([[bx + 8, by], [bx + bw - 8, by], [bx + bw, by + 8], [bx + bw - 8, by + bh], [bx + 8, by + bh], [bx, by + 8]]);
    const bRatio = boss.hp / boss.maxHp;
    const bPhase = boss.phase || 1;
    const barColors = [['#aa00ff','#ff44ff','#cc44ff'], ['#cc0066','#ff44aa','#ff22aa'], ['#cc2200','#ff6600','#ff4400']];
    const [bc0, bc1, bshadow] = barColors[bPhase - 1];
    const bGrd = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    bGrd.addColorStop(0, bc0); bGrd.addColorStop(1, bc1);
    ctx.fillStyle = bGrd; ctx.shadowColor = bshadow; ctx.shadowBlur = 10;
    ctx.fillRect(bx + 8, by + 4, (bw - 16) * bRatio, bh - 8);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff'; ctx.font = `700 9px ${UI_FONT}`; ctx.textAlign = 'center';
    ctx.shadowColor = '#000'; ctx.shadowBlur = 4;
    const bName = boss.special ? BOSS_NAMES[boss.zone] : 'BOSS';
    ctx.fillText(`${bName}  ·  PHASE ${bPhase}`, W / 2, by + bh / 2 + 1);
    ctx.shadowBlur = 0;
    barY += bh + 6;
  }

  // Zone 2: kristal / overdrive barı (üstte)
  if (currentZone === 2) {
    const od = overdriveTimer > 0;
    if (crystalPulse > 0) { ctx.save(); ctx.shadowColor = '#7fe6ff'; ctx.shadowBlur = 18 * crystalPulse / 10; ctx.strokeStyle = `rgba(127,230,255,${crystalPulse / 10})`; ctx.lineWidth = 2; ctx.strokeRect(16, barY, W - 32, 18); ctx.restore(); }
    drawTimerBar(16, barY, W - 32, od ? overdriveTimer / OVERDRIVE_TIME : crystalMeter / CRYSTAL_MAX,
      od ? '#ffc531' : '#7fe6ff', od ? 'OVERDRIVE' : `CRYSTALS ${crystalMeter}/${CRYSTAL_MAX}`, od ? 'bolt' : 'crystal');
  }

  // Altta: aktif güçlendirmelerin süreleri (yalnızca aktifken)
  const active = [];
  if (player.shieldTimer > 0) active.push(['shield', player.shieldTimer / POWERUP_DURATION, '#3aa8ff', 'SHIELD']);
  if (player.tripleTimer > 0) active.push(['triple', player.tripleTimer / POWERUP_DURATION, '#00ffaa', 'TRIPLE SHOT']);
  if (player.doubleTimer > 0) active.push(['double', player.doubleTimer / POWERUP_DURATION, '#ffee00', 'DOUBLE SHOT']);
  active.forEach(([type, ratio, col, label], k) => {
    drawTimerBar(40, H - 38 - k * 26, W - 80, ratio, col, label, type);
  });

  ctx.restore();
}

// Süre çubuğu: köşeli panel + ikon + eğik segmentli dolgu + etiket
function drawTimerBar(x, y, w, ratio, col, label, icon) {
  const h = 18;
  hudPanel([[x + 8, y], [x + w, y], [x + w - 8, y + h], [x, y + h]]);
  // İkon
  ctx.save(); ctx.translate(x + 18, y + h / 2);
  if (icon === 'bolt') {
    ctx.fillStyle = col; ctx.beginPath();
    ctx.moveTo(2, -7); ctx.lineTo(-4, 1); ctx.lineTo(0, 1); ctx.lineTo(-2, 7); ctx.lineTo(4, -2); ctx.lineTo(0, -2); ctx.closePath(); ctx.fill();
  } else if (icon === 'crystal') {
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(5, 0); ctx.lineTo(0, 7); ctx.lineTo(-5, 0); ctx.closePath(); ctx.fill();
  } else {
    drawPowerupIcon(icon, 6);
  }
  ctx.restore();
  // Etiket (ikonun yanında, çubuğun içinde)
  ctx.font = `600 9px ${MONO_FONT}`; ctx.fillStyle = col; ctx.textAlign = 'left';
  ctx.fillText(label, x + 30, y + h / 2 + 1);
  const lw = ctx.measureText(label).width;
  // Segmentler
  const sx0 = x + 38 + lw, sw0 = w - 50 - lw, segs = 10, sw = sw0 / segs;
  for (let k = 0; k < segs; k++) {
    const f = Math.max(0, Math.min(1, ratio * segs - k));
    const sx = sx0 + k * sw;
    ctx.beginPath(); ctx.moveTo(sx + 3, y + 4); ctx.lineTo(sx + sw - 1, y + 4); ctx.lineTo(sx + sw - 4, y + h - 4); ctx.lineTo(sx, y + h - 4); ctx.closePath();
    ctx.save(); ctx.globalAlpha *= 0.12; ctx.fillStyle = HUD_COL; ctx.fill(); ctx.restore();
    if (f > 0) {
      ctx.save(); ctx.clip();
      ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 6;
      ctx.fillRect(sx, y, sw * f, h);
      ctx.restore();
    }
  }
}

// --- Ekran butonu: çizim + dokunma alanı aynı tanımdan ---
function drawButton(b, primary) {
  ctx.save();
  const g = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
  if (primary) { g.addColorStop(0, '#0088cc'); g.addColorStop(1, '#0050a0'); }
  else { g.addColorStop(0, 'rgba(255,255,255,0.10)'); g.addColorStop(1, 'rgba(255,255,255,0.04)'); }
  ctx.fillStyle = g;
  if (primary) { ctx.shadowColor = '#0cf'; ctx.shadowBlur = 12; }
  chamferPath(b.x, b.y, b.w, b.h, 12); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = primary ? 'rgba(120,220,255,0.9)' : 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.2;
  chamferPath(b.x, b.y, b.w, b.h, 12); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = `700 15px ${TEXT_FONT}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 1);
  ctx.restore();
}
